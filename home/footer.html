<!-- =====================================================================
     Picasso Lab footer: ONE embed for the Google Sites footer (every page).
     It replaces the three footer embeds home/ucsd.html + home/address.html +
     home/visitor-map.html:
       - the UC San Diego seal (link: ucsd.edu)
       - PICASSO LAB + the address (link: the 3D lab walk-through, home/address.html)
       - the visitor map card: it records the visit into Supabase exactly like
         home/visitor-map.html does, and a click opens the analytics dashboard
         (home/visitor-map.html) in a new tab.
     A Sites embed box keeps its aspect ratio and only shrinks on phones, and
     Sites already frames the box, so this page fills whatever box it gets
     edge to edge (sizes read from the box):
       ratio >= 2.2 : one row  seal | title + address | map  (desktop proportions,
                      turning smoothly into a compact phone row as the box shrinks)
       ratio <  2.2 : seal + text on top, map below; or, for tall boxes, stacked
                      (seal, text, map), whichever of the two comes out larger.
     GENERATED FILE: edit home/footer-src/footer.tpl.html and run
     python3 home/footer-src/build.py. The visit-recording code is copied from
     home/visitor-map.html by that script (keep the two in sync through it).
     ===================================================================== -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    .pf { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; background: #000; color: #fff;
        font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    .pf-seal, .pf-addr, .vmap { position: absolute; left: 0; top: 0; visibility: hidden; }
    .pf.ready .pf-seal, .pf.ready .pf-addr, .pf.ready .vmap { visibility: visible; }
    .pf-seal { display: block; line-height: 0; text-decoration: none; }
    .pf-seal img { display: block; width: 100%; height: 100%; border: 0; object-fit: contain; background: transparent; }
    .pf-addr { display: block; color: #fff; text-decoration: none; cursor: pointer; }
    .pf-title { font-weight: 800; line-height: 0.98; letter-spacing: -0.025em; white-space: nowrap; }
    .pf-title span { display: inline-block; }
    .pf-text { font-weight: 400; text-justify: inter-word; }

    /* ---- the visitor map card: the map fills it (the card has the map's own proportions) ---- */
    .vmap { overflow: hidden; cursor: pointer; border-radius: var(--vr, 12px); outline: none;
        background: radial-gradient(120% 140% at 50% 0%, #0a2c47 0%, #061a2c 55%, #04111d 100%); }
    .vmap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
    /* the hairline edge sits over the map (the dots never cover it) and lights up on hover / focus */
    .vmap::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        box-shadow: inset 0 0 0 1px rgba(130, 200, 255, .16); transition: box-shadow .25s ease; }
    .vmap:hover::after, .vmap:focus-visible::after { box-shadow: inset 0 0 0 1px rgba(150, 215, 255, .42); }
    /* the numbers sit in the empty South Pacific (bottom left), clear of South America */
    .vm-stats { position: absolute; left: var(--vx, 12px); bottom: var(--vy, 10px); pointer-events: none;
        font: 400 var(--vf, 12px)/1.28 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: rgba(196, 226, 250, .66); white-space: nowrap;
        text-shadow: 0 0 3px #04111d, 0 0 6px #04111d; }
    .vm-stats b { font-weight: 700; color: #f2fbff; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
    .vm-stats div { display: flex; align-items: center; gap: .32em; }
    .vm-live { width: .5em; height: .5em; border-radius: 50%; background: #ffc94d; flex: none; margin-right: .08em;
        box-shadow: 0 0 0 0 rgba(255, 201, 77, .5); animation: vmlive 2.4s ease-out infinite; }
    .vm-stats .vm-l2 { padding-left: .9em; }
    @keyframes vmlive { 0% { box-shadow: 0 0 0 0 rgba(255, 201, 77, .55); } 70%, 100% { box-shadow: 0 0 0 .55em rgba(255, 201, 77, 0); } }
    #vmap-latest { display: none; }
    /* "Open analytics" on hover; a small arrow badge stays on touch screens */
    .vm-open { position: absolute; right: var(--vo, 8px); top: var(--vo, 8px); height: var(--vh, 22px); display: flex; align-items: center; gap: .4em;
        padding: 0 calc(var(--vh, 22px) * .32) 0 calc(var(--vh, 22px) * .5); border-radius: 999px; pointer-events: none;
        font: 600 var(--vf2, 11px)/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #eaf7ff; white-space: nowrap;
        background: rgba(12, 44, 70, .82); box-shadow: inset 0 0 0 1px rgba(150, 215, 255, .3);
        opacity: 0; transform: translateY(-3px); transition: opacity .2s ease, transform .2s ease; }
    .vm-open svg { width: calc(var(--vh, 22px) * .5); height: calc(var(--vh, 22px) * .5); flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .vmap:hover .vm-open, .vmap:focus-visible .vm-open { opacity: 1; transform: none; }
    @media (hover: none) {
        .vm-open { opacity: .9; transform: none; width: var(--vh, 22px); padding: 0; justify-content: center; }
        .vm-open span { display: none; }
    }
    .vmtip { position: fixed; z-index: 100000; display: none; flex-direction: column; gap: 3px; pointer-events: none; max-width: 240px; padding: 7px 10px 8px;
        border-radius: 9px; background: rgba(6, 24, 40, .94); border: 1px solid rgba(130, 200, 255, .22); color: #eef8ff;
        font: 400 11px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; box-shadow: 0 8px 22px rgba(0, 0, 0, .45); }
    .vmtip.show { display: flex; }
    .vmtip b { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .vmtip i { font-style: normal; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 4px 1px; border-radius: 3px;
        color: #082236; background: #9fdcff; line-height: 1; }
    .vmtip span { color: rgba(214, 236, 252, .7); }
</style>

        for (var i = 0; i < pings.length; i++) { var xy = project(pings[i].lon, pings[i].lat), d = Math.hypot(xy[0] - cx, xy[1] - cy); if (d < hd) { hd = d; hit = pings[i]; } } return hit; }
    function hoverMove(e) { var p = nearestPing(e.clientX, e.clientY);
        if (!p) { tip.classList.remove('show'); return; }
        var cc = ISO[p.country];
        tip.innerHTML = '<b>' + (cc ? '<i>' + cc + '</i>' : '') + esc(p.where) + '</b><span>' + fmtFull(p.n) + ' visit' + (p.n > 1 ? 's' : '') + (p.t ? ' &middot; ' + fmtAgo(p.t) + ' ago' : '') + '</span>';
        tip.classList.add('show'); var tw = tip.offsetWidth, th = tip.offsetHeight, vw = window.innerWidth || document.body.clientWidth, vh = window.innerHeight || document.body.clientHeight;
        var tx = e.clientX + 14, ty = e.clientY + 14; if (tx + tw > vw - 4) tx = Math.max(4, e.clientX - 14 - tw); if (ty + th > vh - 4) ty = Math.max(4, e.clientY - 14 - th);
        tip.style.left = tx + 'px'; tip.style.top = ty + 'px'; }

    /* one click = one tab: open without the "noopener" feature (with it, window.open returns null by spec), cut the
       opener by hand, and fall back to a plain link only if open() throws or returns null */
    function openAnalytics() { try { var w = window.open(ANALYTICS_URL, '_blank'); if (w) { try { w.opener = null; } catch (e) {} return; } } catch (e) {}
        try { var a = document.createElement('a'); a.href = ANALYTICS_URL; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {} }

    /* ---------- boot ---------- */
    layout(); resize();
    CARD.addEventListener('mousemove', hoverMove); CARD.addEventListener('mouseleave', function () { tip.classList.remove('show'); });
    CARD.addEventListener('click', function () { openAnalytics(); });
    CARD.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAnalytics(); } });
    var rq = 0; function relayout() { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; layout(); resize(); }); }
    window.addEventListener('resize', relayout); setTimeout(relayout, 250);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
    window.__pfPing = function (city) { var r = CARD.getBoundingClientRect(); for (var i = 0; i < pings.length; i++) if (pings[i].city === city) { var xy = project(pings[i].lon, pings[i].lat); return { x: r.left + xy[0], y: r.top + xy[1] }; } return null; };
    loadData();
})();
</script>
