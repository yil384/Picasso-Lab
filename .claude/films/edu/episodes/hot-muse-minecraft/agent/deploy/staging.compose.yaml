# play-staging.picasso-lab.com on picasso: the staging stack every change runs on before production (ROADMAP M0 item
# 9). The same services and settings as compose.yaml (production), but nothing is shared with it: project
# muse-staging, code in ~/workspace/muse-staging/app, its own Paper 1.21.4 with its own world (seed 71811045) in
# ~/workspace/muse-staging/data, logs in ~/workspace/muse-staging/logs, network 10.77.79.0/28, console volume, agent on
# 172.24.0.1:7851, which Caddy (the FRAS project) proxies https://play-staging.picasso-lab.com to.
# deploy/push.sh deploys here and runs scripts/staging-check.mjs before anything goes to production. By hand, always
# with both -p and -f (push.sh leaves production's compose files out of the staging folder, so a bare `docker compose`
# there finds no file at all):
#   cd ~/workspace/muse-staging/app/deploy && docker compose -p muse-staging -f staging.compose.yaml up -d --build
#   docker compose -p muse-staging -f staging.compose.yaml down        # the world and the logs stay
# The real-client camera runs here only with the "camera" profile, which deploy/push.sh turns on when deploy/camera.env
# exists in the staging folder and no other camera container runs (the one camera account allows one client at a
# time). With FB_LIVE=on in camera.env every staging game goes live on the Facebook Page by itself (README, "Live on a
# Facebook Page"); with FB_LIVE off it films each game to an MP4 in logs/streams (STREAM_OUT_DIR=/logs/streams there).
# The agent then needs STREAM_ENABLED=1 and STREAM_SERVICE_URL=http://127.0.0.1:7862 in deploy/.env.
# Keep the settings in step with compose.yaml (test/deploy.test.js compares them).
# BODY=mineai on staging: its agent image is built with the Mine AI MCP runtime (build arg MINEAI=1, see
# Dockerfile.agent), and their per-bot SQLite (status, inventory, every action) goes to ~/workspace/muse-staging/
# mineai-data (mode 700: the bots' private names are in it; the agent deletes a game's data when it ends and keeps the
# last MINEAI_KEEP_FAILED failed games). Which body plays is set in deploy/.env on picasso, never here (production
# keeps compose.yaml's settings):
#   BODY=mineai  MINEAI_DIR=/opt/mine-ai-mcp  MINEAI_DATA_DIR=/mineai-data
# (README, "The Mine AI MCP body"); without them the image plays with our body as before. Production (compose.yaml)
# builds, runs and mounts the same way since the switch's gate 1; its .env decides its body (docs/SWITCH.md).
name: muse-staging
services:
  paper:
    build: { context: .., dockerfile: deploy/Dockerfile.paper }
    restart: unless-stopped
    environment: { DIFFICULTY: "${PAPER_DIFFICULTY:-easy}", DAYLIGHT: "${PAPER_DAYLIGHT:-locked}", SEED: "71811045", MEMORY: 6G }
    volumes: [ "../../data:/data", "console:/console" ]
    networks: { mc: { ipv4_address: 10.77.79.10 } }
  agent:
    build: { context: .., dockerfile: deploy/Dockerfile.agent, args: { MINEAI: "1" } }
    restart: unless-stopped
    init: true # an init as PID 1 reaps what a Mine AI host leaves behind (production too)
    depends_on: [ paper ]
    env_file: [ .env ]
    environment:
      MC_HOST: 10.77.79.10
      MC_CONSOLE: /console/console.in
      MC_WHITELIST: "true"
      WEB_PUBLIC_URL: https://play-staging.picasso-lab.com
      WEB_TRUST_PROXY: "1"
      WEB_MAX_SESSIONS: "8"
      # 30 minutes, as production; a long Muse run (docs/MUSE-LONG-RUN.md) sets STAGING_LEASE_MS in deploy/.env
      WEB_LEASE_MS: "${STAGING_LEASE_MS:-1800000}"
    volumes: [ "../../logs:/logs", "console:/console", "../../mineai-data:/mineai-data" ]
    ports: [ "172.24.0.1:7851:8787" ]
    networks: { mc: { ipv4_address: 10.77.79.11 } }
  # As compose.yaml's camera, with staging's Paper and folders. The account's tokens are the one camera account's
  # (~/workspace/muse-minecraft/camera/auth, shared with the other stacks: stop their camera first). The Page token for
  # FB_LIVE is ~/workspace/muse-staging/fb/page-token (600, the token alone; FB_TOKEN_FILE=/fb/page-token in
  # camera.env), mounted read-only; it reaches no other container, no environment and no command line.
  camera:
    build: { context: .., dockerfile: deploy/Dockerfile.camera }
    profiles: [ camera ]
    restart: unless-stopped
    depends_on: [ agent ]
    network_mode: "service:agent"
    user: "${CAMERA_UID:-1014}:${CAMERA_GID:-1014}"
    init: true
    env_file: [ { path: camera.env, required: false } ]
    environment:
      STREAM_ENABLED: "1"
      STREAM_MAX: "1"
      STREAM_FPS: "30"
      STREAM_BITRATE_K: "3500"
      MC_HOST: 10.77.79.10
      MC_CONSOLE: /console/console.in
      CAMERA_GL: cpu
      CAMERA_MODS: sodium
    volumes: [ "../../logs:/logs", "console:/console", "${HOME}/workspace/muse-minecraft/camera/auth:/auth", "../../fb:/fb:ro" ]
    tmpfs: [ "/camera:size=1g,mode=1777,exec" ]
    cpus: 6
    mem_limit: 3g
    pids_limit: 1024
    shm_size: 256m
    security_opt: [ "no-new-privileges:true" ]
volumes:
  console: {}
networks:
  mc:
    ipam: { config: [ { subnet: 10.77.79.0/28 } ] }
