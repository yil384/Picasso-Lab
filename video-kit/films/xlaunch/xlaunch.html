<html><head><meta charset="utf-8"><title>Patterns behind Chaos</title>
<!-- Picasso Lab's first X post: a 16 s 3D comic (384 f @ 24 fps, 4:5 portrait) on the ISCA 2026 Best Paper
     "Patterns behind Chaos: Forecasting Data Movement for Efficient Large-Scale MoE LLM Inference".
     Cast as concepts: tokens (cream balls) are routed by a roulette spinner (random expert selection) to experts
     (coloured boxes) spread over the dies of a wafer-scale GPU; every trip squeezes through the die-to-die link
     (data movement = the bottleneck). The Profiler (a magnifying glass) studies the traces, the pattern shows (two hot
     experts take most of the traffic), the hot experts move next to the tokens, the traffic flows, 6.6x.
     Same NPR stack, ink, lettering and palette as the Projects comic films (reference/style-comic). -->
<link rel="stylesheet" href="/pv/fonts/fonts.css">
<script src="/pv/vendor/p5/p5.min.js"></script>
<script src="/pv/vendor/p5.brush/p5.brush.pv.js"></script>
<script type="importmap">{"imports":{"three":"/pv/vendor/three/build/three.module.js","three/addons/":"/pv/vendor/three/addons/"}}</script>
</head><body>
<script type="module">
import { defineScene, ease, clamp, lerp } from '/pv/runtime/pv.js';
import { createNPR } from '/scene/npr/npr.js';
import { bakeBrushTexture, burst } from '/scene/npr/brush.js';
import { orbit, handheld, applyRig, yawSmear } from '/scene/npr/camera.js';

const Q = new URLSearchParams(location.search);
const FPS = 24, NF = 384, TAU = Math.PI * 2;
const PAL = { paper: '#f4ebd6', ink: '#1a1530', ochre: '#f2b134', red: '#e5463b', pink: '#ff3d7f', violet: '#6f52c8',
  teal: '#2f9d97', cream: '#fff6e0', blush: '#ff7a8e', sky: '#5b8fd8' };
const COL = { tok: 0xfff1cf, brass: 0xe6ad42, red: 0xe5463b, teal: 0x39a6a0, ochre: 0xf2b134, violet: 0x7a5bd6, sky: 0x6a9be0,
  dark: 0x2b2447, cream: 0xf8eed6, table: 0x7b86c9, wafer: 0xd9dbe8, letter: 0xe5463b, letterSide: 0xf6b93b };

const mj = (x) => { x = clamp(x); return x * x * x * (10 + x * (-15 + 6 * x)); };
const sm = (x) => ease.smooth(clamp(x));
const io = (x) => ease.inOutSine(clamp(x));
const ob = (x) => ease.outBack(clamp(x));
const twos = (F) => F - (F % 2);
const ringv = (a, amp, w = 1.1, k = 0.2) => (a < 0 ? 0 : amp * Math.exp(-k * a) * Math.cos(w * a));
const hsh = (...n) => { let x = Math.sin(n.reduce((s, v, i) => s + v * (12.9898 + i * 78.233), 0.5)) * 43758.5453; return x - Math.floor(x); };

// =====================================================================================================
// world: a wafer of 3 x 3 dies; die (i, j) centre, x right, z towards the camera
// =====================================================================================================
const PITCH = 1.9, DIE = 1.62, WR = 3.75;
const D = (i, j) => [(i - 1) * PITCH, (j - 1) * PITCH];
const SPIN = [-1.9, 0];                 // the router's roulette on the source die
const LINK = [-0.95, 0];                 // the die-to-die link every early trip squeezes through
const TOKY = 0.24, R = 0.21;

// experts: name, colour, chaos home, new home after the placement (only the two hot ones move)
const EXP = [
  { c: COL.red, home: D(2, 0), hot: true, to: [-1.32, -0.62] },
  { c: COL.teal, home: D(2, 2), hot: true, to: [-1.32, 0.62] },
  { c: COL.ochre, home: D(1, 0) },
  { c: COL.violet, home: D(1, 2) },
  { c: COL.sky, home: D(2, 1) },
];
// key frames
const K = {
  dep: [24, 31, 38, 45, 52],          // chaos departures from the roulette
  prof: [116, 132],                   // the Profiler hops in
  look: 146, aha: 172,                // studies the traces; the pattern lights up
  move: [[192, 206, 220], [198, 212, 226]],   // hot experts hop to the source die (two hops each)
  dep2: [236, 243, 250, 257, 264],    // after: tokens hop straight into the hot experts
  slam: [292, 296, 300, 304],         // 6 . 6 x
  ban: [306, 326],                    // the award banner unfurls
};
const CHAOS_T = [0, 1, 3, 0, 1];     // targets of the chaos trips (4/5 of them go to the two hot experts)
const FLOW_T = [0, 1, 0, 1, 0];

// ---- chaos routes: spinner -> link -> streets -> the expert (pure, computed once) ----
function routeTo(e) {
  const [ex, ez] = EXP[e].home;
  const pts = [[SPIN[0] + 0.3, 0], [LINK[0], 0]];
  if (Math.abs(ez) < 0.1) pts.push([ex - 0.45, 0]);
  else {
    const zs = Math.sign(ez) * PITCH / 2;
    pts.push([LINK[0], zs]);
    if (ex > 0.5) pts.push([PITCH / 2, zs], [PITCH / 2, ez]);
    else pts.push([LINK[0], ez]);
    pts.push([ex - 0.45, ez]);
  }
  return pts;
}
function polyLen(p) { let s = 0; for (let i = 1; i < p.length; i++) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return s; }
function polyAt(p, d) {
  for (let i = 1; i < p.length; i++) {
    const L = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (d <= L || i === p.length - 1) { const k = clamp(d / (L || 1)); return [lerp(p[i - 1][0], p[i][0], k), lerp(p[i - 1][1], p[i][1], k), Math.atan2(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1])]; }
    d -= L;
  }
  return [...p[p.length - 1], 0];
}
const SPEED = 0.085, LINK_GAP = 13, REACH = 7;     // world units / frame; frames between link passes; frames to the link
const TRIPS = CHAOS_T.map((e, k) => ({ e, dep: K.dep[k], route: routeTo(e) }));
{ // the link passes one token at a time: the rest queue up behind it
  let free = 0;
  TRIPS.forEach((t, k) => {
    t.arrive = t.dep + REACH;
    t.pass = Math.max(t.arrive, free); free = t.pass + LINK_GAP;
    t.qi = 0;                                         // queue slot while waiting
    TRIPS.slice(0, k).forEach((o) => { if (o.pass > t.arrive) t.qi++; });
    t.len = polyLen(t.route.slice(1));
    t.end = t.pass + Math.round(t.len / SPEED);
    t.gulp = t.end + 9;
  });
}

// =====================================================================================================
// state: everything a pure function of the frame
// =====================================================================================================
function expertPos(e, F) {
  const E = EXP[e];
  if (!E.hot) return { x: E.home[0], z: E.home[1], y: 0, sq: 0 };
  const [f0, f1, f2] = K.move[e];
  const mid = [(E.home[0] + E.to[0]) / 2 + 0.2, (E.home[1] + E.to[1]) / 2];
  const hop = (a, b, p, h) => ({ x: lerp(a[0], b[0], mj(p)), z: lerp(a[1], b[1], mj(p)), y: h * Math.sin(Math.PI * clamp(p)) });
  let s;
  if (F < f0) s = { x: E.home[0], z: E.home[1], y: 0 };
  else if (F < f1) s = hop(E.home, mid, (F - f0) / (f1 - f0), 1.1);
  else if (F < f2) s = hop(mid, E.to, (F - f1) / (f2 - f1), 0.9);
  else s = { x: E.to[0], z: E.to[1], y: 0 };
  s.sq = F >= f0 - 4 && F < f0 ? 0.16 * sm((F - f0 + 4) / 4) : (F >= f2 ? ringv(F - f2, 0.22, 0.9, 0.2) : 0) + (F >= f1 && F < f1 + 10 ? ringv(F - f1, 0.18, 0.9, 0.25) : 0);
  return s;
}
function expertExpr(e, F) {
  const gulps = [...TRIPS.filter((t) => t.e === e).map((t) => t.gulp), ...FLOWS.filter((t) => t.e === e).map((t) => t.gulp)];
  for (const g of gulps) if (F >= g - 2 && F < g + 8) return F < g + 2 ? 'surprised' : 'happy';
  if (F >= K.slam[0]) return 'happy';
  if (EXP[e].hot && F >= K.move[e][0] - 6 && F < K.move[e][2] + 4) return 'surprised';
  if (EXP[e].hot && F < K.move[e][0] && F > 70) return 'strain';      // swamped: all the traffic, from far away
  return 'calm';
}
function gulpSq(e, F) {
  let s = 0;
  for (const t of [...TRIPS, ...FLOWS]) if (t.e === e) s += F >= t.gulp - 3 && F < t.gulp ? -0.1 : ringv(F - t.gulp, 0.24, 0.9, 0.22);
  return s;
}

const FLOWS = FLOW_T.map((e, k) => ({ e, dep: K.dep2[k], gulp: K.dep2[k] + 9 }));

// a token: queue -> roulette -> (chaos) link + streets, or (after) one hop into the neighbouring expert
function tokState(k, F) {
  const chaos = k < 5, t = chaos ? TRIPS[k] : FLOWS[k - 5];
  const dep = t.dep, slot = chaos ? k : k - 5;
  const qBase = chaos ? 0 : 200;
  // waiting in line on the wafer margin, shuffling forward as the line moves
  const ahead = (chaos ? K.dep : K.dep2).filter((d) => d <= F).length;
  const qx = (n) => SPIN[0] - 0.55 - 0.44 * n;
  if (F < dep - 6) {
    const n = Math.max(0, slot - ahead);
    const prev = Math.max(0, slot - Math.max(0, ahead - 1));
    const lastDep = (chaos ? K.dep : K.dep2)[Math.max(0, ahead - 1)];
    const x = ahead > 0 ? lerp(qx(prev), qx(n), sm((F - lastDep) / 6)) : qx(n);
    const shuffle = ahead > 0 && F - lastDep < 6 ? 0.1 * Math.sin(Math.PI * (F - lastDep) / 6) : 0;
    const vis = chaos ? F < 200 : F >= 150;
    return { vis, x, z: 0, y: TOKY + shuffle, e: chaos && F > 60 ? 'squint' : 'awake', sq: 0.03 * Math.sin(TAU * (F + slot * 7) / 30), yaw: Math.PI / 2 };
  }
  if (F < dep) {   // hop onto the roulette
    const p = (F - dep + 6) / 6;
    return { vis: true, x: lerp(qx(0), SPIN[0], mj(p)), z: 0, y: TOKY + 0.35 + 0.35 * Math.sin(Math.PI * p), e: 'awake', sq: -0.1 * Math.sin(Math.PI * p), yaw: Math.PI / 2 };
  }
  if (!chaos) {   // after: wait one beat on the roulette, then one short hop into the expert
    const ex = expertPos(t.e, F);
    if (F < dep + 3) return { vis: true, x: SPIN[0], z: 0, y: TOKY + 0.35, e: 'happy', sq: ringv(F - dep, 0.2), yaw: 0 };
    const p = (F - dep - 3) / 6;
    if (p >= 1) return { vis: false };
    return { vis: true, x: lerp(SPIN[0], ex.x, mj(p)), z: lerp(0, ex.z, mj(p)), y: lerp(TOKY + 0.35, 0.75, p) + 0.5 * Math.sin(Math.PI * p), e: 'whee', sq: -0.15, sx: 1.15, yaw: Math.atan2(ex.x - SPIN[0], ex.z) };
  }
  // chaos: roll off the roulette to the link, queue, squeeze through, then the long trip
  const r = t.route;
  if (F < t.pass) {
    const a = F - dep, goal = LINK[0] - 0.12 - 0.46 * t.qi;
    const x = lerp(SPIN[0] + 0.3, goal, mj(a / REACH)), wait = F >= t.arrive;
    const bump = wait ? ringv(F - t.arrive, 0.18, 1.0, 0.25) : 0;
    return { vis: true, x, z: 0, y: TOKY + (wait ? 0 : 0.06 * Math.abs(Math.sin(a * 0.9))), e: wait ? (F - t.arrive < 3 ? 'surprised' : 'strain') : 'awake', sq: bump, yaw: Math.PI / 2, wait, jam: wait && t.qi > 0 };
  }
  const d = (F - t.pass) * SPEED;
  const tail = r.slice(1);
  if (F < t.end) {
    const [x, z, yaw] = polyAt(tail, d);
    const step = Math.abs(Math.sin(d * 4.2));
    return { vis: true, x, z, y: TOKY + 0.07 * step, e: F - t.pass < 6 ? 'squint' : 'awake', sq: 0.05 * (1 - step), yaw, moving: true };
  }
  const ex = expertPos(t.e, F), last = r[r.length - 1];
  const p = (F - t.end) / 9;
  if (p >= 1) return { vis: false };
  return { vis: true, x: lerp(last[0], ex.x, mj(p)), z: lerp(last[1], ex.z, mj(p)), y: lerp(TOKY, 0.8, p) + 0.55 * Math.sin(Math.PI * p), e: 'whee', sq: -0.12, yaw: Math.PI / 2 };
}

// the roulette arrow: spins before each departure and stops on the chosen expert's direction
function spinAngle(F) {
  const deps = [...K.dep.map((d, k) => [d, CHAOS_T[k], 2.6]), ...K.dep2.map((d, k) => [d, FLOW_T[k], 1.0])];
  let ang = Math.PI / 2, base = Math.PI / 2;
  for (const [d, e, turns] of deps) {
    const ex = e < 2 && d > 200 ? EXP[e].to : EXP[e].home;
    const tgt = Math.atan2(ex[0] - SPIN[0], ex[1] - SPIN[1]);
    const t0 = d - 6;
    let end = tgt + TAU * Math.ceil(turns); while (end < base) end += TAU;
    if (F < t0) return ang;
    ang = F < d ? lerp(base, end, ease.outCubic((F - t0) / 6)) : end;
    base = end;
  }
  return ang;
}

// ---- the Profiler (a magnifying glass with one big eye) ----
function profState(F) {
  const Fc = twos(F);
  let x = 2.95, z = 2.75, y = 0, tilt = 0, yaw = -0.5, sq = 0, expr = 'eye', vis = Fc >= K.prof[0] - 8, spin = 0;
  if (Fc < K.prof[1]) {   // two hops in from off-screen right
    const H = [[K.prof[0] - 8, 6.2, 3.4], [K.prof[0] + 6, 4.4, 3.1], [K.prof[1], 2.95, 2.75]];
    const h = Fc < H[1][0] ? 0 : 1, a = H[h], b = H[h + 1], p = (Fc - a[0]) / (b[0] - a[0]);
    const air = clamp((p - 0.2) / 0.75);
    x = lerp(a[1], b[1], sm(air)); z = lerp(a[2], b[2], sm(air)); y = 0.7 * Math.sin(Math.PI * air);
    sq = p < 0.2 ? 0.18 * sm(p / 0.2) : -0.15 * Math.sin(Math.PI * air);
    yaw = -0.9;
  } else {
    sq = ringv(Fc - K.prof[1], 0.2, 0.9, 0.22);
    yaw = lerp(-0.9, -0.55, sm((Fc - K.prof[1]) / 6));
    // lean the lens down over the wafer to study it
    tilt = 0.55 * sm((Fc - K.look + 8) / 10) * (1 - sm((Fc - K.move[0][0] + 6) / 8));
    if (Fc >= K.aha && Fc < K.aha + 12) { expr = 'wide'; sq += ringv(Fc - K.aha, -0.22, 0.9, 0.2); }
    // point at the hot experts as they move
    if (Fc >= K.move[0][0] - 6 && Fc < K.move[1][2] + 6) { tilt = -0.35; yaw = lerp(-0.55, -1.2, sm((Fc - K.move[0][0]) / 20)); expr = 'eye'; }
    if (Fc >= K.slam[0]) { expr = 'happy'; y = 0.25 * Math.abs(Math.sin(TAU * (Fc - K.slam[0]) / 20)); spin = Fc >= K.slam[3] && Fc < K.slam[3] + 16 ? TAU * sm((Fc - K.slam[3]) / 16) : 0; yaw = -0.35; }
  }
  return { vis, x, y, z, tilt, yaw, sq, expr, spin };
}

// ---- 6.6x letters + banner ----
const LET = { z: 4.25, h: 1.25, y: -0.16 };
const GL_LAYOUT = [{ ch: '6', dx: -1.75, rz: 0.06, ry: 0.12 }, { ch: '.', dx: -0.86, rz: 0, ry: 0 }, { ch: '6', dx: -0.48, rz: -0.05, ry: -0.04 }, { ch: 'x', dx: 0.5, rz: 0.08, ry: -0.12 }];
function letterState(i, F) {
  const f = K.slam[i], a = F - f;
  if (a < -8) return { vis: false };
  if (a < 0) { const p = (a + 8) / 8; return { vis: true, y: lerp(5.5, 0, ease.inCubic(p)), sy: 1.12, sxz: 0.92, rz: 0 }; }
  const sq = ringv(a, 0.3, 0.8, 0.18);
  return { vis: true, y: 0, sy: 1 - sq, sxz: 1 + sq * 0.6, rz: 0.04 * Math.sin(a * 0.5) * Math.exp(-a / 10) };
}

// =====================================================================================================
// camera: shot rigs + whips
// =====================================================================================================
function mixRig(a, b, k) {
  return { tg: a.tg.map((v, i) => lerp(v, b.tg[i], k)), az: lerp(a.az, b.az, k), el: lerp(a.el, b.el, k), r: lerp(a.r, b.r, k), fov: lerp(a.fov, b.fov, k), roll: lerp(a.roll, b.roll, k) };
}
function rigWide(F) {    // establishing, then lean in on the jam at the link
  const k = sm((F - 50) / 40);
  return { tg: [lerp(0.15, -0.8, k), lerp(0.0, 0.2, k), lerp(0.35, 0.15, k)], az: lerp(-0.36, -0.28, k), el: lerp(0.86, 0.6, k), r: lerp(12.2, 7.6, k) - 0.5 * sm(F / 40), fov: 34, roll: lerp(0.0, -0.06, k) };
}
function rigProf(F) {    // crash zoom on the Profiler as it lands
  const p = profState(F);
  return { tg: [p.x - 0.25, 1.45, p.z], az: 0.36, el: 0.14, r: lerp(4.6, 4.0, sm((F - 126) / 14)), fov: 32, roll: 0.07 };
}
function rigLens(F) {    // over the Profiler's shoulder, down on the wafer through the lens
  const k = sm((F - 146) / 40);
  return { tg: [lerp(1.4, 1.2, k), 0.6, lerp(1.4, 1.2, k)], az: 0.05, el: lerp(0.48, 0.54, k), r: lerp(10.8, 9.9, k), fov: 34, roll: 0.03 };
}
function rigMove(F) {    // wide, following the hot experts' hops home
  const k = sm((F - 192) / 36);
  return { tg: [lerp(0.4, -0.5, k), 0.2, 0.2], az: lerp(-0.12, -0.28, k), el: lerp(0.8, 0.7, k), r: lerp(10.6, 9.4, k), fov: 34, roll: -0.03 };
}
function rigFlow(F) {    // low and close on the source die: hop, hop, hop
  const k = sm((F - 232) / 50);
  return { tg: [lerp(-1.5, -1.7, k), 0.35, 0.05], az: lerp(-0.62, -0.5, k), el: lerp(0.32, 0.27, k), r: lerp(5.4, 4.9, k), fov: 32, roll: -0.05 };
}
function rigWin(F) {     // hero: the 6.6x in front of the wafer, the banner above
  const k = sm((F - 290) / 90);
  return { tg: [-0.3, lerp(1.25, 1.35, k), lerp(1.4, 1.6, k)], az: lerp(0.08, -0.05, k), el: lerp(0.34, 0.3, k), r: lerp(12.4, 11.2, k), fov: 36, roll: lerp(0.02, -0.015, k) };
}
const WHIPS = [[112, 124], [140, 150], [186, 196], [228, 238], [280, 292]];
function camRig(F) {
  if (F < 112) return rigWide(F);
  if (F < 124) return mixRig(rigWide(F), rigProf(F), ease.inOutQuint((F - 112) / 12));
  if (F < 140) return rigProf(F);
  if (F < 150) return mixRig(rigProf(F), rigLens(F), ease.inOutQuint((F - 140) / 10));
  if (F < 186) return rigLens(F);
  if (F < 196) return mixRig(rigLens(F), rigMove(F), ease.inOutQuint((F - 186) / 10));
  if (F < 228) return rigMove(F);
  if (F < 238) return mixRig(rigMove(F), rigFlow(F), ease.inOutQuint((F - 228) / 10));
  if (F < 280) return rigFlow(F);
  if (F < 292) return mixRig(rigFlow(F), rigWin(F), ease.inOutQuint((F - 280) / 12));
  return rigWin(F);
}
function camShake(F) {
  let s = [0, 0, 0];
  const hit = (f0, amp, dec = 5) => { const a = F - f0; if (a < 0 || a > 30) return; const k = amp * Math.exp(-a / dec);
    s[0] += (hsh(F, 1.3, f0) * 2 - 1) * k; s[1] += (hsh(F, 2.7, f0) * 2 - 1) * k; s[2] += (hsh(F, 5.1, f0) * 2 - 1) * k * 0.6; };
  TRIPS.forEach((t) => { if (t.qi > 0) hit(t.arrive, 0.004, 3); });
  hit(K.prof[1], 0.01, 4); hit(K.aha, 0.008, 4); hit(K.move[0][2], 0.006, 3); hit(K.move[1][2], 0.006, 3);
  K.slam.forEach((f, i) => hit(f, i === 2 ? 0.02 : 0.011, 4));
  return s;
}

// =====================================================================================================
// scene
// =====================================================================================================
let T = null;
const st = {};
const LOOK = {
  extends: 'comic',
  hatchCut: 0.22, crossT: 0.62, crossW: 1.0, hatchPx: 7.5, hatchW: 1.5, hatchWobble: 0.08, hatchSwell: 0.35,
  htAmt: 0.55, htPx: 14, htT: 0.3, htRange: 0.5, misreg: [2.6, -2.0],
  lineW: 2.0, lineWShadow: 3.2, hullW: 3.1, hullShadowW: 1.5,
  bleed: 1.6, edgeDark: 0.45, gran: 0.3, flocc: 0.06, dryEdge: 0.2, sat: 1.12,
  rule: 0.17, rulePx: 10, ruleTop: 0.3, ruleBot: 0.04,
  bgDots: [0.95, 0.6, 0.42, 0.28],
  dofMax: 3.5, dofRange: 3.0,
  grain: 0.018, vignette: 0.16,
};

defineScene({
  meta: { title: 'Patterns behind Chaos', durationFrames: NF, fps: FPS, width: 1080, height: 1350, seed: 23,
    design: [1080, 1350], background: PAL.paper, fonts: ['Permanent Marker'], boil: { every: 2, variants: 3 }, poster: 330 },
  update(ctx) {
    const F = ctx.iw;
    updateCamera(ctx, F);
    updateCast(F);
    updateBackdrop(F);
  },
  layers: [
    { name: 'paper', type: '2d', cache: () => 'static', draw(ctx, g) { g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(paperCanvas(ctx), 0, 0); } },
    { name: 'npr', type: 'three', underlay: true, antialias: false,
      async init(ctx, three) { return buildWorld(ctx, three); }, draw(ctx) { drawNPR(ctx); return false; } },
    { name: 'ink', type: 'brush', blend: 'multiply', draw(ctx, p, brush) { inkOverlay(ctx, brush); } },
    { name: 'letters', type: '2d', draw(ctx, g) { lettering(ctx, g); } },
  ],
});
function paperCanvas(ctx) { return ctx.paper({ tone: PAL.paper, grain: 0.04, fibres: 0.05, blotch: 0.06, seed: 4 }); }

let brushesAdded = false;
function addBrushes() {

// ---- 6.6x as extruded comic block letters ----
function glyphShape(THREE, ch, seed) {
  const six = () => {
    const c = [0.36, 0.32], r = 0.32;
    const outer = [[0.66, 0.97], [0.46, 1.01], [0.26, 0.94], [0.1, 0.76], [0.03, 0.52]];
    for (let k = 0; k <= 20; k++) { const a = Math.PI + k / 20 * (Math.PI * 1.55); outer.push([c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r]); }
    outer.push([0.25, 0.71], [0.36, 0.83], [0.5, 0.86], [0.64, 0.83]);
    const hole = Array.from({ length: 14 }, (_, k) => [c[0] + Math.cos(k / 14 * TAU) * 0.15, c[1] + Math.sin(k / 14 * TAU) * 0.15]);
    return [outer, hole];
  };
  const P = {
    '6': six(),
    '.': [Array.from({ length: 12 }, (_, i) => [0.11 + 0.11 * Math.cos(i / 12 * TAU), 0.11 + 0.11 * Math.sin(i / 12 * TAU)])],
    'x': [(() => { const c = [0.3, 0.36], w = 0.08, L = 0.3, a = Math.PI / 4, ca = Math.cos(a), sa = Math.sin(a);
      const plus = [[w, L], [w, w], [L, w], [L, -w], [w, -w], [w, -L], [-w, -L], [-w, -w], [-L, -w], [-L, w], [-w, w], [-w, L]];
      return plus.map(([px, py]) => [c[0] + px * ca - py * sa, c[1] + px * sa + py * ca]).reverse(); })()],
  }[ch];
  const wob = (poly, k) => { const out = [];
    for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length], n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 0.12));
      for (let j = 0; j < n; j++) { const t = j / n; out.push([a[0] + (b[0] - a[0]) * t + (hsh(seed, k, i, j, 1) - 0.5) * 0.016, a[1] + (b[1] - a[1]) * t + (hsh(seed, k, i, j, 2) - 0.5) * 0.016]); } }
    return out; };
  const shape = new THREE.Shape(wob(P[0], 0).map((q) => new THREE.Vector2(q[0], q[1])));
  for (let h = 1; h < P.length; h++) shape.holes.push(new THREE.Path(wob(P[h], h).map((q) => new THREE.Vector2(q[0], q[1]))));
  return shape;
}

  T.letters = GL_LAYOUT.map((L, i) => {
    const geo = new THREE.ExtrudeGeometry(glyphShape(THREE, L.ch, i + 1), { depth: 0.32, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.03, bevelSegments: 2, curveSegments: 4 });

    add(geo, [{ color: COL.letter, hatchDir: [0.3, 1, 0], rim: 0.9, shadeColor: 0x7a1f3a, shadeMix: 0.35, seed: 50 + i },
      { color: COL.letterSide, hatchDir: [0, 1, 0], rim: 0.5, shadeColor: 0xb0521e, shadeMix: 0.4, seed: 60 + i }], { outline: 1.25 }, [0, 0, 0], [0, 0, 0], g);

}

function ell(x, y, rx, ry, rot = 0, n = 22) { const pts = []; for (let i = 0; i < n; i++) { const a = i / n * TAU, px = Math.cos(a) * rx, py = Math.sin(a) * ry; pts.push([x + px * Math.cos(rot) - py * Math.sin(rot), y + px * Math.sin(rot) + py * Math.cos(rot)]); } return pts; }

function star4(x, y, r, rot = 0) { const pts = []; for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 4, rr = i % 2 ? r * 0.3 : r; pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); } return pts; }

// faces: tok (sphere, face at u = 0.25), box (planar), lens (planar, one big eye)
function paintFace(brush, who, expr, W, Hh) {
  const sphere = who === 'tok';
  const cx = sphere ? W * 0.25 : W / 2, cy = sphere ? Hh * 0.5 : Hh * 0.47;
  const s = sphere ? W / 1024 * 1.6 : W / 512 * 2.1;
  const ink = PAL.ink;
  if (who === 'lens') {
    const ex = W / 2, ey = Hh / 2;
    if (expr === 'happy') { brush.set('fatink', ink, 2.2 * s); brush.spline([[ex - 90 * s, ey + 20 * s], [ex, ey - 60 * s], [ex + 90 * s, ey + 20 * s]], 0.7); return; }
    const rr = expr === 'wide' ? 130 : 105;
    fillP(brush, ell(ex, ey, rr * s, rr * 0.92 * s), '#ffffff'); fillP(brush, ell(ex, ey, rr * s, rr * 0.92 * s), '#ffffff');
    brush.set('fatink', ink, 1.6 * s); brush.beginShape(0.4); ell(ex, ey, rr * s, rr * 0.92 * s).forEach(([x, y]) => brush.vertex(x, y)); brush.endShape(true);
    const pr = expr === 'wide' ? 34 : 52;
    for (let q = 0; q < 3; q++) fillP(brush, ell(ex + 18 * s, ey + 14 * s, pr * s, pr * s), '#4a3a8a');
    for (let q = 0; q < 3; q++) fillP(brush, ell(ex + 18 * s, ey + 14 * s, pr * 0.55 * s, pr * 0.55 * s), ink);
    fillP(brush, ell(ex - 6 * s, ey - 12 * s, 14 * s, 11 * s), '#ffffff');
    brush.set('fatink', ink, 1.3 * s); brush.line(ex - 110 * s, ey - (expr === 'wide' ? 170 : 140) * s, ex + 90 * s, ey - (expr === 'wide' ? 175 : 125) * s);
    return;
  }
  const ex = (sphere ? 52 : 70) * s, ey = -26 * s, my = cy + (sphere ? 40 : 62) * s;
  const eyes = [[cx - ex, cy + ey], [cx + ex, cy + ey]];
  const dot = (rx, ry) => eyes.forEach(([x, y]) => { const E = ell(x, y, rx * s, ry * s); fillP(brush, E, ink); fillP(brush, E, ink); fillP(brush, ell(x - rx * 0.3 * s, y - ry * 0.45 * s, rx * 0.32 * s, ry * 0.22 * s), '#fffaf0'); });
  const arcs = (dir) => eyes.forEach(([x, y]) => { brush.set('fatink', ink, 0.9 * s); brush.spline([[x - 20 * s, y + dir * 4 * s], [x, y - dir * 14 * s], [x + 20 * s, y + dir * 4 * s]], 0.7); });
  const mouth = (k) => {
    if (k === 'smile') { brush.set('bigink', ink, 1.1 * s); brush.spline([[cx - 22 * s, my - 4 * s], [cx, my + 10 * s], [cx + 22 * s, my - 4 * s]], 0.7); }
    if (k === 'o') { for (let q = 0; q < 3; q++) fillP(brush, ell(cx, my + 4 * s, 11 * s, 14 * s), ink); }
    if (k === 'open') { const pts = [[cx - 30 * s, my - 8 * s], [cx + 30 * s, my - 8 * s], [cx + 22 * s, my + 14 * s], [cx, my + 24 * s], [cx - 22 * s, my + 14 * s]]; for (let q = 0; q < 3; q++) fillP(brush, pts, ink); fillP(brush, ell(cx, my + 14 * s, 14 * s, 8 * s), '#e8546a'); }
    if (k === 'teeth') { const pts = [[cx - 34 * s, my - 10 * s], [cx + 34 * s, my - 10 * s], [cx + 34 * s, my + 12 * s], [cx - 34 * s, my + 12 * s]]; fillP(brush, pts, '#fffaf0'); brush.set('bigink', ink, 1.0 * s); brush.polygon(pts); brush.line(cx - 34 * s, my + 1 * s, cx + 34 * s, my + 1 * s); for (let q = -2; q <= 2; q++) brush.line(cx + q * 12 * s, my - 10 * s, cx + q * 12 * s, my + 12 * s); }
    if (k === 'tiny') { brush.set('bigink', ink, 0.8 * s); brush.spline([[cx - 8 * s, my], [cx, my + 5 * s], [cx + 8 * s, my]], 0.6); }
  };
  const blush = () => [[cx - ex * 1.5, cy + 18 * s], [cx + ex * 1.5, cy + 18 * s]].forEach(([x, y]) => fillP(brush, ell(x, y, 22 * s, 12 * s), PAL.blush, 150, 0.08, 0.3));
  switch (expr) {
    case 'awake': dot(12, 22); mouth('tiny'); break;
    case 'calm': dot(11, 18); mouth('smile'); break;
    case 'surprised': dot(16, 29); mouth('o'); break;
    case 'whee': eyes.forEach(([x, y], i) => { const sg = i ? -1 : 1; brush.set('fatink', ink, 0.9 * s); brush.spline([[x - 16 * sg * s, y - 16 * s], [x + 14 * sg * s, y], [x - 16 * sg * s, y + 16 * s]], 0.2); }); mouth('open'); break;
    case 'squint': eyes.forEach(([x, y], i) => { const sg = i ? -1 : 1; brush.set('fatink', ink, 0.9 * s); brush.line(x - 18 * s, y - sg * 3 * s, x + 18 * s, y + sg * 3 * s); }); mouth('tiny'); break;
    case 'strain': eyes.forEach(([x, y], i) => { const sg = i ? -1 : 1; brush.set('fatink', ink, 0.9 * s); brush.spline([[x - 16 * sg * s, y - 14 * s], [x + 12 * sg * s, y], [x - 16 * sg * s, y + 14 * s]], 0.2); }); mouth('teeth'); break;
    case 'happy': arcs(1); mouth('open'); blush(); break;
    default: dot(12, 22);
  }
}
async function bakeFaces(THREE) {
  const sets = { tok: ['awake', 'surprised', 'whee', 'squint', 'strain', 'happy'], box: ['calm', 'surprised', 'strain', 'happy'], lens: ['eye', 'wide', 'happy'] };
  const out = {};
  for (const who of Object.keys(sets)) {
    out[who] = {};
    for (const e of sets[who]) {
      const W = who === 'tok' ? 1024 : 512, Hh = 512;
      out[who][e] = await bakeBrushTexture(THREE, { width: W, height: Hh, seed: 100, key: `face-${who}-${e}`, background: who === 'lens' ? '#eef6ff' : '#ffffff' }, (p, brush) => paintFace(brush, who, e, W, Hh));
    }
  }
  return out;
}
function paintBackdrop(ctx, brush, w, h) {
  const r = ctx.rng('backdrop'), cx = w * 0.5, cy = h * 0.62, n = 40;

    brush.fill('#b9b9b9', 215); brush.fillBleed(0.03); brush.fillTexture(0.35, 0.3);
    brush.polygon([[cx, cy], [cx + Math.cos(a0) * 2400, cy + Math.sin(a0) * 1100], [cx + Math.cos(a1) * 2400, cy + Math.sin(a1) * 1100]]); }
  brush.fill('#ffffff', 190); brush.fillBleed(0.3, 'out'); brush.fillTexture(0.5, 0.4); blob(brush, r, cx, cy, 300, 150, 24, 0.1);
  for (let k = 0; k < 6; k++) { brush.fill('#a9a9a9', 60); brush.fillBleed(0.3, 'out'); brush.fillTexture(0.6, 0.5); blob(brush, r, r.range(160, w - 160), r.range(70, h * 0.45), r.range(130, 260), r.range(40, 80), 20, 0.14); }
}
// wafer top: the cap's uv is the disc mapped to the unit square (x -> u, z -> v)
function paintWafer(ctx, brush, w, h) {

    brush.set('inkpen', '#8a8fb5', 0.9);
    for (let k = 0; k < 6; k++) { const y0 = z - 0.6 + k * 0.24; brush.line(U(x - 0.6), Vv(y0), U(x - 0.6 + r.range(0.3, 1.1)), Vv(y0)); }
