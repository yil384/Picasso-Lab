        const tc = row.tributeCard;
        const rc = row.returnCard;
        const payerName = row.payerSeat != null ? encodeHTML(displaySeatName(game.seats[row.payerSeat])) : "";
        const recvName  = row.receiverSeat != null ? encodeHTML(displaySeatName(game.seats[row.receiverSeat])) : "";
        if (tc && payerName) {
            return `<div class="tribute-row tribute-visual">
                <span class="tv-name">${payerName}</span>
                <span class="tv-arrow">进贡</span>
                ${cardHTML(tc, true, false, "", "tv-card")}
                <span class="tv-arrow">→</span>
                <span class="tv-name">${recvName}</span>
                ${rc ? `<span class="tv-sep">·</span><span class="tv-name">${recvName}</span><span class="tv-arrow">还贡</span>${cardHTML(rc, true, false, "", "tv-card tv-return")}<span class="tv-arrow">→</span><span class="tv-name">${payerName}</span>` : ""}
            </div>`;
        }
        return `<div class="tribute-row">${encodeHTML(displayMessage(row.text || row))}</div>`;
    }).join("")}</div>`;
}

function dealOverlayHTML(mine, phase) {
    if (phase !== "dealing" && phase !== "sorting") return "";
    const label = phase === "dealing" ? L("Dealing cards", "正在发牌") : L("Sorting hand", "正在理牌");
    const cards = Array.from({ length: DEAL_CARD_COUNT }).map((_, idx) => {
        const seat = idx % 4;
        const pos = visualSeatPos(seat, mine);
        const fan = Math.floor(idx / 4) - 13;
        const rot = (fan * 1.6).toFixed(1);
        return `<span class="deal-card target-${pos}" style="--i:${idx};--fan:${fan};--rot:${rot}deg"><b>P</b><i>PICASSO</i><i>LAB</i></span>`;
    }).join("");
    return `<div class="deal-overlay ${phase}" aria-hidden="true">
        <div class="deal-deck"><i></i><i></i><i></i></div>
        <div class="deal-status">${label}<span></span></div>
        <div class="deal-flight">${cards}</div>
    </div>`;
}

function handCardsHTML(myHand, selectable, phase) {
    if (!myHand.length) return `<div class="combo-label">${L("You are not seated yet. Spectator view.", "你还没有入座，当前是观战视角。")}</div>`;
    if (phase === "dealing") return handBacksHTML(myHand.length, "deal-hand-back");
    return myHand.map((c, idx) => {
        const fan = idx - myHand.length / 2;
        const attrs = [
            phase === "sorting" ? `style="--i:${idx};--fan:${fan}"` : "",
            selectable && phase === "done" ? `draggable="true" data-hand-pos="${idx}"` : ""
        ].filter(Boolean).join(" ");
        return cardHTML(c, false, selectable, attrs, phase === "sorting" ? "sort-in" : "");
    }).join("");
}

function renderTable() {
    document.body.dataset.screen = "table";
    const mine = mySeat();
    const dealPhase = currentDealPhase();
    const tableBusy = dealPhase !== "done";
    const myHand = mine >= 0 ? orderedHandForDisplay(game.hands[mine] || [], game.currentLevelRank, mine) : [];
    const canAct = mine === game.currentTurn && game.phase === "playing" && !tableBusy;
    const selectedCards = mine >= 0 ? myHand.filter(c => selected.has(c.id)) : [];
    const rawSelectedCombos = selectedCards.length ? evaluateCombos(selectedCards, game.currentLevelRank) : [];
    const selectedCombo = selectedCards.length ? choosePlayable(selectedCards, game.lastPlay?.combo || null, game.currentLevelRank) : null;
    const canPlaySelected = canAct && !!selectedCombo && !actionBusy;
    const handSelectable = game.phase === "playing" && mine >= 0 && !actionBusy && !tableBusy;
    const remaining = turnRemainingMs(game);
    const turnClockText = remaining == null
        ? isOpeningLead(game) ? L("No limit", "不限时") : "--"
        : formatClock(remaining);
    const turnClockClass = remaining != null && remaining <= 30000 ? "danger" : remaining != null && remaining <= 60000 ? "warn" : "";
    const currentTurnName = displaySeatName(game.seats[game.currentTurn], L("player", "玩家"));
    const lastLabel = game.lastPlay
        ? `${encodeHTML(displaySeatName(game.seats[game.lastPlay.player]))}: ${comboName(game.lastPlay.combo)}`
        : L("New trick: any legal combo", "新一轮，任意合法牌型");
    let advisorClass = "";
    let advisorText = mine >= 0
        ? L("Select cards to preview the combo before playing.", "选牌后会预览牌型和能否出牌。")
        : L("Spectator view. Sit in the lobby before the next game to play.", "观战视角。下局前回大厅入座即可参与。");
    let advisorDetail = selectedCards.map(cardText).join(" ");
    const activeHint = activeHintForSelection(selectedCards, canAct);
    if (activeHint) {
        advisorClass = activeHint.className || "hint";
        advisorText = activeHint.text;
        advisorDetail = activeHint.detail || advisorDetail;
    } else if (tableBusy) {
        advisorText = dealPhase === "dealing"
            ? L("Cards are being dealt. Your hand will reveal after the deal.", "正在发牌，发完后会翻开并理牌。")
            : L("Sorting your hand.", "正在理牌。");
    } else if (mine >= 0 && game.phase !== "playing") {
        advisorText = L("Round review mode. Start the next round when everyone is ready.", "本局结算中，准备好后进入下一局。");
    } else if (mine >= 0 && !canAct) {
        advisorText = `${L("Waiting for", "等待")} ${encodeHTML(currentTurnName)}`;
    } else if (selectedCards.length && selectedCombo) {
        advisorClass = "ready";
        advisorText = `${L("Ready", "可出")}: ${comboName(selectedCombo)} · ${selectedCards.length} ${L("cards", "张")}`;
    } else if (selectedCards.length && rawSelectedCombos.length) {
        advisorClass = "invalid";
        advisorText = L("Legal combo, but it does not beat the current trick.", "牌型合法，但压不过当前上一手。");
    } else if (selectedCards.length) {
        advisorClass = "invalid";
        advisorText = L("Not a legal Guandan combo.", "当前选牌不是合法掼蛋牌型。");
    }
    const historyRows = (game.history || []).slice(-10).reverse().map(h => `
        <div class="history-row">
            <div><b>${encodeHTML(displaySeatName(game.seats[h.player]))}</b> ${encodeHTML(translateAction(h.action, h))}</div>
            ${h.cards?.length ? `<div class="history-cards">${displayCardsForCombo(h.cards, h.combo).map(cardText).join(" ")}</div>` : ""}
        </div>`).join("");
    root.innerHTML = `
    <section class="table-wrap">
        <div class="table deal-${dealPhase}">
            <div class="table-emblem" aria-hidden="true"><span>Picasso Lab</span><b>Guandan</b></div>
            <div class="bomb-fx" aria-hidden="true"></div>
            <div class="bomb-banner-slot" aria-hidden="true"></div>
            <div class="score-strip">
                <div class="score-pill">${iconHTML("shield")}<span>${teamName(0)}</span><strong>${teamLevelDisplay(0)}</strong></div>
                <div class="score-pill">${iconHTML("shield")}<span>${teamName(1)}</span><strong>${teamLevelDisplay(1)}</strong></div>
                <div class="score-pill">${iconHTML("level")}<span>${L("Level", "本局打")}</span><strong>${game.currentLevelRank}</strong></div>
                <div class="score-pill">${iconHTML("round")}<span>${L("Round", "第")}</span><strong>${game.roundNo}</strong>${isZH() ? " 局" : ""}</div>
                <div class="score-pill wide turn-timer ${turnClockClass}">${iconHTML("turn")}<span>${L("Turn", "轮到")}</span><strong>${encodeHTML(currentTurnName)}</strong><em id="turn-clock">${turnClockText}</em></div>
                <div class="score-pill">${iconHTML("wild")}<span>${L("Wild", "逢人配")}</span><strong class="wild-rank">♥${game.currentLevelRank}</strong></div>
            </div>
            ${[0,1,2,3].map(i => playerHTML(i, mine)).join("")}
            ${[0,1,2,3].map(i => seatPlayHTML(i, mine)).join("")}
            ${dealOverlayHTML(mine, dealPhase)}
            <div class="center-zone">
                <div class="center-card">
                    <div class="center-meta"><span>${iconHTML("last")}${L("Last Trick", "上一手")}</span><strong>${lastLabel}</strong></div>
                    ${tributeSummaryHTML()}
                    ${game.startingCard && game.roundNo === 1 ? `<div class="starting-card-banner"><span>${L("Starting card", "起始牌")}</span>${cardHTML({ suit: game.startingCard.suit, rank: game.startingCard.rank, id: "__sc" }, true, false, "", "sc-card")}<span>${L("determines first player", "决定首出")}</span></div>` : ""}
                    <div class="last-play ${game.lastPlay ? "" : "empty"}">${encodeHTML(lastPlaySummaryHTML(lastLabel))}</div>
                    <div class="round-message">${encodeHTML(displayMessage(game.message || ""))}</div>
                </div>
            </div>
            <div class="history"><div class="history-title"><span>${iconHTML("log")}${L("Trick Log", "出牌记录")}</span><span>${(game.history || []).length}</span></div>${historyRows || `<div class="history-row">${L("Waiting for the first play.", "等待第一手牌。")}</div>`}</div>
            ${game.phase === "roundOver" ? roundOverHTML() : ""}
            ${game.phase === "gameOver" ? gameOverHTML() : ""}
            <div class="hand-zone ${canAct ? "your-turn" : ""}">
                <div class="hand-header">
                    <div class="hand-summary">${mine >= 0 ? `${L("Hand", "手牌")} ${tableBusy ? "" : `<strong>${myHand.length}</strong> ${L("cards", "张")} · `}${canAct ? L("Your turn", "轮到你出牌") : tableBusy ? (dealPhase === "dealing" ? L("Dealing", "发牌中") : L("Sorting", "理牌中")) : `${L("Waiting for", "等待")} ${encodeHTML(currentTurnName)}`}` : L("Spectator view", "观战视角")}</div>
                    <div class="hand-tools">
                        <button class="btn ghost" id="clear-btn" title="${L('Clear', '取消')}" type="button">${iconHTML("clear")}</button>
                        <button class="btn ghost" id="hint-btn" title="${L('Hint', '提示')}" ${canAct && !actionBusy ? "" : "disabled"} type="button">${iconHTML("hint")}</button>
                        <button class="btn pass" id="pass-btn" ${canAct && game.lastPlay && !actionBusy ? "" : "disabled"} type="button">${iconLabel("pass", L("Pass", "不要"))}</button>
                        <button class="btn play" id="play-btn" ${canPlaySelected ? "" : "disabled"} type="button">${iconLabel("play", L("Play", "出牌"))}</button>
                    </div>
                    <div class="hand-feedback">
                        <div class="selection-meter">${L("Selected", "已选")} <strong>${selected.size}</strong> ${L("cards", "张")}</div>
                        <div class="combo-advisor ${advisorClass}"><span>${advisorText}</span><em>${encodeHTML(advisorDetail)}</em></div>
                    </div>
                </div>
                <div class="hand ${dealPhase === "dealing" ? "receiving-hand" : dealPhase === "sorting" ? "sorting-hand" : ""} ${handSelectable && dealPhase === "done" ? "reorderable" : ""}">${handCardsHTML(myHand, handSelectable, dealPhase)}</div>
            </div>
        </div>
    </section>`;
    function refreshSelectionState() {
        const selectedCardsNow = mine >= 0 ? myHand.filter(c => selected.has(c.id)) : [];
        const rawCombosNow = selectedCardsNow.length ? evaluateCombos(selectedCardsNow, game.currentLevelRank) : [];
        const selectedComboNow = selectedCardsNow.length ? choosePlayable(selectedCardsNow, game.lastPlay?.combo || null, game.currentLevelRank) : null;
        const canPlayNow = canAct && !!selectedComboNow && !actionBusy;
        let nextClass = "";
        let nextText = mine >= 0
            ? L("Select cards to preview the combo before playing.", "选牌后会预览牌型和能否出牌。")
            : L("Spectator view. Sit in the lobby before the next game to play.", "观战视角。下局前回大厅入座即可参与。");
        let nextDetail = selectedCardsNow.map(cardText).join(" ");
        const activeHintNow = activeHintForSelection(selectedCardsNow, canAct);
        if (activeHintNow) {
            nextClass = activeHintNow.className || "hint";
            nextText = activeHintNow.text;
            nextDetail = activeHintNow.detail || nextDetail;
        } else if (tableBusy) {
            nextText = dealPhase === "dealing"
                ? L("Cards are being dealt. Your hand will reveal after the deal.", "正在发牌，发完后会翻开并理牌。")
                : L("Sorting your hand.", "正在理牌。");
        } else if (mine >= 0 && game.phase !== "playing") {
            nextText = L("Round review mode. Start the next round when everyone is ready.", "本局结算中，准备好后进入下一局。");
        } else if (mine >= 0 && !canAct) {
            nextText = `${L("Waiting for", "等待")} ${encodeHTML(currentTurnName)}`;
        } else if (selectedCardsNow.length && selectedComboNow) {
            nextClass = "ready";
            nextText = `${L("Ready", "可出")}: ${comboName(selectedComboNow)} · ${selectedCardsNow.length} ${L("cards", "张")}`;
        } else if (selectedCardsNow.length && rawCombosNow.length) {
            nextClass = "invalid";
            nextText = L("Legal combo, but it does not beat the current trick.", "牌型合法，但压不过当前上一手。");
        } else if (selectedCardsNow.length) {
            nextClass = "invalid";
            nextText = L("Not a legal Guandan combo.", "当前选牌不是合法掼蛋牌型。");
        }
        const advisor = document.querySelector(".combo-advisor");
        advisor?.classList.toggle("ready", nextClass === "ready");
        advisor?.classList.toggle("hint", nextClass === "hint");
        advisor?.classList.toggle("invalid", nextClass === "invalid");
        const span = advisor?.querySelector("span");
        const em = advisor?.querySelector("em");
        if (span) span.textContent = nextText;
        if (em) em.textContent = nextDetail;
        const playBtn = document.getElementById("play-btn");
        if (playBtn) playBtn.disabled = !canPlayNow;
        const meter = document.querySelector(".selection-meter strong");
        if (meter) meter.textContent = String(selected.size);
    }
    document.querySelectorAll("[data-card-id]").forEach(el => {
        el.addEventListener("click", () => {
            if (suppressNextCardClick) {
                suppressNextCardClick = false;
                return;
            }
            const id = el.dataset.cardId;
            hintAdvisor = null;
            if (selected.has(id)) selected.delete(id);
            else selected.add(id);
            el.classList.toggle("selected", selected.has(id));
            refreshSelectionState();
        });
        el.addEventListener("dragstart", event => {
            cardDragState = { id: el.dataset.cardId || "", moved: false };
            el.classList.add("drag-source");
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", cardDragState.id);
        });
        el.addEventListener("dragover", event => {
            if (!cardDragState.id || cardDragState.id === el.dataset.cardId) return;
            event.preventDefault();
            const rect = el.getBoundingClientRect();
            const before = event.clientX < rect.left + rect.width / 2;
            el.classList.toggle("drop-before", before);
            el.classList.toggle("drop-after", !before);
        });
        el.addEventListener("dragleave", () => {
            el.classList.remove("drop-before", "drop-after");
        });
        el.addEventListener("drop", event => {
            if (!cardDragState.id) return;
            event.preventDefault();
            const rect = el.getBoundingClientRect();
            const before = event.clientX < rect.left + rect.width / 2;
            cardDragState.moved = moveHandCard(cardDragState.id, el.dataset.cardId, before);
        });
        el.addEventListener("dragend", () => {
            if (cardDragState.moved) suppressNextCardClick = true;
            cardDragState = { id: "", moved: false };
            document.querySelectorAll(".drag-source,.drop-before,.drop-after").forEach(node => node.classList.remove("drag-source", "drop-before", "drop-after"));
        });
    });
    document.getElementById("play-btn")?.addEventListener("click", playSelected);
    document.getElementById("pass-btn")?.addEventListener("click", passTurn);
    document.getElementById("hint-btn")?.addEventListener("click", hintMove);
    document.getElementById("clear-btn")?.addEventListener("click", () => { selected.clear(); hintAdvisor = null; renderTable(); });
    document.getElementById("next-round")?.addEventListener("click", nextRound);
    maybeCelebrateBomb();
    initResultOverlay();
    updateTopbarStatus();
}

function playerHTML(i, mine) {
    const s = game.seats[i] || { name: `Seat ${i + 1}`, type: "empty" };
    if (i === mine) return "";
    const count = (game.hands[i] || []).length;
    const finishedPlace = finishedList(game).indexOf(i) + 1;
    const pos = visualSeatPos(i, mine);
    const name = displaySeatName(s, `Seat ${i + 1}`);
    const thinking = game.phase === "playing" && game.currentTurn === i && s.type === "ai";
    const canRevealCount = i === mine || finishedPlace || count <= 7;
    const countText = finishedPlace
        ? L("DONE", "完赛")
        : canRevealCount
            ? `${count} ${L("cards", "张")}`
            : "";
    const leftLabel = finishedPlace
        ? L(`#${finishedPlace}`, `第 ${finishedPlace} 名`)
        : i !== mine && count > 7
            ? `≥8 ${L("cards", "张")}`
            : L("left", "剩余");
    // Public jokers revealed after 抗贡
    const publicJokerSeats = valuesFromFirebase(game.publicJokerSeats);
    const publicJokers = publicJokerSeats.includes(i)
        ? (game.hands[i] || []).filter(c => c.joker === "RJ")
        : [];
    const backCount = finishedPlace
        ? 0
        : count <= 7
            ? Math.max(1, count - publicJokers.length)
            : 8 - publicJokers.length;
    const publicJokerCards = publicJokers.map(c => cardHTML(c, true, false, "", "public-joker")).join("");
    const isTurn = game.currentTurn === i;
    const turnRemainMs = isTurn ? turnRemainingMs(game) : null;
    const turnFrac = turnRemainMs == null ? 0 : Math.max(0, Math.min(1, turnRemainMs / TURN_LIMIT_MS));
    const turnDashOffset = (1 - turnFrac) * 163.4;
    const ringClass = turnRemainMs != null && turnRemainMs <= 30000 ? "danger" : turnRemainMs != null && turnRemainMs <= 60000 ? "warn" : "";
    const tier = levelTier(game.levels?.[i % 2]);
    const memberPhoto = seatMemberPhoto(name);
    return `<div class="player p${pos} ${game.currentTurn === i ? "turn" : ""} ${thinking ? "thinking" : ""} ${finishedPlace ? "finished" : ""}">
        <div class="player-main">
            <div class="avatar-frame" data-tier="${tier}">
                <svg class="turn-ring ${ringClass}" viewBox="0 0 68 68" aria-hidden="true">
                    <circle class="turn-ring-track" cx="34" cy="34" r="26"/>
                    <circle class="turn-ring-fill" cx="34" cy="34" r="26" style="stroke-dashoffset:${turnDashOffset}"/>
                </svg>
                <div class="player-avatar">${memberPhoto ? `<img src="${encodeHTML(memberPhoto)}" alt="">` : encodeHTML(initials(name, String(i + 1)))}</div>
                <span class="player-level-badge">${encodeHTML(teamLevelDisplay(i % 2))}</span>
            </div>
            <div class="player-name"><span>${encodeHTML(name)}</span><span class="player-badge">${i === mine ? L("You", "你") : teamName(i % 2)}</span></div>
        </div>
        <div class="player-small"><span>${iconHTML(s.type === "ai" ? "ai" : "human")} ${s.type === "ai" ? "AI" : L("Human", "真人")} · ${thinking ? `<span class="thinking-badge">${L("Thinking", "思考中")}<i></i><i></i><i></i></span>` : leftLabel}</span>${countText ? `<span class="count-chip${i !== mine && !finishedPlace && count <= 7 ? " alert" : ""}">${iconHTML("cards")} ${countText}</span>` : ""}</div>
        <div class="back-stack">${publicJokerCards}${Array.from({ length: Math.max(0, backCount) }).map(() => `<i class="mini-back"></i>`).join("")}</div>
    </div>`;
}

function roundOverHTML() {
    const r = game.roundResult;
    const mine = mySeat();
    const isWin = mine >= 0 && mine % 2 === r.firstTeam;
    const isLose = mine >= 0 && mine % 2 !== r.firstTeam;
    const rows = r.order.map((i, idx) => `<div class="tribute-row">${L(`#${idx + 1}`, `第 ${idx + 1} 名`)}: ${encodeHTML(displaySeatName(game.seats[i]))} · ${teamName(i % 2)}</div>`).join("");
    const title = r.aceChallenge
        ? r.aceReset
            ? `${teamName(r.firstTeam)} ${L("A challenge reset", "冲 A 失败退回 2")}`
            : `${teamName(r.firstTeam)} ${L("A challenge failed", "冲 A 失败")}`
        : `${teamName(r.firstTeam)} ${L(`advances ${r.advance}`, `本局升级 ${r.advance}`)}`;
    const detail = r.aceChallenge
        ? r.aceReset
            ? L("This was the third failed A challenge. The team resets to level 2 next round.", "这是第 3 次冲 A 失败，下局该队退回打 2。")
            : L(`A challenge failed. Failure ${r.aceFailureCount}/${ACE_FAIL_LIMIT}; the team keeps playing A next round.`, `冲 A 失败，第 ${r.aceFailureCount}/${ACE_FAIL_LIMIT} 次；下局继续打 A。`)
        : L("The next round will automatically handle Tribute and Return. If the paying side holds two Red Jokers, Tribute is blocked.", "下一局将自动处理进贡/还贡；如果进贡方合计拿到两张大王，则抗贡成功。");
    // Confetti only for a clean round win (not a failed/aborted A challenge, even
    // though the challenging team still technically held first place).
    const showConfetti = isWin && !r.aceChallenge;
    const resultKey = `round:${game.roundNo}:${r.firstTeam}:${r.advance}:${r.aceChallenge ? 1 : 0}:${r.aceReset ? 1 : 0}`;
    return `<div class="phase-backdrop">
        <div class="result-ticket ${isWin ? "win" : "lose"}" data-result-key="${encodeHTML(resultKey)}" data-result-score="${Number(r.advance) || 0}">
            <div class="result-verdict">
                <span class="result-verdict-label">${isWin ? "胜" : "负"}</span>
                <span class="result-verdict-team">${teamName(r.firstTeam)}</span>
            </div>
            <div class="result-standings">
                <h2>${title}</h2>
                <p>${detail}</p>
                <div class="tribute-list">${rows}</div>
            </div>
            <div class="result-action">
                <div class="result-score"><span class="result-score-label">${L("Levels advanced", "本局升级")}</span><span class="result-score-value">0</span></div>
                <button class="btn play" id="next-round" ${isHost() ? "" : "disabled"} type="button">${L("Next Round", "进入下一局")}</button>
            </div>
            ${showConfetti ? `<div class="result-confetti">${confettiPiecesHTML(28)}</div>` : ""}
        </div>
    </div>`;
}

                <button class="btn play" id="next-round" disabled type="button">${L("Match Complete", "比赛结束")}</button>
            </div>
            ${isWin ? `<div class="result-confetti">${confettiPiecesHTML(28)}</div>` : ""}
        </div>
    </div>`;
}

function confettiPiecesHTML(n) {
    let out = "";
    for (let i = 0; i < n; i++) {
        const cx = Math.round(Math.random() * 100);
        const dx = Math.round((Math.random() * 2 - 1) * 120);
        const rot = Math.round(Math.random() * 720 - 360);
        const dur = Math.round(1800 + Math.random() * 800);
        const delay = Math.round(Math.random() * 600);
        out += `<span class="confetti-piece" style="--cx:${cx}%;--cdx:${dx}px;--crot:${rot}deg;--cdur:${dur}ms;--cdelay:${delay}ms"></span>`;
    }
    return out;
}

// Win/lose overlay entrance is handled by CSS (gdBackdropIn/gdResultIn); the
// score count-up needs real per-frame JS for an eased 0 -> final-tally
// animation. Guarded by lastResultOverlayKey so it only plays once per result
// (renderTable() re-runs on every game-state tick while the panel is open).
let lastResultOverlayKey = "";
function initResultOverlay() {
    const panel = document.querySelector(".result-ticket");
    if (!panel) { lastResultOverlayKey = ""; return; }
    const key = panel.dataset.resultKey || "";
    if (!key || key === lastResultOverlayKey) return;
    lastResultOverlayKey = key;
    const valueEl = panel.querySelector(".result-score-value");
    const target = Number(panel.dataset.resultScore) || 0;
    if (!valueEl) return;
    const duration = 700;
    const start = performance.now();
    function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        valueEl.textContent = String(Math.round(target * eased));
        if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
}

document.getElementById("copy-link-btn").addEventListener("click", async () => {
    if (!roomCode) return showToast(L("No room yet", "还没有房间"));
    const url = new URL(location.href);
    url.searchParams.set("room", roomCode);
    try {
        await navigator.clipboard.writeText(url.toString());
        showToast(L("Room link copied", "房间链接已复制"));
    } catch (_) {
        showToast(roomCode);
    }
});

document.getElementById("new-room-btn").addEventListener("click", () => {
    location.href = GUANDAN_URL;
});

langToggleBtn.addEventListener("click", () => {
    uiLang = isZH() ? "en" : "zh";
    storageSet("picasso.guandan.lang", uiLang);
    setStaticLabels();
    render();
});

backEventsBtn.addEventListener("click", startReturnToEvents);

window.addEventListener("load", () => setTimeout(primeReturnKeyboardCapture, 0), { once: true });
window.addEventListener("pageshow", () => setTimeout(primeReturnKeyboardCapture, 0));
window.addEventListener("focus", primeReturnKeyboardCapture);
document.addEventListener("pointerenter", primeReturnKeyboardCapture);
document.addEventListener("mousemove", () => {
    if (!returnKeyboardPrimed) primeReturnKeyboardCapture();
}, { once: true });

document.addEventListener("keydown", event => {
    if (event.target?.closest?.("input, textarea, [contenteditable='true']")) return;
    if (event.key.length !== 1 || event.metaKey || event.ctrlKey || event.altKey) return;
    returnKeyboardPrimed = true;
    returnBuffer = (returnBuffer + event.key.toLowerCase()).slice(-7);
    if (returnBuffer.endsWith("picasso") || returnBuffer.endsWith("picaso")) {
        returnBuffer = "";
        startReturnToEvents();
        return;
    }
    if (returnBuffer.length >= 2) showReturnTypeHint();
}, true);

// ==== STAGE HOOKS (owned by stage package) ====
// Mount window.GuandanStage into #stage-mount here (lazy import, optional-chained, never
// blocking the 2D game). Nothing runs in this region yet.
// ==== END STAGE HOOKS ====

if (roomCode) attachRoom(roomCode);
else render();
</script>
<script src="https://yil384.github.io/Picasso-Lab/events/static/guandan-records.js"></script>
<script>
// 巅峰对决 board: window.GuandanRecordsUI.open(page) / close(). It opens only from a
// [data-open-records] control (value = page key) and never by itself; the 战报 strip is
// rendered only into [data-gdr-banner-slot] elements that a screen provides.
(function () {
    var R = window.GuandanRecords;
    var modal = document.getElementById("gdr-cardmodal");
    var host = document.getElementById("gdr-cardmodal-body");
    var closeBtn = document.getElementById("gdr-card-close");
    if (!R || !R.mount || !modal || !host) return;
    var board = null, opener = null, closeTimer = 0;
    function setBackgroundInert(on) {
        [document.getElementById("root"), document.querySelector(".topbar")].forEach(function (el) { if (el) el.inert = on; });
    }
    function uiLang() {
        try { return localStorage.getItem("picasso.guandan.lang") === "en" ? "en" : "zh"; } catch (_) { return "zh"; }
    }
    function isOpen() { return !modal.hidden && modal.classList.contains("is-open"); }
    function open(page) {
        var lang = uiLang();
        clearTimeout(closeTimer);
        if (!board || board.lang !== lang) {
            if (board) board.destroy();
            board = R.mount(host, { lang: lang });
            modal.setAttribute("aria-label", lang === "en" ? "Peak Showdown" : "巅峰对决");
            closeBtn.setAttribute("aria-label", lang === "en" ? "Close" : "关闭");
        }
        board.go(page == null || page === "" ? 0 : page, true);
        if (!isOpen()) opener = document.activeElement;
        modal.hidden = false;
        setBackgroundInert(true);
        document.body.classList.add("gdr-modal-open");
        void modal.offsetWidth; // start the fade from the hidden state
        modal.classList.add("is-open");
        closeBtn.focus({ preventScroll: true });
    }
    function close() {
        if (modal.hidden) return;
        modal.classList.remove("is-open");
        setBackgroundInert(false);
        document.body.classList.remove("gdr-modal-open");
        clearTimeout(closeTimer);
        closeTimer = setTimeout(function () { modal.hidden = true; }, 160);
        var back = opener && document.contains(opener) ? opener : document.body;
        opener = null;
        try { back.focus({ preventScroll: true }); } catch (_) {}
    }
    closeBtn.addEventListener("click", close);
    document.addEventListener("click", function (e) {
        var t = e.target.closest && e.target.closest("[data-open-records]");
        if (!t) return;
        e.preventDefault();
        open(t.getAttribute("data-open-records"));
    });
    document.addEventListener("keydown", function (e) {
        if (isOpen()) {
            if (e.key === "Escape") { e.preventDefault(); close(); }
            else if (e.key === "ArrowRight") { e.preventDefault(); board.next(); }
            else if (e.key === "ArrowLeft") { e.preventDefault(); board.prev(); }
            return;
        }
        var t = (e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest("[data-open-records]");
        if (t && t.tagName !== "BUTTON" && t.tagName !== "A") { e.preventDefault(); open(t.getAttribute("data-open-records")); }
    });
    function fillBannerSlots() {
        if (!R.buildBanner) return;
        var lang = uiLang();
        [].forEach.call(document.querySelectorAll("[data-gdr-banner-slot]"), function (slot) {
            var bn = slot.firstElementChild;
            if (bn && bn.classList.contains("gdr-banner") && bn.getAttribute("data-lang") === lang) return;
            slot.innerHTML = R.buildBanner({ lang: lang });
        });
    }
    new MutationObserver(fillBannerSlots).observe(document.getElementById("root") || document.body, { childList: true, subtree: true });
    fillBannerSlots();
    window.GuandanRecordsUI = { open: open, close: close };
})();

// BGM: autoplay on load; fall back to first user gesture if browser blocks autoplay
(function () {
    var bgm = document.getElementById("guandan-bgm");
    if (!bgm) return;
    bgm.volume = 0.45;
    function tryPlay() { bgm.play().catch(function () {}); }
    tryPlay();
    function onGesture() {
        tryPlay();
        document.removeEventListener("click", onGesture, true);
        document.removeEventListener("keydown", onGesture, true);
    }
    document.addEventListener("click", onGesture, true);
    document.addEventListener("keydown", onGesture, true);
})();
</script>
