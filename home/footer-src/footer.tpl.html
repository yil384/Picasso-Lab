<!-- =====================================================================
     Picasso Lab footer: ONE embed for the Google Sites footer (every page).
     It replaces the three footer embeds home/ucsd.html + home/address.html +
     home/visitor-map.html:
       - the UC San Diego seal (link: ucsd.edu)
       - PICASSO LAB + the address (link: the 3D lab walk-through, home/address.html)
       - the visitor map card: it records the visit into Supabase exactly like
         home/visitor-map.html does, and a click opens the analytics dashboard
         (home/visitor-map.html) in a new tab.
     A Sites embed box keeps its aspect ratio and only shrinks on phones, and
     Sites already frames the box, so this page fills whatever box it gets
     edge to edge (sizes read from the box):
       ratio >= 2.2 : one row  seal | title + address | map  (desktop proportions,
                      turning smoothly into a compact phone row as the box shrinks)
       ratio <  2.2 : seal + text on top, map below; or, for tall boxes, stacked
                      (seal, text, map), whichever of the two comes out larger.
     GENERATED FILE: edit home/footer-src/footer.tpl.html and run
     python3 home/footer-src/build.py. The visit-recording code is copied from
     home/visitor-map.html by that script (keep the two in sync through it).
     ===================================================================== -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    .pf { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; background: #000; color: #fff;
        font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    .pf-seal, .pf-addr, .vmap { position: absolute; left: 0; top: 0; visibility: hidden; }
    .pf.ready .pf-seal, .pf.ready .pf-addr, .pf.ready .vmap { visibility: visible; }
    .pf-seal { display: block; line-height: 0; text-decoration: none; }
    .pf-seal img { display: block; width: 100%; height: 100%; border: 0; object-fit: contain; background: transparent; }
    .pf-addr { display: block; color: #fff; text-decoration: none; cursor: pointer; }
    .pf-title { font-weight: 800; line-height: 0.98; letter-spacing: -0.025em; white-space: nowrap; }
    .pf-title span { display: inline-block; }
    .pf-text { font-weight: 400; text-justify: inter-word; }

    /* ---- the visitor map card: the map fills it (the card has the map's own proportions) ---- */
    .vmap { overflow: hidden; cursor: pointer; border-radius: var(--vr, 12px); outline: none;
        background: radial-gradient(120% 140% at 50% 0%, #0a2c47 0%, #061a2c 55%, #04111d 100%); }
    .vmap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
    /* the hairline edge sits over the map (the dots never cover it) and lights up on hover / focus */
    .vmap::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        box-shadow: inset 0 0 0 1px rgba(130, 200, 255, .16); transition: box-shadow .25s ease; }
    .vmap:hover::after, .vmap:focus-visible::after { box-shadow: inset 0 0 0 1px rgba(150, 215, 255, .42); }
    /* the numbers sit in the empty South Pacific (bottom left), clear of South America */
    .vm-stats { position: absolute; left: var(--vx, 12px); bottom: var(--vy, 10px); pointer-events: none;
        font: 400 var(--vf, 12px)/1.28 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: rgba(196, 226, 250, .66); white-space: nowrap;
        text-shadow: 0 0 3px #04111d, 0 0 6px #04111d; }
    .vm-stats b { font-weight: 700; color: #f2fbff; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
    .vm-stats div { display: flex; align-items: center; gap: .32em; }
    .vm-live { width: .5em; height: .5em; border-radius: 50%; background: #ffc94d; flex: none; margin-right: .08em;
        box-shadow: 0 0 0 0 rgba(255, 201, 77, .5); animation: vmlive 2.4s ease-out infinite; }
    .vm-stats .vm-l2 { padding-left: .9em; }
    @keyframes vmlive { 0% { box-shadow: 0 0 0 0 rgba(255, 201, 77, .55); } 70%, 100% { box-shadow: 0 0 0 .55em rgba(255, 201, 77, 0); } }
    #vmap-latest { display: none; }
    /* "Open analytics" on hover; a small arrow badge stays on touch screens */
    .vm-open { position: absolute; right: var(--vo, 8px); top: var(--vo, 8px); height: var(--vh, 22px); display: flex; align-items: center; gap: .4em;
        padding: 0 calc(var(--vh, 22px) * .32) 0 calc(var(--vh, 22px) * .5); border-radius: 999px; pointer-events: none;
        font: 600 var(--vf2, 11px)/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #eaf7ff; white-space: nowrap;
        background: rgba(12, 44, 70, .82); box-shadow: inset 0 0 0 1px rgba(150, 215, 255, .3);
        opacity: 0; transform: translateY(-3px); transition: opacity .2s ease, transform .2s ease; }
    .vm-open svg { width: calc(var(--vh, 22px) * .5); height: calc(var(--vh, 22px) * .5); flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .vmap:hover .vm-open, .vmap:focus-visible .vm-open { opacity: 1; transform: none; }
    @media (hover: none) {
        .vm-open { opacity: .9; transform: none; width: var(--vh, 22px); padding: 0; justify-content: center; }
        .vm-open span { display: none; }
    }
    .vmtip { position: fixed; z-index: 100000; display: none; flex-direction: column; gap: 3px; pointer-events: none; max-width: 240px; padding: 7px 10px 8px;
        border-radius: 9px; background: rgba(6, 24, 40, .94); border: 1px solid rgba(130, 200, 255, .22); color: #eef8ff;
        font: 400 11px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; box-shadow: 0 8px 22px rgba(0, 0, 0, .45); }
    .vmtip.show { display: flex; }
    .vmtip b { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .vmtip i { font-style: normal; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 4px 1px; border-radius: 3px;
        color: #082236; background: #9fdcff; line-height: 1; }
    .vmtip span { color: rgba(214, 236, 252, .7); }
</style>

<div class="pf" id="pf">
    <a class="pf-seal" id="pf-seal" href="https://ucsd.edu/" target="_blank" rel="noopener" aria-label="UC San Diego">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Seal_of_the_University_of_California,_San_Diego.svg?width=400"
             alt="UC San Diego" width="200" height="200">
    </a>
    <a class="pf-addr" id="pf-addr" href="https://yil384.github.io/Picasso-Lab/home/address.html" target="_blank" rel="noopener" aria-label="Picasso Lab, step inside the lab in 3D">
        <div class="pf-title" id="pf-title"><span>PICASSO LAB</span></div>
        <div class="pf-text" id="pf-text">Computer Science and Engineering Building, 3235 Voigt Dr, La&nbsp;Jolla, CA&nbsp;92093</div>
    </a>
    <div id="vmap" class="vmap" role="link" tabindex="0" aria-label="Visitor map: open the visitor analytics">
        <canvas id="vmap-c"></canvas>
        <canvas id="vmap-fx"></canvas>
        <div class="vm-stats" aria-hidden="true">
            <div class="vm-l1"><span class="vm-live"></span><b id="vmap-total">0</b><span>visits</span></div>
            <div class="vm-l2"><b id="vmap-countries">0</b><span id="vm-reg">regions</span></div>
            <span id="vmap-latest"></span>
        </div>
        <div class="vm-open" aria-hidden="true"><span>Open analytics</span><svg viewBox="0 0 12 12"><path d="M3.6 8.4 8.4 3.6M4.6 3.6h3.8v3.8"/></svg></div>
    </div>
</div>
<div id="vmtip" class="vmtip"></div>

<script>
(function () {
    /* ════════ visitor data + recording (copied from home/visitor-map.html by build.py) ════════ */
//@@VM_JS@@

    /* ════════ layout: everything is placed from the box's own size ════════ */
    var PF = document.getElementById('pf'), SEAL = document.getElementById('pf-seal'), ADDR = document.getElementById('pf-addr'),
        TTL = document.getElementById('pf-title'), TSP = TTL.firstChild, TXT = document.getElementById('pf-text'),
        CARD = document.getElementById('vmap'), STATS = CARD.querySelector('.vm-stats');
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    /* quirks mode (no doctype in the Sites embed): read the box from the fixed root / body, not documentElement */
    function boxSize() { var b = document.body;
        return [PF.clientWidth || (b && b.clientWidth) || window.innerWidth, PF.clientHeight || (b && b.clientHeight) || window.innerHeight]; }
    /* typeset the title + address at the given sizes; the column is the title's width (or minEm address-ems, if wider) */
    function typeset(T, A, lh, gap, minEm, align) {
        TTL.style.fontSize = T + 'px'; TTL.style.marginTop = (-0.11 * T) + 'px';
        TXT.style.lineHeight = lh; TXT.style.marginTop = gap + 'px';
        var tw = TSP.getBoundingClientRect().width, C, just = align === 'justify';
        function lines() { return Math.round(TXT.offsetHeight / (parseFloat(TXT.style.fontSize) * lh)); }
        /* justified (fills the title's width, like the old footer): sized so it breaks into the same three lines as on
           desktop; if it can't, or the column is narrow, it is left-aligned instead (narrow justified lines get word gaps) */
        if (just) { C = Math.ceil(tw + 0.5); var a = Math.min(A, C / 12.45); ADDR.style.width = C + 'px'; TXT.style.textAlign = 'justify';
            for (var i = 0; i < 5; i++) { TXT.style.fontSize = a + 'px'; if (lines() <= 3) break; a *= 0.96; }
            if (lines() > 3 || C < 150) just = false; else A = a; }
        if (!just) { TXT.style.fontSize = A + 'px'; C = Math.ceil(Math.max(tw, A * minEm) + 0.5); ADDR.style.width = C + 'px';
            TXT.style.textAlign = align === 'center' ? 'center' : 'left'; }
        var h = ADDR.offsetHeight, lead = A * (lh - 1) / 2;
        /* visual box: from the title's cap top (the negative margin crops the leading above it) to the last baseline + descender */
        return { C: C, tw: tw, A: A, h: h, vis: Math.max(1, h - lead - A * 0.08) };
    }
    function put(el, x, y, w, h) { el.style.left = Math.round(x) + 'px'; el.style.top = Math.round(y) + 'px';
        if (w != null) el.style.width = Math.round(w) + 'px'; if (h != null) el.style.height = Math.round(h) + 'px'; }

    /* one row: seal | text | map, filling the box (Sites already frames it, so only a hairline margin).
       Two keyframes: desktop (957 x 290 box) and phone (the same box shrunk to 352 x 107); f runs 0 -> 1 between
       them with the box's effective size, so the text gets relatively larger as the box shrinks. The map card
       takes the width that is left; if that would make it taller than the box, the spare width goes to the gaps. */
    function rowLayout(W, H) {
        var s = Math.min(W / 957, H / 290, 1.3), f = clamp((s - 0.368) / 0.632, 0, 1), We = 957 * s;
        function L(a, b) { return a + (b - a) * f; }
        var px = clamp(W * 0.012, 3, 14), py = clamp(H * 0.035, 3, 12), availW = W - 2 * px, availH = H - 2 * py;
        var z = 1, o;
        for (var it = 0; it < 8; it++) {
            var T = We * L(0.0469, 0.046) * z, A = T * L(0.65, 0.5), lh = L(1.5, 1.34), gap = T * 0.28;
            var S = We * L(0.125, 0.2) * z, g1 = We * L(0.03, 0.04) * z, g2 = We * L(0.032, 0.04) * z;
            var t = typeset(T, A, lh, gap, L(11, 11.5), f >= 0.5 ? 'justify' : 'left');
            var fixedW = S + g1 + t.C + g2, Mmin = We * L(0.42, 0.34) * z;
            var M = Math.min(availW - fixedW, availH * MAP_ASPECT), zz = 1;
            if (M < Mmin) zz = Math.min(zz, availW / (fixedW + Mmin));
            var needH = Math.max(S, t.vis);
            if (needH > availH) zz = Math.min(zz, availH / needH);
            o = { mode: 'row', f: +f.toFixed(2), T: T, A: t.A, S: S, g1: g1, g2: g2, t: t, M: Math.max(M, 40), cardH: 0 };
            if (zz >= 0.995) break;
            z *= zz * 0.995;
        }
        o.cardH = o.M / MAP_ASPECT;
        var G = o.S + o.g1 + o.t.C + o.g2 + o.M, spare = Math.max(0, availW - G);
        /* spare width (a box taller than the map allows): half into the two gaps, half around the group */
        o.g1 += spare * 0.25; o.g2 += spare * 0.25; G += spare * 0.5;
        var x0 = (W - G) / 2, cy = H / 2, ty = cy - o.t.vis / 2;
        put(ADDR, x0 + o.S + o.g1, ty);
        /* phone-sized rows: the seal sits level with the title, which leaves the bottom-left corner (Google's (i) button) free */
        put(SEAL, x0, f < 0.4 ? ty + 1 : cy - o.S / 2, o.S, o.S);
        put(CARD, x0 + o.S + o.g1 + o.t.C + o.g2, cy - o.cardH / 2, o.M, o.cardH);
        o.x0 = x0; o.G = G;
        return o;
    }

    /* two tiers (seal + text on top, map below) or stacked (seal, text, map): designed at u = 1, then scaled to fit */
    function tierLayout(W, H, stacked, dry) {
        var px = clamp(W * 0.025, 4, 16), py = clamp(H * 0.025, 4, 14);
        var T = 34, A = 18, lh = 1.45, gap = 9.5, S = stacked ? 100 : 120, gS = stacked ? 14 : 20, gT = stacked ? 16 : 18;
        var t = typeset(T, A, lh, gap, 11, stacked ? 'center' : 'justify');
        var rowW = stacked ? Math.max(S, t.C) : S + gS + t.C, rowH = stacked ? S + gS + t.vis : Math.max(S, t.vis);
        var M = Math.max(rowW, 300) * (stacked ? 1.1 : 1), cardH = M / MAP_ASPECT;
        var u = Math.min((W - 2 * px) / Math.max(rowW, M), (H - 2 * py) / (rowH + gT + cardH), 1.8);
        if (dry) return u;
        var o = { mode: stacked ? 'stack' : 'tier', u: +u.toFixed(3) };
        t = typeset(T * u, A * u, lh, gap * u, 11, stacked ? 'center' : 'justify');
        S *= u; gS *= u; gT *= u; M *= u; cardH *= u;
        rowW = stacked ? Math.max(S, t.C) : S + gS + t.C; rowH = stacked ? S + gS + t.vis : Math.max(S, t.vis);
        var y0 = (H - (rowH + gT + cardH)) / 2, cx = W / 2;
        if (stacked) { put(SEAL, cx - S / 2, y0, S, S); put(ADDR, cx - t.C / 2, y0 + S + gS); }
        else { var x0 = cx - rowW / 2; put(SEAL, x0, y0 + (rowH - S) / 2, S, S); put(ADDR, x0 + S + gS, y0 + (rowH - t.vis) / 2); }
        put(CARD, cx - M / 2, y0 + rowH + gT, M, cardH);
        o.T = T * u; o.A = t.A; o.S = S; o.M = M; o.cardH = cardH; o.t = t;
        return o;
    }

    /* the card's type and corners scale with it (designed on a 360 px card) */
    function fitCard(M) {
        var k = clamp(M / 360, 0.42, 1.5), st = CARD.style;
        st.setProperty('--vr', clamp(12 * k, 6, 16).toFixed(1) + 'px');
        st.setProperty('--vf', clamp(12.5 * k, 8, 16).toFixed(2) + 'px');
        st.setProperty('--vx', clamp(M * 0.034, 6, 18).toFixed(1) + 'px'); st.setProperty('--vy', clamp(M * 0.03, 5, 16).toFixed(1) + 'px');
        st.setProperty('--vh', clamp(22 * k, 15, 28).toFixed(1) + 'px'); st.setProperty('--vf2', clamp(11 * k, 9, 13).toFixed(2) + 'px');
        st.setProperty('--vo', clamp(8 * k, 5, 11).toFixed(1) + 'px');
    }

    var LAST = null;
    function layout() {
        var wh = boxSize(), W = wh[0], H = wh[1]; if (!W || !H) return;
        var r = W / H, o;
        if (r >= 2.2) o = rowLayout(W, H);
        else { var uT = tierLayout(W, H, false, true), uS = tierLayout(W, H, true, true); o = tierLayout(W, H, uS >= uT * 0.97); }
        fitCard(o.M);
        o.W = W; o.H = H; LAST = o;
        PF.classList.add('ready');
    }
    window.__pf = function () { return LAST && { mode: LAST.mode, f: LAST.f, u: LAST.u, W: LAST.W, H: LAST.H, title: +LAST.T.toFixed(2), addr: +LAST.A.toFixed(2),
        seal: Math.round(LAST.S), col: LAST.t.C, card: [Math.round(LAST.M), Math.round(LAST.cardH)], align: TXT.style.textAlign,
        lines: Math.round((TXT.offsetHeight) / (LAST.A * parseFloat(TXT.style.lineHeight))), x0: Math.round(LAST.x0 || 0), G: Math.round(LAST.G || 0) }; };

    /* ════════ the map: a static base (land dots, borders, every visitor) + a light live layer ════════ */
    var BASE = document.getElementById('vmap-c'), FX = document.getElementById('vmap-fx'), bctx = BASE.getContext('2d'), fctx = FX.getContext('2d');
    var DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1)), MW = 0, MH = 0, K = 1;
    var MY0 = mercY(LAT_MAX), MY1 = mercY(LAT_MIN);
    function project(lon, lat) { return [(lon - LON_MIN) / (LON_MAX - LON_MIN) * MW, (MY0 - mercY(lat)) / (MY0 - MY1) * MH]; }
    function latAt(y) { var my = MY0 - y / MH * (MY0 - MY1); return (2 * Math.atan(Math.exp(my)) - Math.PI / 2) * 180 / Math.PI; }
    function landAt(lon, lat) { if (lat > LAT_MAX || lat < LAT_MIN) return 0;
        var c = Math.floor((lon - LON_MIN) / (LON_MAX - LON_MIN) * GW), r = Math.floor((LAT_MAX - lat) / (LAT_MAX - LAT_MIN) * GH);
        return isLand(clamp(c, 0, GW - 1), clamp(r, 0, GH - 1)); }
    /* soft round halos, drawn once (no shadowBlur per dot per frame) */
    function halo(rgb) { var c = document.createElement('canvas'); c.width = c.height = 64; var g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        gr.addColorStop(0, 'rgba(' + rgb + ',.55)'); gr.addColorStop(0.35, 'rgba(' + rgb + ',.22)'); gr.addColorStop(1, 'rgba(' + rgb + ',0)');
        g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c; }
    var HALO_C = halo('84,226,255'), HALO_L = halo('255,201,77');
    function dotR(p) { return K * (0.8 + Math.min(1.5, Math.sqrt(p.n) * 0.11)); }
    function liveR(p) { return Math.max(dotR(p) * 1.3, 2.3 * K); }
    function drawBase() {
        var o = bctx; o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, BASE.width, BASE.height); o.setTransform(DPR, 0, 0, DPR, 0, 0);
        /* land: a uniform dot grid in screen space (even rows from the equator to the Arctic), sampled from the land mask */
        var pitch = clamp(MW / 112, 2.1, 4.4), rad = pitch * 0.33, cols = Math.floor(MW / pitch), rows = Math.floor(MH / pitch);
        var ox = (MW - (cols - 1) * pitch) / 2, oy = (MH - (rows - 1) * pitch) / 2;
        o.fillStyle = '#1f5079';
        for (var r = 0; r < rows; r++) { var y = oy + r * pitch, lat = latAt(y);
            o.beginPath();
            for (var c = 0; c < cols; c++) { var x = ox + c * pitch, lon = LON_MIN + x / MW * (LON_MAX - LON_MIN);
                if (landAt(lon, lat)) { o.moveTo(x + rad, y); o.arc(x, y, rad, 0, 6.2832); } }
            o.fill(); }
        /* country borders: faint, and only where the card is big enough for them to read as lines */
        if (MW >= 190 && BORDERS && BORDERS.countries) { o.strokeStyle = 'rgba(140,208,252,' + (MW >= 300 ? 0.15 : 0.11) + ')'; o.lineWidth = 0.55; o.lineJoin = 'round';
            o.beginPath();
            for (var i = 0; i < BORDERS.countries.length; i++) { var poly = BORDERS.countries[i];
                for (var j = 0; j < poly.length; j++) { var q = project(poly[j][0], poly[j][1]); if (j) o.lineTo(q[0], q[1]); else o.moveTo(q[0], q[1]); } }
            o.stroke(); }
        /* every visited place (the latest few are drawn live on top): halo + core + a bright centre, small to big */
        var ps = pings.filter(function (p) { return !p.live; }).sort(function (a, b) { return a.n - b.n; });
        for (var k = 0; k < ps.length; k++) { var p = ps[k], xy = project(p.lon, p.lat), d = dotR(p);
            o.globalAlpha = 0.9; o.drawImage(HALO_C, xy[0] - d * 3.2, xy[1] - d * 3.2, d * 6.4, d * 6.4); o.globalAlpha = 1;
            o.beginPath(); o.arc(xy[0], xy[1], d, 0, 6.2832); o.fillStyle = '#56e2ff'; o.fill();
            o.beginPath(); o.arc(xy[0], xy[1], d * 0.42, 0, 6.2832); o.fillStyle = '#e9fdff'; o.fill(); }
    }
    function drawLive(t) {
        var o = fctx; o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, FX.width, FX.height); o.setTransform(DPR, 0, 0, DPR, 0, 0);
        for (var i = 0; i < pings.length; i++) { var p = pings[i]; if (!p.live) continue;
            var xy = project(p.lon, p.lat), d = liveR(p), ph = ((t + i * 800) % 2400) / 2400;
            o.beginPath(); o.arc(xy[0], xy[1], d + ph * 7.5 * K, 0, 6.2832); o.strokeStyle = 'rgba(255,201,77,' + (0.6 * (1 - ph)).toFixed(3) + ')'; o.lineWidth = 1.1 * Math.max(0.8, K); o.stroke();
            o.drawImage(HALO_L, xy[0] - d * 3.6, xy[1] - d * 3.6, d * 7.2, d * 7.2);
            o.beginPath(); o.arc(xy[0], xy[1], d, 0, 6.2832); o.fillStyle = '#ffc94d'; o.fill();
            o.beginPath(); o.arc(xy[0], xy[1], d * 0.42, 0, 6.2832); o.fillStyle = '#fff6dd'; o.fill(); }
    }
    function resize() { var w = CARD.clientWidth, h = CARD.clientHeight; if (!w || !h) return;
        MW = w; MH = h; K = clamp(w / 360, 0.6, 1.5);
        BASE.width = FX.width = Math.round(w * DPR); BASE.height = FX.height = Math.round(h * DPR);
        drawBase(); drawLive(performance.now()); }
    /* ~30 fps, only while the card is on screen and the tab is visible */
    var onScreen = true, lastT = 0;
    if (window.IntersectionObserver) new IntersectionObserver(function (es) { onScreen = es[es.length - 1].isIntersecting; if (onScreen) kick(); }).observe(CARD);
    var ticking = false;
    function kick() { if (!ticking) { ticking = true; requestAnimationFrame(tick); } }
    function tick(t) { ticking = false; if (!onScreen || document.hidden) return;
        if (t - lastT >= 32) { lastT = t; drawLive(t); }
        if (pings.some(function (p) { return p.live; })) kick(); }
    document.addEventListener('visibilitychange', kick);

    function fmtFull(n) { return Math.round(n).toLocaleString('en-US'); }
    function onData(cc) { document.getElementById('vm-reg').textContent = cc === 1 ? 'region' : 'regions'; if (MW) drawBase(); kick(); }
    var VA = null; function renderDash() {}

    /* ---------- tooltip: the nearest visited place (two-letter country code instead of a flag) ---------- */
    var tip = document.getElementById('vmtip');
    function nearestPing(clientX, clientY) { var rect = CARD.getBoundingClientRect(), cx = clientX - rect.left, cy = clientY - rect.top, hit = null, hd = 14 * Math.max(0.8, K);
        for (var i = 0; i < pings.length; i++) { var xy = project(pings[i].lon, pings[i].lat), d = Math.hypot(xy[0] - cx, xy[1] - cy); if (d < hd) { hd = d; hit = pings[i]; } } return hit; }
    function hoverMove(e) { var p = nearestPing(e.clientX, e.clientY);
        if (!p) { tip.classList.remove('show'); return; }
        var cc = ISO[p.country];
        tip.innerHTML = '<b>' + (cc ? '<i>' + cc + '</i>' : '') + esc(p.where) + '</b><span>' + fmtFull(p.n) + ' visit' + (p.n > 1 ? 's' : '') + (p.t ? ' &middot; ' + fmtAgo(p.t) + ' ago' : '') + '</span>';
        tip.classList.add('show'); var tw = tip.offsetWidth, th = tip.offsetHeight, vw = window.innerWidth || document.body.clientWidth, vh = window.innerHeight || document.body.clientHeight;
        var tx = e.clientX + 14, ty = e.clientY + 14; if (tx + tw > vw - 4) tx = Math.max(4, e.clientX - 14 - tw); if (ty + th > vh - 4) ty = Math.max(4, e.clientY - 14 - th);
        tip.style.left = tx + 'px'; tip.style.top = ty + 'px'; }

    /* one click = one tab: open without the "noopener" feature (with it, window.open returns null by spec), cut the
       opener by hand, and fall back to a plain link only if open() throws or returns null */
    function openAnalytics() { try { var w = window.open(ANALYTICS_URL, '_blank'); if (w) { try { w.opener = null; } catch (e) {} return; } } catch (e) {}
        try { var a = document.createElement('a'); a.href = ANALYTICS_URL; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {} }

    /* ---------- boot ---------- */
    layout(); resize();
    CARD.addEventListener('mousemove', hoverMove); CARD.addEventListener('mouseleave', function () { tip.classList.remove('show'); });
    CARD.addEventListener('click', function () { openAnalytics(); });
    CARD.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAnalytics(); } });
    var rq = 0; function relayout() { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; layout(); resize(); }); }
    window.addEventListener('resize', relayout); setTimeout(relayout, 250);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
    window.__pfPing = function (city) { var r = CARD.getBoundingClientRect(); for (var i = 0; i < pings.length; i++) if (pings[i].city === city) { var xy = project(pings[i].lon, pings[i].lat); return { x: r.left + xy[0], y: r.top + xy[1] }; } return null; };
    loadData();
})();
</script>
