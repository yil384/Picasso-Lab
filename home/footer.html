<!-- =====================================================================
     Picasso Lab footer: ONE embed for the Google Sites footer (every page).
     It replaces the three footer embeds home/ucsd.html + home/address.html +
     home/visitor-map.html:
       - the UC San Diego seal (link: ucsd.edu)
       - PICASSO LAB + the address (link: the 3D lab walk-through, home/address.html)
       - the visitor map card: it records the visit into Supabase exactly like
         home/visitor-map.html does, and a click opens the analytics dashboard
         (home/visitor-map.html) in a new tab.
     A Sites embed box keeps its aspect ratio and only shrinks on phones, and
     Sites already frames the box, so this page fills whatever box it gets
     edge to edge (sizes read from the box):
       ratio >= 2.2 : one row  seal | title + address | map  (desktop proportions,
                      turning smoothly into a compact phone row as the box shrinks)
       ratio <  2.2 : seal + text on top, map below; or, for tall boxes, stacked
                      (seal, text, map), whichever of the two comes out larger.
     GENERATED FILE: edit home/footer-src/footer.tpl.html and run
     python3 home/footer-src/build.py. The visit-recording code is copied from
     home/visitor-map.html by that script (keep the two in sync through it).
     ===================================================================== -->

    /* typeset the title + address at the given sizes; the column is the title's width (or minEm address-ems, if wider) */

        if (just) { C = Math.ceil(tw + 0.5); var a = Math.min(A, C / 12.45); ADDR.style.width = C + 'px'; TXT.style.textAlign = 'justify';

    /* one row, laid out like the old three-embed footer: seal | address | map, the address (nearly) centred on
       the page (up to 5% left of centre, as the old boxes were), and the three of the SAME height: the seal is as
       tall as the map card, the title + address block nearly so. f runs 0 (phone row, 352 x 107) -> 1 (957 x 290). */
    function rowLayout(W, H) {
        if (W < 560) return stripLayout(W, H);
        var s = Math.min(W / 957, 1.3), f = clamp((s - 0.368) / 0.632, 0, 1);
        function L(a, b) { return a + (b - a) * f; }
        var px = clamp(W * 0.012, 3, 14), py = clamp(H * 0.02, 3, 8), availH = H - 2 * py;

        var Hc = availH, t, T, X;

            T = Hc * 0.3; t = typeset(T, T * ar, lh, T * 0.28, minEm, 'justify');
            T *= kH * Hc / t.vis; t = typeset(T, T * ar, lh, T * 0.28, minEm, 'justify');

        /* a touch smaller than the most that fits: the height saved goes into the gaps (the old footer breathed more) */
        Hc *= 0.92; fit(Hc);

        /* spare width spreads the three parts apart (gaps up to 10% of the box), the address stays near the centre */
        var g2 = Math.min((W - 2 * px - o.S - t.C - o.M) / 2, W * 0.1, W - px - o.M - t.C / 2 - (W / 2 - off) - 1);

    /* phones: the wide footer box shrinks to a thin strip (957 x 200 -> 352 x 73, 957 x 290 -> 352 x 107). The address
       gets the largest size (9-11 px) whose block fits the strip's height, wrapping to more lines if it must; seal and
       map card share what is left; the seal sits level with the title so the bottom-left corner (Google's (i)) stays free. */
    function stripLayout(W, H) {
        var px = clamp(W * 0.03, 6, 14), py = clamp(H * 0.07, 3, 9), availW = W - 2 * px, availH = H - 2 * py, lh = 1.28;

        while (t.vis > availH && me < 22) { me += 1; t = typeset(T, A, lh, T * 0.2, me, 'left'); }
        var g = Math.max(8, W * 0.035), ks = 0.86, Hc = Math.min(availH, (availW - t.C - 2 * g) / (ks + 2));

    }

    /* two tiers (seal + text on top, map below) or stacked (seal, text, map): designed at u = 1, then scaled to fit */
    function tierLayout(W, H, stacked, dry) {
        var px = clamp(W * 0.025, 4, 16), py = clamp(H * 0.025, 4, 14);
        var T = 34, A = 18, lh = 1.45, gap = 9.5, S = stacked ? 100 : 120, gS = stacked ? 14 : 20, gT = stacked ? 16 : 18;
        var t = typeset(T, A, lh, gap, 11, stacked ? 'center' : 'justify');
        var rowW = stacked ? Math.max(S, t.C) : S + gS + t.C, rowH = stacked ? S + gS + t.vis : Math.max(S, t.vis);
        var M = Math.max(rowW, 300) * (stacked ? 1.1 : 1), cardH = M / 2;

        t = typeset(T * u, A * u, lh, gap * u, 11, stacked ? 'center' : 'justify');
        S *= u; gS *= u; gT *= u; M *= u; cardH *= u;

        else { var x0 = cx - rowW / 2; put(SEAL, x0, y0 + (rowH - S) / 2, S, S); put(ADDR, x0 + S + gS, y0 + (rowH - t.vis) / 2); }
        put(CARD, cx - M / 2, y0 + rowH + gT, M, cardH);
        o.T = T * u; o.A = t.A; o.S = S; o.M = M; o.cardH = cardH; o.t = t;

    }

    /* the stats pill keeps its look and scales with the card (365 px wide in the old footer); it drops the latest

    function fitCard(M) {

        st.setProperty('--vpr', (fs * 0.86).toFixed(1) + 'px'); st.setProperty('--vg', (fs * 0.67).toFixed(1) + 'px'); st.setProperty('--vd', (fs * 0.67).toFixed(1) + 'px');

    }

    var LAST = null;

    /* ════════ the visitor globe: the real Earth (NASA Blue Marble by day, Black Marble city lights by night, a soft

       the visitors, the off-world blips and the signals crawling in from the far ones. Drag to turn the Earth (the far
       objects barely move: parallax); hover a dot for the place; a click that is not a drag opens the analytics. The

    var GL_URL = 'https://yil384.github.io/Picasso-Lab/home/static/globe/';

        '      col = mix(col, cc, smoothstep(r + 0.8, r - 0.8, q)); } }',
