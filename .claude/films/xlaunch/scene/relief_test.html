<!doctype html>
<html><head><meta charset="utf-8"><title>relief test</title>
<!-- A/B for sprite relief: the same character flat (left) and with its depth relief (right), the camera orbiting
     -32, 0, +32 degrees (frames 0-2: Zaifeng; 3-5: Xiang landing). -->
<link rel="stylesheet" href="/pv/fonts/fonts.css">
<script src="/pv/vendor/p5/p5.min.js"></script>
<script type="importmap">{"imports":{"three":"/pv/vendor/three/build/three.module.js","three/addons/":"/pv/vendor/three/addons/"}}</script>
</head><body>
<script type="module">
import { defineScene } from '/pv/runtime/pv.js';
import { buildStudio, look } from '/scene/studio.js';
import { spriteKit } from '/scene/sprite.js';
let T, SK, A, B, A2, B2;
const FLOOR = -0.62;
defineScene({
  meta: { title: 'relief', durationFrames: 6, fps: 30, width: 1080, height: 1350, seed: 1, design: [1080, 1350], background: '#0b0b0e', fonts: ['Inter'], boil: { every: 1, variants: 6 }, poster: 0 },
  update(ctx) {
    const f = ctx.iw, ang = [-32, 0, 32][f % 3] * Math.PI / 180, r = 3.0;
    const [a, b] = f < 3 ? [A, B] : [A2, B2], pose = f < 3 ? 'm_zaifeng' : 'xiang_land', h = f < 3 ? 1.0 : 0.6;
    [A, B, A2, B2].forEach((c) => c.hide());
    look(T, [Math.sin(ang) * r, 0.25, Math.cos(ang) * r], [0, -0.05, 0], 30, 0.0002);
    a.set(pose, { height: h, relief: 0 }); a.place(-0.42, FLOOR, 0, T.camera, { floorY: FLOOR, light: 0.85, rim: 1.2, rimDir: [-1, 0.3] });
    b.set(pose, { height: h }); b.place(0.42, FLOOR, 0, T.camera, { floorY: FLOOR, light: 0.85, rim: 1.2, rimDir: [-1, 0.3] });
  },
  layers: [{ name: '3d', type: 'three', async init(ctx, three) {
    const D = await (await fetch('/scene/data.json')).json();
    T = await buildStudio(ctx, three, D);
    T.papers?.forEach?.((p) => p.visible = false);
    SK = spriteKit(T.THREE, T.scene);
    const mk = (n) => SK.make({ [n]: `/scene/cut/${n}.png` }, { height: 1 });
    A = await mk('m_zaifeng'); B = await mk('m_zaifeng'); A2 = await mk('xiang_land'); B2 = await mk('xiang_land');
  }, draw() { T.composer.render(); return false; } }],
});
</script></body></html>
