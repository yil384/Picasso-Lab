<html><head><meta charset="utf-8"><title>Qubrio: The Convoy Job</title>
<!-- Qubrio project-card film, concept "comic-book 3D": 15 s seamless loop (360 f @ 24 fps).
     The whole film is one real three.js set rendered through a local copy of runtime/npr (painted cel ramp,
     burin hatching, halftone, watercolour pass, boiling ink). p5.brush paints every texture, every face and the
     ink overlay. All lettering is built from hand-authored stroke / outline data (no web font).
     Lettering pop / burst / emote ideas follow ClaudeAnimationBase src/core.js (MIT, (c) JohnHeibel).
     ?sheet=1 model sheet camera   ?top=1 top-down layout check   ?debug=1..5 npr G-buffer views -->
<script src="/pv/vendor/p5/p5.min.js"></script>
<script src="/pv/vendor/p5.brush/p5.brush.pv.js"></script>
<script type="importmap">{"imports":{"three":"/pv/vendor/three/build/three.module.js","three/addons/":"/pv/vendor/three/addons/"}}</script>
</head><body>
<script type="module">
import { defineScene, ease, clamp, lerp, loopNoise } from '/pv/runtime/pv.js';
import { createNPR, rgb } from '/scene/npr/npr.js';
import { bakeBrushTexture, burst } from '/scene/npr/brush.js';
import { orbit, handheld, applyRig, yawSmear } from '/scene/npr/camera.js';

const Q = new URLSearchParams(location.search);
const SHEET = Q.get('sheet');
const TOP = Q.get('top') === '1';
const FPS = 24, NF = 360, TAU = Math.PI * 2;

// =====================================================================================================
// palette (paint space)
// =====================================================================================================
const PAL = {
  paper: '#f4ebd6', ink: '#1a1530', ochre: '#f2b134', red: '#e5463b', pink: '#ff3d7f', violet: '#6f52c8',
  teal: '#2f9d97', cream: '#fff6e0', blush: '#ff7a8e', sky: '#5b8fd8',
};
const COL = {
  atom: 0xfff1cf, brass: 0xe6ad42, red: 0xe5463b, steel: 0x74b0f2, cream: 0xf8eed6, violet: 0x6f52c8,
  teal: 0x39a6a0, pink: 0xff3d7f, ochre: 0xf2b134, slabSide: 0xd98f45, table: 0x7b86c9, dark: 0x2b2447,
  paper: 0xf6ecd4, letter: 0xe5463b, letterSide: 0xf6b93b,
};

// =====================================================================================================
// timeline helpers (all pure functions of the frame)
// =====================================================================================================
const mj = (x) => { x = clamp(x); return x * x * x * (10 + x * (-15 + 6 * x)); };      // minimum jerk
const sm = (x) => ease.smooth(clamp(x));
const io = (x) => ease.inOutSine(clamp(x));
const ob = (x) => ease.outBack(clamp(x));
const twos = (F) => F - (F % 2);                                                          // characters on twos
const ringv = (a, amp, w = 1.1, k = 0.2) => (a < 0 ? 0 : amp * Math.exp(-k * a) * Math.cos(w * a)); // a in frames
const bumpv = (a, amp, w = 0.9, k = 0.16) => (a < 0 ? 0 : amp * Math.exp(-k * a) * Math.sin(w * a));
const hsh = (...n) => { let x = Math.sin(n.reduce((s, v, i) => s + v * (12.9898 + i * 78.233), 0.5)) * 43758.5453; return x - Math.floor(x); };
const wrapF = (F) => ((F % NF) + NF) % NF;
const dimK = (F) => (F >= K.dim && F < K.zap ? sm((F - K.dim) / 14) : 0);   // lights-down amount

// key frames of the story
const K = {
  tick: [14, 26, 38],          // Compass lands on the selected columns 3, 4, 5
  hop: [44, 54], point: 56,     // hero hop into the gap, point at the Fork
  thwip: [72, 80], taut: 88,    // Fork shoots the AOD threads; reins snap taut
  glide: [92, 132],             // convoy: one rigid AOD move
  enter: [126, 135, 144],       // Stopwatch hops in from off-screen right (two hops)
  dim: 160, vert: [158, 178],   // lights go down; dolly-zoom (vertigo) on the Stopwatch's wind-up
  click: 176, zap: 182,         // Stopwatch slaps its crown; Rydberg impact (flash cut to the wide under the impact frames)
  kick: 222, roll: [224, 244],  // paper roll unrolls the schedule tape
  snip: 254,
  slam: [266, 268, 270, 272],   // 4 . 7 x land
  back: [300, 340],             // convoy glides home
  reset: 318,                   // Compass off-screen reset during the whip pan home
  resetW: 324,                  // Stopwatch reset (the 4.7x has left the frame by then)
};

// =====================================================================================================
// world layout (1 unit ~ one atom pitch / 0.62)
// =====================================================================================================
const R = 0.2, AY = 0.3;
const SX = (c) => -3.7 + 0.62 * c, SZ = (r) => -0.62 + 0.62 * r;           // storage lattice 6 x 3
const PX = (k) => 1.25 + 1.24 * k, PZ = (r) => -1.0 + 1.0 * r;             // entanglement-zone partners 3 x 3
const PAIR = 0.44, LANE = 0.5, LIG_SEG = 24;
const SLAB = { x0: -6.4, x1: 5.0, z0: -1.8, z1: 2.9, h: 0.5 };
const TABLE_Y = -0.5;
const FORK = { x: 4.45, z: 0.0 };
const WATCH = { x: 4.0, z: 2.5 };
const TAPE = { x0: 3.56, z: 2.5, w: 0.42, len: 4.7, stub: 1.0 };
const CUTX = TAPE.x0 - TAPE.stub;
const CMP = { z: 1.55, s: 0.62, leg: 1.25, standX: -0.7, standZ: 2.12, spread: 1.1 };
const LET = { z: 3.45, h: 1.0, x: 0.0 };

// ---- mover path: the AOD block (storage cols 3-5 x rows 0-2) -> pairs in the zone.
// z first spreads into lanes between partner rows, then x glides, then the block docks (min-jerk each).
function moverP(F) {
  if (F >= K.glide[0] && F < K.glide[1]) return (F - K.glide[0]) / (K.glide[1] - K.glide[0]);
  if (F >= K.glide[1] && F < K.back[0]) return 1;
  if (F >= K.back[0] && F < K.back[1]) return 1 - (F - K.back[0]) / (K.back[1] - K.back[0]);
  return 0;
}
function moverXZ(k, r, p) {
  const sx = SX(3 + k), sz = SZ(r), fx = PX(k) - PAIR, fz = PZ(r), lz = fz + LANE;
  const x = lerp(sx, fx, mj(p));
  const z = sz + (lz - sz) * mj(p / 0.26) + (fz - lz) * mj((p - 0.8) / 0.2);
  return [x, z];
}
const convoyV = (p) => { const x = clamp(p); return 30 * x * x * (1 - x) * (1 - x); }; // mj'(p), peak 1.875
// frame at which pair q's ligature breaks on the way home (stretch >= 1.8); pure, cached
const SNAP = {};
function snapFrame(q) {
  if (SNAP[q] != null) return SNAP[q];
  const k = Math.floor(q / 3), r = q % 3;
  let f = K.back[0];
  for (; f < K.back[1]; f++) { const [x, z] = moverXZ(k, r, moverP(f)); if (Math.hypot(PX(k) - x, PZ(r) - z) / PAIR >= 1.8) break; }
  return (SNAP[q] = f);
}

// =====================================================================================================
// camera: shot rigs + transitions (orbit params), all closed-form; rig(360) == rig(0)
// =====================================================================================================
function rigA(F) {   // storage, low and close, tracking the Compass (valid for F in [-60, 70])
  const k = sm((F + 34) / 92);
  const hop = Math.sin(Math.PI * clamp((F - 42) / 16));
  return { tg: [lerp(-3.0, -0.3, k), lerp(0.8, 0.92, sm((F - 36) / 22)) + 0.5 * hop, lerp(1.1, 1.55, sm((F - 30) / 28))],
    az: lerp(-0.46, -0.1, k), el: lerp(0.12, 0.07, sm((F - 20) / 40)), r: lerp(5.9, 5.1, sm((F - 10) / 50)) + 1.25 * hop, fov: 30,
    roll: lerp(-0.045, 0.06, sm((F - 44) / 16)) };
}
function rigB(F) {   // close on the Fork; pull back with the threads into a tug-of-war wide; swing into the ride
  const fork = { tg: [4.2, 0.9, 0.35], az: 0.78, el: 0.1, r: 4.2 - 0.4 * sm((F - 62) / 14), fov: 30, roll: 0.07 };
  // tug-of-war: the straining Fork big on the right, the reins running back to the block on the left
  const haul = { tg: [lerp(2.6, 2.2, sm((F - 82) / 20)), 0.66, 0.3], az: 0.52, el: 0.12, r: 6.1 - 0.35 * sm((F - 84) / 18), fov: 32, roll: 0.06 - 0.03 * sm((F - 84) / 16) };
  const cx = lerp(SX(4), PX(1) - PAIR, mj(moverP(F)));
  const ride = { tg: [cx + 0.5 + 0.9 * sm((F - 128) / 16), 0.5, 0.62], az: -0.13, el: 0.17 + 0.03 * sm((F - 120) / 12), r: 4.2 + 0.5 * sm((F - 118) / 16), fov: 32, roll: -0.045 };
  if (F < 72) return fork;
  if (F < 100) return mixRig(fork, haul, ease.inOutCubic(clamp((F - 72) / 11)));
  return mixRig(haul, ride, ease.inOutQuint(clamp((F - 100) / 11)));
}
function rigC(F) {   // after the flash cut: high 3/4 over the whole zone, slow push-in while the pairs glow
  const push = sm((F - K.zap) / 26);
  return { tg: [2.45, 0.35, 0.35 + 0.3 * push], az: lerp(0.58, 0.44, sm((F - K.zap) / 40)), el: lerp(0.5, 0.43, push),
    r: lerp(7.6, 6.2, push), fov: 30, roll: lerp(0.03, -0.04, push) };
}
// the wind-up: low hero angle on the Stopwatch, the zone and the objective lens behind it. A dolly-zoom (vertigo)
// keeps the watch the same size while the fov opens 27 -> 66 deg: the lab stretches away behind it as the lights go down.
function rigV(F) {
  const k = ease.inCubic(clamp((F - K.vert[0]) / (K.vert[1] - K.vert[0])));
  const fov = lerp(27, 66, k), r0 = 5.3;
  const r = r0 * Math.tan((27 / 2) * Math.PI / 180) / Math.tan((fov / 2) * Math.PI / 180);
  return { tg: [WATCH.x - 0.5, lerp(0.95, 1.05, k), WATCH.z - 0.3], az: lerp(0.36, 0.3, k), el: lerp(0.13, 0.07, k), r, fov,
    roll: lerp(0.0, -0.09, k) };
}
function rigD(F) {   // the watch kicks the roll; pan along the long tape; whip back for the snip; team shot
  const rx = tapeState(F).rollX;
  const pre = { tg: [3.3, 0.5, 2.3], az: 0.32, el: 0.2, r: 5.0, fov: 31, roll: 0.02 };
  // low along the tape: the roll races towards the lens, the tape recedes to the watch in deep perspective
  const follow = { tg: [rx + 1.0, 0.3, 2.45], az: -0.6, el: 0.2, r: 3.6, fov: 34, roll: 0.05 };
  const snip = { tg: [CUTX - 0.15, 0.5, 2.45], az: 0.14, el: 0.18, r: 3.8, fov: 31, roll: -0.04 };
  // hero orbit round the team: the extruded 4.7x slides across the set with real parallax
  const orb = io((F - 262) / 50);
  const team = { tg: [lerp(1.75, 2.05, orb), 0.3, 2.45], az: lerp(0.34, -0.26, orb), el: lerp(0.3, 0.21, sm((F - 266) / 40)),
    r: lerp(7.3, 6.5, sm((F - 266) / 40)), fov: 32, roll: lerp(-0.07, 0.03, orb) };
  if (F < 224) return pre;
  if (F < 243) return mixRig(pre, follow, sm((F - 224) / 6));
  if (F < 258) return mixRig(follow, snip, ease.inOutQuint(clamp((F - 243) / 7)));
  return mixRig(snip, team, ease.inOutCubic(clamp((F - 258) / 10)));
}
const WHIPS = [[58, 70], [100, 111], [243, 250], [312, 326]];
function mixRig(a, b, k) {
  return { tg: a.tg.map((v, i) => lerp(v, b.tg[i], k)), az: lerp(a.az, b.az, k), el: lerp(a.el, b.el, k), r: lerp(a.r, b.r, k),
    fov: lerp(a.fov, b.fov, k), roll: lerp(a.roll, b.roll, k) };
}
function camRig(F) {
  if (F < 58) return rigA(F);
  if (F < 70) return mixRig(rigA(F), rigB(F), ease.inOutQuint((F - 58) / 12));      // whip right
  if (F < 140) return rigB(F);
  if (F < 158) return mixRig(rigB(F), rigV(F), io((F - 140) / 18));                 // settle round to the Stopwatch
  if (F < K.zap) return rigV(F);                                                    // vertigo wind-up
  if (F < 210) return rigC(F);                                                      // flash cut (impact frames) to the wide
  if (F < 226) return mixRig(rigC(F), rigD(F), io((F - 210) / 16));                 // swing down to the tape
  if (F < 312) return rigD(F);
  if (F < 326) return mixRig(rigD(F), rigA(F - NF), ease.inOutQuint((F - 312) / 14)); // whip home
  return rigA(F - NF);
}
function camShake(F) {   // decaying hash shake on the hits (radians)
  let s = [0, 0, 0];
  const hit = (f0, amp, dec = 5) => {
    const a = F - f0; if (a < 0 || a > 30) return;
    const k = amp * Math.exp(-a / dec);
    s[0] += (hsh(F, 1.3, f0) * 2 - 1) * k; s[1] += (hsh(F, 2.7, f0) * 2 - 1) * k; s[2] += (hsh(F, 5.1, f0) * 2 - 1) * k * 0.6;
  };
  hit(K.taut, 0.006, 3); hit(K.glide[1], 0.006, 4); hit(K.zap, 0.02, 6); hit(K.snip, 0.006, 3);
  K.slam.forEach((f, i) => hit(f, i === 2 ? 0.02 : 0.011, 4));
  return s;
}

// =====================================================================================================
// character state
// =====================================================================================================
// ---- atoms ----
const ATOMS = [];
for (let c = 0; c < 6; c++) for (let r = 0; r < 3; r++) ATOMS.push({ kind: c >= 3 ? 'mover' : 'store', c, r, k: c - 3 });
for (let k = 0; k < 3; k++) for (let r = 0; r < 3; r++) ATOMS.push({ kind: 'partner', c: k, r, k });
ATOMS.forEach((a, i) => { a.i = i; a.o = Math.floor(hsh(i, 7.7) * 5); a.ph = hsh(i, 3.3); });

function exprTimeline(F, keys) {   // keys: [[frame, expr], ...] ascending; returns expr and the squash of the take
  let e = keys[0][1], last = -999;
  for (const [f, x] of keys) if (F >= f) { e = x; last = f; }
  return { e, age: F - last };
}
function atomState(a, F) {
  const Fc = twos(F);
  const o = a.o;
  let x, z, e, sq = 0, sx = 1, hop = 0, look = 0, emote = null;
  const breath = 0.035 * Math.sin(TAU * (F / 45 + a.ph));          // 8 breaths per loop
  if (a.kind === 'store') {
    x = SX(a.c); z = SZ(a.r);
    const T = exprTimeline(Fc, [[0, 'sleep'], [K.zap - 4 + o, 'squint'], [K.zap + 8 + o, 'sleep']]);
    e = T.e;
  } else if (a.kind === 'mover') {
    const p = moverP(F);
    [x, z] = moverXZ(a.k, a.r, p);
    const tk = K.tick[a.k] + (2 - a.r) * 2 + (o % 2) * 2;
    const T = exprTimeline(Fc, [[0, 'sleep'], [tk, 'squint'], [tk + 3, 'surprised'], [tk + 20, 'awake'],
      [K.glide[0] - 6, 'squint'], [K.glide[0], 'whee'], [K.glide[1] - 2, 'surprised'], [K.glide[1] + 10 + o, 'love'],
      [K.zap - 7, 'squint'], [K.zap + 5 + o, 'sparkle'], [K.back[0] - 8 - o, 'awake'], [K.back[0] + 4, 'whee'],
      [K.back[1] - 2, 'yawn'], [K.back[1] + 8 + o * 2, 'sleep']]);
    e = T.e;
    if (T.e === 'surprised' && Fc < tk + 20) { sq = takeSq(Fc - tk - 3); emote = { type: '!', age: Fc - tk - 3 }; hop = 0.16 * Math.sin(Math.PI * clamp((Fc - tk - 3) / 9)); }
    if (T.e === 'surprised' && Fc >= K.glide[1] - 2 && Fc < K.glide[1] + 12) sq = ringv(Fc - K.glide[1], 0.2, 0.9, 0.16);
    if (Fc >= K.glide[0] - 6 && Fc < K.glide[0]) sq = 0.1 * sm((Fc - K.glide[0] + 6) / 4);                 // crouch before the move
    const v = (F >= K.glide[0] && F < K.glide[1]) ? convoyV((F - K.glide[0]) / (K.glide[1] - K.glide[0])) / 1.875
      : (F >= K.back[0] && F < K.back[1]) ? -convoyV((F - K.back[0]) / (K.back[1] - K.back[0])) / 1.875 : 0;
    sx = 1 + 0.2 * Math.abs(v);
    look = v;
    if (T.e === 'sparkle' || T.e === 'love') hop = cheer(a, Fc);
    if (T.e === 'squint' && Fc >= K.zap - 7 && Fc < K.zap + 5) sq = 0.12;
  } else {
    x = PX(a.k); z = PZ(a.r);
    const arr = K.glide[1] - 3 + a.k * 0;
    const T = exprTimeline(Fc, [[0, 'sleep'], [arr - 6 + o, 'squint'], [arr - 3 + o, 'surprised'], [K.glide[1] + 12 + o, 'love'],
      [K.zap - 7, 'squint'], [K.zap + 5 + o, 'sparkle'], [K.back[0] + 2 + o, 'surprised'], [K.back[0] + 16, 'awake'],
      [K.back[1] - 6 + o, 'yawn'], [K.back[1] + 6 + o * 2, 'sleep']]);
    e = T.e;
    if (T.e === 'surprised') sq = takeSq(T.age);
    if (T.e === 'surprised' && Fc < K.back[0]) emote = { type: '!', age: T.age };
    if (T.e === 'sparkle' || T.e === 'love') hop = cheer(a, Fc);
    if (T.e === 'squint' && Fc >= K.zap - 7 && Fc < K.zap + 5) sq = 0.12;
  }
  if (e === 'yawn') sq = -0.12 * Math.sin(Math.PI * clamp(((Fc % 40) + 0) / 18));
  return { x, z, y: AY + hop + (e === 'sleep' ? -0.02 : 0), e, sq: sq + (e === 'sleep' ? breath : breath * 0.4), sx, look, emote };
}
function takeSq(age) {   // squint-squash then stretch pop and ring (age in frames from the eye pop)
  if (age < -3) return 0;
  if (age < 0) return 0.14 * sm((age + 3) / 3);
  return -0.24 * Math.exp(-age / 4.5) * Math.cos(age * 0.75);
}
function cheer(a, Fc) {   // cheer hops in the team shot, out of phase per atom (no twinning)
  const w0 = 276 + a.o * 3 + a.r * 2, w1 = 300;
  if (Fc < w0 || Fc >= w1) return 0;
  const ph = ((Fc - w0) % 12) / 12;
  return 0.16 * Math.sin(Math.PI * ph) * (1 - 0.3 * a.r / 2);
}

// ---- the Compass (placement): divider walk ----
const FL = (k) => 14 + 12 * (k - 6);                 // landing frame of tip k
const XK = (k) => -5.56 + CMP.s * k;                  // tip k position
function hingeFrom(A, B, L) {   // hinge point of a divider with legs L on tips A and B (above the tips)
  const m = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2, (A[2] + B[2]) / 2];
  const d = [B[0] - A[0], B[1] - A[1], B[2] - A[2]], dl = Math.hypot(...d) || 1;
  const h = Math.sqrt(Math.max(0.01, L * L - dl * dl / 4));
  const u = [0, 1, 0], dd = (u[0] * d[0] + u[1] * d[1] + u[2] * d[2]) / (dl * dl);
  const up = [u[0] - d[0] * dd, u[1] - d[1] * dd, u[2] - d[2] * dd], ul = Math.hypot(...up) || 1;
  return [m[0] + up[0] / ul * h, m[1] + up[1] / ul * h, m[2] + up[2] / ul * h];
}
// Tip landings [frame (loop time; negative = end of the previous loop), x] along z = CMP.z. The last landed tip is
// the pivot, the one before is the free tip, which swings 180 deg round the front to the next landing. Landing on
// the spot where a tip already stands only swaps the pivot (to turn round).
const CMP_EV = [
  ...Array.from({ length: 9 }, (_, k) => [14 + 12 * (k - 6), -5.56 + 0.62 * k]),     // walk in; ticks at 14 / 26 / 38
  [53, 0.21], [54, -0.41],                                                           // where the hop lands
  [70, -1.03], [73, -1.65], [76, -2.27], [79, -2.89], [82, -3.51],                    // scurry off left, clear of the convoy
  [256, -2.89], [262, -2.27], [268, -1.65], [274, -1.03], [280, -0.41], [282, -1.03], // walk back in for the team shot
];
function walkPose(Fw) {
  let j = 0; for (let i = 0; i < CMP_EV.length; i++) if (CMP_EV[i][0] <= Fw) j = i;
  const pv = CMP_EV[j][1], prev = j > 0 ? CMP_EV[j - 1][1] : pv - CMP.s;
  const nxt = CMP_EV[j + 1];
  let p = 0, to = prev;
  if (nxt) { const dur = Math.min(8, nxt[0] - CMP_EV[j][0] - 1); p = clamp((Fw - (nxt[0] - dur)) / dur); to = nxt[1]; }
  const th0 = prev < pv ? Math.PI : 0, th1 = to < pv ? Math.PI : 0;
  const moving = th0 !== th1 && p > 0 && p < 1;
  const th = th0 === th1 ? th0 : lerp(th0, th1, ease.inOutCubic(p));
  const s = Math.abs(prev - pv) || CMP.s;
  const A = [pv, 0, CMP.z], B = [pv + Math.cos(th) * s, moving ? 0.22 * Math.sin(Math.PI * p) : 0, CMP.z + Math.sin(th) * s * 0.9];
  return { A, B, p: moving ? p : 0, landAge: Fw - CMP_EV[j][0], j, dir: Math.sign((to - prev) || 1) };
}
function compassPose(F) {
  const Fc = twos(F);
  const Fw = F >= K.reset ? Fc - NF : Fc;
  const L = CMP.leg;
  let A, B, H, yaw = 0, spin = 0, headSq = 0, expr = 'determined', cape = 0.2, lookX = 0;
  if (Fw < K.hop[0] - 4 || Fw >= K.hop[1]) {
    const W = walkPose(Fw);
    A = W.A; B = W.B;
    H = hingeFrom(A, B, L);
    headSq = ringv(W.landAge, 0.16, 1.0, 0.25);
    cape = 0.25 + 0.5 * Math.sin(Math.PI * W.p);
    yaw = 0.25 * Math.sin(Math.PI * W.p) * W.dir;
    lookX = Fw < 40 ? 1 : 0;
    if (Fw < 40 && W.j >= 6 && W.landAge < 10) expr = W.landAge < 2 ? 'squint' : 'happy';
    if (Fw >= 66 && Fw < 92) expr = 'surprised';
    // points: at the Fork (56-66) and at the 4.7x (284-306): lean over the planted tip, swing the free leg up
    const pt1 = Fw >= K.hop[1] && Fw < 70 ? sm((Fw - K.point) / 4) * (1 - sm((Fw - 64) / 5)) : 0;
    const pt2 = sm((Fw - 284) / 5) * (1 - sm((Fw - 304) / 4));
    const pt = Math.max(pt1, pt2);
    if (pt > 0.001) {
      const Hp = [A[0] + 0.28, Math.sqrt(L * L - 0.28 * 0.28) - 0.02, A[2]];
      H = [lerp(H[0], Hp[0], pt), lerp(H[1], Hp[1], pt), lerp(H[2], Hp[2], pt)];
      const ang = lerp(Math.atan2(B[1] - H[1], B[0] - H[0]), pt2 > pt1 ? 0.5 : 0.25, pt);
      B = [H[0] + Math.cos(ang) * L, H[1] + Math.sin(ang) * L, H[2] - 0.12 * pt];
      expr = pt2 > pt1 ? 'happy' : 'determined'; cape = 0.4 + 0.5 * pt;
    }
    if (Fw >= K.hop[1] && Fw < K.hop[1] + 3) expr = 'squint';
    if (Fw >= K.hop[1]) headSq += ringv(Fw - K.hop[1], 0.2, 0.9, 0.2);
  } else {
    // crouch (the free leg slides back), then hop with a full spin and a split, landing on (-0.41, 0.21)
    const Hc = hingeFrom([XK(8) - 1.25, 0, CMP.z], [XK(8), 0, CMP.z], L);   // the crouched pose
    const Hl = hingeFrom([-0.41, 0, CMP.z], [0.21, 0, CMP.z], L);
    if (Fw < K.hop[0]) {
      const c = sm((Fw - K.hop[0] + 4) / 4);
      A = [lerp(XK(7), XK(8) - 1.25, c), 0, CMP.z]; B = [XK(8), 0, CMP.z];
      H = hingeFrom(A, B, L); expr = 'squint'; cape = 0.1;
    } else {
      const p = (Fw - K.hop[0]) / (K.hop[1] - K.hop[0]);
      const e = ease.inOutSine(p);
      H = [lerp(Hc[0], Hl[0], e), lerp(Hc[1], Hl[1], e) + 0.8 * Math.sin(Math.PI * p), CMP.z];
      spin = TAU * ease.inOutCubic(p);
      const split = lerp(0.52, 0.25, e) + 0.55 * Math.sin(Math.PI * p);   // crouch spread -> split -> landing spread
      A = [H[0] - Math.sin(split) * L, H[1] - Math.cos(split) * L, H[2]]; B = [H[0] + Math.sin(split) * L, H[1] - Math.cos(split) * L, H[2]];
      expr = 'determined'; cape = 0.9;
    }
  }
  return { A, B, H, yaw, spin, headSq, expr, cape, lookX };
}

// ---- the Fork (routing) ----
// tine angles: pL rotates the left tine (the rein hand, on the convoy side), positive = out to the left;
// pR rotates the right tine, negative = out to the right. lean > 0 = leaning back, away from the convoy.
function forkPose(F) {
  const Fc = twos(F);
  let lean = 0, crouch = 0, pL = 0.3, pR = -0.3, hopY = 0, expr = 'determined', footX = 0;
  const idle = Math.sin(TAU * Fc / 30);
  pL += 0.07 * idle; pR -= 0.06 * Math.sin(TAU * Fc / 30 + 1.9);
  if (Fc >= 62 && Fc < K.thwip[0]) { const u = sm((Fc - 62) / 8); crouch = 0.16 * u; pL = lerp(pL, -0.35, u); pR = lerp(pR, -0.7, u); expr = 'squint'; }
  if (Fc >= K.thwip[0] && Fc < K.taut) {   // THWIP: the left tine fires the threads at the block
    const a = Fc - K.thwip[0];
    crouch = -0.14 * Math.exp(-a / 3); pL = lerp(-0.35, 1.5, ob(a / 4)); pR = -0.8; lean = -0.12 * Math.exp(-a / 4);
    expr = 'determined';
    if (Fc >= K.taut - 6) { const u = sm((Fc - K.taut + 6) / 6); lean = lerp(lean, 0.32, u); pL = lerp(pL, 1.2, u); pR = lerp(pR, 0.95, u); crouch = 0.1 * u; expr = 'strain'; }
  }
  if (Fc >= K.taut && Fc < K.glide[1] + 2) {   // haul: lean back, hand over hand, feet skid
    const a = Fc - K.taut, hand = Math.floor(a / 6) % 2;
    lean = 0.42 + 0.05 * Math.sin(a * 0.9);
    pL = 1.2 + (hand ? 0.25 : -0.12); pR = 0.95 + (hand ? -0.12 : 0.25);
    crouch = 0.08; expr = 'strain'; footX = 0.05 * Math.sin(a * 1.3) * Math.exp(-a / 30);
  }
  if (Fc >= K.glide[1] + 2 && Fc < 150) {     // the load stops: stumble back, then tines up in a V
    const a = Fc - K.glide[1] - 2;
    lean = lerp(0.42, 0, sm(a / 6)) + bumpv(a, 0.35, 0.7, 0.14);
    hopY = bumpv(a, 0.12, 0.6, 0.15);
    pL = lerp(1.2, 0.6, sm((a - 6) / 6)); pR = lerp(0.95, -0.6, sm((a - 6) / 6));
    expr = a < 5 ? 'surprised' : 'happy';
  }
  if (Fc >= 150 && Fc < K.back[0] - 6) {
    pL = 1.05 + 0.08 * idle; pR = -0.3 - 0.05 * idle; expr = 'happy';
    if (Fc >= K.zap && Fc < K.zap + 14) { hopY = 0.3 * Math.sin(Math.PI * (Fc - K.zap) / 14); expr = 'surprised'; pR = -1.3; }
    if (Fc >= 276 && Fc < 306) { const u = sm((Fc - 276) / 5); pR = lerp(pR, -0.75, u); hopY = 0.1 * Math.abs(Math.sin(TAU * (Fc - 276) / 16)); pR += 0.25 * Math.sin(TAU * (Fc - 276) / 8) * u; expr = 'happy'; }
  }
  if (Fc >= K.back[0] - 6 && Fc < K.back[1] + 10) { pL = 1.2 - 0.3 * Math.sin(Math.PI * clamp((Fc - K.back[0]) / 40)); lean = -0.12 * Math.sin(Math.PI * clamp((Fc - K.back[0] + 6) / 46)); expr = 'determined'; }
  return { lean, crouch, pL, pR, hopY, expr, footX };
}

// ---- the Stopwatch (optimize) ----
function watchPose(F) {
  const Fc = twos(F);
  let x = WATCH.x, z = WATCH.z, y = 0, sq = 0, rock = 0.07 * Math.sin(TAU * Fc / 24), expr = 'calm', armL = 0.5, armR = -0.5, scis = 0.35, crown = 0, yaw = -0.2, kick = 0;
  const Fw = F >= K.resetW ? Fc - NF : Fc;
  let vis = Fw >= K.enter[0];
  if (Fw >= K.enter[0] && Fw < K.enter[2]) {
    // two hops in from off-screen right: crouch -> stretch in the air -> land (arms flung up)
    const E = [[K.enter[0], 6.9, 3.25], [K.enter[1], 5.4, 2.9], [K.enter[2], WATCH.x, WATCH.z]];
    const h = Fw < K.enter[1] ? 0 : 1, f0 = E[h][0], f1 = E[h + 1][0], p = (Fw - f0) / (f1 - f0);
    const air = clamp((p - 0.22) / 0.7);
    x = lerp(E[h][1], E[h + 1][1], sm(air)); z = lerp(E[h][2], E[h + 1][2], sm(air));
    y = 0.62 * Math.sin(Math.PI * air);
    sq = p < 0.22 ? 0.18 * sm(p / 0.22) : -0.16 * Math.sin(Math.PI * air);
    armL = lerp(0.5, 2.3, Math.sin(Math.PI * air)); armR = lerp(-0.5, 2.4, Math.sin(Math.PI * air));
    expr = 'fierce'; rock = 0.12 * Math.sin(Math.PI * air) * (h ? -1 : 1); yaw = -0.45;
  }
  if (Fw >= K.enter[2] && Fw < 150) { sq = ringv(Fw - K.enter[2], 0.2, 0.9, 0.22); expr = Fw < K.enter[2] + 3 ? 'squint' : 'grin'; yaw = lerp(-0.45, -0.2, sm((Fw - K.enter[2]) / 6)); rock = 0; }
  if (Fw >= 150 && Fw < K.click) { yaw = lerp(-0.2, 0.18, sm((Fw - 150) / 8)); expr = 'calm'; }
  if (Fw >= 162 && Fw < K.click) { sq = 0.16 * sm((Fw - 162) / 8); armL = lerp(0.5, 2.9, sm((Fw - 166) / 6)); expr = 'fierce'; rock = 0; yaw = lerp(0.18, 0.1, sm((Fw - 162) / 5)); }
  if (Fw >= K.click && Fw < K.click + 24) {
    const a = Fw - K.click;
    crown = Math.max(0, 1 - a / 4); armL = lerp(2.7, 0.6, sm((a - 3) / 6));
    sq = ringv(a, -0.18, 0.9, 0.2); y = bumpv(a, 0.12, 0.5, 0.12);
    expr = a < 8 ? 'squint' : 'grin'; rock = 0; yaw = lerp(0.1, -0.55, sm((a - 6) / 8));
  }
  if (Fw >= 200 && Fw < K.kick) { yaw = lerp(-0.6, 0.1, sm((Fw - 200) / 10)); expr = 'calm'; }
  if (Fw >= K.kick - 6 && Fw < K.kick + 8) { kick = Math.sin(Math.PI * clamp((Fw - K.kick + 6) / 14)); expr = 'fierce'; rock = 0; yaw = -0.25; }
  if (Fw >= K.kick + 8 && Fw < 246) { yaw = lerp(-0.25, -0.95, sm((Fw - K.kick - 8) / 10)); expr = Fw > 236 ? 'annoyed' : 'calm'; rock = 0.03 * Math.sin(TAU * Fc / 12); }
  if (Fw >= 244 && Fw < K.resetW) {
    // scissors up, leap to the cut, chop: SNIP; look up at the falling letters; hop on top of the 7 and pose
    const cutX = CUTX - 0.95, top = [LET.x + GL_LAYOUT[2].dx + 0.36, TABLE_Y + LET.h, LET.z];
    const h2 = sm((Fw - 280) / 8);
    x = lerp(lerp(WATCH.x, cutX, sm((Fw - 247) / 6)), top[0], h2);
    z = lerp(WATCH.z, top[2], h2);
    y = 0.42 * Math.sin(Math.PI * clamp((Fw - 247) / 6)) + lerp(0, top[1], h2) + 0.6 * Math.sin(Math.PI * clamp((Fw - 280) / 8));
    yaw = lerp(-0.95, 0.0, sm((Fw - 245) / 5));
    armR = lerp(-0.5, 2.6, sm((Fw - 244) / 5));
    if (Fw >= K.snip - 1) armR = lerp(2.6, 0.9, sm((Fw - K.snip + 1) / 2));
    if (Fw >= 262) armR = lerp(0.9, 0.4, sm((Fw - 262) / 6));
    scis = Fw < K.snip ? 0.6 : lerp(0.0, 0.3, sm((Fw - K.snip - 6) / 6));
    expr = Fw < K.snip - 1 ? 'fierce' : Fw < K.snip + 3 ? 'squint' : 'grin';
    sq = Fw >= K.snip && Fw < 266 ? ringv(Fw - K.snip, 0.14, 0.9, 0.2) : (Fw >= 288 ? ringv(Fw - 288, 0.22, 0.9, 0.2) : 0);
    if (Fw >= K.slam[0] - 4 && Fw < 280) { expr = 'surprised'; yaw = lerp(0, 0.25, sm((Fw - 262) / 4)); y += Fw >= K.slam[2] && Fw < K.slam[2] + 8 ? 0.2 * Math.sin(Math.PI * (Fw - K.slam[2]) / 8) : 0; }
    if (Fw >= 278 && Fw < 288) sq = Fw < 280 ? 0.14 * sm((Fw - 278) / 2) : -0.1;          // crouch, stretch in the air
    if (Fw >= 288) { armL = lerp(0.5, 2.2, sm((Fw - 288) / 5)); armR = lerp(0.4, 2.7, sm((Fw - 289) / 5)); expr = 'grin'; }
    rock = Fw > 292 ? 0.05 * Math.sin(TAU * Fc / 16) : 0;
  }
  return { x, z, y, sq, rock, expr, armL, armR, scis, crown, yaw, kick, vis };
}

// ---- tape + roll + letters ----
function tapeState(F) {
  const vis = F >= K.kick && F < K.reset + 12;
  const rollX = lerp(TAPE.x0, TAPE.x0 - TAPE.len, ease.outCubic(clamp((F - K.roll[0]) / (K.roll[1] - K.roll[0]))));
  const fly = F >= K.snip ? F - K.snip : -1;
  return { vis, rollX, rollOn: F >= K.kick && F < K.roll[1] + 1, fly };
}
const GL_LAYOUT = [ // x offset (world), rot z, rot y (hand-placed, jaunty)
  { ch: '4', dx: 0.0, rz: -0.07, ry: 0.12 }, { ch: '.', dx: 0.84, rz: 0.0, ry: 0.05 },
  { ch: '7', dx: 1.1, rz: 0.06, ry: -0.02 }, { ch: 'x', dx: 1.86, rz: -0.1, ry: -0.1 },
];
function letterState(i, F) {
  const land = K.slam[i];
  if (F < land - 14 || F >= K.reset + 12) return { vis: false };
  const a = F - land;
  let y = 0, sy = 1, sxz = 1, rz = 0;
  if (a < 0) { const p = (a + 14) / 14; y = 6.5 * (1 - p * p); sy = 1.08; sxz = 0.95; }
  else { sy = 1 - ringv(a, 0.3, 0.8, 0.18); sxz = 1 + ringv(a, 0.14, 0.8, 0.18); rz = bumpv(a, 0.06, 0.7, 0.15); }
  return { vis: true, y, sy, sxz, rz, a };
}

function glyphShape(THREE, ch, seed) {
  const P = {
    '4': [[[0.44, 1.0], [0.63, 1.0], [0.63, 0.40], [0.77, 0.40], [0.77, 0.23], [0.63, 0.23], [0.63, 0.0], [0.43, 0.0], [0.43, 0.23], [0.0, 0.23], [0.0, 0.41]],
      [[0.43, 0.40], [0.43, 0.70], [0.21, 0.40]]],
    '7': [[[0.0, 1.0], [0.68, 1.0], [0.68, 0.85], [0.35, 0.0], [0.13, 0.0], [0.45, 0.83], [0.0, 0.83]]],
    '.': [Array.from({ length: 12 }, (_, i) => [0.11 + 0.11 * Math.cos(i / 12 * TAU), 0.11 + 0.11 * Math.sin(i / 12 * TAU)])],
    'x': [(() => {   // a plus sign (arm half-width w, half-length L) turned 45 degrees
      const c = [0.3, 0.36], w = 0.08, L = 0.3, a = Math.PI / 4, ca = Math.cos(a), sa = Math.sin(a);
      const plus = [[w, L], [w, w], [L, w], [L, -w], [w, -w], [w, -L], [-w, -L], [-w, -w], [-L, -w], [-L, w], [-w, w], [-w, L]];
      return plus.map(([px, py]) => [c[0] + px * ca - py * sa, c[1] + px * sa + py * ca]).reverse();
    })()],
  }[ch];
  // hand wobble: subdivide edges and nudge
  const wob = (poly, k) => {
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 0.12));
      for (let j = 0; j < n; j++) {
        const t = j / n;
        out.push([a[0] + (b[0] - a[0]) * t + (hsh(seed, k, i, j, 1) - 0.5) * 0.018, a[1] + (b[1] - a[1]) * t + (hsh(seed, k, i, j, 2) - 0.5) * 0.018]);
      }
    }
    return out;
  };
  const outer = wob(P[0], 0).map((q) => new THREE.Vector2(q[0], q[1]));
  const shape = new THREE.Shape(outer);
  for (let h = 1; h < P.length; h++) shape.holes.push(new THREE.Path(wob(P[h], h).map((q) => new THREE.Vector2(q[0], q[1]))));
  return shape;
}

function ell(x, y, rx, ry, rot = 0, n = 22) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU, px = Math.cos(a) * rx, py = Math.sin(a) * ry; pts.push([x + px * Math.cos(rot) - py * Math.sin(rot), y + px * Math.sin(rot) + py * Math.cos(rot)]); }

}

  }

  const nrm = B.clone().sub(A).cross(H.clone().sub(A));        // hinge axle: normal of the legs' plane
  if (nrm.lengthSq() < 1e-8) nrm.set(0, 0, 1);
  C.hinge.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), nrm.normalize());
  // head: on the hinge, looks at the camera / the action
  C.head.position.copy(H);
  const cam = T.camera.position;
  let yaw = Math.atan2(cam.x - H.x, cam.z - H.z) * 0.75 + P.yaw + P.spin;
  if (P.lookX) yaw = lerp(yaw, Math.PI / 2, 0.35);
  C.head.rotation.set(0.08, yaw, 0.1 * Math.sin(TAU * F / 40));
  C.head.scale.set(1 + P.headSq * 0.5, 1 - P.headSq, 1 + P.headSq * 0.5);
  C.headM.material.uniforms.uMap.value = T.faces.compass[P.expr][Math.floor(F / 2) % 2];
  // cape: flutter (on twos), stronger when moving
  const pos = C.cape.geometry.attributes.position, base = C.capeBase, Fc = twos(F);

function updateFork(F) {

function updateTape(F) {
  const S = tapeState(F);
  T.stub.visible = T.tail.visible = S.vis;
  T.roll.visible = S.rollOn;
  if (S.rollOn) { const rr = lerp(0.28, 0.1, (TAPE.x0 - S.rollX) / TAPE.len); T.roll.scale.set(rr / 0.28, 1, rr / 0.28); T.roll.position.set(S.rollX, rr, TAPE.z); T.roll.rotation.set(Math.PI / 2, (TAPE.x0 - S.rollX) / 0.19, 0); }
  if (!S.vis) { st.tape = S; return; }
  const THREE = T.THREE;
  // stub: from x0 - stub to x0, lying flat; collapses into the roll during the unroll
  const lay = (m, xStart, curveFn) => {
    const pos = m.geometry.attributes.position, base = m.userData.base, len = m.userData.len;
    for (let i = 0; i < pos.count; i++) {
      const bx = base[i * 3], by = base[i * 3 + 1];          // plane x in [-len/2, len/2], y in [-w/2, w/2]
      const u = len / 2 - bx;                                // distance from the right end (towards -x)
      let p = curveFn(u, by);

  };
  const y0 = 0.014;
  // plane y (by) -> -z, so the canvas top is the far edge and the writing reads upright from the front
  const flat = (x, w) => [Math.max(x, S.rollX), y0, TAPE.z - w];
  const recoil = S.fly >= 0 ? bumpv(S.fly, 0.05, 0.9, 0.2) : 0;
  // the stub pops up like a card (hinged on its front edge) so "Qubrio" faces the camera
  const phi = (Math.PI / 2) * ob((F - 272) / 8);
  lay(T.stub, TAPE.x0, (u, w) => {
    const f = flat(TAPE.x0 - u, w); f[1] += recoil * Math.sin(Math.PI * u / TAPE.stub);
    if (F >= 272) {   // flip up on the front edge, then grow (toon exaggeration: ta-da)
      const zf = TAPE.z + TAPE.w / 2, dd = zf - f[2]; f[1] = y0 + dd * Math.sin(phi); f[2] = zf - dd * Math.cos(phi);
      const g = 1 + 0.45 * ob((F - 275) / 8), cxm = 2.69;

    }

  });
  // tail: flat until the snip; then yanked up along a spiralling leader path and away
  const d = S.fly >= 0 ? 9 * Math.pow(clamp(S.fly / 18), 1.3) : 0;
  const gam = (lam, w) => {
    if (lam <= 0) return flat(CUTX + lam, w);
    const c = [CUTX + 0.9 * Math.sin(1.3 * lam) - 0.55 * lam, y0 + 0.5 * lam + 0.3 * (1 - Math.cos(1.3 * lam)), TAPE.z + 0.45 * lam];
    const e = 0.02, c2 = [CUTX + 0.9 * Math.sin(1.3 * (lam + e)) - 0.55 * (lam + e), y0 + 0.5 * (lam + e) + 0.3 * (1 - Math.cos(1.3 * (lam + e))), TAPE.z + 0.45 * (lam + e)];
    const tg = [c2[0] - c[0], c2[1] - c[1], c2[2] - c[2]], tl = Math.hypot(...tg);
    let b = [-tg[2] / tl, 0, tg[0] / tl]; const bl = Math.hypot(...b) || 1; b = b.map((q) => q / bl);

    const n = [0, 1, 0];
    const bw = [b[0] * Math.cos(twist) + n[0] * Math.sin(twist), b[1] * Math.cos(twist) + n[1] * Math.sin(twist), b[2] * Math.cos(twist) + n[2] * Math.sin(twist)];
    return [c[0] - bw[0] * w, c[1] - bw[1] * w, c[2] - bw[2] * w];
  };
  lay(T.tail, CUTX, (u, w) => gam(d - u, w));
  T.tail.visible = S.vis && (S.fly < 0 || S.fly < 20);
  st.tape = { ...S, d };
}

function updateLetters(F) {

function updateBackdrop(F) {
  // colour arc: cool dawn -> warm action -> hot pink ZAP -> gold triumph -> cool
  const dawn = [0.62, 0.66, 1.0], warm = [1.0, 0.8, 0.4], zap = [1.0, 0.5, 0.72], gold = [1.0, 0.76, 0.3];
  const keys = [[0, dawn], [62, dawn], [76, warm], [172, warm], [180, zap], [204, zap], [228, warm], [262, warm], [272, gold], [312, gold], [326, dawn], [360, dawn]];
  let c = keys[0][1];
  for (let i = 1; i < keys.length; i++) if (F < keys[i][0]) { const [a, ca] = keys[i - 1], [b, cb] = keys[i]; const k = io((F - a) / (b - a)); c = ca.map((v, j) => lerp(v, cb[j], k)); break; }

// =====================================================================================================
// npr per-frame: lights, glows, beams, comic FX
// =====================================================================================================
function drawNPR(ctx) {
  const { npr, camera, THREE } = T, F = ctx.iw;
  npr.frame(ctx);
  // lights down for the wind-up: more pigment, cooler key, heavy vignette (set every frame: pure)
  const dk = dimK(F);
  npr.setLook(dk > 0 ? { ...LOOK, value: 1 + 0.35 * dk, vignette: 0.16 + 0.42 * dk, keyTint: [1 - 0.28 * dk, 1 - 0.32 * dk, 1 - 0.12 * dk] } : LOOK);
  // ...but a warm follow-spot stays on the Stopwatch
  if (dk > 0) npr.pointLight(V(st.watch.x + 0.3, 1.4, st.watch.z + 0.9), { color: 0xffe9b0, radius: 1.5, i: 0.75 * dk });
  npr.setSmear(st.smear || 0, 0);
  // the Rydberg flash comes from the lens overhead: the key light swings up and every shadow snaps under its atom
  const zs = F >= K.zap - 1 && F < K.zap + 34 ? (F < K.zap + 2 ? sm((F - K.zap + 1) / 3) : 1 - sm((F - K.zap - 8) / 26)) : 0;
  const kd = [lerp(-0.55, 0.06, zs), lerp(0.8, 1.0, zs), lerp(0.6, 0.12, zs)];
  npr.setLight({ dir: kd, target: [0, 0, 0.4], size: 7.2, dist: 20 });
  // focus follows the story
  const focusPts = [[0, [-1.6, 0.4, 1.0]], [64, [-0.2, 0.5, 1.4]], [70, [4.2, 0.8, 0.2]], [80, [2.6, 0.6, 0.2]], [104, [1.0, 0.4, 0.4]], [140, [2.2, 0.4, 0.2]], [150, [WATCH.x, 0.8, WATCH.z]], [K.zap, [2.2, 0.4, 0.2]], [220, [2.8, 0.3, 2.4]], [262, [2.8, 0.5, 2.7]], [320, [-2.0, 0.4, 0.8]]];
  let fp = focusPts[0][1]; for (const [f, p] of focusPts) if (F >= f) fp = p;
  npr.focusOn(camera, V(...fp), 3.2);
  // tweezer light: soft painted halos behind the atoms in view (storage early/late, the zone in between)
  const zapWin = F >= K.zap - 2 && F < K.zap + 60;
  if (!zapWin) st.atoms.forEach((s, i) => {
    const a = ATOMS[i], storageShot = F < 84 || F >= 318;
    if (storageShot ? a.kind !== 'store' && a.kind !== 'mover' : a.kind === 'store') return;
    const tw = 0.4 + 0.12 * Math.sin(TAU * (F / 60 + a.ph));
    npr.glowAt(ctx, camera, V(s.x, s.y, s.z), { radius: 0.27, i: tw, color: storageShot ? 0xfff0b0 : 0xffd98a, behind: true, seed: i });
  });
  // warm spill from the tweezer lattice, cool from the zone
  npr.pointLight(V(-2.1, 0.8, 0), { color: 0xffe08a, radius: 2.6, i: 0.35 });
  // Rydberg: the lens charges, a light sheet sweeps the zone, then the flash
  const charge = clamp((F - 164) / 12) * (1 - clamp((F - K.zap - 10) / 10));
  if (charge > 0) {
    npr.glowAt(ctx, camera, V(...T.OBJ), { radius: 0.35, i: charge, color: COL.pink, rays: 0.6 * charge, rayLen: 0.5, rayCount: 12, seed: 4 });
    npr.beamAt(ctx, camera, V(T.OBJ[0], T.OBJ[1], T.OBJ[2]), V(2.45, 0.3, 0.2), { width: 0.25 + 1.4 * clamp((F - K.click) / 5), i: 0.2 + 0.7 * charge, color: COL.pink, lines: 0, seed: 1, occluded: 0.2 });
  }
  const sweep = clamp((F - K.click) / (K.zap - K.click));
  if (F >= K.click && F < K.zap + 16) npr.pointLight(V(lerp(0.2, 4.2, sweep), 0.9, 0.2), { color: COL.pink, radius: 1.8 + 1.5 * clamp((F - K.zap) / 4), i: 1.0 - 0.5 * clamp((F - K.zap - 4) / 12) });
  const zapAge = F - K.zap;
  if (zapAge >= -2 && zapAge < 60) {
    const k = zapAge < 0 ? 0.4 : Math.exp(-zapAge / 14);
    st.atoms.forEach((s, i) => {
      const a = ATOMS[i]; if (a.kind === 'store') return;
      npr.glowAt(ctx, camera, V(s.x, s.y, s.z), { radius: 0.28 + 0.15 * k, i: 0.35 + 0.6 * k, color: COL.pink, behind: true, seed: i });
    });
    if (zapAge >= 0 && zapAge < 22) {
      const c = ctx.project(V(2.3, 0.4, 0.2), camera);
      npr.focusLines({ x: c.x, y: c.y, r0: 380, amount: 1 - zapAge / 22, count: 120, width: 1.4, seed: 3 });
      if (zapAge < 2) npr.impact(1, { invert: zapAge === 1, threshold: 0.6 });
    }
  }
  // AOD threads glow faintly while they carry the block
  if (F >= K.glide[0] && F < K.glide[1]) npr.pointLight(V(st.atoms[13].x, 0.6, 0.4), { color: COL.ochre, radius: 1.6, i: 0.5 });
  // wind-up: concentration lines close in on the Stopwatch
  if (F >= 166 && F < K.zap) {
    const c = ctx.project(V(st.watch.x, st.watch.y + 0.75, st.watch.z), camera);
    npr.focusLines({ x: c.x, y: c.y, r0: 330 - 60 * sm((F - 166) / 12), amount: 0.75 * sm((F - 166) / 6), count: 110, width: 1.3, seed: 12 });
  }
  // crown click spark
  if (F >= K.click && F < K.click + 3) { const w = T.watch.btn.getWorldPosition(new THREE.Vector3()); npr.glowAt(ctx, camera, w, { radius: 0.16, i: 1, color: 0xffe066, rays: 1, rayLen: 0.42, rayCount: 10, seed: 8 }); }
  // golden spill on the 4.7x and the team
  if (F >= K.slam[0] && F < K.reset + 6) npr.pointLight(V(LET.x + 1.2, TABLE_Y + 1.4, LET.z + 0.9), { color: 0xffc23d, radius: 2.4, i: 0.55 * sm((F - K.slam[0]) / 8) });
  // the slam: concentration lines on the middle letter
  const sa = F - K.slam[2];
  if (sa >= 0 && sa < 14) {
    const c = ctx.project(V(LET.x + 1.4, TABLE_Y + 0.6, LET.z), camera);
    npr.focusLines({ x: c.x, y: c.y, r0: 430, amount: 0.9 * (1 - sa / 14), count: 100, width: 1.2, seed: 9 });
    if (sa === 0) npr.impact(0.8, { threshold: 0.55 });
  }
  npr.render(T.scene, camera);
}

// =====================================================================================================
// ink overlay (p5.brush): marks that follow the 3D world, boiling on twos
// =====================================================================================================
function prj(ctx, x, y, z) { const v = new T.THREE.Vector3(x, y, z); const s = ctx.project(v, T.camera); const vc = v.clone().applyMatrix4(T.camera.matrixWorldInverse); return { x: s.x, y: s.y, front: vc.z < 0, d: -vc.z }; }
function pxu(ctx, x, y, z) { const p = prj(ctx, x, y, z); return p.front ? (ctx.DH / 2) / (Math.tan(T.camera.fov * Math.PI / 360) * p.d) : 0; }
// screen-space occluders for the 2D ink marks (they have no depth): the characters' big round parts
function occluders(ctx) {
  const list = [];
  const addO = (obj, local, rad) => {
    const w = obj.localToWorld(new T.THREE.Vector3(...local)), p = prj(ctx, w.x, w.y, w.z);
    if (p.front) list.push({ x: p.x, y: p.y, d: p.d, r: rad * pxu(ctx, w.x, w.y, w.z) });
  };
  if (T.watch.root.visible) { addO(T.watch.body, [0, 0.72, 0], 0.52); addO(T.watch.body, [0, 0.3, 0], 0.3); }
  addO(T.fork.body, [0, 0, 0], 0.42);
  addO(T.cmp.headM, [0, 0, 0], 0.34);
  return list;
}
function hidden(occ, p) { return occ.some((o) => p.d > o.d + 0.05 && Math.hypot(p.x - o.x, p.y - o.y) < o.r); }

function inkOverlay(ctx, brush) {
  if (SHEET || TOP) return;
  const F = ctx.iw, r = ctx.boilRng('ink');
  const ink = PAL.ink;
  const occ = occluders(ctx);
  brush.noHatch();
  // --- zzz over sleepers (loop-periodic) ---
  st.atoms.forEach((s, i) => {
    if (s.e !== 'sleep' || i % 4 !== 1) return;
    const a = prj(ctx, s.x, s.y + 0.28, s.z); if (!a.front || hidden(occ, a)) return;
    const u = pxu(ctx, s.x, s.y, s.z) * 0.12;
    for (let q = 0; q < 2; q++) {
      const ph = ((F / 40 + q * 0.5 + ATOMS[i].ph) % 1);
      const sz = u * (0.6 + 0.6 * ph), x = a.x + 22 * ph * u / 20 + 10, y = a.y - ph * 55 * u / 20;
      if (ph > 0.85) continue;
      brush.set('inkpen', ink, clamp(u / 14, 0.6, 1.6));
      brush.spline([[x - sz / 2, y - sz / 2], [x + sz / 2, y - sz / 2 + r.gauss(0, 0.5)], [x - sz / 2, y + sz / 2], [x + sz / 2, y + sz / 2]], 0.0);
    }
  });
  // --- compass ticks: impact star at the tip + ochre target rings that draw on round the column ---
  K.tick.forEach((tf, k) => {
    const age = F - tf;
    const tip = [SX(3 + k), 0.0, CMP.z];
    if (age >= 0 && age < 6) {
      const a = prj(ctx, ...tip), u = pxu(ctx, ...tip);
      brush.set('bigink', ink, 1.3);
      for (let q = 0; q < 7; q++) { const an = -Math.PI * (0.1 + 0.8 * q / 6), r0 = 0.1 * u * (1 + age * 0.25), r1 = 0.26 * u * (1 + age * 0.12); brush.line(a.x + Math.cos(an) * r0, a.y + Math.sin(an) * r0, a.x + Math.cos(an) * r1, a.y + Math.sin(an) * r1); }
    }
    if (age >= 0 && F < K.glide[0] + 8) {
      const fade = 1 - sm((F - K.glide[0]) / 8);
      for (let rr = 0; rr < 3; rr++) {
        const s = st.atoms[ATOMS.findIndex((A) => A.kind === 'mover' && A.k === k && A.r === rr)];
        const draw = sm((age - rr * 2) / 5) * fade;
        if (draw <= 0.02) continue;
        const pts = [];
        const n = Math.max(3, Math.round(24 * draw));
        for (let q = 0; q <= n; q++) { const an = -0.6 + q / 24 * TAU * 1.05; const p = prj(ctx, s.x + Math.cos(an) * 0.34, 0.01, s.z + Math.sin(an) * 0.34); pts.push([p.x + r.gauss(0, 0.8), p.y + r.gauss(0, 0.8)]); }
        brush.set('bigink', PAL.ochre, 1.6); brush.spline(pts, 0.5);
      }
    }
  });
  // --- THWIP: motion streaks along the threads; TWANG vibration arcs at the tine ---
  if (F >= K.thwip[0] && F < K.thwip[0] + 8 && st.tine) {
    const a = prj(ctx, st.tine.x, st.tine.y, st.tine.z);
    brush.set('inkpen', ink, 1.2);
    for (let q = 0; q < 4; q++) { const dx = -(80 + q * 50) * (F - K.thwip[0] + 1) / 3, dy = (q - 1.5) * 16; brush.line(a.x + dx * 0.4, a.y + dy + dx * 0.12, a.x + dx, a.y + dy + dx * 0.2); }
  }
  if (F >= K.taut && F < K.taut + 10 && st.tine) {
    const a = prj(ctx, st.tine.x, st.tine.y, st.tine.z);
    brush.set('bigink', ink, 1.2);
    for (let q = 1; q <= 3; q++) brush.spline([[a.x - 30 * q, a.y - 18 * q], [a.x - 36 * q - 6, a.y], [a.x - 30 * q, a.y + 18 * q]], 0.7);
  }
  // --- convoy speed lines trailing each row ---
  if (F >= K.glide[0] + 2 && F < K.glide[1] - 4) {
    const v = convoyV((F - K.glide[0]) / (K.glide[1] - K.glide[0])) / 1.875;
    const mv = st.atoms.filter((s, i) => ATOMS[i].kind === 'mover');
    for (let rr = 0; rr < 3; rr++) {
      const s = mv[rr];
      for (let q = 0; q < 3; q++) {
        const y = s.y + (q - 1) * 0.11, len = (0.6 + 0.9 * v) * (1 - q * 0.15);
        const a = prj(ctx, s.x - 0.3, y, s.z), b = prj(ctx, s.x - 0.3 - len * (1 + hsh(F >> 1, q, rr) * 0.4), y, s.z);
        brush.set('bigink', ink, 1.3); brush.line(a.x, a.y + r.gauss(0, 1), b.x, b.y + r.gauss(0, 1));
      }
    }
  }
  // --- dock puffs ---
  const da = F - K.glide[1];
  if (da >= 0 && da < 9) st.atoms.forEach((s, i) => { if (ATOMS[i].kind !== 'mover' || i % 2) return; const a = prj(ctx, s.x + 0.2, s.y - 0.18, s.z), u = pxu(ctx, s.x, s.y, s.z); if (hidden(occ, a)) return; puff(brush, a.x, a.y, 0.12 * u * (1 + da * 0.12), ink, r, 1 - da / 9); });
  // --- Stopwatch hop landings: dust puffs ---
  [K.enter[1], K.enter[2]].forEach((f) => {
    const a0 = F - f; if (a0 < 0 || a0 >= 9 || !T.watch.root.visible) return;
    for (const sd of [-1, 1]) { const a = prj(ctx, st.watch.x + sd * 0.42, 0.04, st.watch.z + 0.1), u = pxu(ctx, st.watch.x, 0, st.watch.z); if (a.front) puff(brush, a.x + sd * a0 * 3, a.y - a0, 0.12 * u * (1 + a0 * 0.1), PAL.ink, r, 1 - a0 / 9); }
  });
  // --- the pair snaps apart when the convoy leaves: a little ink "pop" where each ligature broke ---
  for (let q = 0; q < 9; q++) {

// hand-built comic lettering (Canvas2D): stroke skeletons -> ink shadow, ink outline, colour, sheen

const GLYPH = {
  W: { w: 1.0, s: [[[0, 0], [0.22, 1], [0.5, 0.34], [0.78, 1], [1.0, 0]]] },
  H: { w: 0.62, s: [[[0, 0], [0, 1]], [[0.62, 0], [0.62, 1]], [[0, 0.52], [0.62, 0.5]]] },
  O: { w: 0.8, s: [[...ell(0.4, 0.5, 0.4, 0.5, 0, 20), ell(0.4, 0.5, 0.4, 0.5, 0, 20)[0]]] },
  S: { w: 0.64, s: [[[0.62, 0.12], [0.36, 0.0], [0.08, 0.1], [0.06, 0.32], [0.3, 0.47], [0.56, 0.6], [0.62, 0.84], [0.38, 1.0], [0.02, 0.9]]], smooth: true },
  Z: { w: 0.72, s: [[[0.02, 0.02], [0.72, 0.0], [0.0, 1.0], [0.74, 0.98]]] },
  A: { w: 0.78, s: [[[0, 1], [0.39, 0], [0.78, 1]], [[0.17, 0.64], [0.61, 0.64]]] },
  P: { w: 0.62, s: [[[0, 1], [0, 0], [0.4, 0], [0.62, 0.15], [0.62, 0.35], [0.4, 0.5], [0, 0.5]]], smooth: true },
  N: { w: 0.66, s: [[[0, 1], [0, 0], [0.66, 1], [0.66, 0]]] },

function smoothPts(pts, n = 5) {

/**

function handWord(g, word, x, y, size, o) {

function bang(g, x, y, s, rot, r) {   // comic "!" (Canvas2D): tapered bar + dot, ink shadow, ink outline, red, cream sheen

function lettering(ctx, g) {
