# play.picasso-lab.com on picasso: `docker compose up -d --build` in the deployed folder (deploy/push.sh --prod does it,
# after the same code passed its checks on staging, deploy/staging.compose.yaml).
# Caddy (the FRAS project) proxies https://play.picasso-lab.com to 172.24.0.1:7850.
name: muse-minecraft
services:
  paper:
    build: { context: .., dockerfile: deploy/Dockerfile.paper }
    restart: unless-stopped
    environment: { DIFFICULTY: easy, DAYLIGHT: locked, SEED: "71811045", MEMORY: 6G }
    volumes: [ "../data:/data", "console:/console" ]
    networks: { mc: { ipv4_address: 10.77.77.10 } }
  # deploy/.env (made by push.sh, kept on picasso) holds WEB_ADMIN_TOKEN and should hold WEB_PROXY_SECRET: a secret
  # (openssl rand -hex 24) that Caddy adds to every request it forwards here (header_up X-Muse-Proxy <secret> in this
  # site's reverse_proxy block). Only requests carrying it have their X-Forwarded-For believed; any other request that
  # is not loopback is refused. The peer address cannot do this job: the published port goes through docker-proxy, so
  # Caddy, other containers and every user on the host all arrive from this network's gateway (10.77.77.1); do not use
  # WEB_TRUSTED_PROXIES here. Set the secret in .env and in Caddy together (one without the other refuses every
  # visitor with 403). WEB_MCP_GAMES_PER_ADDRESS (live MCP games per address; probe T8) may go there too.
  agent:
    build: { context: .., dockerfile: deploy/Dockerfile.agent }
    restart: unless-stopped
    depends_on: [ paper ]
    env_file: [ .env ]
    environment:
      MC_HOST: 10.77.77.10
      MC_CONSOLE: /console/console.in
      MC_WHITELIST: "true"
      WEB_PUBLIC_URL: https://play.picasso-lab.com
      WEB_TRUST_PROXY: "1"
      WEB_MAX_SESSIONS: "8"
      WEB_LEASE_MS: "1800000"
    volumes: [ "../logs:/logs", "console:/console" ]
    ports: [ "172.24.0.1:7850:8787" ]
    networks: { mc: { ipv4_address: 10.77.77.11 } }
  # Live video of guest games (off unless started with the "stream" profile; deploy/push.sh --prod does that when
  # deploy/stream.env exists). It shares the agent's network namespace: the agent's first-person views on 127.0.0.1
  # are local to it, and its control API (127.0.0.1:7861) is reachable from the agent only. The stream keys live in
  # stream.env, read by this container alone. To turn it on: deploy/stream.env with
  #   STREAM_ENABLED=1
  #   STREAM_RTMP_URL=rtmps://live-api-s.facebook.com:443/rtmp/<key>   (one URL per stream that may run at once)
  # and in deploy/.env (the agent):
  #   STREAM_ENABLED=1
  #   STREAM_SERVICE_URL=http://127.0.0.1:7861
  # Per stream about 3-5 CPU threads at 720p30 rendered at 640x360 (README, "Live video"); the caps below hold every
  # stream of this container together.
  stream:
    build: { context: .., dockerfile: deploy/Dockerfile.stream }
    profiles: [ stream ]
    restart: unless-stopped
    depends_on: [ agent ]
    network_mode: "service:agent"
    env_file: [ { path: stream.env, required: false } ]
    environment: { STREAM_MAX: "1", STREAM_FPS: "30", STREAM_SCALE: "0.5" }
    volumes: [ "../logs:/logs" ]
    cpus: 8
    mem_limit: 3g
    pids_limit: 1024
    shm_size: 256m
    security_opt: [ "no-new-privileges:true" ]
  # The real-client camera (off unless started with the "camera" profile; deploy/push.sh --prod does that when
  # deploy/camera.env exists): a vanilla Minecraft 1.21.4 client on Xvfb that spectates each guest bot in first person,
  # captured by ffmpeg to the output in camera.env (README, "Real-client camera"). Like the stream container it shares
  # the agent's network namespace (control API on 127.0.0.1:7862, Paper at 10.77.77.10), and it puts itself in
  # spectator mode through the console FIFO. It runs as the operator's uid so the account's tokens in
  # ~/workspace/muse-minecraft/camera/auth (scripts/camera-login.mjs) stay theirs. OpenGL on the CPU (Mesa llvmpipe):
  # picasso's H100s create GL contexts but support no framebuffer objects. To turn it on: deploy/camera.env with
  #   STREAM_RTMP_URL=rtmps://live-api-s.facebook.com:443/rtmp/<key>     (or STREAM_OUT_DIR=/logs/streams for files)
  # and in deploy/.env (the agent):
  #   STREAM_ENABLED=1
  #   STREAM_SERVICE_URL=http://127.0.0.1:7862
  # One camera = one client at about 4-5 CPU threads and 1.5 GB while it films (README); STREAM_MAX cameras need as many
  # accounts (a second client under the same name would kick the first).
  camera:
    build: { context: .., dockerfile: deploy/Dockerfile.camera }
    profiles: [ camera ]
    restart: unless-stopped
    depends_on: [ agent ]
    network_mode: "service:agent"
    user: "${CAMERA_UID:-1014}:${CAMERA_GID:-1014}"
    init: true
    env_file: [ { path: camera.env, required: false } ]
    environment:
      STREAM_ENABLED: "1"
      STREAM_MAX: "1"
      STREAM_FPS: "30"
      STREAM_BITRATE_K: "3500"
      MC_HOST: 10.77.77.10
      MC_CONSOLE: /console/console.in
      CAMERA_GL: cpu
      CAMERA_GL_THREADS: "8"
    volumes: [ "../logs:/logs", "console:/console", "../../camera/auth:/auth" ]
    tmpfs: [ "/camera:size=1g,mode=1777,exec" ]
    cpus: 6
    mem_limit: 3g
    pids_limit: 1024
    shm_size: 256m
    security_opt: [ "no-new-privileges:true" ]
volumes:
  console: {}
networks:
  mc:
    ipam: { config: [ { subnet: 10.77.77.0/28 } ] }
