<!-- Team-page avatar short for Prof. Yufei Ding: "Picatso" (8 s, 192 f @ 24 fps, square, NOT a loop).
     Plays inside her round avatar on double-click: starts and ends exactly on her photo.
     One three.js world rendered through the film's copy of runtime/npr (comic look: cel ramp, hull + Sobel
     ink with boil, Ben-Day dots, off-register plates, paper). Her photo becomes a 2.5D comic panel (three
     cut-out planes: dusk sky, palm, her), the lab bench with a superconducting chip sits elsewhere in the
     same scene. Every texture is painted with Canvas2D at boot; all ink overlays and the hand-built lettering
     are Canvas2D stroke skeletons (no web font). Lettering pop / burst ideas follow ClaudeAnimationBase
     src/core.js (MIT, (c) JohnHeibel) via reference/style-comic.
     Authoring: ?debug=1..5 npr G-buffer views. -->
<script type="importmap">{"imports":{"three":"/pv/vendor/three/build/three.module.js","three/addons/":"/pv/vendor/three/addons/"}}</script>
</head><body>
<script type="module">
import { defineScene, ease, clamp, lerp } from '/pv/runtime/pv.js';
import { createNPR } from '/scene/npr/npr.js';
import { handheld } from '/scene/npr/camera.js';

const Q = new URLSearchParams(location.search);
const FPS = 24, NF = 192, TAU = Math.PI * 2, DES = 960;

// =====================================================================================================
// palette (paint space)
// =====================================================================================================
const PAL = {
  paper: '#f4ebd6', ink: '#14122a', gold: '#f6c445', goldD: '#c98a1e', goldL: '#fff0a8', red: '#e5463b',
  cyan: '#53d8f2', cream: '#fff6e0', yellow: '#ffe14d', pink: '#ff5a8a', white: '#ffffff',
};
const COL = {
  gold: 0xf0b437, goldChip: 0xffffff, cyan: 0x58dcf4, red: 0xff2a5a, noiseAlt: 0x6e1238, bronze: 0x9a6230,
  coupLit: 0xffd23f, bench: 0x7b86c9, benchSide: 0x4f5aa0, pcb: 0x252b64, fur: 0xfbf8f2, pink: 0xf4a3b3,
  beret: 0xe0383a, wood: 0xa8683a, ferrule: 0xe6ad42, bristle: 0xf3dcae, paintGold: 0xffc93a,
};

// =====================================================================================================
// timeline helpers (pure functions of the frame)
// =====================================================================================================
const sm = (x) => ease.smooth(clamp(x));
const io = (x) => ease.inOutSine(clamp(x));
const ob = (x) => ease.outBack(clamp(x));
const ic = (x) => ease.inCubic(clamp(x));
const oc = (x) => ease.outCubic(clamp(x));
const ioc = (x) => ease.inOutCubic(clamp(x));
const twos = (F) => F - (F % 2);
const ringv = (a, amp, w = 1.1, k = 0.2) => (a < 0 ? 0 : amp * Math.exp(-k * a) * Math.cos(w * a));
const bumpv = (a, amp, w = 0.9, k = 0.16) => (a < 0 ? 0 : amp * Math.exp(-k * a) * Math.sin(w * a));
const hsh = (...n) => { let x = Math.sin(n.reduce((s, v, i) => s + v * (12.9898 + i * 78.233), 0.5)) * 43758.5453; return x - Math.floor(x); };
const arcP = (p) => Math.sin(Math.PI * clamp(p));

// key frames of the story (24 fps)
const K = {
  ring: [3, 10],                 // photo -> comic panel (ink burst ring closes in)
  whip1: [12, 18, 23],           // whip pan right: start, cut, settled
  pop: [20, 22, 24],             // gremlins pop up over the chip's far edge (staggered)
  edge: [24, 26, 28],            // ... land on the chip edge
  hop: [[26, 31], [28, 35], [30, 36]],   // ... hop onto their qubits (take-off, landing)
  bzzt: 31,
  whip2: [55, 59, 63],           // whip pan left back to her
  zoom: [59, 64], shing: 62,     // crash zoom to her face, glasses flash
  back: [66, 74],                // camera eases back to catch the shoulder
  catUp: [68, 75],               // the cat leaps up from below and lands on her shoulder
  catOff: [84, 86],              // crouch, leap off (up)
  whip3: [86, 89, 94],           // whip: tilt up with the cat, cut, tilt down onto the chip
  fall: [89, 97], stroke: [97, 122],
  exit: [122, 131], land: 140, puff: [143, 152],
  write1: [147, 163], write2: [158, 168],
  wipe: [173, 184],
};

// =====================================================================================================
// world layout
// =====================================================================================================
// her comic panel: three cut-out planes facing +z, far from the bench (z = 60). Photo px (u, v) -> plane
// coords: x = (u/512 - .5) * 10, y = (.5 - v/512) * 10. The home camera sits D in front: the planes fill it.
const PNL = { z: 60, D: 5 / Math.tan(15 * Math.PI / 180) };
const PZ = { person: 0, palm: -6, sky: -14 };
const pp = (u, v, dz = 0) => [(u / 512 - 0.5) * 10, (0.5 - v / 512) * 10, PNL.z + dz];
const LENS = [pp(232.5, 144), pp(291.5, 144.2)];
const SHOULDER = pp(168, 262, 0.95);        // where the cat lands (in front of her left-in-image shoulder)

// bench: table top y = 0, navy PCB, gold chip, 3 x 3 qubits
const CHIP = { w: 3.4, h: 0.22, y0: 0.06 };
const CHIP_TOP = CHIP.y0 + CHIP.h;
const QP = 0.95, QR = 0.2, QY = CHIP_TOP + 0.17;
const QX = (c) => (c - 1) * QP, QZ = (r) => (r - 1) * QP;
const QUBITS = [];
for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) QUBITS.push({ r, c, k: r * 3 + c, x: QX(c), z: QZ(r) });
const COUPLERS = [];
for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) COUPLERS.push({ a: r * 3 + c, b: r * 3 + c + 1, x: (QX(c) + QX(c + 1)) / 2, z: QZ(r), rot: 0 });
for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) COUPLERS.push({ a: r * 3 + c, b: (r + 1) * 3 + c, x: QX(c), z: (QZ(r) + QZ(r + 1)) / 2, rot: Math.PI / 2 });
// three noise gremlins: where they pop up (far edge) and the qubit each one sits on
const GREM = [
  { q: 0, popX: -1.0 },   // far-left qubit
  { q: 4, popX: 0.05 },   // centre
  { q: 2, popX: 1.0 },    // far-right
];
const G_BODY = 0.42, G_SIT = QY + QR - 0.03;

// the one stroke: a gold ribbon swooping through the three gremlins (far-left -> centre -> far-right)
const STROKE_PTS = [[-2.45, 1.75, 0.45], [-1.75, 1.2, -0.55], [-0.98, 1.02, -0.95], [-0.5, 1.0, -0.42], [0.0, 1.02, 0.02],
  [0.5, 1.0, -0.42], [0.98, 1.02, -0.95], [1.8, 1.25, -0.55], [2.8, 1.95, 0.45]];

// =====================================================================================================
// scene state
// =====================================================================================================
let T = null;
const st = {};
const V = (x, y, z) => new T.THREE.Vector3(x, y, z);

const LOOK = {
  extends: 'comic',
  // lengths are design px of this film's 960 x 960 design (ink >= 6 px so it reads at 135-200 CSS px)
  lineW: 3.0, lineWShadow: 4.3, hullW: 6.0, hullShadowW: 1.35, wobA: 1.5, wobF: 0.02, depthT: 0.13,
  htAmt: 0.9, htPx: 13, htT: 0.38, htRange: 0.5,
  hatchPx: 7, hatchW: 1.5, hatchCut: 0.62, crossT: 0.86,
  misreg: [2.4, -1.8],
  sat: 1.1, edgeDark: 0.1, gran: 0.05,
  bgDots: [0.92, 0.62, 0.5, 0.42],
  grain: 0.012, vignette: 0.06,
  shadowRadius: 2.0,
  burstW: 5.0,
  ...(Q.get('lk') ? JSON.parse(Q.get('lk')) : {}),
};

defineScene({
  meta: {
    title: 'Yufei - Picatso', durationFrames: NF, fps: FPS, width: DES, height: DES, seed: 23,
    design: [DES, DES], background: PAL.paper, fonts: [],
    boil: { every: 2, variants: 3 },            // ink boils at 12 drawings/s
    poster: 150,
  },
  update(ctx) {
    const F = ctx.iw;
    st.F = F;
    st.skip = F < K.ring[0] || F >= K.wipe[1];   // the exact photo covers these frames
    if (st.skip) return;
    updateCamera(ctx, F);
    updateStroke(F);
    updateCat(F);
    updateGremlins(F);
    updateChip(F);
  },
  layers: [
    { name: 'paper', type: '2d', cache: () => 'static', draw(ctx, g) { g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(paperCanvas(ctx), 0, 0); } },
    { name: 'npr', type: 'three', underlay: true, antialias: false,
      async init(ctx, three) { return buildWorld(ctx, three); },
      draw(ctx) { if (!st.skip) drawNPR(ctx); return false; } },
    { name: 'ink', type: '2d', draw(ctx, g) { if (!st.skip) inkOverlay(ctx, g); } },
    { name: 'letters', type: '2d', draw(ctx, g) { if (!st.skip) lettering(ctx, g); } },
    { name: 'photo', type: '2d', draw(ctx, g) { photoLayer(ctx, g); } },
  ],
});

let _flatPaper = null;
function paperCanvas(ctx) {
  if (Q.get('nopaper')) { if (!_flatPaper) { _flatPaper = mkCanvas(ctx.W, ctx.H); const g = _flatPaper.getContext('2d'); g.fillStyle = PAL.paper; g.fillRect(0, 0, ctx.W, ctx.H); } return _flatPaper; }
  return ctx.paper({ tone: PAL.paper, grain: 0.02, fibres: 0.02, blotch: 0.012, seed: 4 });
}

// =====================================================================================================
// assets + Canvas2D painted textures
// =====================================================================================================
async function loadImage(url) { const im = new Image(); im.src = url; await im.decode(); return im; }
function canvasTex(THREE, c, { wrap = false, repeat = null } = {}) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.NoColorSpace; t.anisotropy = 8;
  if (wrap) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(...repeat);
  t.needsUpdate = true;
  return t;
}
function imgTex(THREE, im) {
  const t = new THREE.Texture(im);
  t.colorSpace = THREE.NoColorSpace; t.anisotropy = 8; t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const rnd = (seed) => { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };
function ellipse(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
function star4Path(g, x, y, r, rot = 0, k = 0.28) {
  g.beginPath();
  for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 4 - Math.PI / 2, rr = i % 2 ? r * k : r; const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.closePath();
}

// ---- cat face (equirect sphere map: face centre at u = .25, the equator) ----
function paintCatFace(expr) {
  const W = 1024, H = 512, c = mkCanvas(W, H), g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  const cx = 256, ey = 238, ex = 74, ink = PAL.ink;
  g.lineCap = 'round'; g.lineJoin = 'round';
  const openEye = (x, y, s = 1, look = 0) => {
    ellipse(g, x, y, 31 * s, 41 * s); g.fillStyle = '#78c6f4'; g.fill(); g.lineWidth = 8; g.strokeStyle = ink; g.stroke();
    ellipse(g, x + look * 8, y + 4, 14 * s, 29 * s); g.fillStyle = ink; g.fill();
    ellipse(g, x + 9 * s + look * 6, y - 15 * s, 9 * s, 10 * s); g.fillStyle = '#ffffff'; g.fill();
    ellipse(g, x - 10 * s, y + 18 * s, 4 * s, 4 * s); g.fill();
  };
  const happyEye = (x, y) => { g.beginPath(); g.moveTo(x - 30, y + 10); g.quadraticCurveTo(x, y - 30, x + 30, y + 10); g.lineWidth = 11; g.strokeStyle = ink; g.stroke(); };
  const smugEye = (x, y) => { g.beginPath(); g.moveTo(x - 32, y - 2); g.quadraticCurveTo(x, y + 22, x + 32, y - 2); g.lineWidth = 11; g.strokeStyle = ink; g.stroke();
    g.beginPath(); g.moveTo(x + (x < cx ? -32 : 32), y - 2); g.lineTo(x + (x < cx ? -44 : 44), y - 12); g.lineWidth = 7; g.stroke(); };
  const brows = (dir) => { for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cx + s * (ex + 34), ey - 52 - dir * 6); g.lineTo(cx + s * (ex - 26), ey - 46 + dir * 12); g.lineWidth = 12; g.strokeStyle = ink; g.stroke(); } };
  // nose + mouth
  const ny = 288;
  const nose = () => { g.beginPath(); g.moveTo(cx - 15, ny - 9); g.quadraticCurveTo(cx, ny - 14, cx + 15, ny - 9); g.quadraticCurveTo(cx + 6, ny + 7, cx, ny + 9); g.quadraticCurveTo(cx - 6, ny + 7, cx - 15, ny - 9); g.fillStyle = '#f2899b'; g.fill(); g.lineWidth = 5; g.strokeStyle = ink; g.stroke(); };
  const wMouth = () => { g.beginPath(); g.moveTo(cx, ny + 9); g.lineTo(cx, ny + 18); g.moveTo(cx - 28, ny + 18); g.quadraticCurveTo(cx - 14, ny + 34, cx, ny + 18); g.quadraticCurveTo(cx + 14, ny + 34, cx + 28, ny + 18); g.lineWidth = 6; g.strokeStyle = ink; g.stroke(); };
  const openMouth = () => { g.beginPath(); g.moveTo(cx - 26, ny + 16); g.quadraticCurveTo(cx, ny + 22, cx + 26, ny + 16); g.quadraticCurveTo(cx + 18, ny + 52, cx, ny + 54); g.quadraticCurveTo(cx - 18, ny + 52, cx - 26, ny + 16); g.fillStyle = '#5a1f33'; g.fill();
    ellipse(g, cx, ny + 44, 13, 8); g.fillStyle = '#f07c8e'; g.fill(); g.beginPath(); g.moveTo(cx - 26, ny + 16); g.quadraticCurveTo(cx, ny + 22, cx + 26, ny + 16); g.quadraticCurveTo(cx + 18, ny + 52, cx, ny + 54); g.quadraticCurveTo(cx - 18, ny + 52, cx - 26, ny + 16); g.lineWidth = 6; g.strokeStyle = ink; g.stroke(); };
  const whiskers = () => { g.lineWidth = 4.5; g.strokeStyle = ink; for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(cx + s * 58, ny + 4 + k * 11); g.quadraticCurveTo(cx + s * 110, ny - 4 + k * 13, cx + s * 160, ny - 10 + k * 22); g.stroke(); } };
  const blush = () => { for (const s of [-1, 1]) { ellipse(g, cx + s * 98, ny + 4, 24, 12); g.fillStyle = 'rgba(245,140,160,0.55)'; g.fill(); } };
  switch (expr) {
    case 'open': openEye(cx - ex, ey); openEye(cx + ex, ey); nose(); wMouth(); break;
    case 'look': openEye(cx - ex, ey, 1, 1); openEye(cx + ex, ey, 1, 1); nose(); wMouth(); break;
    case 'happy': happyEye(cx - ex, ey); happyEye(cx + ex, ey); nose(); openMouth(); blush(); break;
    case 'determined': openEye(cx - ex, ey, 0.95); openEye(cx + ex, ey, 0.95);
      g.fillStyle = '#ffffff'; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cx + s * (ex + 44), ey - 52); g.lineTo(cx + s * (ex - 40), ey - 52); g.lineTo(cx + s * (ex - 40), ey - 22); g.lineTo(cx + s * (ex + 44), ey - 40); g.closePath(); g.fill(); }
      brows(1); nose(); wMouth(); break;
    case 'proud': smugEye(cx - ex, ey); smugEye(cx + ex, ey); nose(); wMouth(); blush(); break;
    case 'wink': openEye(cx - ex, ey); happyEye(cx + ex, ey); nose(); openMouth(); blush(); break;
    case 'surprised': openEye(cx - ex, ey, 1.12); openEye(cx + ex, ey, 1.12); nose(); ellipse(g, cx, ny + 30, 11, 14); g.fillStyle = '#5a1f33'; g.fill(); g.lineWidth = 5; g.strokeStyle = ink; g.stroke(); break;
    default: openEye(cx - ex, ey); openEye(cx + ex, ey); nose(); wMouth();
  }
  whiskers();
  return c;
}

// ---- gremlin face (the body colour is in the map: albedo white) ----
function paintGremFace(expr, v) {
  const W = 1024, H = 512, c = mkCanvas(W, H), g = c.getContext('2d');
  g.fillStyle = '#f0503a'; g.fillRect(0, 0, W, H);
  // a darker belly band + speckles (texture for the cel ramp)
  g.fillStyle = '#d23a35'; for (let i = 0; i < 40; i++) { const r = rnd(i * 7 + 3 + v); ellipse(g, r() * W, 300 + r() * 200, 6 + r() * 10, 4 + r() * 6); g.fill(); }
  const cx = 256, ey = 236, ink = PAL.ink, j = (k) => (hsh(v, k) - 0.5) * 4;
  g.lineCap = 'round'; g.lineJoin = 'round';
  const eye = (x, y, rx, ry, px, py, pr) => { ellipse(g, x, y, rx, ry); g.fillStyle = '#fff8e6'; g.fill(); g.lineWidth = 7; g.strokeStyle = ink; g.stroke(); ellipse(g, x + px, y + py, pr, pr * 1.1); g.fillStyle = ink; g.fill(); };
  const brows = () => { for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cx + s * 98 + j(s), ey - 58); g.lineTo(cx + s * 12, ey - 26 + j(s + 2)); g.lineTo(cx + s * 18, ey - 10); g.lineTo(cx + s * 98, ey - 38); g.closePath(); g.fillStyle = ink; g.fill(); } };
  const teeth = (y0, w, h, open) => {
    g.beginPath(); g.moveTo(cx - w, y0); g.quadraticCurveTo(cx, y0 + 12, cx + w, y0); g.quadraticCurveTo(cx + w * 0.7, y0 + h, cx, y0 + h + 6); g.quadraticCurveTo(cx - w * 0.7, y0 + h, cx - w, y0); g.closePath();
    g.fillStyle = '#4a0d1c'; g.fill();
    g.save(); g.clip(); g.fillStyle = '#fff8e6';
    const n = 6;
    for (let k = 0; k < n; k++) { const x0 = cx - w + (2 * w) * k / n, x1 = x0 + 2 * w / n; g.beginPath(); g.moveTo(x0, y0 - 4); g.lineTo(x1, y0 - 4); g.lineTo((x0 + x1) / 2, y0 + 20 + open); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(x0 + w / n, y0 + h + 10); g.lineTo(x1 + w / n, y0 + h + 10); g.lineTo((x0 + x1) / 2 + w / n, y0 + h - 12 - open * 0.5); g.closePath(); g.fill(); }
    g.restore();
    g.beginPath(); g.moveTo(cx - w, y0); g.quadraticCurveTo(cx, y0 + 12, cx + w, y0); g.quadraticCurveTo(cx + w * 0.7, y0 + h, cx, y0 + h + 6); g.quadraticCurveTo(cx - w * 0.7, y0 + h, cx - w, y0); g.closePath();
    g.lineWidth = 7; g.strokeStyle = ink; g.stroke();
  };
  if (expr === 'angry') { eye(cx - 54, ey, 34, 30, 10, 6, 14); eye(cx + 54, ey, 34, 30, -10, 6, 14); brows(); teeth(292, 64, 34, 4); }
  else if (expr === 'grin') { eye(cx - 54, ey + 6, 32, 22, 6, 4, 12); eye(cx + 54, ey + 6, 32, 22, -6, 4, 12); brows(); teeth(284, 82, 46, 10); }
  else if (expr === 'tongue') { eye(cx - 54, ey, 32, 28, 0, 2, 13); g.beginPath(); g.moveTo(cx + 24, ey + 4); g.quadraticCurveTo(cx + 54, ey - 26, cx + 86, ey + 4); g.lineWidth = 10; g.strokeStyle = ink; g.stroke(); brows();
    teeth(286, 70, 36, 6); g.beginPath(); g.moveTo(cx - 22, 318); g.quadraticCurveTo(cx - 24, 372, cx + 4, 374); g.quadraticCurveTo(cx + 30, 372, cx + 26, 318); g.closePath(); g.fillStyle = '#f07c8e'; g.fill(); g.lineWidth = 6; g.strokeStyle = ink; g.stroke(); }
  else { // shock
    eye(cx - 56, ey - 6, 40, 44, 0, 0, 8); eye(cx + 56, ey - 6, 40, 44, 0, 0, 8);
    ellipse(g, cx, 316, 26, 32); g.fillStyle = '#4a0d1c'; g.fill(); g.lineWidth = 7; g.strokeStyle = ink; g.stroke();
  }
  return c;
}

// ---- chip top: gold die with xmon crosses, coupler traces, readout meanders and bond pads ----
function paintChip() {
  const W = 1024, c = mkCanvas(W, W), g = c.getContext('2d');
  const u = W / CHIP.w, X = (x) => W / 2 + x * u, Z = (z) => W / 2 + z * u;
  g.fillStyle = '#f1bd4c'; g.fillRect(0, 0, W, W);
  // brushed bands
  for (let i = 0; i < 26; i++) { g.fillStyle = i % 2 ? 'rgba(255,236,170,0.22)' : 'rgba(200,130,30,0.10)'; g.fillRect(0, i * W / 26, W, W / 52); }
  // border frame + bond pads
  g.strokeStyle = '#b57718'; g.lineWidth = 12; g.strokeRect(26, 26, W - 52, W - 52);
  g.fillStyle = '#ffe28a';
  for (let k = 0; k < 9; k++) {
    const t = 120 + k * (W - 240) / 8;
    for (const [x, y, w, h] of [[t - 16, 44, 32, 30], [t - 16, W - 74, 32, 30], [44, t - 16, 30, 32], [W - 74, t - 16, 30, 32]]) { g.fillRect(x, y, w, h); g.strokeStyle = '#8a5212'; g.lineWidth = 4; g.strokeRect(x, y, w, h); }
  }
  // readout meanders from each edge qubit to the border (hand-ruled)
  g.strokeStyle = '#9a5f14'; g.lineWidth = 7; g.lineJoin = 'round';
  for (const q of QUBITS) {
    const dirs = [];
    if (q.r === 0) dirs.push([0, -1]); if (q.r === 2) dirs.push([0, 1]); if (q.c === 0) dirs.push([-1, 0]); if (q.c === 2) dirs.push([1, 0]);
    for (const [dx, dz] of dirs) {
      g.beginPath();
      const x0 = X(q.x) + dx * 70, y0 = Z(q.z) + dz * 70, L = (dx ? (dx > 0 ? W - 80 - x0 : x0 - 80) : (dz > 0 ? W - 80 - y0 : y0 - 80));
      const n = 6;
      for (let k = 0; k <= n * 4; k++) {
        const s = k / (n * 4), a = s * L, w = (k % 4 === 1 || k % 4 === 2) ? 18 : -18;
        const px = x0 + dx * a + (dz ? w : 0), py = y0 + dz * a + (dx ? w : 0);
        k ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.stroke();
    }
  }
  // coupler traces (thin) between neighbours
  g.strokeStyle = '#a66a18'; g.lineWidth = 10;
  for (const cp of COUPLERS) { const a = QUBITS[cp.a], b = QUBITS[cp.b]; g.beginPath(); g.moveTo(X(a.x), Z(a.z)); g.lineTo(X(b.x), Z(b.z)); g.stroke(); }
  // xmon crosses under each qubit
  for (const q of QUBITS) {
    const x = X(q.x), y = Z(q.z), L = 92, w = 22;
    g.fillStyle = '#c98a26';

function paintPCB() {
  const W = 512, c = mkCanvas(W, W), g = c.getContext('2d');

  g.strokeStyle = '#d9a440'; g.lineWidth = 6;
  for (let k = 0; k < 9; k++) {
    const t = 112 + k * 36;
    for (const [x0, y0, x1, y1] of [[t, 8, t, 70], [t, W - 8, t, W - 70], [8, t, 70, t], [W - 8, t, W - 70, t]]) { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
  }
  g.fillStyle = '#d9a440'; for (const [x, y] of [[30, 30], [W - 30, 30], [30, W - 30], [W - 30, W - 30]]) { ellipse(g, x, y, 14, 14); g.fill(); }

}
function paintBench() {
  const W = 512, c = mkCanvas(W, W), g = c.getContext('2d');

  return c;
}
// dusk sky cyclorama: banded sunset, sunburst rays, the sun on the horizon, far palms (Canvas2D)
function paintBackdrop() {
  const W = 2048, H = 1152, c = mkCanvas(W, H), g = c.getContext('2d');
  const bands = ['#2f2470', '#3d2a7c', '#4b2f86', '#6f3a92', '#9a4392', '#c44f88', '#e5627a', '#f47f68', '#f9a05a', '#fcc161', '#fedd86'];
  const hz = H * 0.81;
  bands.forEach((b, i) => { g.fillStyle = b; g.fillRect(0, (hz / bands.length) * i, W, hz / bands.length + 1); });
  const sx = W * 0.47, sy = hz;
  // sunburst rays (alternating warm wedges)
  for (let k = 0; k < 40; k++) {
    const a0 = Math.PI + (k / 40) * Math.PI, a1 = a0 + Math.PI / 80;
    g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.cos(a0) * 2400, sy + Math.sin(a0) * 2400); g.lineTo(sx + Math.cos(a1) * 2400, sy + Math.sin(a1) * 2400); g.closePath();
    g.fillStyle = 'rgba(255,214,140,0.16)'; g.fill();
  }
  // halftone seams between bands
  for (let i = 1; i < bands.length; i++) {
    const y0 = (hz / bands.length) * i; g.fillStyle = bands[i - 1];
    for (let row = 0; row < 3; row++) for (let x = (row % 2) * 7; x < W; x += 14) { ellipse(g, x, y0 + row * 9 + 4, 4.6 - row * 1.3, 4.6 - row * 1.3); g.fill(); }
  }
  // the sun
  for (const [r, col] of [[120, '#ff9f45'], [100, '#ffc65a'], [74, '#ffe7a0']]) { g.beginPath(); g.arc(sx, sy, r, Math.PI, TAU); g.fillStyle = col; g.fill(); }
  // sea
  const gr = g.createLinearGradient(0, hz, 0, H); gr.addColorStop(0, '#6c6cb8'); gr.addColorStop(1, '#2a2e70');
  g.fillStyle = gr; g.fillRect(0, hz, W, H - hz);
  g.fillStyle = '#ffd890'; const r = rnd(5);
  for (let k = 0; k < 40; k++) { const y = hz + 6 + r() * 120, w = 20 + (y - hz) * 0.8; g.fillRect(sx + (r() - 0.5) * (60 + (y - hz) * 1.2) - w / 2, y, w, 5); }
  g.fillStyle = '#ffe6ad'; g.fillRect(0, hz - 2, W, 4);
  // far palms (silhouettes)
  const palmS = (x, h, s) => {
    g.strokeStyle = '#2b1d4c'; g.lineWidth = 9 * s; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, hz + 4); g.quadraticCurveTo(x - 18 * s, hz - h * 0.5, x + 10 * s, hz - h); g.stroke();
    g.fillStyle = '#2b1d4c';
    for (let k = 0; k < 7; k++) { const a = -Math.PI * (0.05 + 0.9 * k / 6); const L = 70 * s; g.beginPath(); g.moveTo(x + 10 * s, hz - h);
      g.quadraticCurveTo(x + 10 * s + Math.cos(a) * L * 0.6, hz - h + Math.sin(a) * L * 0.6 - 10 * s, x + 10 * s + Math.cos(a) * L, hz - h + Math.sin(a) * L * 0.3 + 26 * s);
      g.quadraticCurveTo(x + 10 * s + Math.cos(a) * L * 0.5, hz - h + Math.sin(a) * L * 0.4 + 4 * s, x + 10 * s, hz - h); g.fill(); }
  };
  palmS(W * 0.2, 230, 1.2); palmS(W * 0.27, 170, 0.9); palmS(W * 0.76, 250, 1.3); palmS(W * 0.83, 160, 0.8);
  return c;
}
function paintRibbon() {
  // gold paint along the stroke: bristle streaks run along u (the stroke length)
  const W = 1024, H = 128, c = mkCanvas(W, H), g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  const r = rnd(9);
  for (let k = 0; k < 26; k++) {
    const y = r() * H, w = 1.5 + r() * 4;
    g.strokeStyle = r() < 0.5 ? 'rgba(190,120,20,0.45)' : 'rgba(255,250,210,0.8)'; g.lineWidth = w;
    g.beginPath(); g.moveTo(r() * 60, y); for (let x = 0; x <= W; x += 64) g.lineTo(x, y + (r() - 0.5) * 3); g.stroke();
  }
  return c;
}

// =====================================================================================================

async function buildWorld(ctx, { THREE, renderer }) {
  const scene = new THREE.Scene();

  npr.setUnder(window.__pv.canvas);

  T = { THREE, scene, camera, npr };
  const add = (geo, mo, ao = {}, pos = [0, 0, 0], rot = [0, 0, 0], parent = scene) => {
    const m = npr.add(new THREE.Mesh(geo, Array.isArray(mo) ? mo.map((o) => npr.surface(o)) : npr.surface(mo)), ao);
    m.position.set(...pos); m.rotation.set(...rot); parent.add(m); return m;

  T.add = add;

  // ---------------- her comic panel (three cut-out planes) ----------------
  const [imPerson, imPalm, imSky, imPhoto] = await Promise.all(['comic_person', 'comic_palm', 'comic_sky', 'photo_full'].map((n) => loadImage(`/scene/assets/${n}.png`)));
  T.photo = imPhoto;
  const plane = (im, dz, cut, big = 1, flat = 1) => {

    const geo = new THREE.PlaneGeometry(s * big, s * big);
    if (big !== 1) { const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, (uv.getX(i) - 0.5) * big + 0.5, (uv.getY(i) - 0.5) * big + 0.5); }
    const tex = imgTex(THREE, im);

    return m;

  T.sky = plane(imSky, PZ.sky, 0, 9.0);

  T.backdrop = npr.backdrop(canvasTex(THREE, paintBackdrop()), { radius: 17, height: 24, y: -3.2, center: [0, 0, 0], arc: [Math.PI - 1.7, 4.2] });
  scene.add(T.backdrop);
  const benchTex = canvasTex(THREE, paintBench(), { wrap: true, repeat: [9, 6] });
  const bSide = { color: COL.benchSide, hatchDir: [0, 1, 0] };
  add(new THREE.BoxGeometry(22, 0.5, 14), [bSide, bSide, { color: COL.bench, map: benchTex, hatchDir: [1, 0, 0.3], noiseScale: 0.5, spec: 0 }, bSide, bSide, bSide],
    { outline: 1.0, cast: false }, [0, -0.25, 0]);
  const pcbTex = canvasTex(THREE, paintPCB());
  const pSide = { color: 0x1b2050 };
  add(new THREE.BoxGeometry(4.7, CHIP.y0, 4.7), [pSide, pSide, { color: 0xffffff, map: pcbTex, spec: 0 }, pSide, pSide, pSide], { outline: 0.8 }, [0, CHIP.y0 / 2, 0]);
  const chipTex = canvasTex(THREE, paintChip());
  const cSide = { color: 0xc98a26, hatchDir: [0, 1, 0], shadeColor: 0x7a4a18, shadeMix: 0.3 };
  T.chip = add(new THREE.BoxGeometry(CHIP.w, CHIP.h, CHIP.w), [cSide, cSide, { color: 0xffffff, map: chipTex, spec: 0.15, toneBias: 0.06, hatchDir: [1, 0, 0.2] }, cSide, cSide, cSide],

  add(new THREE.CylinderGeometry(0.36, 0.3, 0.7, 36), { color: 0xf5efe2, hatchMode: 'u' }, { outline: 1 }, [3.3, 0.35, -1.9]);

  T.qubits = QUBITS.map((q) => add(qGeo, { color: COL.cyan, glow: 0.25, rim: 0.9, spec: 1, toneBias: 0.1, receive: false, halftone: 0.6, spill: 0, seed: 5 + q.k },

function buildGremlins(THREE, add) {
  const bodyGeo = new THREE.SphereGeometry(G_BODY, 36, 24);
  const spikeGeo = new THREE.ConeGeometry(0.075, 0.24, 10); spikeGeo.translate(0, 0.12, 0);
  const footGeo = new THREE.SphereGeometry(0.085, 14, 10);
  const armGeo = new THREE.CapsuleGeometry(0.045, 0.14, 4, 8); armGeo.translate(0, -0.1, 0);
  // spike directions: a crown over the upper hemisphere, none on the face
  const dirs = [];
  for (let k = 0; k < 11; k++) {
    const a = (k / 11) * TAU + 0.3, elv = k % 2 ? 0.35 : 0.85;
    const d = [Math.cos(a) * Math.cos(elv), Math.sin(elv), Math.sin(a) * Math.cos(elv)];
    if (d[2] > 0.55 && elv < 0.5) continue;    // keep the face clear
    dirs.push(d);
  }
  dirs.push([0, 1, 0]);
  T.grems = GREM.map((G, i) => {
    const root = new THREE.Group(); T.scene.add(root);
    const squash = new THREE.Group(); root.add(squash);
    const body = add(bodyGeo, { color: 0xffffff, map: T.gremFace.angry[0], rim: 0.9, spec: 0.4, seed: 60 + i, hatchMode: 'v' }, { outline: 1.0 }, [0, G_BODY, 0], [0, 0, 0], squash);
    const spikes = dirs.map((d, k) => {
      const s = add(spikeGeo, { color: k % 3 ? 0xd8332f : 0xff8a3a, rim: 0.8, seed: 70 + i * 20 + k }, { outline: 0.8 }, [d[0] * G_BODY * 0.86, G_BODY + d[1] * G_BODY * 0.86, d[2] * G_BODY * 0.86], [0, 0, 0], squash);
      s.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(...d));
      s.userData.base = s.quaternion.clone(); s.userData.d = d;
      return s;
    });
    const feet = [-1, 1].map((sx) => { const f = add(footGeo, { color: 0x9e2228, rim: 0.5 }, { outline: 0.7 }, [sx * 0.13, 0.04, 0.08], [0, 0, 0], root); f.scale.set(1.2, 0.7, 1.4); return f; });
    const arms = [-1, 1].map((sx) => {
      const pv = new THREE.Group(); pv.position.set(sx * 0.27, G_BODY * 0.95, 0.04); squash.add(pv);
      add(armGeo, { color: 0xd8332f, rim: 0.6 }, { outline: 0.7 }, [0, 0, 0], [0, 0, 0], pv);
      add(new THREE.SphereGeometry(0.06, 12, 8), { color: 0x9e2228 }, { outline: 0.6 }, [0, -0.22, 0], [0, 0, 0], pv);
      return pv;
    });
    return { root, squash, body, spikes, feet, arms };
  });
}

// ---- the gold stroke: a flat ribbon of paint along STROKE_PTS, grown with drawRange ----
const RIB_N = 180, RIB_SEG = 10;
function ribbonWidth(s) { return 0.36 * (0.25 + 0.75 * Math.pow(Math.sin(Math.PI * clamp(s * 0.94 + 0.03)), 0.55)) * (1 + 0.08 * Math.sin(s * 37)); }
function buildRibbon(THREE, add) {
  const curve = new THREE.CatmullRomCurve3(STROKE_PTS.map((p) => new THREE.Vector3(...p)), false, 'centripetal');
  T.curve = curve;
  const pos = new Float32Array(RIB_N * RIB_SEG * 3), uv = new Float32Array(RIB_N * RIB_SEG * 2);
  const up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < RIB_N; i++) {
    const s = i / (RIB_N - 1);
    const p = curve.getPointAt(s), tg = curve.getTangentAt(s);
    let w = new THREE.Vector3().crossVectors(tg, up).normalize();
    const tw = 0.55 * Math.sin(TAU * s * 0.9 + 0.4);              // the ribbon twists as the brush turns
    w.applyAxisAngle(tg, tw);
    const n = new THREE.Vector3().crossVectors(w, tg).normalize();
    const hw = ribbonWidth(s), ht = 0.07;
    for (let j = 0; j < RIB_SEG; j++) {
      const a = (j / RIB_SEG) * TAU;
      const q = p.clone().addScaledVector(w, Math.cos(a) * hw).addScaledVector(n, Math.sin(a) * ht);
      const k = i * RIB_SEG + j;
      pos[k * 3] = q.x; pos[k * 3 + 1] = q.y; pos[k * 3 + 2] = q.z;
      uv[k * 2] = s; uv[k * 2 + 1] = j / RIB_SEG;
    }
  }
  const idx = [];
  for (let i = 0; i < RIB_N - 1; i++) for (let j = 0; j < RIB_SEG; j++) {
    const a = i * RIB_SEG + j, b = i * RIB_SEG + (j + 1) % RIB_SEG, c = a + RIB_SEG, d = b + RIB_SEG;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx);

// ---- chip: qubit noise, snap back, couplers lighting ----
function qubitState(k, F) {

    const q = QUBITS[G.q], h = K.hits ? K.hits[i] : 999;

    const s = qubitState(k, F), m = T.qubits[k], U = m.material.uniforms;
    const bs = Math.floor(F / 2);

    if (a >= 0) { col = new THREE.Color(COL.coupLit); glow = 0.35 + 0.4 * Math.exp(-a / 4); sc = 1 + 0.5 * Math.exp(-a / 3) * Math.cos(a * 0.8); }
    U.uAlbedo.value.set(col.r, col.g, col.b); U.uGlow.value = glow;

    return { lit, a };

}

// =====================================================================================================
// npr per frame
// =====================================================================================================
function drawNPR(ctx) {
  const { npr, camera } = T, F = ctx.iw, shot = st.shot;

  npr.setSmear(st.smear[0], st.smear[1]);

    const c = T.cat.root.visible ? T.cat.root.position : V(0, 0, PNL.z);
    npr.setLight({ dir: [-0.45, 0.75, 0.6], target: [c.x, c.y + 1, PNL.z + 0.5], size: 3.2, dist: 14 });
    npr.focusOn(camera, V(0, 1, PNL.z), 30);
    // crash zoom: concentration lines on her face
    const za = F - K.zoom[0];
    if (shot === 'P3' && za >= 0 && za < 9) {
      const c2 = ctx.project(V(0.12, 2.0, PNL.z), camera);
      npr.focusLines({ x: c2.x, y: c2.y, r0: 300, amount: 0.85 * (1 - za / 9), count: 110, width: 1.6, seed: 2 });
    }
  } else {
    npr.setLight({ dir: [-0.5, 0.82, 0.62], target: [0, 0.4, 0.2], size: 4.4, dist: 18 });
    npr.focusOn(camera, V(0, 0.5, 0), 40);
    // qubits glow: cyan halos (comic dots), red while noisy, a burst when they snap back clean
    st.q.forEach((s, k) => {
      const m = T.qubits[k];
      const c = s.noise > 0 ? s.col.getHex() : COL.cyan;
      const burst = s.snap >= 0 && s.snap < 8 ? 1 - s.snap / 8 : 0;
      npr.glowAt(ctx, camera, m.position.clone(), { radius: 0.34 * (1 + 0.4 * burst), i: s.noise > 0 ? 0.55 : 0.42 + 0.4 * burst, color: c, behind: true, rays: burst, rayLen: 0.6, rayCount: 10, seed: k });
    });
    // painted spill: red from the noisy qubits, gold from the stroke
    let pl = 0;
    st.q.forEach((s, k) => { if (s.noise > 0 && pl < 3) { npr.pointLight(T.qubits[k].position.clone().setY(QY + 0.25), { color: 0xff4a3a, radius: 0.9, i: 0.6 * s.noise }); pl++; } });
    if (T.ribbon.visible && st.strokeP > 0.02) npr.pointLight(st.catTip.clone(), { color: 0xffc93a, radius: 1.3, i: 0.55 });
    else if (F >= 128) npr.pointLight(V(0, 0.9, 0.2), { color: 0xffd96a, radius: 2.4, i: 0.45 });
    // brush tip glow while painting
    if (T.ribbon.visible && F < K.stroke[1]) npr.glowAt(ctx, camera, st.catTip.clone(), { radius: 0.22, i: 0.8, color: 0xffd23f, behind: false, seed: 30 });
    // SPLAT: concentration lines + one impact frame on the middle hit
    if (K.hits) {
      const h = Math.ceil(K.hits[1]), a = F - h;
      if (a >= 0 && a < 12) {
        const q = QUBITS[GREM[1].q], c = ctx.project(V(q.x, G_SIT + 0.2, q.z), camera);
        npr.focusLines({ x: c.x, y: c.y, r0: 250, amount: 0.9 * (1 - a / 12), count: 100, width: 1.6, seed: 9 });
        if (a === 0) npr.impact(0.85, { threshold: 0.5 });
      }
    }
    // the cat lands on the chip: lines + sparkle
    const la = F - K.land;
    if (la >= 0 && la < 8) { const c = ctx.project(V(0.05, CHIP_TOP + 0.5, 1.38), camera); npr.focusLines({ x: c.x, y: c.y, r0: 260, amount: 0.6 * (1 - la / 8), count: 90, width: 1.4, seed: 4 }); }
  }

}

// =====================================================================================================
// 2D ink overlay (Canvas2D, design px): speed lines, sparks, glints, splatter, sparkles, puffs

      g.fillStyle = PAL.gold; g.fill(b);
      g.save(); g.clip(b);
      for (let i = 0; i < 18; i++) { const yy = s.y - W2 / 2 + (i + 0.5) * W2 / 18, w = 3 + 6 * hsh(k, i, 4), x2 = hx + s.dir * (40 + 50 * hsh(k, i, 6)); g.strokeStyle = i % 3 ? PAL.goldD : PAL.goldL; g.lineWidth = w; g.beginPath(); g.moveTo(tail - s.dir * 20, yy + (tail - 480) * s.tilt); g.lineTo(x2, yy + (x2 - 480) * s.tilt); g.stroke(); }
      ellipse(g, hx + s.dir * 30, cy - W2 * 0.24, 46, 18, s.tilt - s.dir * 0.35); g.fillStyle = '#fff6c8'; g.fill();
      g.restore();
      // ink outline on the top edge, the round front and the bottom edge; the back stays open (wet bristles)
      const ol = new Path2D(), N4 = 20;
      for (let i = 0; i <= N4; i++) { const x = lerp(tail, hx, i / N4); i ? ol.lineTo(x, yAt(s, x, -1, k)) : ol.moveTo(x, yAt(s, x, -1, k)); }
      ol.ellipse(hx, cy, 150, W2 / 2 + 6, 0, -Math.PI / 2, Math.PI / 2, s.dir < 0);
      for (let i = N4; i >= 0; i--) ol.lineTo(lerp(tail, hx, i / N4), yAt(s, lerp(tail, hx, i / N4), 1, k));
      g.lineWidth = 9; g.strokeStyle = PAL.ink; g.stroke(ol);
    }
  }
}
