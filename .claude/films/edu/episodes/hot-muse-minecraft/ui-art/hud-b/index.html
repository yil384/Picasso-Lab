<script>
'use strict';
/* =====================================================================================================================
   Concept B: Speedrun broadcast. Canvas 2D only (fillText, rects, arcTo, drawImage, globalAlpha, linear gradients),
   so it ports to node-canvas. Motion is position + alpha of pre-rendered offscreen canvases.
   ?state=long|nowhy|fresh|rules   ?t=<s since the newest Muse command>   ?debug=1 (safe zones)   ?ab=1 (action-bar demo)
   ===================================================================================================================== */
window.HUD_READY = false;
const S = window.HUD_STATES;
const Q = new URLSearchParams(location.search);
const KEY = Q.get('state') || 'long';
const st = S[KEY];
const DEBUG = Q.get('debug') === '1';
const cv = document.getElementById('c');
const g = cv.getContext('2d');

/* ---------- tokens ---------- */
const C = {
  hud: '#0a0d12', bar: '#0f131b', plate: '#0b0e14', tile: '#161b26', track: '#262d3b', rim: 'rgba(255,255,255,0.10)',
  hair: 'rgba(255,255,255,0.08)',
  t1: '#f3f5f9', t2: '#c9d1df', soft: '#aeb6c6', raw: '#8d97ab', dim: '#6b7488',
  muse: '#b0a4ff', museType: '#b9adff', rule: '#ffb547', bot: '#a3acbb', ok: '#5fd09c', fail: '#ff8a7a', hint: '#6fd3c8',
  gold: '#ffd164', ink: '#0b0e14',
};
const ACTOR = { MUSE: C.muse, RULE: C.rule, BOT: C.bot, SRV: C.ok, HINT: C.hint, REFUSED: C.fail };
const UI = (w, s) => `${w} ${s}px MuseUI`;
const MONO = (w, s) => `${w} ${s}px MuseMono`;
const FPS = 30;

/* ---------- small maths ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const outQuint = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 5);
const inOut = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const mmss = (s) => { s = Math.max(0, Math.floor(s + 1e-6)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const durTxt = (s) => (s == null ? '' : s < 1 ? `${s.toFixed(1)} s` : s < 60 ? `${Math.round(s)} s` : mmss(s));
const parseClock = (s) => { const [m, x] = String(s).split(':').map(Number); return m * 60 + x; };
const cap1 = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);
const lc1 = (s) => (s ? s[0].toLowerCase() + s.slice(1) : s);

/* ---------- canvas primitives (all portable) ---------- */
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
function rr(x, y, w, h, r, ctx = g) { r = Math.min(r, h / 2, w / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function fillRR(x, y, w, h, r, c, ctx = g) { rr(x, y, w, h, r, ctx); ctx.fillStyle = c; ctx.fill(); }
function strokeRR(x, y, w, h, r, c, lw = 1, ctx = g) { rr(x + lw / 2, y + lw / 2, w - lw, h - lw, Math.max(0, r - lw / 2), ctx); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.stroke(); }
function rect(x, y, w, h, c, ctx = g) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function plate(x, y, w, h, r = 10, ctx = g, a = 0.88) { ctx.save(); ctx.globalAlpha *= a; fillRR(x, y, w, h, r, C.plate, ctx); ctx.restore(); strokeRR(x, y, w, h, r, C.rim, 1, ctx); }
function T(s, x, y, font, color, align = 'left', ctx = g) { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); return ctx.measureText(s).width; }
function W(s, font, ctx = g) { ctx.font = font; return ctx.measureText(s).width; }
// text with a 3 px dark stroke, for words straight on the video (floaters, action bar)
function TS(s, x, y, font, color, align = 'left', ctx = g, sw = 3) {
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round'; ctx.miterLimit = 2;
  ctx.lineWidth = sw * 2; ctx.strokeStyle = 'rgba(6,8,12,0.94)'; ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}
// spaced capitals (node-canvas has no letter-spacing): one glyph at a time, +0.1 em
function capsW(s, size, wt = 600, ctx = g) { ctx.font = UI(wt, size); let w = 0; for (const ch of s.toUpperCase()) w += ctx.measureText(ch).width + size * 0.1; return w - size * 0.1; }
function CAPS(s, x, y, size, color, wt = 600, ctx = g, align = 'left') {
  const w = capsW(s, size, wt, ctx); let cx = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  ctx.font = UI(wt, size); ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const ch of s.toUpperCase()) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + size * 0.1; }
  return w;
}
function icon(name, x, y, s, a = 1, ctx = g) { const im = IMG[name]; if (!im) return; ctx.save(); ctx.globalAlpha *= a; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(im, x, y, s, s); ctx.restore(); }
function tick(x, y, s, c, lw = 2.6, ctx = g) { ctx.beginPath(); ctx.moveTo(x, y + s * 0.55); ctx.lineTo(x + s * 0.36, y + s * 0.88); ctx.lineTo(x + s, y + s * 0.12); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
function xmark(x, y, s, c, lw = 2.6, ctx = g) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y); ctx.lineTo(x, y + s); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke(); }
function dot(cx, cy, r, c, hollow = false, ctx = g) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); if (hollow) { ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.stroke(); } else { ctx.fillStyle = c; ctx.fill(); } }
// actor chip: 14 px spaced caps on a solid actor colour (the only solid fills in the HUD)
function chip(code, x, y, w, h, color, solid = true, ctx = g, size = 14) {
  if (solid) fillRR(x, y, w, h, 4, color, ctx); else strokeRR(x, y, w, h, 4, color, 1.5, ctx);
  CAPS(code, x + w / 2, y + h / 2 + size * 0.36, size, solid ? C.ink : color, 700, ctx, 'center');
}
// cut at a word, add an ellipsis; never wider than maxW
function fit(s, maxW, font, ctx = g) {
  if (!s) return '';
  ctx.font = font; if (ctx.measureText(s).width <= maxW) return s;
  const words = s.split(' ');
  while (words.length > 1) { words.pop(); const t = words.join(' ').replace(/[\s,;:.\-]+$/, '') + '…'; if (ctx.measureText(t).width <= maxW) return t; }
  let t = s; while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1); return t + '…';
}

/* ---------- Muse's words: item names get their painted icon and gold ---------- */
const ITEM_WORDS = [
  ['diamond pickaxe', 'diamond_pickaxe'], ['iron pickaxe', 'iron_pickaxe'], ['stone pickaxe', 'stone_pickaxe'], ['wooden pickaxe', 'wooden_pickaxe'],
  ['water bucket', 'water_bucket'], ['flint and steel', 'flint_and_steel'], ['ender pearl', 'ender_pearl'], ['obsidian', 'obsidian'],
  ['diamonds', 'diamond'], ['diamond', 'diamond'], ['cobblestone', 'cobblestone'], ['bread', 'bread'], ['coal', 'coal'], ['logs', 'log'],
  ['iron', 'iron_ingot'], ['pickaxe', 'pickaxe'], ['shield', 'shield'], ['bucket', 'bucket'],
];
// -> tokens [{t, icon?}] (words with their following space kept)
function richTokens(s) {
  const out = []; const low = s.toLowerCase(); let i = 0, buf = '';
  const flush = () => { if (buf) { for (const w of buf.match(/\S+\s*|\s+/g)) out.push({ t: w }); buf = ''; } };
  while (i < s.length) {
    let hit = null;
    if (i === 0 || /[\s("'“]/.test(s[i - 1])) for (const [w, ic] of ITEM_WORDS) if (low.startsWith(w, i) && !/[a-z]/.test(low[i + w.length] || '')) { hit = [w, ic]; break; }
    if (hit) { flush(); let j = i + hit[0].length; let tail = ''; while (j < s.length && /[,.;:!?\s]/.test(s[j])) { tail += s[j]; j++; if (s[j - 1] === ' ') break; } out.push({ t: s.slice(i, i + hit[0].length), icon: hit[1], tail }); i = j; }
    else { buf += s[i]; i++; }
  }
  flush(); return out;
}
// wrap rich tokens into at most maxLines lines of width maxW; returns {lines, cut}
function richWrap(s, maxW, size, wt, maxLines, ctx = g, iconSize = null) {
  const font = UI(wt, size), isz = iconSize || Math.max(24, Math.round(size)), igap = iconSize ? 5 : 4;
  const tokW = (k) => (k.icon ? isz + igap + W(k.t + (k.tail || ''), font, ctx) : W(k.t, font, ctx));
  const toks = richTokens(s); const lines = [[]]; let lw = 0, cut = false;
  for (let i = 0; i < toks.length; i++) {
    const k = toks[i], w = tokW(k);
    if (lw + w > maxW && lines[lines.length - 1].length) {
      if (lines.length === maxLines) { cut = true; break; }
      lines.push([]); lw = 0; if (!k.icon && !k.t.trim()) continue;
    }
    lines[lines.length - 1].push(k); lw += w;
  }
  if (cut) { // ellipsis on the last line, cutting whole words until it fits
    const L = lines[lines.length - 1];
    const lineW = () => L.reduce((a, k) => a + tokW(k), 0) + W('…', font, ctx);
    while (L.length > 1 && lineW() > maxW) L.pop();
    const last = L[L.length - 1];
    if (last.icon) last.tail = (last.tail || '').replace(/[\s,;:.]+$/, '') + '…'; else last.t = last.t.replace(/[\s,;:.\-]+$/, '') + '…';
  }
  return { lines, cut, font, isz, igap, tokW };
}
function drawRich(R, x, y, lh, color, ctx = g, gold = C.gold) {
  R.lines.forEach((L, li) => {
    let cx = x; const by = y + li * lh;
    for (const k of L) {
      if (k.icon) {
        icon(k.icon, cx, by - R.isz * 0.8, R.isz, 1, ctx); cx += R.isz + R.igap;
        cx += T(k.t, cx, by, R.font, gold, 'left', ctx);
        if (k.tail) cx += T(k.tail, cx, by, R.font, color, 'left', ctx);
      } else cx += T(k.t, cx, by, R.font, color, 'left', ctx);
    }
  });
}

/* ---------- plain words for steps (Muse's args, said for viewers) ---------- */
const PRETTY = { oak_log: ['oak log', 'oak logs'], birch_log: ['birch log', 'birch logs'], oak_planks: ['oak plank', 'oak planks'], crafting_table: ['crafting table', 'crafting tables'],
  deepslate_diamond_ore: ['diamond ore', 'diamond ore'], cobbled_deepslate: ['cobbled deepslate', 'cobbled deepslate'], water_bucket: ['water bucket', 'water buckets'],
  raw_iron: ['raw iron', 'raw iron'], iron_ingot: ['iron ingot', 'iron ingots'], clay_ball: ['clay ball', 'clay balls'] };
const pretty = (id, n) => { const p = PRETTY[id]; if (p) return n === 1 ? p[0] : p[1]; return String(id).replace(/_/g, ' '); };
function policyRules(a) {
  const r = []; if (a.defend === 'on' || a.defend === true) r.push('defend'); if (a.escape === 'on' || a.escape === true) r.push('escape'); if (a.flee === 'on' || a.flee === true) r.push('flee');
  if (a.eat_below != null) r.push(`eat at food ${a.eat_below}`); return r;
}
function stepSay(sk) {
  const a = sk.args || {};
  switch (sk.skill) {
    case 'collect': return `Mine ${a.n} ${pretty(a.block, a.n)}`;
    case 'craft': return a.n === 1 ? `Craft a ${pretty(a.item, 1)}` : `Craft ${a.n} ${pretty(a.item, a.n)}`;
    case 'go_to': return `Walk to ${a.x} ${a.y} ${a.z}`;
    case 'bucket': return a.action === 'pour' ? `Pour ${a.liquid}` : `Fill a bucket with ${a.liquid}`;
    case 'eat': return 'Eat';
    case 'hunt': return `Hunt ${a.n} ${a.mob}${a.n === 1 ? '' : 's'}`;
    case 'policy': return `Set ${policyRules(a).length} rules`;
    case 'smelt': return `Smelt ${a.n} ${pretty(a.item, a.n)}`;
    case 'shelter': return 'Build a shelter';
    default: return cap1(String(sk.skill).replace(/_/g, ' '));
  }
}
function stepIcon(sk) {
  const a = sk.args || {};
  switch (sk.skill) {
    case 'collect': return { oak_log: 'log', birch_log: 'log', obsidian: 'obsidian', stone: 'cobblestone', cobblestone: 'cobblestone', deepslate_diamond_ore: 'diamond', diamond_ore: 'diamond', coal_ore: 'coal', iron_ore: 'raw_iron' }[a.block] || 'pickaxe';
    case 'craft': return IMG[a.item] ? a.item : 'hammer';
    case 'go_to': return 'boot';
    case 'bucket': return a.liquid === 'lava' ? 'lava_bucket' : 'water_bucket';
    case 'eat': return 'bread';
    case 'hunt': return 'sword';
    case 'policy': return 'shield';
    case 'smelt': return 'flame';
    case 'shelter': return 'house';
    default: return 'compass';
  }
}
function stepsOf(args) { try { const j = JSON.parse(args); if (j.steps) return j.steps; if (j.skill) return [{ skill: j.skill, args: j.args || {} }]; } catch (e) {} return []; }
// one action for the whole command: identical steps add up ("Hunt 10 pigs"), different steps show the first + "then N more"
function cmdAction(steps, long = true) {
  if (!steps.length) return '';
  if (steps.length === 1) return stepSay(steps[0]);
  const key = (s) => s.skill + JSON.stringify({ ...s.args, n: 0 });
  if (steps.every((s) => key(s) === key(steps[0])) && steps[0].args && steps[0].args.n != null) {
    return stepSay({ skill: steps[0].skill, args: { ...steps[0].args, n: steps.reduce((a, s) => a + (s.args.n || 0), 0) } });
  }
  if (!long) return stepSay(steps[0]);
  if (steps.length === 2) return `${stepSay(steps[0])}, then ${lc1(stepSay(steps[1]))}`;
  return `${stepSay(steps[0])}, then ${steps.length - 1} more`;
}
const COMMAND_TOOLS = new Set(['play', 'play_sequence', 'set_goal', 'start_game']);
const CALLOUT_TOOLS = new Set(['play', 'play_sequence', 'set_goal']);
function deltas(text) { // "+33 cobbled_deepslate, +10 tuff" from the server's bracket
  const m = String(text || '').match(/\[([^\]]*)\]\s*$/); if (!m) return null;
  const d = [...m[1].matchAll(/([+-]\d+) ([a-z_]+)/g)].map((x) => `${x[1]} ${pretty(x[2], Math.abs(+x[1]))}`);
  return d.length ? d.join(', ') : null;
}
// the server's answer, said short (result column); the full answer stays in RAW
function resultOf(e, steps) {
  const tx = e.answer && e.answer.text || '';
  if (e.tool === 'set_goal') { const m = tx.match(/it was: ([^;)]+)/); return m ? `was ${m[1]}` : 'goal set'; }
  if (e.tool === 'start_game') { const g2 = (tx.match(/Goal: ([^.]+)\./) || [])[1]; return g2 ? `${g2}, empty inventory` : 'new bot, empty inventory'; }
  if (steps.length === 1 && steps[0].skill === 'policy') return policyRules(steps[0].args).join(', ');
  const d = deltas(tx); if (d) return d;
  const ok = tx.match(/ok: ([^[]+)/); if (ok) return ok[1].replace(/\s+$/, '').replace(/ and picked up.*$/, '');
  return '';
}

/* ---------- the model: one pass over the state, all times from the game clock ---------- */
function buildModel() {
  const entries = st.raw.entries;
  const cmds = entries.filter((e) => CALLOUT_TOOLS.has(e.tool) && !/^Already received/.test(e.answer && e.answer.text || ''));
  const newest = cmds[0];
  const tQ = Q.get('t');
  const t = tQ != null ? +tQ : st.now.gameS - newest.sentS; // seconds since the newest Muse command
  const nowS = Math.round((newest.sentS + t) * 1000) / 1000;
  const M = { t, nowS, clock: mmss(nowS), calls: entries.filter((e) => e.sentS <= nowS + 1e-6).length };
  const s = st.stats;
  M.hp = s.hp; M.food = s.food;
  // time of day from the tick count: the server calls night from about tick 12300 (its own "night in N s" lines)
  const ticks = s.ticks != null ? s.ticks : 6000;
  if (ticks < 12300) { const sec = (12300 - ticks) / 20; M.phase = { icon: 'sun', words: sec < 60 ? `dusk in ${Math.round(sec)} s` : `dusk in ${Math.floor(sec / 60)} min`, warn: sec < 60 }; }
  else { const sec = (23000 - ticks) / 20; M.phase = { icon: 'moon', words: sec < 60 ? `dawn in ${Math.round(sec)} s` : `dawn in ${Math.floor(sec / 60)} min`, warn: false }; }
  // who did what: Muse's steps, its rules firing, the bot on its own (reflexes under the server's default rules)
  const share = s.museShare || {};
  if (share.muse != null) M.tally = { muse: share.muse, rule: share.reflex || 0, bot: share.bot || 0 };
  else {
    let muse = 0; for (const e of entries) if ((e.tool === 'play' || e.tool === 'play_sequence') && !/^Already received/.test(e.answer && e.answer.text || '')) muse += stepsOf(e.args).length;
    const bot = (st.events || []).filter((ev) => ev.who === 'body' && ['reflex', 'flee', 'body', 'interrupt'].includes(ev.kind)).length;
    M.tally = { muse, rule: 0, bot };
  }
  M.inv = st.inventory;

  /* the newest command and whose turn it is */
  const cc = st.currentCall && st.currentCall.sentS === newest.sentS ? st.currentCall : null;
  const nSteps = stepsOf(newest.args);
  const cmdNo = newest.playCallNo || newest.n;
  const ansAt = newest.answer && newest.answer.atS != null ? newest.answer.atS : (cc && cc.doneS != null ? newest.sentS + cc.doneS : null);

      if (done) tick(bx + 10, yB + 8, 13, C.ok, 2.2); else dot(bx + 17, yB + 14, 5, run ? C.muse : C.dim, !run);
      const lw = T(label, bx + 32, yB + 20, UI(600, 18), run || done ? C.t1 : C.soft);
      if (sub) T(sub, bx + 32 + lw + 10, yB + 20, subMono ? MONO(500, 16) : UI(500, 18), C.soft);
      bx += w + 8;
    }
    bx += 10;
  }
  if (M.next) {

    const lw = CAPS(lab, bx, yB + 19, 14, C.raw, 600);
    let nx = bx + lw + 10;
    const RN = richWrap(M.next.text, 1056 - nx, 18, 600, 1, g, 24);

  }

  if (M.why) {

    let wx = x;

    if (s.kind !== 'run' && M.whyIcon) { icon(M.whyIcon, x, LT.why1 - 20, 24); wx = x + 34; }
    const R = richWrap(`“${M.why}”`, 1056 - wx, 24, 500, 2);
    drawRich(R, wx === x ? wx - W('“', R.font) : wx, LT.why1, LT.lh, '#e6e9f1');
    g.restore();
  } else {
    T('No why was sent with this command.', x, LT.why1, UI(500, 18), C.raw);
    if (M.polls) T(`Since then Muse has checked the game ${M.polls.n} times, the last ${Math.round(M.polls.lastAgo)} s ago.`, x, LT.why1 + 26, UI(500, 18), C.raw);
  }
}
function drawGoal(M) {
  const G = L.goal, gl = M.goal, y = G.y;
  if (gl.kind === 'counted') {
    const p = gl.parts[0];
    icon(p.icon, 57, y + 2, 40);
    const tw0 = T(cap1(gl.title), 129, y + 31, UI(700, 24), C.t1);
    const bx0 = Math.max(330, 129 + tw0 + 32), bx1 = 900, n = p.of, gap = n > 20 ? 0 : 6, sw = (bx1 - bx0 - gap * (n - 1)) / n;
    for (let i = 0; i < n; i++) fillRR(bx0 + i * (sw + gap), y + 16, sw, 12, 3, i < p.done ? C.t2 : C.track);
    T(`${p.done}`, 1056 - W(`/${p.of}`, MONO(500, 30)), y + 33, MONO(500, 30), C.t1, 'right');
    T(`/${p.of}`, 1056, y + 33, MONO(500, 30), C.raw, 'right');
    // the goal it replaced, paused: its 12 splits as small icons
    const pv = gl.previous;
    if (pv && pv.list) {
      pv.list.forEach((m, i) => icon(m.icon, 129 + i * 30, y + 52, 24, m.state === 'done' ? 0.9 : 0.28));
      const done = pv.list.filter((m) => m.state === 'done').length;
      const tx = 129 + 12 * 30 + 10;
      const w1 = T(pv.title, tx, y + 71, UI(600, 18), C.soft);
      T(` ${done} / ${pv.list.length} · paused`, tx + w1, y + 71, MONO(400, 16), C.raw);
    }
    return;
  }
  // milestones as LiveSplit splits: done = full + tick + time, current = ringed + its count, next = 30 %
  const list = gl.list; const curI = list.findIndex((m) => m.state !== 'done');
  icon(gl.key === 'free' ? 'compass' : 'portal', 57, y + 6, 40);
  const CW = 50, CG = 4, X0 = 129;
  list.forEach((m, i) => {
    const cx = X0 + i * (CW + CG), done = m.state === 'done', cur = i === curI;
    if (cur) { fillRR(cx, y - 2, CW, 80, 8, 'rgba(176,164,255,0.10)'); strokeRR(cx, y - 2, CW, 80, 8, C.muse, 2); }
    icon(m.icon, cx + 5, y + 6, 40, done || cur ? 1 : 0.3);
    if (done) { fillRR(cx + 33, y + 34, 16, 16, 8, C.hud); tick(cx + 36, y + 38, 10, C.ok, 2.2); T(m.done, cx + CW / 2, y + 70, MONO(400, 16), C.soft, 'center'); }
    if (cur) {
      const lastSplit = Math.max(0, ...list.filter((q) => q.doneS != null).map((q) => q.doneS));
      T(m.progress || mmss(M.nowS - lastSplit), cx + CW / 2, y + 70, MONO(500, 16), C.t1, 'center');
    }
  });
  const done = list.filter((m) => m.state === 'done').length, rx = X0 + 12 * (CW + CG) + 16, rw = 1056 - rx;
  const nw = T(`${done}`, rx, y + 26, MONO(500, 30), C.t1);
  const sw = T(`/${list.length}`, rx + nw, y + 26, MONO(500, 30), C.raw);
  T(fit(gl.title, rw - nw - sw - 12, UI(600, 18)), 1056, y + 24, UI(600, 18), C.soft, 'right');
  const cur = list[curI], nxt = list.slice(curI + 1).find((m) => m.state !== 'done');
  if (cur) T(fit(cur.label, rw, UI(700, 24)), rx, y + 55, UI(700, 24), C.t1);
  if (nxt) { const lw = T('then ', rx, y + 78, UI(500, 18), C.raw); T(fit(nxt.label, rw - lw, UI(500, 18)), rx + lw, y + 78, UI(500, 18), C.soft); }
}
const FEED_ICON_X = 195;
function drawFeed(M, pend, t) {
  const F = L.feed;
  M.feed.forEach((r, i) => {
    const y = F.y + i * F.row, by = y + 20;
    if (r.isNewest && t < 0.6) { g.save(); g.globalAlpha = 0.25 * (1 - t / 0.6); rect(24, y, 1032, F.row, ACTOR[r.code]); g.restore(); }
    if (r.isNewest && pend.dockFlash != null && pend.dockFlash < 0.6) { g.save(); g.globalAlpha = 0.25 * (1 - pend.dockFlash / 0.6); rect(24, y, 1032, F.row, ACTOR[r.code]); g.restore(); }
    T(mmss(r.s), 113, by, MONO(400, 16), C.raw, 'right');
    chip(r.code, 129, y + 4, 56, 20, ACTOR[r.code]);
    if (r.isNewest && pend.feedIcon) { icon(r.icon, FEED_ICON_X, y + 2, 24, 0.3); g.save(); g.setLineDash([3, 3]); strokeRR(FEED_ICON_X - 2, y, 28, 28, 6, 'rgba(176,164,255,0.6)', 1.5); g.restore(); }
    else icon(r.icon, FEED_ICON_X, y + 2, 24);
    const durW = r.dur ? W(r.dur, MONO(400, 16)) : 0;
    const right = 960;
    const ax = FEED_ICON_X + 34;
    const aw = T(fit(r.action, 430, UI(600, 18)), ax, by, UI(600, 18), C.t1);
    if (r.result) T(fit(`→ ${r.result}`, right - (ax + aw + 12), UI(500, 18)), ax + aw + 12, by, UI(500, 18), C.soft);
    if (r.glyph === 'ok') tick(974, y + 8, 13, C.ok, 2.2);
    if (r.dur) T(r.dur, 1056, by, MONO(400, 16), C.raw, 'right');

}
function drawRaw(M) {
  const R = L.raw; rect(0, R.y - 6, 1080, 1080 - (R.y - 6), '#07090c'); rect(0, R.y - 6, 1080, 1, C.hair);
  const font = MONO(400, 16), cw = W('0', font), RX = 129, maxC = Math.floor((1056 - RX) / cw);
  let line = 0;
  for (const r of M.raw) {
    if (line >= R.n) break;
    const y = R.y + 15 + line * R.lh;
    T(r.time, 113, y, font, C.raw, 'right');
    const tw = T(r.tool, RX, y, font, C.t2);
    let rest = ' ' + r.rest; const first = Math.max(0, maxC - r.tool.length);
    // the newest call may take two lines
    if (line === 0 && rest.length > first && R.n > 2) {
      let cut = first; const head = rest.slice(0, first); const k = Math.max(head.lastIndexOf(','), head.lastIndexOf('} '), head.lastIndexOf(' ')); if (k > first * 0.6) cut = k + 1;
      T(rest.slice(0, cut), RX + tw, y, font, C.raw);
      let r2 = rest.slice(cut).replace(/^\s+/, ''); if (r2.length > maxC - 2) r2 = r2.slice(0, maxC - 3) + '…';
      T(r2, RX + cw * 2, y + R.lh, font, C.raw); line += 2;
    } else {
      if (rest.length > first) rest = rest.slice(0, first - 1) + '…';
      T(rest, RX + tw, y, font, C.raw); line += 1;
    }
  }
}

/* =====================================================================================================================
   MOMENTS: what the video shows at t
   ===================================================================================================================== */
function planVideo(M) {
  const V = { floaters: [], toast: null, banner: null, nowchip: null, actionbar: null };
  const t = M.t, cmd = M.cmd;
  const pend = { ltIcon: false, why: false, feedIcon: false, dockFlash: null };
  let toastBusyUntil = 0;
  if (cmd.tool !== 'set_goal') {
    const tk = buildToast(M, cmd, t); const tl = toastTimeline(tk);
    // dock target: the lower third's tile while the command runs, else its feed row
    const runningAtDock = cmd.running && (cmd.ansAt == null || cmd.ansAt > cmd.sentS + tl.dockEnd);
    let dock;
    if (runningAtDock) dock = { kind: 'lt', x: L.lt.tileX, y: L.lt.tileY };
    else { const ri = Math.max(0, M.feed.findIndex((r) => r.isNewest)); dock = { kind: 'feed', cx: FEED_ICON_X + 12, cy: L.feed.y + ri * L.feed.row + 14 }; }
    V.toast = { ...tk, tl, dock };
    toastBusyUntil = tl.dockEnd;
    if (t < tl.dockEnd) { if (runningAtDock) { pend.ltIcon = true; pend.why = true; } else pend.feedIcon = true; }
    else pend.dockFlash = t - tl.dockEnd;
    if (t >= tl.dockEnd && runningAtDock) pend.dockFlashLT = t - tl.dockEnd;
  }
  // banner: goal set (by a set_goal command, or a goal that changed with this command), only after the toast has gone
  const gl = st.goal;
  if (gl && gl.new && gl.newSinceS != null && gl.newSinceS <= M.nowS) {
    const start = Math.max(gl.newSinceS - cmd.sentS, toastBusyUntil);
    const age = t - start;
    if (age >= 0 && age < 5) {
      const p = gl.parts && gl.parts[0];
      const prev = gl.previous ? `${gl.previous.title} paused` : '';
      V.banner = { age, icon: p ? p.icon : 'star', type: 'New goal', typeColor: C.museType, color: 'rgba(176,164,255,0.9)', title: cap1(gl.title),
        sub: [p ? `${p.done} of ${p.of} so far` : '', `set at ${mmss(gl.newSinceS)}`, prev].filter(Boolean).join(' · ') };
    }
  }
  // floaters (step results at the bot's head; at the crosshair in first person / ceiling views)
  const toastUp = V.toast && t < V.toast.tl.dockEnd;
  const anchor = M.camera === 'third' ? { x: 480, y: 330 } : { x: toastUp ? 400 : 540, y: 300 };
  if (KEY === 'rules' && cmd.ansAt != null) V.floaters.push({ ...anchor, age: t - (cmd.ansAt - cmd.sentS), icon: 'shield', text: `${policyRules(cmd.steps[0].args).length} rules on` });
  if (KEY === 'nowhy') V.floaters.push({ ...anchor, age: 0.45, icon: 'obsidian', text: '+1 obsidian' });
  // now chip: shown when no callout or banner holds the top right
  const free = (!V.toast || t >= V.toast.tl.dockEnd) && !V.banner;
  if (free && M.status.kind === 'run') {
    const cur = M.status.cur || {};
    let text, count = '', p = null, ic = M.status.icon;
    if (cur.sub && cur.sub.of) { text = cap1(cur.sub.text); count = `${cur.sub.done}/${cur.sub.of}`; p = cur.sub.done / cur.sub.of; }
    else if (cur.skill === 'hunt' && gl && gl.kind === 'counted') { const gp = gl.parts[0]; text = `Hunting ${cur.args.mob}s`; count = `${gp.done}/${gp.of}`; p = gp.done / gp.of; }
    else text = cur.say || stepSay(cur);
    if (cur.icon) ic = cur.icon === 'pickaxe' && cur.args && cur.args.block === 'obsidian' ? 'obsidian' : ic;
    V.nowchip = { a: V.toast ? clamp((t - V.toast.tl.dockEnd) / 0.3, 0, 1) : 1, actor: 'MUSE', icon: ic, text, count, p };
  }
  if (Q.get('ab') === '1') {
    const ev = (st.events || []).find((e) => e.who === 'body' && e.kind === 'reflex') || (st.events || []).find((e) => e.who === 'body' && e.kind === 'flee');
    if (ev) V.actionbar = { age: 1.0, code: (st.stats.museShare || {}).reflex ? 'RULE' : 'BOT', text: ev.text };
  }
  M.video = V;
  return pend;
}

/* ---------- debug: the zones the design keeps clear ---------- */

  const z = (x0, y0, x1, y1, c) => { g.save(); g.strokeStyle = c; g.setLineDash([6, 4]); g.lineWidth = 2; g.strokeRect(x0, y0, x1 - x0, y1 - y0); g.restore(); };
  z(380, 330, 580, 608, '#ff4d4d'); z(18, 26, 85, 67, '#ff4d4d'); z(436, 97, 652, 126, '#ff4d4d'); z(700, 460, 950, 608, '#ffaa00');
  z(520, 128, 1064, 400, '#33dd77'); z(16, 488, 372, 536, '#33dd77');
}

/* ---------- main ---------- */
const IMG = {};
const ICONS = ['bed', 'boot', 'bread', 'bucket', 'bulb', 'coal', 'cobblestone', 'compass', 'depth', 'diamond_pickaxe', 'diamond', 'ender_pearl', 'flame', 'flint_and_steel', 'food', 'hammer', 'heart', 'house', 'iron_ingot', 'iron_pickaxe', 'lava_bucket', 'log', 'moon', 'obsidian', 'pickaxe', 'portal', 'raw_iron', 'shield', 'star', 'steak', 'stone_pickaxe', 'sun', 'sword', 'water_bucket', 'wooden_pickaxe'];
const load = (src) => new Promise((r) => { const im = new Image(); im.onload = () => r(im); im.onerror = () => { console.error('image failed', src); r(null); }; im.src = src; });
(async () => {
  await Promise.all(['500 24px MuseUI', '600 24px MuseUI', '700 24px MuseUI', '400 16px MuseMono', '500 16px MuseMono'].map((f) => document.fonts.load(f)));
  await Promise.all(ICONS.map(async (n) => { IMG[n] = await load(`${S._about.iconDir}/${n}.png`); }));
