<div class="ucsd-seal" style="padding-top:5px;padding-left:30px;">
  <a href="https://ucsd.edu/" target="_blank" rel="noopener"
     style="display:inline-block;line-height:0;text-decoration:none;">
    <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Seal_of_the_University_of_California,_San_Diego.svg?width=320"
         alt="UC San Diego" width="160" height="160"
         style="display:block;width:160px;height:160px;border:0;background:transparent;">
  </a>
</div>
<script>
/* Phones: Google Sites stacks the footer tiles in one column, so centre the seal in its tile
   to line up with the address card below it (which centres itself there too). */
if (Math.min(screen.width, screen.height) < 600) {
  document.querySelector('.ucsd-seal').style.cssText =
    'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;';
}
</script>
