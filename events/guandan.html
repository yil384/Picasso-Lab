// Storage can throw (blocked third-party storage in the Google Sites iframe, private modes);
// every access goes through these so the module never dies at top level.
function storageGet(key, fallback = null) {
    try {
        const value = localStorage.getItem(key);
        return value == null ? fallback : value;
    } catch (_) {
        return fallback;
    }
}
function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (_) {}
}

const reducedMotionQuery = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
function prefersReducedMotion() {
    return !!reducedMotionQuery?.matches;
}

let uiLang = storageGet("picasso.guandan.lang") === "en" ? "en" : "zh";
let returnBuffer = "";
let returnHintTimer = null;
let returnNavigationStarted = false;
let returnKeyboardPrimed = false;
const dealAnimation = {
    key: "",
    phase: "done",
    completed: new Set(),
    timers: []
};
let clientId = storageGet("picasso.guandan.client");
if (!clientId) {
    clientId = "c_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    storageSet("picasso.guandan.client", clientId);
}
let nickname = storageGet("picasso.guandan.name", "");

function isZH() {
    return uiLang === "zh";
}

function L(en, zh) {
    return isZH() ? zh : en;
}

function teamName(index) {
    return teamNames[uiLang]?.[index] || teamNames.en[index] || `Team ${index + 1}`;
}

function teamLevelDisplay(team, g = game) {
    const level = g?.levels?.[team] || "2";
    const failures = level === "A" ? Number(g?.aceFailures?.[team] || 0) : 0;
    return failures ? `${level} ${failures}/${ACE_FAIL_LIMIT}` : level;
}

function botName(index) {
    return botNames[uiLang]?.[index] || botNames.en[index] || `AI ${index + 1}`;
}

function clientSeatIn(g, id = clientId) {
    return normalizeGame(g)?.seats.findIndex(s => s && s.clientId === id) ?? -1;
}

function clientIsHost(g, id = clientId) {
    const idx = clientSeatIn(g, id);
    return idx >= 0 && !!g.seats[idx]?.host;
}

function ensureHost(g) {
    if (g.seats.some(s => s?.host)) return;
    const idx = g.seats.findIndex(s => s?.type === "human") >= 0
        ? g.seats.findIndex(s => s?.type === "human")
        : g.seats.findIndex(Boolean);
    if (idx >= 0) g.seats[idx].host = true;
}

function displaySeatName(seat, fallback = "") {
    if (!seat) return fallback;
    if (seat.type === "ai") {
        const knownNames = [...botNames.en, ...botNames.zh, ...legacyBotNames];
        const found = knownNames.indexOf(seat.name);
        const idx = Number.isInteger(seat.botIndex) ? seat.botIndex : found >= 0 ? found % 4 : -1;
        if (idx >= 0 && botNames[uiLang]?.[idx]) return botNames[uiLang][idx];
        return displayNameText(seat.name);
    }
    return seat.name || fallback;
}

function phaseLabel(phase) {
    const labels = {
        lobby: ["Lobby", "等待开局"],
        playing: ["Playing", "进行中"],
        roundOver: ["Round over", "本局结束"],
        gameOver: ["Game over", "比赛结束"],
        loading: ["Loading", "加载中"]
    };
    const label = labels[phase] || labels.loading;
    return isZH() ? label[1] : label[0];
}

// Topbar buttons are short text labels (no stroke icons); only rewritten when the language flips.
let staticLabelsLang = "";
function setHudButton(btn, label, title) {
    btn.textContent = label;
    btn.title = title;
    btn.setAttribute("aria-label", title);
}

function setStaticLabels() {
    if (staticLabelsLang === uiLang) return;
    staticLabelsLang = uiLang;
    document.documentElement.lang = isZH() ? "zh-CN" : "en";
    setHudButton(copyLinkBtn, L("Invite", "邀请"), L("Copy Room Link", "复制房间链接"));

    setHudButton(langToggleBtn, isZH() ? "EN" : "中", isZH() ? "Switch to English" : "切换到中文");
    setHudButton(backEventsBtn, L("Exit", "返回"), L("Back to Events", "返回活动"));
}

function updateTopbarStatus() {
    if (!hudStatusEl) return;
    if (!game || !game.roomCode) { hudStatusEl.innerHTML = ""; return; }
    hudStatusEl.innerHTML = `<span class="hud-status-room">${L("Room", "房间")} ${encodeHTML(game.roomCode)}</span>
        <span class="hud-status-seats">${[0,1,2,3].map(i => {
            const s = game.seats && game.seats[i];
            const cls = !s ? "empty" : s.type === "ai" ? "ai" : "human";
            return `<i class="hud-seat-dot ${cls}"></i>`;
        }).join("")}</span>`;
}

function showToast(text, duration = 1700) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("show"), duration);
}

function showReturnTypeHint() {
    if (!returnTypeHint) return;
    returnTypeHint.firstChild.nodeValue = L("try typing ", "试试输入 ");
    returnTypeHint.classList.add("show");
    clearTimeout(returnHintTimer);
    returnHintTimer = setTimeout(() => returnTypeHint?.classList.remove("show"), 2600);
}

function hideReturnTypeHint() {
    clearTimeout(returnHintTimer);
    returnTypeHint?.classList.remove("show");
}

function returnShardsHTML() {
    const PL = (window.GuandanRecords && window.GuandanRecords.PLAYERS) || {};
    const roster = ["yufei","yue","zhengding","chang","hezi","keyi","xiang","jixuan","zaifeng","zhongkai","zhuo","yichen","xinwei","alon","chenyang","haotian"].filter(k => PL[k] && PL[k].avatar);
    const spread = [
        { dx: -156, dy: -94, rot: -40 }, { dx: 148, dy: -104, rot: 38 },
        { dx: -188, dy: 20, rot: -24 }, { dx: 178, dy: 30, rot: 26 },
        { dx: -150, dy: 116, rot: -16 }, { dx: 150, dy: 122, rot: 18 },
        { dx: -70, dy: 158, rot: -8 }, { dx: 78, dy: 162, rot: 10 },
        { dx: -210, dy: -40, rot: -52 }, { dx: 200, dy: -48, rot: 50 },
        { dx: -100, dy: -140, rot: -30 }, { dx: 96, dy: -134, rot: 32 },
        { dx: -240, dy: 80, rot: -62 }, { dx: 230, dy: 88, rot: 58 },
        { dx: -30, dy: 190, rot: -5 }, { dx: 36, dy: 194, rot: 6 }
    ];
    const isRed = (s) => s === "♥" || s === "♦";
    if (!roster.length) return "";
    return roster.slice(0, 16).map((k, i) => {
        const p = PL[k];
        const sp = spread[i % spread.length];
        const card = p.card || "A♥";
        const r = card.slice(0, -1);
        const s = card.slice(-1);
        return `<span class="rvx-shard ${isRed(s) ? "red" : ""}" style="--dx:${sp.dx}px;--dy:${sp.dy}px;--rot:${sp.rot}deg;--delay:${(0.5 + i * 0.028).toFixed(3)}s"><span class="rvx-shard-photo" style="background-image:url('${p.avatar}')"></span><span class="rvx-shard-cn">${r}<small>${s}</small></span></span>`;
    }).join("");
}

function returnCardsHTML() {
    // A small fanned hand of cards: starts stacked face-down (gold "P" emblem back),
    // fans open on its own tilt, flips to reveal a suit face, then scatters off-screen.
    const cards = [
        { suit: "♠", color: "black", fan: -30, sx: -46, sy: -14, fly: -58, dx: -220, dy: -110, delay: 0.30 },
        { suit: "♥", color: "red",   fan: -14, sx: -24, sy: -30, fly: -28, dx: -104, dy: -186, delay: 0.35 },

        { suit: "♠", color: "black", fan: 30,  sx: 46,  sy: -14, fly: 58,  dx: 220,  dy: -110, delay: 0.50 }
    ];
    return cards.map(c => `<span class="rvx-card" style="--fan-rot:${c.fan}deg;--spread-x:${c.sx}px;--spread-y:${c.sy}px;--fly-rot:${c.fly}deg;--dx:${c.dx}px;--dy:${c.dy}px;--delay:${c.delay}s"><span class="rvx-card-inner"><span class="rvx-face back"><span class="rvx-emblem">P</span></span><span class="rvx-face front ${c.color}">${c.suit}</span></span></span>`).join("");
}

function returnCoinsHTML() {

        { dx: -128, dy: -96, rot: 210 }, { dx: 122, dy: -102, rot: -190 },

function startReturnToEvents() {
    if (returnNavigationStarted) return;
    returnNavigationStarted = true;
    hideReturnTypeHint();
    if (!returnTransition) {
        location.href = `${EVENTS_URL}?from=guandan`;
        return;
    }
    returnTransition.innerHTML = `
        <div class="rvx-stage" aria-hidden="true">
            <div class="rvx-title">${L("TABLE CLEARED", "牌局结束")}<small>&middot; ${L("VICTORY", "完胜")} &middot;</small></div>

            <div class="rvx-burst">
                ${returnCardsHTML()}
                ${returnShardsHTML()}
                ${returnCoinsHTML()}
            </div>
        </div>`;
    returnTransition.setAttribute("aria-hidden", "false");
    requestAnimationFrame(() => returnTransition.classList.add("active"));
    setTimeout(() => { location.href = `${EVENTS_URL}?from=guandan`; }, 1640);
}

function primeReturnKeyboardCapture() {
    if (!document.body) return;
    if (document.activeElement?.closest?.("input, textarea, [contenteditable='true']")) return;
    if (!document.body.hasAttribute("tabindex")) document.body.tabIndex = -1;
    try {
        document.body.focus({ preventScroll: true });
        returnKeyboardPrimed = true;
    } catch (_) {}
}

    return engineCardText(card, lang);
}

function comboName(combo, lang = uiLang) {
    return engineComboName(combo, lang);

function translateAction(action, entry = {}) {
    if (isZH()) return action || "";
    if (entry.actionType === "pass" || action === "不要") return "Pass";
    if (entry.actionType === "finish") return `Finished #${entry.place || ""}`.trim();
    if (entry.combo) return comboName(entry.combo, "en");
    const bomb = String(action || "").match(/^(\d+) 张炸弹$/);
    if (bomb) return `${bomb[1]}-card Bomb`;

        "天王炸": "Joker Bomb",
        "单张": "Single",
        "对子": "Pair",
        "三张": "Triple",
        "三带二": "Full House",
        "顺子": "Straight",
        "同花顺": "Straight Flush",
        "三连对": "Three Consecutive Pairs",

function displayNameText(name) {
    const teamIndex = [...teamNames.en, ...teamNames.zh, ...legacyTeamNames].indexOf(name);
    if (teamIndex >= 0) return teamNames[uiLang][teamIndex % 2];
    const botIndex = [...botNames.en, ...botNames.zh, ...legacyBotNames].indexOf(name);
    if (botIndex >= 0) return botNames[uiLang][botIndex % 4];
    return name;
}

function localizeStoredNames(text) {
    let out = String(text || "");
    for (let i = 0; i < teamNames.en.length; i++) {
        out = out.replaceAll(teamNames.en[i], teamNames[uiLang][i]).replaceAll(teamNames.zh[i], teamNames[uiLang][i]);
    }
    for (let i = 0; i < legacyTeamNames.length; i++) {
        out = out.replaceAll(legacyTeamNames[i], teamNames[uiLang][i % 2]);
    }
    for (let i = 0; i < botNames.en.length; i++) {
        out = out.replaceAll(botNames.en[i], botNames[uiLang][i]).replaceAll(botNames.zh[i], botNames[uiLang][i]);
    }
    for (let i = 0; i < legacyBotNames.length; i++) {
        out = out.replaceAll(legacyBotNames[i], botNames[uiLang][i % 4]);
    }
    return out;
}

function displayCardTextFromMessage(text) {
    if (isZH()) return text;
    return String(text || "").replaceAll("大王", "Red Joker").replaceAll("小王", "Black Joker");
}

function displayMessage(message) {
    const text = localizeStoredNames(message);
    if (isZH() || !text) return text;
    let m;
    if (text === "等待队友入座。") return "Waiting for players to take seats.";
    if (text === "座位已清空。") return "Seat cleared.";
    if (text === "抗贡成功，头游先出牌。") return "Tribute blocked. The first-place player leads.";
    if (text === "本轮收牌。") return "Trick collected.";
    if ((m = text.match(/^(.+) 入座。$/))) return `${displayNameText(m[1])} took a seat.`;
    if ((m = text.match(/^(.+) 加入对局。$/))) return `${displayNameText(m[1])} joined the table.`;
    if ((m = text.match(/^(.+) 从 (.+) 开始打。$/))) return `${displayNameText(m[1])} starts from ${m[2]}.`;
    if ((m = text.match(/^第 (\d+) 局开始，打 (.+)。$/))) return `Round ${m[1]} started. Level rank: ${m[2]}.`;
    if ((m = text.match(/^第 (\d+) 局 · (.+)$/))) return `Round ${m[1]} · ${m[2].split("；").map(displayMessage).join("; ")}`;
    if ((m = text.match(/^双贡：(.+) 进贡 (.+) 给 (.+)，(.+) 还贡 (.+)$/))) return `Double tribute: ${displayNameText(m[1])} tributes ${displayCardTextFromMessage(m[2])} to ${displayNameText(m[3])}; ${displayNameText(m[4])} returns ${displayCardTextFromMessage(m[5])}.`;
    if ((m = text.match(/^双贡：(.+) 进贡 (.+) 给 (.+)$/))) return `Double tribute: ${displayNameText(m[1])} tributes ${displayCardTextFromMessage(m[2])} to ${displayNameText(m[3])}.`;
    if ((m = text.match(/^(.+) 进贡 (.+) 给 (.+)，(.+) 还贡 (.+)$/))) return `${displayNameText(m[1])} tributes ${displayCardTextFromMessage(m[2])} to ${displayNameText(m[3])}; ${displayNameText(m[4])} returns ${displayCardTextFromMessage(m[5])}.`;
    if ((m = text.match(/^(.+) 进贡 (.+) 给 (.+)，还贡 (.+)$/))) return `${displayNameText(m[1])} tributes ${displayCardTextFromMessage(m[2])} to ${displayNameText(m[3])}; ${displayNameText(m[3])} returns ${displayCardTextFromMessage(m[4])}.`;
    if ((m = text.match(/^(.+) 进贡 (.+) 给 (.+)$/))) return `${displayNameText(m[1])} tributes ${displayCardTextFromMessage(m[2])} to ${displayNameText(m[3])}.`;
    if ((m = text.match(/^(.+) 出了 (.+)。$/))) return `${displayNameText(m[1])} played ${translateAction(m[2])}.`;
    if ((m = text.match(/^(.+) 收牌，继续出。$/))) return `${displayNameText(m[1])} takes the trick and leads again.`;
    if ((m = text.match(/^(.+) 接风给队友 (.+)。$/))) return `${displayNameText(m[1])} passes catch-wind to partner ${displayNameText(m[2])}.`;
    if ((m = text.match(/^(.+) 超时不要。$/))) return `${displayNameText(m[1])} timed out and passed.`;
    if ((m = text.match(/^(.+) 超时自动出 (.+)。$/))) return `${displayNameText(m[1])} timed out and auto-played ${displayCardTextFromMessage(m[2])}.`;
    if ((m = text.match(/^(.+) 不要。$/))) return `${displayNameText(m[1])} passes.`;
    if ((m = text.match(/^(.+) 冲 A 成功，赢得比赛。$/))) return `${displayNameText(m[1])} cleared A and won the match.`;
    if ((m = text.match(/^(.+) 冲 A 第 (\d+) 次失败，退回打 2。$/))) return `${displayNameText(m[1])} failed the A challenge ${m[2]} times and resets to level 2.`;
    if ((m = text.match(/^(.+) 冲 A 失败，第 (\d+)\/(\d+) 次；下局继续打 A。$/))) return `${displayNameText(m[1])} failed the A challenge (${m[2]}/${m[3]}). They keep playing A next round.`;
    if ((m = text.match(/^(.+) (.+) 完成排名，升 (\d+) 级。$/))) return `${displayNameText(m[1])} completed the round order and advanced ${m[3]} level${m[3] === "1" ? "" : "s"}.`;
    return text;
}

// Suit glyphs are inline SVG <use> refs into the #gd-suit-* sprite in the shell, so every
// card renders instantly (no image decode) and suit shapes never depend on the font.
function suitSvgHTML(suit, className) {
    const key = String(suit || "").toLowerCase();
    if (!suitName[suit]) return "";
    return `<svg class="${className}" aria-hidden="true" focusable="false"><use href="#gd-suit-${key}"/></svg>`;
}

// Lab face cards: map every J/Q/K/A (rank+suit) to a labmate. Each player's
// signature card (from the records board) is honored first; the remaining face
// slots are filled round-robin so all labmates appear and no face card is bare.
let _facePortraitMap = null;
function facePortraitMap() {
    if (_facePortraitMap) return _facePortraitMap;
    const PL = (window.GuandanRecords && window.GuandanRecords.PLAYERS) || {};
    // All 16 PICASSO Lab members get a face card (A♠→J♣); external opponents (zihan, yilin) are excluded.
    const keys = ["yufei","yue","zhengding","chang","hezi","keyi","xiang","jixuan","zaifeng","zhongkai","zhuo","yichen","xinwei","alon","chenyang","haotian"].filter(k => PL[k] && PL[k].avatar);
    if (!keys.length) return {};            // board data not loaded yet → no portraits this pass
    const sig = {};
    keys.forEach(k => { if (PL[k].card) sig[PL[k].card] = k; });
    const FACE_RANKS = ["A", "K", "Q", "J"];
    const SUITS = ["S", "H", "C", "D"];
    const map = {};
    const leftover = [];
    FACE_RANKS.forEach(r => SUITS.forEach(s => {
        const str = r + (suitGlyph[s] || "");
        if (sig[str]) map[r + s] = sig[str];
        else leftover.push(r + s);
    }));
    let i = 0;
    leftover.forEach(slot => { map[slot] = keys[i % keys.length]; i++; });
    _facePortraitMap = map;
    return map;
}
function faceCardPortrait(card) {
    if (!card || card.joker || card.back) return null;
    if (!["A", "K", "Q", "J"].includes(card.rank)) return null;
    const PL = (window.GuandanRecords && window.GuandanRecords.PLAYERS) || {};
    const key = facePortraitMap()[card.rank + card.suit];
    const p = key && PL[key];
    if (!p || !p.avatar) return null;
    return { avatar: p.avatar, name: (p.name || "").split(" ")[0] };
}

// Card body (below the index): jokers get the JOKER word + figure, J/Q/K/A the labmate
// portrait (initials if the photo fails) plus a smaller pip, number cards one big pip.
function cardBodyHTML(card, portrait) {
    if (card.joker) {
        return `<span class="gd-joker-word" aria-hidden="true">JOKER</span><span class="gd-joker-art">${jokerIconHTML(card)}</span>`;
    }

}

// Markup contract: div.card[data-card-id] (+ .selected .small .back .red/.black .wild,
// .level-card, .has-portrait, .joker-card) plus the caller's extra classes/attributes.
// Sizing comes from container CSS vars (see the card section of guandan-ui.css).
function cardHTML(card, small = false, selectable = false, extraAttrs = "", extraClass = "", overlayHTML = "") {
    if (!card) return "";
    if (card.back) {
        return `<div class="${["card back", small ? "small" : "", extraClass].filter(Boolean).join(" ")}" ${extraAttrs} aria-hidden="true"><span class="gd-back-emblem">P</span></div>`;
    }
    const levelRank = game?.currentLevelRank || "";
    const wild = !!levelRank && isWild(card, levelRank);
    const isLevel = !card.joker && !!levelRank && card.rank === levelRank;
    const portrait = faceCardPortrait(card);
    const classes = [
        "card",
        small ? "small" : "",
        cardColor(card) ? "red" : "black",
        card.joker ? `joker-card ${card.joker === "RJ" ? "red-joker" : "black-joker"}` : "",
        portrait ? "has-portrait" : "",
        isLevel ? "level-card" : "",
        wild ? "wild" : "",
        selectable && selected.has(card.id) ? "selected" : "",
        extraClass
    ].filter(Boolean).join(" ");
    let title = wild ? L(`Wild Card ${cardText(card)}`, `逢人配 ${cardText(card)}`) : cardText(card);
    if (portrait?.name) title += ` · ${portrait.name}`;
    const attrs = [selectable ? `data-card-id="${encodeHTML(card.id)}"` : "", extraAttrs].filter(Boolean).join(" ");
    const index = card.joker
        ? ""
        : `<span class="gd-ix" aria-hidden="true"><b class="gd-rank${card.rank === "10" ? " is-10" : ""}">${rankLabel(card.rank)}</b>${suitSvgHTML(card.suit, "gd-suit")}</span>`;
    return `<div class="${classes}" ${attrs} title="${encodeHTML(title)}" aria-label="${encodeHTML(title)}">${index}${cardBodyHTML(card, portrait)}${isLevel ? `<span class="gd-ji" aria-hidden="true">${L("LV", "级")}</span>` : ""}${wild ? `<span class="gd-wild-tag" aria-hidden="true">${L("WILD", "逢人配")}</span>` : ""}${overlayHTML}</div>`;
}

function initials(name, fallback = "P") {
    const clean = String(name || "").trim();
    if (!clean) return fallback;
    const parts = clean.split(/\s+/).filter(Boolean);
    if (parts.length > 1) return parts.slice(0, 2).map(p => p[0]).join("").toUpperCase();
    return clean.slice(0, 2).toUpperCase();
}

// Avatar rank-tier ring: bronze (2-4) / silver (5-8) / gold (9-J) / diamond (Q-A).
function levelTier(lv) {
    const n = rankBase(lv || "2");
    return n <= 4 ? "bronze" : n <= 8 ? "silver" : n <= 11 ? "gold" : "diamond";
}

// Reuse the same labmate photo pool already wired for card-face portraits
// (facePortraitMap/faceCardPortrait) so a seat's live avatar shows a real
// photo when the seat's display name matches a Picasso Lab member; no new
// photo asset map needed. Falls back to null (→ initials) otherwise.
function seatMemberPhoto(name) {
    const clean = String(name || "").trim().toLowerCase();
    if (!clean) return null;
    const PL = (window.GuandanRecords && window.GuandanRecords.PLAYERS) || {};
    for (const key in PL) {
        const p = PL[key];
        if (!p || !p.avatar) continue;
        const pname = String(p.name || "").trim().toLowerCase();
        if (!pname) continue;
        if (clean === pname || clean.includes(pname) || pname.includes(clean)) return p.avatar;
    }
    return null;
}

function sortHandForDisplay(cards, levelRank) {
    return [...cards].sort((a, b) => {
        const pa = a.joker ? jokerPower(a) : rankPower(a.rank, levelRank);
        const pb = b.joker ? jokerPower(b) : rankPower(b.rank, levelRank);
        if (pa !== pb) return pa - pb;
        const sa = suits.indexOf(a.suit || "S");
        const sb = suits.indexOf(b.suit || "S");
        return sa - sb || a.id.localeCompare(b.id);
    });
}

function handOrderKey(seat, g = game) {
    return `${roomCode || g?.roomCode || ""}:${g?.roundNo || 0}:${g?.dealStartedAt || 0}:${seat}`;
}

function orderedHandForDisplay(cards, levelRank, seat) {
    const sorted = sortHandForDisplay(cards, levelRank);
    const key = handOrderKey(seat);
    const sortedIds = sorted.map(c => c.id);
    if (handOrderState.key !== key) {
        handOrderState = { key, ids: sortedIds };
        return sorted;
    }
    const liveIds = new Set(sortedIds);
    const nextIds = handOrderState.ids.filter(id => liveIds.has(id));
    const seen = new Set(nextIds);
    for (const card of sorted) {
        if (!seen.has(card.id)) nextIds.push(card.id);
    }
    handOrderState.ids = nextIds;
    const byId = new Map(cards.map(c => [c.id, c]));
    return nextIds.map(id => byId.get(id)).filter(Boolean);
}

function moveHandCard(dragId, targetId, before) {
    if (!dragId || !targetId || dragId === targetId) return false;
    const seat = mySeat();
    if (seat < 0) return false;
    orderedHandForDisplay(game.hands[seat] || [], game.currentLevelRank, seat);
    const ids = handOrderState.ids.filter(id => id !== dragId);
    const targetIndex = ids.indexOf(targetId);
    if (targetIndex < 0) return false;
    ids.splice(targetIndex + (before ? 0 : 1), 0, dragId);
    handOrderState.ids = ids;
    suppressNextCardClick = true;
    renderTable();
    return true;
}

function makeDeck() {
    const deck = [];
    for (let copy = 0; copy < 2; copy++) {
        for (const suit of suits) {
            for (const rank of ranks) deck.push({ id: `${copy}${suit}${rank}`, suit, rank });
        }
        deck.push({ id: `${copy}BJ`, joker: "BJ" });
        deck.push({ id: `${copy}RJ`, joker: "RJ" });
    }
    return shuffle(deck);
}

function shuffle(arr) {
    const a = [...arr];
    const randomIndex = (maxExclusive) => {
        if (globalThis.crypto?.getRandomValues && maxExclusive > 0) {
            const limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
            const buf = new Uint32Array(1);
            do globalThis.crypto.getRandomValues(buf);
            while (buf[0] >= limit);
            return buf[0] % maxExclusive;
        }
        return Math.floor(Math.random() * maxExclusive);
    };
    for (let i = a.length - 1; i > 0; i--) {
        const j = randomIndex(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function setCurrentTurn(g, seat) {
    g.currentTurn = seat;
    g.turnStartedAt = Date.now();
}

function addHistory(g, entry) {
    g.history = [...valuesFromFirebase(g.history), entry].slice(-16);
}

function finishIfPartnershipDone(g, lastSeat = null) {
    const order = finishedList(g);
    if (order.length < 2) return false;
    const first = order[0];
    const partner = partnerOf(first);
    if (!order.includes(partner)) return false;
    const remaining = [0,1,2,3].filter(i => !order.includes(i));
    if (lastSeat != null) {
        const orderedRemaining = [];
        let cursor = lastSeat;
        while (orderedRemaining.length < remaining.length) {
            cursor = nextSeat(cursor, { ...g, finished: [...order, ...orderedRemaining] });
            if (cursor == null || orderedRemaining.includes(cursor)) break;
            if (remaining.includes(cursor)) orderedRemaining.push(cursor);
        }
        for (const i of remaining) if (!orderedRemaining.includes(i)) orderedRemaining.push(i);
        g.finished.push(...orderedRemaining);
    } else {
        g.finished.push(...remaining);
    }
    finishRound(g);
    return true;
}

function cardsByIdFromHand(g, seat, ids) {
    const wanted = new Set(ids);
    if (wanted.size !== ids.length) return null;
    const cards = (g.hands[seat] || []).filter(c => wanted.has(c.id));
    return cards.length === wanted.size ? cards : null;
}

function canSeatAct(g, seat) {
    return g.phase === "playing" && !dealWindowOpen(g) && g.currentTurn === seat && !!g.seats[seat] && !finishedList(g).includes(seat);
}

async function withAction(fn) {
    if (actionBusy) return false;
    actionBusy = true;
    root.classList.add("action-busy");
    try {
        return await fn();
    } finally {
        actionBusy = false;
        root.classList.remove("action-busy");
        render();
    }
}

function commitAction(fn, options = {}) {
    return options.silent ? mutateGame(fn) : withAction(() => mutateGame(fn));
}

function createRoomCode() {
    const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    for (let i = 0; i < 5; i++) code += alphabet[Math.floor(Math.random() * alphabet.length)];
    return code;
}

function defaultGame(code, hostName) {
    const seats = [null, null, null, null];
    seats[0] = { clientId, name: hostName || "Host", type: "human", team: 0, ready: true, host: true };
    return {

        createdAt: Date.now(),
        updatedAt: Date.now(),

        levels: ["2", "2"],
        aceFailures: [0, 0],
        currentLevelRank: "2",
        roundNo: 0,
        leaderTeam: 0,
        hands: { 0: [], 1: [], 2: [], 3: [] },
        currentTurn: 0,
        turnStartedAt: Date.now(),
        roundStartedAt: 0,
        dealStartedAt: 0,
        lastPlay: null,
        passCount: 0,
        finished: [],

async function createRoom() {
    const name = (document.getElementById("nick-input")?.value.trim() || nickname || "Lab Player").slice(0, 24);
    nickname = name;
    storageSet("picasso.guandan.name", name);
    const code = createRoomCode();
    const g = defaultGame(code, name);
    await set(roomRef(code), g);
    history.replaceState(null, "", `?room=${code}`);
    attachRoom(code);
    showToast(L("Room created", "房间已创建"));
}

async function joinRoom() {
    const code = (document.getElementById("room-input")?.value || roomCode).trim().toUpperCase();
    const name = (document.getElementById("nick-input")?.value.trim() || nickname || "Lab Player").slice(0, 24);
    if (!code) return showToast(L("Enter a room code", "请输入房间码"));
    nickname = name;
    storageSet("picasso.guandan.name", name);
    const snap = await get(roomRef(code));
    if (!snap.exists()) {
        statusText = L("Room not found. You can create a new one.", "没找到这个房间，可以新建一个。");
        render();
        return;
    }
    roomCode = code;
    history.replaceState(null, "", `?room=${code}`);
    attachRoom(code);
}

function attachRoom(code) {
    roomCode = code;
    if (unsubscribe) unsubscribe();
    unsubscribe = onValue(roomRef(code), (snap) => {
        game = normalizeGame(snap.val());
        selected.clear();
        hintAdvisor = null;
        syncDealAnimation();
        render();
        maybeRunAI();
        scheduleTurnClock();
        maybePrefetchHint();
    });
}

async function mutateGame(fn) {
    if (!roomCode) return null;
    try {
        const result = await runTransaction(roomRef(), current => {
            if (!current) return undefined;
            const next = normalizeGame(JSON.parse(JSON.stringify(current)));
            const outcome = fn(next);
            if (outcome === false) return undefined;
            next.updatedAt = Date.now();
            next.revision = (Number(next.revision) || 0) + 1;
            return next;
        }, { applyLocally: false });
        return result.committed ? normalizeGame(result.snapshot.val()) : null;
    } catch (err) {
        console.error(err);
        showToast(L("Sync failed. Please retry.", "同步失败，请重试。"));
        return null;
    }
}

function mySeat(g = game) {
    if (!g) return -1;
    return clientSeatIn(g);
}

function isHost(g = game) {
    if (!g) return false;
    return clientIsHost(g);
}

function clearDealTimers() {
    dealAnimation.timers.forEach(t => clearTimeout(t));
    dealAnimation.timers = [];
}

function dealKey(g = game) {
    if (!g || g.phase !== "playing" || !Number.isFinite(g.dealStartedAt) || !g.dealStartedAt) return "";
    return `${g.roomCode || roomCode}:${g.roundNo || 0}:${g.dealStartedAt}`;
}

function setDealPhase(phase) {
    if (dealAnimation.phase === phase) return;
    dealAnimation.phase = phase;
    render();
}

function finishDealAnimation(key = dealAnimation.key) {
    clearDealTimers();
    if (key) dealAnimation.completed.add(key);
    if (dealAnimation.key === key) dealAnimation.phase = "done";
    render();
    maybeRunAI();
    scheduleTurnClock();
    maybePrefetchHint();
}

function syncDealAnimation(g = game) {
    const key = dealKey(g);
    if (!key || dealAnimation.completed.has(key)) {
        if (!key) {
            clearDealTimers();
            dealAnimation.key = "";
            dealAnimation.phase = "done";
        }
        return;
    }
    const elapsed = Math.max(0, Date.now() - Number(g.dealStartedAt || 0));
    const total = DEALING_MS + SORTING_MS;
    if (elapsed >= total) {
        finishDealAnimation(key);
        return;
    }
    if (dealAnimation.key !== key) {
        clearDealTimers();
        dealAnimation.key = key;
    } else {
        clearDealTimers();
    }
    dealAnimation.phase = elapsed < DEALING_MS ? "dealing" : "sorting";
    if (elapsed < DEALING_MS) {
        dealAnimation.timers.push(setTimeout(() => setDealPhase("sorting"), DEALING_MS - elapsed));
    }
    dealAnimation.timers.push(setTimeout(() => finishDealAnimation(key), total - elapsed));
}

function currentDealPhase(g = game) {
    const key = dealKey(g);
    if (!key || dealAnimation.completed.has(key) || dealAnimation.key !== key) return "done";
    return dealAnimation.phase;
}

function dealBusy(g = game) {
    const phase = currentDealPhase(g);
    return phase === "dealing" || phase === "sorting";
}

function dealWindowOpen(g = game) {
    return !!g && g.phase === "playing" && Number(g.dealStartedAt) > 0 && Date.now() < Number(g.dealStartedAt) + DEALING_MS + SORTING_MS;
}

function clearTurnTimers() {
    clearTimeout(turnDeadlineTimer);
    clearTimeout(turnRenderTimer);
    turnDeadlineTimer = null;
    turnRenderTimer = null;
}

function isOpeningLead(g = game) {
    return !!g && g.phase === "playing" && !g.lastPlay && valuesFromFirebase(g.history).length === 0;
}

function turnLimitApplies(g = game) {
    if (!g || g.phase !== "playing" || dealWindowOpen(g)) return false;
    if (isOpeningLead(g)) return false;
    if (!g.seats?.[g.currentTurn] || finishedList(g).includes(g.currentTurn)) return false;
    return true;
}

function turnRemainingMs(g = game) {
    if (!turnLimitApplies(g)) return null;
    const started = Number(g.turnStartedAt) || Date.now();
    return Math.max(0, TURN_LIMIT_MS - (Date.now() - started));
}

function formatClock(ms) {
    const safe = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(safe / 60);
    const s = String(safe % 60).padStart(2, "0");
    return `${m}:${s}`;
}

function scheduleTurnClock() {
    clearTurnTimers();
    if (!game || !turnLimitApplies(game)) return;
    const remaining = turnRemainingMs(game);
    if (remaining == null) return;
    if (remaining <= 0) {
        handleTurnTimeout();
        return;
    }
    turnDeadlineTimer = setTimeout(handleTurnTimeout, remaining + 80);
    updateTurnClockDOM();
    turnRenderTimer = setTimeout(scheduleTurnClock, Math.min(1000, remaining + 80));
}

function updateTurnClockDOM() {
    const el = document.getElementById("turn-clock");
    if (!el || !game) return;
    const remaining = turnRemainingMs(game);
    el.textContent = remaining == null ? (isOpeningLead(game) ? L("No limit", "不限时") : "--") : formatClock(remaining);
    el.classList.toggle("warn", remaining != null && remaining <= 60000 && remaining > 30000);
    el.classList.toggle("danger", remaining != null && remaining <= 30000);
    // Keep the current-turn seat's avatar turn-ring in sync with the same
    // numeric clock tick (reuses turnRemainingMs + the identical warn/danger
    // thresholds above) so the ring animates in real time between full renders.
    const ring = document.querySelector(".player.turn .turn-ring");
    if (ring) {
        const frac = remaining == null ? 0 : Math.max(0, Math.min(1, remaining / TURN_LIMIT_MS));
        const fill = ring.querySelector(".turn-ring-fill");
        if (fill) fill.style.strokeDashoffset = String((1 - frac) * 163.4);
        ring.classList.toggle("warn", remaining != null && remaining <= 60000 && remaining > 30000);
        ring.classList.toggle("danger", remaining != null && remaining <= 30000);
    }
}

async function takeSeat(index) {
    const name = (document.getElementById("nick-input")?.value.trim() || nickname || "Lab Player").slice(0, 24);
    nickname = name;
    storageSet("picasso.guandan.name", name);
    const updated = await withAction(() => mutateGame(g => {
        if (g.phase !== "lobby") return false;
        const occupiedByOther = g.seats[index] && g.seats[index].clientId !== clientId;
        if (occupiedByOther) return false;
        const existing = clientSeatIn(g);
        const wasHost = existing >= 0 && !!g.seats[existing]?.host;
        if (existing >= 0) g.seats[existing] = null;
        const needsHost = !g.seats.some(s => s?.host);
        g.seats[index] = { clientId, name, type: "human", team: index % 2, ready: true, host: wasHost || needsHost };
        ensureHost(g);
        g.message = `${name} 入座。`;
    }));
    if (!updated) showToast(L("Seat changed before you. Try another seat.", "座位刚被占了，请换一个。"));
}

async function leaveSeat(index) {
    const updated = await withAction(() => mutateGame(g => {
        if (g.phase !== "lobby") return false;
        if (g.seats[index]?.clientId === clientId || clientIsHost(g)) {
            g.seats[index] = null;
            ensureHost(g);
            g.message = "座位已清空。";
            return true;
        }
        return false;
    }));
    if (!updated) showToast(L("Cannot leave that seat now.", "现在不能离开这个座位。"));
}

function makeAISeat(index) {
    return {
        clientId: `ai_${index}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        name: botNames.zh[index] || `AI ${index + 1}`,
        botIndex: index,
        type: "ai",
        team: index % 2,
        ready: true,
        host: false
    };
}

async function addAI(index) {
    if (!isHost()) return showToast(L("Only the host can add AI", "只有房主能补 AI"));
    const updated = await withAction(() => mutateGame(g => {
        if (g.phase !== "lobby" || !clientIsHost(g) || g.seats[index]) return false;
        g.seats[index] = makeAISeat(index);
        g.message = `${g.seats[index].name} 加入对局。`;
    }));
    if (!updated) showToast(L("That seat is no longer open.", "这个座位已经不是空位了。"));
}

async function fillAISeats() {
    if (!isHost()) return showToast(L("Only the host can add AI", "只有房主能补 AI"));
    const updated = await withAction(() => mutateGame(g => {
        if (g.phase !== "lobby" || !clientIsHost(g)) return false;
        let filled = 0;
        for (let i = 0; i < 4; i++) {
            if (!g.seats[i]) {
                g.seats[i] = makeAISeat(i);
                filled++;
            }
        }
        if (!filled) return false;
        g.message = `${filled} AI 加入对局。`;
    }));
    if (!updated) showToast(L("No open AI seats to fill.", "没有空位需要补 AI。"));
}

async function startGame() {
    if (!isHost()) return showToast(L("Only the host can start", "只有房主能开始"));
    const updated = await withAction(() => mutateGame(g => {
        if (g.phase !== "lobby" || !clientIsHost(g)) return false;
        for (let i = 0; i < 4; i++) if (!g.seats[i]) g.seats[i] = makeAISeat(i);
        ensureHost(g);
        startRound(g, null);
    }));
    if (!updated) showToast(L("The table changed. Please retry.", "牌桌状态变了，请重试。"));
}

function startRound(g, previousResult) {
    const deck = makeDeck();
    const now = Date.now();
    g.roundNo = (g.roundNo || 0) + 1;
    g.roundStartedAt = now;
    g.dealStartedAt = now;
    g.currentLevelRank = g.levels[g.leaderTeam || 0] || "2";
    g.hands = { 0: [], 1: [], 2: [], 3: [] };
    deck.forEach((card, idx) => g.hands[idx % 4].push(card));
    for (let i = 0; i < 4; i++) g.hands[i] = sortCards(g.hands[i], g.currentLevelRank);
    g.finished = [];
    g.lastPlay = null;
    g.passCount = 0;
    g.history = [];
    g.trickPlays = [null, null, null, null];
    g.phase = "playing";
    g.startingCard = null;
    g.publicJokerSeats = [];
    if (!previousResult) {
        // First game: randomly pick a non-joker card as public starting marker
        const allNonJokers = [0, 1, 2, 3].flatMap(s =>
            (g.hands[s] || []).filter(c => !c.joker).map(c => ({ card: c, seat: s }))
        );
        const pick = allNonJokers.length
            ? allNonJokers[Math.floor(Math.random() * allNonJokers.length)]
            : null;
        if (pick) {
            g.startingCard = { rank: pick.card.rank, suit: pick.card.suit };
            setCurrentTurn(g, pick.seat);
        } else {
            setCurrentTurn(g, activeSeatIds(g)[0] ?? 0);
        }
    } else {
        setCurrentTurn(g, previousResult.nextStarter ?? 0);
    }
    if (!g.seats[g.currentTurn]) setCurrentTurn(g, activeSeatIds(g)[0] ?? 0);
    const tributeRows = previousResult ? applyTribute(g, previousResult) : [];
    g.selectedTributes = tributeRows;
    if (tributeRows.length) {
        g.message = `第 ${g.roundNo} 局 · ${tributeRows.map(x => x.text).join("；")}`;
    } else if (g.startingCard) {
        g.message = `第 ${g.roundNo} 局开始，打 ${g.currentLevelRank}。起始牌：${g.startingCard.suit}${g.startingCard.rank}`;
    } else {
        g.message = `第 ${g.roundNo} 局开始，打 ${g.currentLevelRank}。`;
    }
}

function highestTributeCard(hand, levelRank) {
    const candidates = hand.filter(c => !(isWild(c, levelRank)));
    const sorted = sortCards(candidates, levelRank);
    return sorted[0] || sortCards(hand, levelRank)[0];
}

function lowestReturnCard(hand, levelRank, excluded = new Set()) {
    const available = hand.filter(c => !excluded.has(c.id));
    const counts = countRanks(available.filter(c => !c.joker && !isWild(c, levelRank)));
    const candidates = available.filter(c => {
        if (c.joker || isWild(c, levelRank)) return false;
        if (rankPower(c.rank, levelRank) > 10) return false;
        if ((counts[c.rank] || 0) >= 4) return false;
        return true;
    });
    const sorted = sortCards(candidates.length ? candidates : available, levelRank);
    return sorted[sorted.length - 1];
}

function moveCardBetween(g, from, to, card) {
    g.hands[from] = g.hands[from].filter(c => c.id !== card.id);
    g.hands[to].push(card);
    g.hands[to] = sortCards(g.hands[to], g.currentLevelRank);
}

function tributePower(card, levelRank) {
    return card?.joker ? jokerPower(card) : rankPower(card?.rank, levelRank);
}

function clockwiseDistanceFrom(from, to, g = game) {
    const active = activeSeatIds(g);
    let cursor = from;
    for (let step = 1; step <= 4; step++) {
        cursor = (cursor + 1) % 4;
        if (!active.includes(cursor)) continue;
        if (cursor === to) return step;
    }
    return 99;
}

function applyTribute(g, result) {
    const rows = [];
    const levelRank = g.currentLevelRank;
    const payers = (result.tributePayers || []).filter(p => Number.isInteger(p) && g.hands[p]?.length);
    const redJokerCount = payers.reduce((n, p) => n + g.hands[p].filter(c => c.joker === "RJ").length, 0);
    if (payers.length && redJokerCount >= 2) {
        // 抗贡：big jokers become public information
        g.publicJokerSeats = payers.filter(p => g.hands[p].some(c => c.joker === "RJ"));
        setCurrentTurn(g, result.first);
        rows.push({ text: "抗贡成功，头游先出牌。" });
        return rows;
    }
    g.publicJokerSeats = [];
    const entries = payers.map(payer => ({
        payer,
        tribute: highestTributeCard(g.hands[payer], levelRank)
    })).filter(entry => entry.tribute);
    if (entries.length === 2) {
        entries.sort((a, b) => {
            const diff = tributePower(b.tribute, levelRank) - tributePower(a.tribute, levelRank);
            if (diff) return diff;
            return clockwiseDistanceFrom(result.first, a.payer, g) - clockwiseDistanceFrom(result.first, b.payer, g);
        });
    }
    const receivers = entries.length === 2 ? [result.first, partnerOf(result.first)] : [result.first];
    // Starter = the tribute payer who received the highest returned card
    let starter = result.first;
    let maxRetPower = -1;
    for (const [idx, entry] of entries.entries()) {
        const payer = entry.payer;
        const receiver = receivers[idx] ?? result.first;
        const tribute = entry.tribute;
        if (!tribute) continue;
        moveCardBetween(g, payer, receiver, tribute);
        const ret = lowestReturnCard(g.hands[receiver], levelRank, new Set([tribute.id]));
        if (ret) {
            moveCardBetween(g, receiver, payer, ret);
            const retPower = tributePower(ret, levelRank);
            if (retPower > maxRetPower) { maxRetPower = retPower; starter = payer; }
        } else if (maxRetPower < 0) {
            starter = payer;
        }
        rows.push({
            text: `${entries.length === 2 ? "双贡：" : ""}${g.seats[payer].name} 进贡 ${cardText(tribute, "zh")} 给 ${g.seats[receiver].name}${ret ? `，${g.seats[receiver].name} 还贡 ${cardText(ret, "zh")}` : ""}`,
            payerSeat: payer,
            receiverSeat: receiver,
            tributeCard: tribute,
            returnCard: ret || null
        });
    }
    setCurrentTurn(g, starter);
    return rows;
}

async function playSelected() {
    const seat = mySeat();
    if (seat !== game.currentTurn) return showToast(L("Not your turn yet", "还没轮到你"));
    const hand = game.hands[seat] || [];
    const cards = hand.filter(c => selected.has(c.id));
    if (!cards.length) return showToast(L("Select cards to play", "请选择要出的牌"));
    const lastCombo = game.lastPlay?.combo || null;
    const combo = choosePlayable(cards, lastCombo, game.currentLevelRank);
    if (!combo) return showToast(L("Invalid combo or not strong enough", "这手牌型不合法或压不过上家"));
    const ok = await playCards(seat, cards);
    if (ok) {
        selected.clear();
        hintAdvisor = null;
    }
}

async function playCards(seat, cards, options = {}) {
    const ids = cards.map(c => c.id);
    const updated = await commitAction(g => {
        if (!canSeatAct(g, seat)) return false;
        if (!Array.isArray(g.finished)) g.finished = [];
        if (!Array.isArray(g.history)) g.history = [];
        if (!Array.isArray(g.trickPlays)) g.trickPlays = [null, null, null, null];
        const currentCards = cardsByIdFromHand(g, seat, ids);
        if (!currentCards?.length) return false;
        const combo = choosePlayable(currentCards, g.lastPlay?.combo || null, g.currentLevelRank);
        if (!combo) return false;
        if (!g.lastPlay) g.trickPlays = [null, null, null, null];
        const idSet = new Set(ids);
        g.hands[seat] = g.hands[seat].filter(c => !idSet.has(c.id));
        // Remove played public jokers from the public reveal list
        if ((g.publicJokerSeats || []).includes(seat) && currentCards.some(c => c.joker === "RJ")) {
            if (!g.hands[seat].some(c => c.joker === "RJ")) {
                g.publicJokerSeats = (g.publicJokerSeats || []).filter(s => s !== seat);
            }
        }
        g.lastPlay = { player: seat, cards: currentCards, combo };
        g.trickPlays[seat] = { player: seat, action: comboName(combo, "zh"), actionType: "combo", combo, cards: currentCards, at: Date.now() };
        g.passCount = 0;
        addHistory(g, { player: seat, action: comboName(combo, "zh"), actionType: "combo", combo, cards: currentCards, at: Date.now() });
        if (g.hands[seat].length === 0 && !g.finished.includes(seat)) {
            g.finished.push(seat);
            addHistory(g, { player: seat, action: `第 ${g.finished.length} 名出完`, actionType: "finish", place: g.finished.length, cards: [], at: Date.now() });
        }
        if (finishIfPartnershipDone(g, seat)) return;
        if (g.finished.length >= 3) {
            const last = [0,1,2,3].find(i => !g.finished.includes(i));
            if (last != null) g.finished.push(last);
            finishRound(g);
            return;
        }
        setCurrentTurn(g, nextSeat(seat, g));
        g.message = `${g.seats[seat].name} 出了 ${comboName(combo, "zh")}。`;
    }, options);
    if (!updated && !options.silent) showToast(L("Move expired. Check the table and retry.", "牌局已经变化，请看牌桌后重试。"));
    return !!updated;
}

async function passTurn() {
    const seat = mySeat();
    if (seat !== game.currentTurn) return showToast(L("Not your turn yet", "还没轮到你"));
    if (!game.lastPlay) return showToast(L("You cannot pass when leading a new trick", "新一轮不能不要"));
    hintAdvisor = null;
    await doPass(seat);
}

async function doPass(seat, options = {}) {
    const updated = await commitAction(g => {
        if (!canSeatAct(g, seat) || !g.lastPlay) return false;
        if (!Array.isArray(g.finished)) g.finished = [];
        if (!Array.isArray(g.history)) g.history = [];
        if (!Array.isArray(g.trickPlays)) g.trickPlays = [null, null, null, null];
        g.passCount = (g.passCount || 0) + 1;
        g.trickPlays[seat] = { player: seat, action: "不要", actionType: "pass", cards: [], at: Date.now() };
        addHistory(g, { player: seat, action: "不要", actionType: "pass", cards: [], at: Date.now() });
        if (g.passCount >= requiredPassesForTrick(g)) {
            const winner = g.lastPlay.player;
            const partner = partnerOf(winner);
            g.lastPlay = null;
            g.passCount = 0;
            if (!g.finished.includes(winner)) {
                setCurrentTurn(g, winner);
                g.message = `${g.seats[winner].name} 收牌，继续出。`;
            } else if (!g.finished.includes(partner)) {
                setCurrentTurn(g, partner);
                g.message = `${g.seats[winner].name} 接风给队友 ${g.seats[partner].name}。`;
            } else {
                setCurrentTurn(g, nextSeat(winner, g));
                g.message = "本轮收牌。";
            }
        } else {
            setCurrentTurn(g, nextSeat(seat, g));
            g.message = `${g.seats[seat].name} 不要。`;
        }
    }, options);
    if (!updated && !options.silent) showToast(L("Pass expired. Check the table and retry.", "牌局已经变化，请看牌桌后重试。"));
    return !!updated;
}

async function handleTurnTimeout() {
    if (!game || !turnLimitApplies(game)) return;
    const seat = game.currentTurn;
    const started = Number(game.turnStartedAt) || 0;
    await mutateGame(g => {
        if (!turnLimitApplies(g) || g.currentTurn !== seat || Number(g.turnStartedAt || 0) !== started) return false;
        if (!Array.isArray(g.finished)) g.finished = [];
        if (!Array.isArray(g.history)) g.history = [];
        if (!Array.isArray(g.trickPlays)) g.trickPlays = [null, null, null, null];
        const seatName = g.seats[seat]?.name || `Seat ${seat + 1}`;
        if (g.lastPlay) {
            g.passCount = (g.passCount || 0) + 1;
            g.trickPlays[seat] = { player: seat, action: "不要", actionType: "pass", cards: [], timedOut: true, at: Date.now() };
            addHistory(g, { player: seat, action: "不要", actionType: "pass", cards: [], timedOut: true, at: Date.now() });
            if (g.passCount >= requiredPassesForTrick(g)) {
                const winner = g.lastPlay.player;
                const partner = partnerOf(winner);
                g.lastPlay = null;
                g.passCount = 0;
                if (!g.finished.includes(winner)) {
                    setCurrentTurn(g, winner);
                    g.message = `${g.seats[winner].name} 收牌，继续出。`;
                } else if (!g.finished.includes(partner)) {
                    setCurrentTurn(g, partner);
                    g.message = `${g.seats[winner].name} 接风给队友 ${g.seats[partner].name}。`;
                } else {
                    setCurrentTurn(g, nextSeat(winner, g));
                    g.message = "本轮收牌。";
                }
            } else {
                setCurrentTurn(g, nextSeat(seat, g));
                g.message = `${seatName} 超时不要。`;
            }
            return true;
        }
        const sortedHand = sortCards(g.hands[seat] || [], g.currentLevelRank);
        const card = sortedHand[sortedHand.length - 1];
        if (!card) return false;
        const combo = choosePlayable([card], null, g.currentLevelRank);
        if (!combo) return false;
        g.hands[seat] = g.hands[seat].filter(c => c.id !== card.id);
        g.lastPlay = { player: seat, cards: [card], combo };
        g.trickPlays = [null, null, null, null];
        g.trickPlays[seat] = { player: seat, action: comboName(combo, "zh"), actionType: "combo", combo, cards: [card], timedOut: true, at: Date.now() };
        g.passCount = 0;
        addHistory(g, { player: seat, action: comboName(combo, "zh"), actionType: "combo", combo, cards: [card], timedOut: true, at: Date.now() });
        if (g.hands[seat].length === 0 && !g.finished.includes(seat)) {
            g.finished.push(seat);
            addHistory(g, { player: seat, action: `第 ${g.finished.length} 名出完`, actionType: "finish", place: g.finished.length, cards: [], at: Date.now() });
        }
        if (finishIfPartnershipDone(g, seat)) return true;
        if (g.finished.length >= 3) {
            const last = [0,1,2,3].find(i => !g.finished.includes(i));
            if (last != null) g.finished.push(last);
            finishRound(g);
            return true;
        }
        setCurrentTurn(g, nextSeat(seat, g));
        g.message = `${seatName} 超时自动出 ${cardText(card, "zh")}。`;
        return true;
    });
}

function finishRound(g) {
    const order = finishedList(g);
    if (order.length < 4) return;
    const first = order[0];
    const firstTeam = first % 2;
    const partnerPlace = order.indexOf(partnerOf(first)) + 1;
    const advance = partnerPlace === 2 ? 3 : partnerPlace === 3 ? 2 : 1;
    g.selectedTributes = [];
    const wasAceChallenge = g.levels[firstTeam] === "A";
    let aceFailureCount = g.aceFailures[firstTeam] || 0;
    let aceReset = false;
    if (wasAceChallenge) {
        if (partnerPlace === 2 || partnerPlace === 3) {
            g.leaderTeam = firstTeam;
            g.aceFailures[firstTeam] = 0;
            g.phase = "gameOver";
            g.roundResult = {
                first,
                firstTeam,
                order,
                advance: 0,
                aceChallenge: true,
                acePassed: true,
                tributePayers: [],
                nextStarter: first
            };
            g.message = `${teamNames.zh[firstTeam]} 冲 A 成功，赢得比赛。`;
            return;
        }
        aceFailureCount += 1;
        if (aceFailureCount >= ACE_FAIL_LIMIT) {
            g.levels[firstTeam] = "2";
            g.aceFailures[firstTeam] = 0;
            aceReset = true;
        } else {
            g.levels[firstTeam] = "A";
            g.aceFailures[firstTeam] = aceFailureCount;
        }
    } else {
        g.levels[firstTeam] = advanceLevel(g.levels[firstTeam], advance);
        g.aceFailures[firstTeam] = 0;
    }
    g.leaderTeam = firstTeam;
    const last = order[3];
    const tributePayers = partnerPlace === 2 ? [order[2], order[3]] : [last];
    g.phase = "roundOver";
    g.roundResult = {
        first,
        firstTeam,
        order,
        advance,
        aceChallenge: wasAceChallenge,
        acePassed: false,
        aceFailureCount,
        aceReset,
        tributePayers,
        nextStarter: first
    };
    if (wasAceChallenge) {
        g.message = aceReset
            ? `${teamNames.zh[firstTeam]} 冲 A 第 ${ACE_FAIL_LIMIT} 次失败，退回打 2。`
            : `${teamNames.zh[firstTeam]} 冲 A 失败，第 ${aceFailureCount}/${ACE_FAIL_LIMIT} 次；下局继续打 A。`;
    } else {
        g.message = `${teamNames.zh[firstTeam]} ${order.map(i => g.seats[i].name).join(" / ")} 完成排名，升 ${advance} 级。`;
    }
}

function advanceLevel(level, steps) {

    return order[Math.min(order.length - 1, idx + steps)];
}

    }));

// The AI search and the 提示 engine run in a Web Worker (events/static/guandan-ai-worker.js) so they
// never block rendering; the client falls back to the same engine on this thread if the worker fails.
const engineClient = createEngineClient(AI_WORKER_URL);
let aiRunToken = 0;
let hintClickToken = 0;
let hintRequest = null;
let hintUsedThisSession = false;

function findAIMoveAsync(hand, lastCombo, levelRank, seat, g) {
    return engineClient.findAIMove(hand, lastCombo, levelRank, seat, g);
}

function buildPlayerHintPackageAsync(seat, g, lang = uiLang) {
    return engineClient.buildPlayerHintPackage(seat, g, lang);
}

// True while `g` is still the state an async engine result was computed for (every transaction
// bumps `revision`).
function sameTurnState(g, snapshot) {
    return !!g && !!snapshot
        && g.roomCode === snapshot.roomCode
        && (Number(g.revision) || 0) === (Number(snapshot.revision) || 0)
        && g.phase === snapshot.phase
        && g.currentTurn === snapshot.currentTurn;
}

// One 提示 package per table state + language: repeat clicks cycle through it without recomputing,
// and a prefetch that is still running is simply awaited.
function requestHintPackage(seat, g, lang) {
    const key = `${g.roomCode || roomCode}:${Number(g.revision) || 0}:${g.currentTurn}:${seat}:${lang}`;
    if (hintRequest?.key !== key) {
        const promise = buildPlayerHintPackageAsync(seat, g, lang);
        hintRequest = { key, promise };
        promise.catch(() => {
            if (hintRequest?.promise === promise) hintRequest = null;
        });
    }
    return hintRequest.promise;
}

function maybePrefetchHint() {
    if (!hintUsedThisSession || !game || game.phase !== "playing" || dealWindowOpen(game)) return;
    const seat = mySeat();
    if (seat < 0 || seat !== game.currentTurn) return;
    requestHintPackage(seat, game, uiLang).catch(() => {});
}

async function hintMove() {
    const seat = mySeat();
    if (seat !== game.currentTurn) return showToast(L("Not your turn yet", "还没轮到你"));
    hintUsedThisSession = true;
    const snapshot = game;
    const lang = uiLang;
    const token = ++hintClickToken;
    const hand = game.hands[seat] || [];
    const previousHint = activeHintForSelection(hand.filter(c => selected.has(c.id)), true);
    let thinkingShown = false;
    const thinkingTimer = setTimeout(() => {
        thinkingShown = true;
        showToast(L("Thinking…", "思考中…"), 8000);
    }, 150);
    let packet;
    try {
        packet = await requestHintPackage(seat, snapshot, lang);
    } catch (err) {
        if (!err?.cancelled) console.error(err);
        packet = null;
    } finally {
        clearTimeout(thinkingTimer);
    }
    if (token !== hintClickToken || !sameTurnState(game, snapshot) || mySeat() !== seat) {
        if (thinkingShown && token === hintClickToken) toastEl.classList.remove("show");
        return;
    }
    if (!packet?.options?.length) return showToast(L("No useful suggestion found.", "暂时没有可用提示。"));
    const nextIndex = previousHint && previousHint.signature === packet.signature && packet.options.length > 1
        ? (previousHint.index + 1) % packet.options.length
        : 0;
    const advice = packet.options[nextIndex];
    const ids = advice.move?.cards?.map(c => c.id) || [];
    selected = new Set(ids);
    hintAdvisor = {
        ids,
        text: hintTextWithOrdinal(advice.text, nextIndex, packet.options.length),
        detail: advice.detail || "",
        className: "hint",
        signature: packet.signature,
        index: nextIndex,
        total: packet.options.length
    };
    render();
    showToast(hintAdvisor.text, 2800);
}

function hintTextWithOrdinal(text, index, total) {
    if (total <= 1) return text;
    return isZH() ? `提示 ${index + 1}/${total} · ${text}` : `Hint ${index + 1}/${total} · ${text}`;
}

function activeHintForSelection(selectedCards, canAct) {
    if (!hintAdvisor || !canAct) return null;
    const currentIds = selectedCards.map(c => c.id).sort().join(",");
    const hintIds = (hintAdvisor.ids || []).slice().sort().join(",");
    return currentIds === hintIds ? hintAdvisor : null;
}

function maybeRunAI() {
    clearTimeout(aiTimer);
    const token = ++aiRunToken;
    if (!game || game.phase !== "playing") return;
    if (dealWindowOpen(game)) {
        const wait = Math.max(0, Number(game.dealStartedAt) + DEALING_MS + SORTING_MS - Date.now()) + 140;
        aiTimer = setTimeout(maybeRunAI, wait);
        return;
    }
    const seat = game.currentTurn;
    if (game.seats[seat]?.type !== "ai") return;
    const snapshot = game;
    const hand = snapshot.hands[seat] || [];
    const lastCombo = snapshot.lastPlay?.combo || null;
    const obviousNoBeat = !!snapshot.lastPlay && obviouslyCannotBeat(hand, snapshot.lastPlay.combo, snapshot.currentLevelRank);
    const finishingCombo = hand.length ? choosePlayable(hand, lastCombo, snapshot.currentLevelRank) : null;
    const canFinishNow = !!finishingCombo;
    const fastDecision = obviousNoBeat || canFinishNow;
    const elapsed = Date.now() - (Number(snapshot.turnStartedAt) || Date.now());
    const visibleMs = fastDecision ? AI_FAST_VISIBLE_MS : AI_THINK_VISIBLE_MS;
    const commitAt = Date.now() + Math.max(0, visibleMs - elapsed);
    const stillCurrent = () => token === aiRunToken && sameTurnState(game, snapshot);
    const thinkStart = Date.now();
    // The search runs in the worker while the seat shows its "thinking" state; the move commits once
    // both the minimum visible think time and the search are done. Anything newer wins.
    findAIMoveAsync(hand, lastCombo, snapshot.currentLevelRank, seat, snapshot).then(move => {
        if (!stillCurrent()) return;
        const computedMs = Date.now() - thinkStart;
        const wait = Math.max(0, commitAt - Date.now(), AI_COMMIT_BUFFER_MS - computedMs);
        aiTimer = setTimeout(async () => {
            if (!stillCurrent()) return;
            if (move) await playCards(seat, move.cards, { silent: true });
            else await doPass(seat, { silent: true });
        }, wait);
    }, err => {
        if (!err?.cancelled) console.error(err);
    });
}

function previewCardsHTML() {
    // The hero fan renders the SAME card component as the live game (cardHTML), so the
    // display cards are literally identical to the in-game cards: each labmate appears on

    const PL = (window.GuandanRecords && window.GuandanRecords.PLAYERS) || {};
    const roster = ["zhongkai", "zhuo", "zaifeng", "zhengding", "haotian", "yichen"];
    const present = roster.filter(k => PL[k]);
    const items = [{ back: true }].concat((present.length ? present : ["zhongkai", "zhuo", "zaifeng"]).map(k => ({ key: k })));
    const n = items.length;
    const suitCode = { "♠": "S", "♥": "H", "♦": "D", "♣": "C" };
    return items.map((it, i) => {
        const st = `--i:${i};--n:${n}`;

            return `<span class="preview-slot" style="${st}"><span class="pl-back"><b>P</b><i>PICASSO</i><i>LAB</i></span></span>`;

        const p = PL[it.key] || { card: "A♥" };
        const sig = p.card || "A♥";
        const co = { rank: sig.slice(0, -1), suit: suitCode[sig.slice(-1)] || "H", id: "pv" + i };
        return `<span class="preview-slot" style="${st}">${cardHTML(co, true, false, "", "preview-game-card")}</span>`;
    }).join("");

// Bomb / combo celebration: purely presentational — reads entry.combo.isBomb
// (already computed by the scoring logic in evaluateCombos/normalizeActionEntry)
// and never changes game state. Guarded by lastCelebratedBombAt so each real
// bomb play triggers the shake/particles/banner exactly once per client.
let lastCelebratedBombAt = 0;
function maybeCelebrateBomb() {
    if (!game || !Array.isArray(game.trickPlays)) return;
    const latestAt = latestTrickPlayAt();
    if (!latestAt || latestAt === lastCelebratedBombAt) return;
    const entry = game.trickPlays.find(e => e && Number(e.at) === latestAt);
    lastCelebratedBombAt = latestAt;
    const combo = entry?.combo;
    if (!entry || entry.actionType === "pass" || !combo?.isBomb) return;
    triggerBombCelebration(combo);
}

function triggerBombCelebration(combo) {
    const tableEl = document.querySelector(".table");
    if (!tableEl) return;
    tableEl.classList.remove("bomb-shake");
    void tableEl.offsetWidth; // restart the animation if it's already mid-shake
    requestAnimationFrame(() => tableEl.classList.add("bomb-shake"));

    const fx = tableEl.querySelector(".bomb-fx");
    if (fx) {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < 28; i++) {
            const angle = Math.random() * Math.PI * 2;
            const mag = 60 + Math.random() * 100;
            const px = Math.round(Math.cos(angle) * mag);
            const py = Math.round(Math.sin(angle) * mag);
            const rot = Math.round(Math.random() * 360);
            const span = document.createElement("span");
            span.className = "bomb-particle";
            span.style.cssText = `--px:${px}px;--py:${py}px;--rot:${rot}deg;animation-delay:${Math.round(Math.random() * 80)}ms`;
            frag.appendChild(span);
        }
        fx.innerHTML = "";
        fx.appendChild(frag);
        setTimeout(() => { fx.innerHTML = ""; }, 1000);
    }

    const slot = tableEl.querySelector(".bomb-banner-slot");
    if (slot) {
        const bombLen = combo.bombLen || 0;
        const text = combo.type === "jokerBomb" ? "天王炸!" : bombLen >= 8 ? "八张炸弹!" : bombLen >= 6 ? "六张炸弹!" : "炸弹!";
        slot.innerHTML = `<div class="bomb-banner show">${text}</div>`;
        setTimeout(() => {
            const banner = slot.querySelector(".bomb-banner");
            if (!banner) return;
            banner.classList.remove("show");
            banner.classList.add("hide");
            setTimeout(() => banner.remove(), 220);
        }, 900);
    }
}
