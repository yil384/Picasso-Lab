<!-- =====================================================================
     Picasso Lab footer: ONE embed for the Google Sites footer (every page).
     It replaces the three footer embeds home/ucsd.html + home/address.html +
     home/visitor-map.html:
       - the UC San Diego seal (link: ucsd.edu)
       - PICASSO LAB + the address (link: the 3D lab walk-through, home/address.html)
       - the visitor map in its compact footer mode: it records the visit into
         Supabase exactly like home/visitor-map.html does inside an iframe, and a
         click opens the analytics dashboard (home/visitor-map.html) in a new tab.
     A Sites embed box keeps its aspect ratio and only shrinks on phones, so this
     page lays itself out for whatever box it gets (sizes read from the box):
       ratio >= 2.2 : one row  seal | title + address | map  (desktop proportions,
                      turning smoothly into a compact phone row as the box shrinks)
       ratio <  2.2 : seal + text on top, map below; or, for tall boxes, stacked
                      (seal, text, map), whichever of the two comes out larger.
     The map and visit-recording code is copied from home/visitor-map.html (v10):
     keep the Supabase constants and the data + capture functions in sync with it.
     ===================================================================== -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    .pf { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; background: #000; color: #fff;
        font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    .pf-seal, .pf-addr, .pf .vmap { position: absolute; left: 0; top: 0; visibility: hidden; }
    .pf.ready .pf-seal, .pf.ready .pf-addr, .pf.ready .vmap { visibility: visible; }
    .pf-seal { display: block; line-height: 0; text-decoration: none; }
    .pf-seal img { display: block; width: 100%; height: 100%; border: 0; object-fit: contain; background: transparent; }
    .pf-addr { display: block; color: #fff; text-decoration: none; cursor: pointer; }
    .pf-title { font-weight: 800; line-height: 0.98; letter-spacing: -0.025em; white-space: nowrap; }
    .pf-title span { display: inline-block; }
    .pf-text { font-weight: 400; text-justify: inter-word; }

    /* ---- visitor map (compact footer mode), copied from home/visitor-map.html ---- */
/*@@VM_CSS@@*/
    /* ---- footer only: the card is placed and sized by the layout script; the pill scales with the card ---- */
    .pf .vmap { width: auto; aspect-ratio: auto; min-height: 0; max-height: none; margin: 0; border-radius: var(--vr, 14px); }
    .pf .vmap-stats { left: var(--vx, 12px); bottom: var(--vy, 11px); max-width: calc(100% - 2 * var(--vx, 12px)); gap: var(--vg, 7px);
        padding: var(--vpy, 6px) var(--vpx, 11px); border-radius: var(--vpr, 9px); font-size: var(--vf, 10.5px); white-space: nowrap; overflow: hidden; }
    .pf #vmap-latest { font-size: var(--vf2, 9px); }
    .pf .vmap-live { width: var(--vd, 7px); height: var(--vd, 7px); }
    .pf .vmap-lt, .pf .vmap-reg { display: flex; align-items: center; gap: var(--vg, 7px); min-width: 0; }
    .pf .vmap-lt { flex: 0 1 auto; overflow: hidden; } .pf #vmap-latest { min-width: 0; flex: 0 1 auto; }
    .pf .vmap-stats.no-lt .vmap-lt, .pf .vmap-stats.no-reg .vmap-reg { display: none; }
</style>

<div class="pf" id="pf">
    <a class="pf-seal" id="pf-seal" href="https://ucsd.edu/" target="_blank" rel="noopener" aria-label="UC San Diego">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Seal_of_the_University_of_California,_San_Diego.svg?width=320"
             alt="UC San Diego" width="160" height="160">
    </a>
    <a class="pf-addr" id="pf-addr" href="https://yil384.github.io/Picasso-Lab/home/address.html" target="_blank" rel="noopener" aria-label="Picasso Lab, step inside the lab in 3D">
        <div class="pf-title" id="pf-title"><span>PICASSO LAB</span></div>
        <div class="pf-text" id="pf-text">Computer Science and Engineering Building, 3235 Voigt Dr, La&nbsp;Jolla, CA&nbsp;92093</div>
    </a>
    <div id="vmap" class="vmap" role="link" tabindex="0" aria-label="Visitor map: open the visitor analytics">
        <canvas id="vmap-c" class="vmap-c"></canvas>
        <div class="vmap-stats"><span class="vmap-live"></span><span><b id="vmap-total">0</b>&nbsp;<span class="vmap-dim">visits</span></span><span class="vmap-reg"> <span class="vmap-sep">/</span>
            <span><b id="vmap-countries">0</b>&nbsp;<span class="vmap-dim">reg.</span></span></span><span class="vmap-lt"> <span class="vmap-sep">/</span> <span id="vmap-latest">—</span></span></div>
    </div>
</div>
<div id="vmtip" class="vmtip"></div>

<script>
(function () {
    /* ════════ layout: everything is placed from the box's own size ════════ */
    var PF = document.getElementById('pf'), SEAL = document.getElementById('pf-seal'), ADDR = document.getElementById('pf-addr'),
        TTL = document.getElementById('pf-title'), TSP = TTL.firstChild, TXT = document.getElementById('pf-text'),
        CARD = document.getElementById('vmap'), STATS = CARD.querySelector('.vmap-stats');
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    /* quirks mode (no doctype in the Sites embed): read the box from the fixed root / body, not documentElement */
    function boxSize() { var b = document.body;
        return [PF.clientWidth || (b && b.clientWidth) || window.innerWidth, PF.clientHeight || (b && b.clientHeight) || window.innerHeight]; }
    /* typeset the title + address at the given sizes; the column is the title's width (or minEm address-ems, if wider) */
    function typeset(T, A, lh, gap, minEm, align) {
        TTL.style.fontSize = T + 'px'; TTL.style.marginTop = (-0.11 * T) + 'px';
        TXT.style.lineHeight = lh; TXT.style.marginTop = gap + 'px';
        var tw = TSP.getBoundingClientRect().width, C, just = align === 'justify';
        function lines() { return Math.round(TXT.offsetHeight / (parseFloat(TXT.style.fontSize) * lh)); }
        /* justified (fills the title's width, like the old footer): sized so it breaks into the same three lines as on
           desktop; if it can't, or the column is narrow, it is left-aligned instead (narrow justified lines get word gaps) */
        if (just) { C = Math.ceil(tw + 0.5); var a = Math.min(A, C / 12.45); ADDR.style.width = C + 'px'; TXT.style.textAlign = 'justify';
            for (var i = 0; i < 5; i++) { TXT.style.fontSize = a + 'px'; if (lines() <= 3) break; a *= 0.96; }
            if (lines() > 3 || C < 150) just = false; else A = a; }
        if (!just) { TXT.style.fontSize = A + 'px'; C = Math.ceil(Math.max(tw, A * minEm) + 0.5); ADDR.style.width = C + 'px';
            TXT.style.textAlign = align === 'center' ? 'center' : 'left'; }
        var h = ADDR.offsetHeight, lead = A * (lh - 1) / 2;
        /* visual box: from the title's cap top (the negative margin crops the leading above it) to the last baseline + descender */
        return { C: C, tw: tw, A: A, h: h, vis: Math.max(1, h - lead - A * 0.08) };
    }
    function put(el, x, y, w, h) { el.style.left = Math.round(x) + 'px'; el.style.top = Math.round(y) + 'px';
        if (w != null) el.style.width = Math.round(w) + 'px'; if (h != null) el.style.height = Math.round(h) + 'px'; }

    /* one row: seal | text | map. Two keyframes: desktop (957 x 290 box) and phone (the same box shrunk to 352 x 107);
       f runs 0 -> 1 between them with the box's effective size, so the text gets relatively larger as the box shrinks */
    function rowLayout(W, H) {
        var s = Math.min(W / 957, H / 290, 1.3), f = clamp((s - 0.368) / 0.632, 0, 1), We = 957 * s;
        function L(a, b) { return a + (b - a) * f; }
        var z = 1, o;
        for (var it = 0; it < 6; it++) {
            var T = We * L(0.0469, 0.0376) * z, A = T * L(0.65, 0.528), lh = L(1.32, 1.5), gap = T * 0.28;
            var S = We * L(0.125, 0.167) * z, g1 = We * L(0.03, 0.094) * z, g2 = We * L(0.034, 0.058) * z;
            var px = Math.max(8, We * L(0.028, 0.02)), py = Math.max(6, H * 0.06);
            var t = typeset(T, A, lh, gap, L(11.5, 11), f >= 0.5 ? 'justify' : 'left');
            var availW = Math.min(W, We) - 2 * px, availH = H - 2 * py;
            var Mmax = We * L(0.44, 0.366) * z, Mmin = We * L(0.36, 0.3) * z;
            var M = Math.min(Mmax, availW - S - g1 - t.C - g2), cardH = M / 2;
            var zz = 1;
            if (M < Mmin) { zz = Math.min(zz, availW / (S + g1 + t.C + g2 + Mmin)); M = Mmin; cardH = M / 2; }
            var needH = Math.max(S, t.vis, cardH);
            if (needH > availH) zz = Math.min(zz, availH / needH);
            o = { mode: 'row', f: +f.toFixed(2), T: T, A: t.A, S: S, g1: g1, g2: g2, t: t, M: M, cardH: cardH };
            if (zz >= 0.995) break;
            z *= zz * 0.995;
        }
        var G = o.S + o.g1 + o.t.C + o.g2 + o.M, x0 = (W - G) / 2, cy = H / 2;
        var ty = cy - o.t.vis / 2;
        put(ADDR, x0 + o.S + o.g1, ty);
        /* phone-sized rows: the seal sits level with the title, which leaves the bottom-left corner (Google's (i) button) free */
        put(SEAL, x0, f < 0.4 ? ty + 1 : cy - o.S / 2, o.S, o.S);
        put(CARD, x0 + o.S + o.g1 + o.t.C + o.g2, cy - o.cardH / 2, o.M, o.cardH);
        o.x0 = x0; o.G = G;
        return o;
    }

    /* two tiers (seal + text on top, map below) or stacked (seal, text, map): designed at u = 1, then scaled to fit */
    function tierLayout(W, H, stacked, dry) {
        var px = clamp(W * 0.045, 8, 30), py = clamp(H * 0.05, 8, 28);
        var T = 34, A = 18, lh = 1.45, gap = 9.5, S = stacked ? 96 : 116, gS = stacked ? 16 : 22, gT = stacked ? 20 : 24;
        var t = typeset(T, A, lh, gap, 11, stacked ? 'center' : 'justify');
        var rowW = stacked ? Math.max(S, t.C) : S + gS + t.C, rowH = stacked ? S + gS + t.vis : Math.max(S, t.vis);
        var M = Math.max(rowW, 300) * (stacked ? 1.1 : 1), cardH = M / 2;
        var u = Math.min((W - 2 * px) / Math.max(rowW, M), (H - 2 * py) / (rowH + gT + cardH), 1.7);
        if (dry) return u;
        var o = { mode: stacked ? 'stack' : 'tier', u: +u.toFixed(3) };
        t = typeset(T * u, A * u, lh, gap * u, 11, stacked ? 'center' : 'justify');
        S *= u; gS *= u; gT *= u; M *= u; cardH *= u;
        rowW = stacked ? Math.max(S, t.C) : S + gS + t.C; rowH = stacked ? S + gS + t.vis : Math.max(S, t.vis);
        var y0 = (H - (rowH + gT + cardH)) / 2, cx = W / 2;
        if (stacked) { put(SEAL, cx - S / 2, y0, S, S); put(ADDR, cx - t.C / 2, y0 + S + gS); }
        else { var x0 = cx - rowW / 2; put(SEAL, x0, y0 + (rowH - S) / 2, S, S); put(ADDR, x0 + S + gS, y0 + (rowH - t.vis) / 2); }
        put(CARD, cx - M / 2, y0 + rowH + gT, M, cardH);
        o.T = T * u; o.A = t.A; o.S = S; o.M = M; o.cardH = cardH; o.t = t;
        return o;
    }

    /* the stats pill keeps its look and scales with the card (365 px wide in the old footer); it drops the latest
       place, then the region count, when the card is too narrow for them */
    function fitPill(M) {
        var k = clamp(M / 365, 0.3, 1.4), fs = Math.max(7.5, 10.5 * k), st = CARD.style;
        st.setProperty('--vr', Math.max(8, 14 * k).toFixed(1) + 'px');
        st.setProperty('--vx', Math.max(6, 12 * k).toFixed(1) + 'px'); st.setProperty('--vy', Math.max(5, 11 * k).toFixed(1) + 'px');
        st.setProperty('--vf', fs.toFixed(2) + 'px'); st.setProperty('--vf2', Math.max(7, 9 * k).toFixed(2) + 'px');
        st.setProperty('--vpy', (fs * 0.57).toFixed(1) + 'px'); st.setProperty('--vpx', (fs * 1.05).toFixed(1) + 'px');
        st.setProperty('--vpr', (fs * 0.86).toFixed(1) + 'px'); st.setProperty('--vg', (fs * 0.67).toFixed(1) + 'px'); st.setProperty('--vd', (fs * 0.67).toFixed(1) + 'px');
        var room = CARD.clientWidth - 2 * Math.max(6, 12 * k);
        STATS.classList.remove('no-reg'); STATS.classList.add('no-lt');
        if (STATS.scrollWidth > room + 0.5) STATS.classList.add('no-reg');
        else { var base = STATS.scrollWidth, LT = document.getElementById('vmap-latest'); STATS.classList.remove('no-lt');
            /* a latest place that only fits as a stub ("SAN DIEGO, UNI...") is left out */
            if (LT.scrollWidth > LT.clientWidth + 1 && room - base < fs * 14) STATS.classList.add('no-lt'); }
    }

    var LAST = null;
    function layout() {
        var wh = boxSize(), W = wh[0], H = wh[1]; if (!W || !H) return;
        var r = W / H, o;
        if (r >= 2.2) o = rowLayout(W, H);
        else { var uT = tierLayout(W, H, false, true), uS = tierLayout(W, H, true, true); o = tierLayout(W, H, uS >= uT * 0.97); }
        fitPill(o.M);
        o.W = W; o.H = H; LAST = o;
        PF.classList.add('ready');
    }
    window.__pf = function () { return LAST && { mode: LAST.mode, f: LAST.f, u: LAST.u, W: LAST.W, H: LAST.H, title: +LAST.T.toFixed(2), addr: +LAST.A.toFixed(2),
        seal: Math.round(LAST.S), col: LAST.t.C, card: [Math.round(LAST.M), Math.round(LAST.cardH)], align: TXT.style.textAlign,
        pill: STATS.className, lines: Math.round((TXT.offsetHeight) / (LAST.A * parseFloat(TXT.style.lineHeight))) }; };

//@@VM_JS@@

    /* one click = one tab: open without the "noopener" feature (with it, window.open returns null by spec), cut the
       opener by hand, and fall back to a plain link only if open() throws or returns null */
    function openAnalytics() { try { var w = window.open(ANALYTICS_URL, '_blank'); if (w) { try { w.opener = null; } catch (e) {} return; } } catch (e) {}
        try { var a = document.createElement('a'); a.href = ANALYTICS_URL; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {} }
    var VA = null; function renderDash() {}

    /* ---------- boot ---------- */
    layout();
    var ftC = document.getElementById('vmap-c'), vmap = document.getElementById('vmap');
    setTarget(ftC);
    ftC.addEventListener('mousemove', hoverMove); ftC.addEventListener('mouseleave', function () { tip.classList.remove('show'); });
    vmap.addEventListener('click', function () { openAnalytics(); });
    vmap.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAnalytics(); } });
    var rq = 0; function relayout() { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; layout(); resize(); }); }
    window.addEventListener('resize', relayout); setTimeout(relayout, 250);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
    /* the pill's numbers count up when the data arrives: re-check what fits as its text changes */
    if (window.MutationObserver) { var mq = 0; new MutationObserver(function () { if (mq || !LAST) return; mq = requestAnimationFrame(function () { mq = 0; fitPill(LAST.M); }); })
        .observe(STATS, { childList: true, characterData: true, subtree: true }); }
    window.__pfPing = function (city) { var r = ftC.getBoundingClientRect(); for (var i = 0; i < pings.length; i++) if (pings[i].city === city) { var xy = project(pings[i].lon, pings[i].lat); return { x: r.left + xy[0], y: r.top + xy[1] }; } return null; };
    requestAnimationFrame(frame);
    loadData();
})();
</script>
