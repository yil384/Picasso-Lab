<!-- =====================================================================
     Picasso Lab footer: ONE embed for the Google Sites footer (every page).
     It replaces the three footer embeds home/ucsd.html + home/address.html +
     home/visitor-map.html:
       - the UC San Diego seal (link: ucsd.edu)
       - PICASSO LAB + the address (link: the 3D lab walk-through, home/address.html)
       - the visitor map card: it records the visit into Supabase exactly like
         home/visitor-map.html does, and a click opens the analytics dashboard
         (home/visitor-map.html) in a new tab.
     A Sites embed box keeps its aspect ratio and only shrinks on phones, and
     Sites already frames the box, so this page fills whatever box it gets
     edge to edge (sizes read from the box):
       ratio >= 2.2 : one row  seal | title + address | map  (desktop proportions,
                      turning smoothly into a compact phone row as the box shrinks)
       ratio <  2.2 : seal + text on top, map below; or, for tall boxes, stacked
                      (seal, text, map), whichever of the two comes out larger.
     GENERATED FILE: edit home/footer-src/footer.tpl.html and run
     python3 home/footer-src/build.py. The visit-recording code is copied from
     home/visitor-map.html by that script (keep the two in sync through it).
     ===================================================================== -->

        g.lineWidth = 0.6; g.strokeStyle = 'rgba(120,190,255,0.07)';

        for (var lo2 = -180; lo2 < 180; lo2 += 30) { g.beginPath(); var on2 = false; for (var la = -84; la <= 84; la += 6) { var q = view(Math.sin(la * RAD), Math.cos(la * RAD), lo2 * RAD); if (q[2] > 0) { var X2 = GX + q[0] * GR, Y2 = GY - q[1] * GR; on2 ? g.lineTo(X2, Y2) : g.moveTo(X2, Y2); on2 = true; } else on2 = false; } g.stroke(); }
        var ds = Math.max(1.1, GR / 48), buckets = [[], [], [], []];
        for (var k = 0; k < LAND.length; k++) { var P = LAND[k], v = view(P[0], P[1], P[2]); if (v[2] <= 0.02) continue;
            var lit = 0.3 + 0.7 * Math.max(0, v[0] * LIGHT[0] + v[1] * LIGHT[1] + v[2] * LIGHT[2]), b = Math.min(3, Math.floor(lit * v[2] ** 0.35 * 4));
            buckets[b].push(GX + v[0] * GR - ds / 2, GY - v[1] * GR - ds / 2); }
        var cols = ['rgba(52,112,160,0.45)', 'rgba(62,138,192,0.65)', 'rgba(78,162,215,0.85)', 'rgba(110,192,238,0.95)'];
        for (var bb = 0; bb < 4; bb++) { g.fillStyle = cols[bb]; var arr = buckets[bb]; for (var j = 0; j < arr.length; j += 2) g.fillRect(arr[j], arr[j + 1], ds, ds); }

        g.save(); g.beginPath(); g.arc(GX, GY, GR, 0, 6.2832); g.clip();
        if (g.createConicGradient) { var cg = g.createConicGradient(sweep, GX, GY); cg.addColorStop(0, 'rgba(110,230,255,0.20)'); cg.addColorStop(0.12, 'rgba(110,230,255,0)'); cg.addColorStop(1, 'rgba(110,230,255,0)'); g.fillStyle = cg; g.fillRect(GX - GR, GY - GR, GR * 2, GR * 2); }
        g.strokeStyle = 'rgba(140,235,255,0.35)'; g.lineWidth = 1; g.beginPath(); g.moveTo(GX, GY); g.lineTo(GX + Math.cos(sweep) * GR, GY + Math.sin(sweep) * GR); g.stroke();
        g.restore();
        g.strokeStyle = 'rgba(140,200,255,0.28)'; g.lineWidth = 1; g.beginPath(); g.arc(GX, GY, GR, 0, 6.2832); g.stroke();
        // visitors: small and calm; they brighten as the sweep passes; the latest three pulse amber
        SCR = [];
        for (var pi = 0; pi < pings.length; pi++) { var pp = pings[pi], w = view(Math.sin(pp.lat * RAD), Math.cos(pp.lat * RAD), pp.lon * RAD); if (w[2] <= 0.05) continue;
            var sx = GX + w[0] * GR, sy = GY - w[1] * GR; SCR.push([sx, sy, pp]);
            var ang = Math.atan2(sy - GY, sx - GX), dA = ((sweep - ang) % 6.2832 + 6.2832) % 6.2832, hot = Math.exp(-dA * 2.2), r = K * (0.75 + Math.min(1.1, Math.sqrt(pp.n) * 0.08)) * (0.6 + 0.4 * w[2]);
            if (pp.live) { var ph = ((s * 1000 + pi * 800) % 2400) / 2400; g.strokeStyle = 'rgba(255,201,77,' + (0.5 * (1 - ph)).toFixed(3) + ')'; g.lineWidth = 1; g.beginPath(); g.arc(sx, sy, r * 1.6 + ph * 7 * K, 0, 6.2832); g.stroke();
                g.fillStyle = '#ffc94d'; g.beginPath(); g.arc(sx, sy, Math.max(r * 1.4, 1.6 * K), 0, 6.2832); g.fill(); continue; }
            if (hot > 0.05) { g.fillStyle = 'rgba(120,230,255,' + (0.25 * hot).toFixed(3) + ')'; g.beginPath(); g.arc(sx, sy, r * 3.2, 0, 6.2832); g.fill(); }
            g.fillStyle = 'rgba(130,225,255,' + (0.55 + 0.4 * hot).toFixed(3) + ')'; g.beginPath(); g.arc(sx, sy, r, 0, 6.2832); g.fill(); }
        if (mz >= 0) moon();
        // the off-world "visits": a slow amber blip on each
        for (var e = 0; e < EXTRA.length; e++) { var E = EXTRA[e], pin = E.pin || [E.x, E.y], ph2 = ((s * 1000 + e * 900) % 3000) / 3000;
            g.strokeStyle = 'rgba(255,201,77,' + (0.55 * (1 - ph2)).toFixed(3) + ')'; g.lineWidth = 1; g.beginPath(); g.arc(pin[0], pin[1], 1.4 * K + ph2 * 6 * K, 0, 6.2832); g.stroke();
            g.fillStyle = '#ffd877'; g.beginPath(); g.arc(pin[0], pin[1], 1.3 * K, 0, 6.2832); g.fill(); }
    }
    /* ~30 fps, only while the card is on screen and the tab is visible */
    var onScreen = true, lastF = 0, ticking = false;
    if (window.IntersectionObserver) new IntersectionObserver(function (es) { onScreen = es[es.length - 1].isIntersecting; if (onScreen) kick(); }).observe(CARD);
    function kick() { if (!ticking) { ticking = true; requestAnimationFrame(tick); } }
    function tick(t) { ticking = false; if (!onScreen || document.hidden) { lastT = 0; return; } if (t - lastF >= 32) { lastF = t; draw(t); } kick(); }
    document.addEventListener('visibilitychange', kick);

    function fmtFull(n) { return Math.round(n).toLocaleString('en-US'); }
    function onData(cc) { kick(); if (LAST) fitCard(LAST.M); }
    var VA = null; function renderDash() {}

    /* ---------- hover / drag / click ---------- */
    var tip = document.getElementById('vmtip'), drag = null, tipHold = 0;
    function hitAt(clientX, clientY) { var rect = CARD.getBoundingClientRect(), x = clientX - rect.left, y = clientY - rect.top, best = null, bd = 12 * Math.max(0.8, K);
        for (var i = 0; i < SCR.length; i++) { var dd = Math.hypot(SCR[i][0] - x, SCR[i][1] - y); if (dd < bd) { bd = dd; best = { p: SCR[i][2] }; } }
        if (!best) for (var j = 0; j < EXTRA.length; j++) { if (Math.hypot(EXTRA[j].x - x, EXTRA[j].y - y) < Math.max(EXTRA[j].r, 9)) best = { o: EXTRA[j].o }; }
        return best; }
    function showTip(h, clientX, clientY) {
        if (h.p) { var p = h.p, cc = ISO[p.country]; tip.innerHTML = '<b>' + (cc ? '<i>' + cc + '</i>' : '') + esc(p.where) + '</b><span>' + fmtFull(p.n) + ' visit' + (p.n > 1 ? 's' : '') + (p.t ? ' &middot; ' + fmtAgo(p.t) + ' ago' : '') + '</span>'; }
        else { var o = h.o; tip.innerHTML = '<b><i>' + o.code + '</i>' + esc(o.where) + '</b><span>' + o.n + ' visit' + (o.n > 1 ? 's' : '') + ' &middot; ' + esc(o.note) + '</span>'; }
        tip.classList.add('show'); var tw = tip.offsetWidth, th = tip.offsetHeight, vw = window.innerWidth || document.body.clientWidth, vh = window.innerHeight || document.body.clientHeight;
        var tx = clientX + 14, ty = clientY + 14; if (tx + tw > vw - 4) tx = Math.max(4, clientX - 14 - tw); if (ty + th > vh - 4) ty = Math.max(4, clientY - 14 - th);
        tip.style.left = tx + 'px'; tip.style.top = ty + 'px'; }
    function hoverMove(e) { if (drag || performance.now() < tipHold) return; var h = hitAt(e.clientX, e.clientY); if (h) showTip(h, e.clientX, e.clientY); else tip.classList.remove('show'); }
    CARD.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, t: performance.now(), moved: false }; ROT.vlon = ROT.vlat = 0; try { CARD.setPointerCapture(e.pointerId); } catch (_) {} });
    CARD.addEventListener('pointermove', function (e) {
        if (!drag) { if (e.pointerType === 'mouse') hoverMove(e); return; }
        var dx = e.clientX - drag.lx, dy = e.clientY - drag.ly, now = performance.now(), dtt = Math.max(1, now - drag.t) / 1000;
        if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) { drag.moved = true; tip.classList.remove('show'); }
        if (drag.moved) { var dg = 57.3 / GR; ROT.lon -= dx * dg; ROT.lat = clamp(ROT.lat + dy * dg, -55, 60); ROT.vlon = -dx * dg / dtt * 0.6; ROT.vlat = dy * dg / dtt * 0.6; ROT.auto = 0; kick(); }
        drag.lx = e.clientX; drag.ly = e.clientY; drag.t = now; });
    function endDrag(e, cancel) { if (!drag) return; var d0 = drag; drag = null; if (cancel || d0.moved) return;
        var h = hitAt(e.clientX, e.clientY);
        if (h && h.o) { showTip(h, e.clientX, e.clientY); tipHold = performance.now() + 2500; setTimeout(function () { if (performance.now() >= tipHold) tip.classList.remove('show'); }, 2600); return; }
        if (h && h.p && e.pointerType !== 'mouse') { showTip(h, e.clientX, e.clientY); tipHold = performance.now() + 2500; setTimeout(function () { if (performance.now() >= tipHold) tip.classList.remove('show'); }, 2600); return; }
        openAnalytics(); }
    CARD.addEventListener('pointerup', function (e) { endDrag(e, false); });
    CARD.addEventListener('pointercancel', function (e) { endDrag(e, true); });
    CARD.addEventListener('mouseleave', function () { if (!drag) tip.classList.remove('show'); });

    /* one click = one tab: open without the "noopener" feature (with it, window.open returns null by spec), cut the
       opener by hand, and fall back to a plain link only if open() throws or returns null */
    function openAnalytics() { try { var w = window.open(ANALYTICS_URL, '_blank'); if (w) { try { w.opener = null; } catch (e) {} return; } } catch (e) {}
        try { var a = document.createElement('a'); a.href = ANALYTICS_URL; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {} }

    /* ---------- boot ---------- */
    layout(); resize(); kick();
    CARD.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAnalytics(); } });
    var rq = 0; function relayout() { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; layout(); resize(); }); }
    window.addEventListener('resize', relayout); setTimeout(relayout, 250);

    window.__pfGlobe = function () { return { lon: ROT.lon, lat: ROT.lat, land: LAND.length, onGlobe: SCR.length, extra: EXTRA.map(function (e) { return { id: e.o.id, x: Math.round(e.x), y: Math.round(e.y) }; }) }; };
    loadData();
})();
