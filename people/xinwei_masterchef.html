<!--
  xinwei_masterchef.html — 厨神 = 美国厨神 MasterChef USA
  ──────────────────────────────────────────────────────────
  Palette: studio-black #1c1a1f | masterchef-gold #e3a822 | chef-white #fbfaf6 | steel #d3d9df
           flame #ff5a1f / #ffa21f / #ffe14d | seal-red #c8302a
  Style:   贴纸 / 漫画 — 2px 墨线描边, 平涂 (最多 2 色), 每个元素一个投影; 不用模糊, 不发光,
           圆外没有任何光晕或边框.

  默认: 干净的原照片 (只有中性投影); hover: 整个舞台轻微上浮; 点击 (或键盘 Enter/空格) 切换 .xc-on:
    ① 平底锅     — 锅柄握在他真实的右手 (观者左侧) 里: 真手的手指从照片里重新叠回锅柄上面,
                   不画假手. 锅一到手就 "轰" 地 flambé 一下.
    ② 厨房片场   — 第一团火从锅里炸开, 火光扩散处原照片背景被烧成黑金演播厅厨房
                   (金色吊灯, 挂锅架, 调料架, 黑色砖墙, 金色腰线). 人物还是原照片:
                   布景按他的轮廓挖空 (内联矢量路径, 无额外图片), 轮廓只描一圈细墨线.
    ③ 料理台     — 不锈钢灶台从圆底升起 (金线, 旋钮, 砧板), 台前一枚小小的 "厨神" 朱印.
    ④ 厨师帽     — 高筒褶皱厨师帽落在头顶, 落地只轻轻一压, 帽檐不会压到眼镜.
    ⑤ 围裙+领巾  — 白色参赛围裙, 黑金胸徽 (金色厨师帽), 红色领巾系在真实领口.
    ⑥ 主厨刀     — 握在他真实的左手 (观者右侧) 里, 刀尖搭在砧板上; 真手的拳头同样叠在刀柄上.
    ⑦ Flambé     — 每 3.2 s 一团大火 (只占节拍的 ~20%) + 火星 + 锅轻颠 + 刀光一闪;
                   间隙里锅上只留小火苗, 冒两缕蒸汽.
    ⑧ 金奖杯     — 冠军奖杯立在右上调料架上, 在吊灯光束里, 每拍中段闪一下.
    ⑨ YES, CHEF! — 从他嘴边冒出的漫画对白气泡, 每次开启只喊一次, 然后退场.

  微调 (改下方 style="" 里的数字):
    --hat-x / --hat-y / --hat-rot   厨师帽位置 / 歪戴角度
-->

<style>
/* Keep oversized animation layers from enlarging the Google Sites embed. */
html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  box-sizing: border-box;
  padding: 8px;
}

.xc-wrap {
  display: inline-block;
  cursor: pointer;
  overflow: visible;
  -webkit-tap-highlight-color: transparent;
  background: transparent;
  border-radius: 50%;
  outline: none;
}
.xc-wrap *,
.xc-wrap *::before,
.xc-wrap *::after { box-sizing: border-box; }

/* the whole stage lifts on hover, so every prop stays glued to the photo */
.xc-stage {
  position: relative;
  width:  var(--avatar-size, 200px);
  height: var(--avatar-size, 200px);
  overflow: visible;
  transform: translateY(var(--xc-lift, 0px)) scale(var(--xc-scale, 1));
  transform-origin: 50% 50%;
  transition: transform .4s cubic-bezier(.32, 1.3, .4, 1);
}
/* max 1.05 about the centre, so the lifted circle stays inside the 8 px embed padding */
.xc-wrap:hover,
.xc-wrap:focus-visible { --xc-scale: 1.05; --xc-lift: -2px; }
.xc-wrap.xc-on       { --xc-scale: 1.03; }
.xc-wrap.xc-on:hover,
.xc-wrap.xc-on:focus-visible { --xc-scale: 1.05; --xc-lift: -2px; }

/* ── photo + set ── */
.xc-photo {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,.18);
  transition: box-shadow .4s ease;
}
.xc-wrap:hover .xc-photo,
.xc-wrap:focus-visible .xc-photo { box-shadow: 0 4px 10px rgba(0,0,0,.2); }
.xc-avatar {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

/* ② the set floods out of the first flambé (a circle growing from the pan) and swallows the old backdrop.
   The reveal is a clip-path TRANSITION (not a keyframe), so switching off at any moment keeps the clip
   where it is while the set fades; the clip only resets after the fade (0s step at .25s).
   Percentages scale with --avatar-size: 17% 69% = the pan, 116% reaches the far edge. */
.xc-set {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0;
  -webkit-clip-path: circle(0% at 17% 69%);
          clip-path: circle(0% at 17% 69%);
  transition: opacity .25s ease, -webkit-clip-path 0s linear .25s, clip-path 0s linear .25s;
}
.xc-wrap.xc-on .xc-set {
  opacity: 1;
  -webkit-clip-path: circle(116% at 17% 69%);
          clip-path: circle(116% at 17% 69%);
  transition: opacity .15s ease,
              -webkit-clip-path .7s cubic-bezier(.3, 0, .3, 1) .3s,
              clip-path .7s cubic-bezier(.3, 0, .3, 1) .3s;
}

.xc-cone { opacity: .17; }
.xc-lamps {
  transform-box: view-box;
  transform-origin: 100px 0;
  transform: translateY(-16px);
  transition: transform 0s .3s;   /* stay put while the set fades out */
}
.xc-wrap.xc-on .xc-lamps {
  transform: translateY(0);
  transition: transform .6s cubic-bezier(.2, 1.5, .4, 1) .7s;
}

/* ── overlay (costume, station, props) ── */
.xc-fx {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}
.xc-fx g { transform-box: view-box; }

/* Hidden state: quick exits, no delays. On state: staggered entrances. */
.xc-hat, .xc-apron, .xc-counter, .xc-pan, .xc-knife, .xc-trophy, .xc-grip, .xc-seal {
  opacity: 0;
  transition: opacity .2s ease, transform .25s ease;
}

/* ① pan swings into his hand first; the grip overlay is the real photo, so it just fades in with it */
.xc-pan {
  transform-origin: 64px 167px;
  transform: rotate(-38deg) scale(.4);
}
.xc-wrap.xc-on .xc-pan {
  opacity: 1;
  transform: none;
  transition: opacity .15s ease, transform .4s cubic-bezier(.2, 1.4, .4, 1);
}
.xc-wrap.xc-on .xc-grip { opacity: 1; transition: opacity .15s ease; }

/* ③ station comes up before the set reaches his legs */
.xc-counter { transform: translateY(30px); }
.xc-wrap.xc-on .xc-counter {
  opacity: 1;
  transform: none;
  transition: opacity .2s ease .08s, transform .45s cubic-bezier(.2, 1.2, .4, 1) .08s;
}

/* ⑤ apron unrolls from the collar */
.xc-apron {
  transform-origin: 101px 84px;
  transform: scaleY(.25);
}
.xc-wrap.xc-on .xc-apron {
  opacity: 1;
  transform: none;
  transition: opacity .2s ease .5s, transform .5s cubic-bezier(.2, 1.3, .4, 1) .5s;
}

/* ④ toque drops onto his head: keyframed so the landing squash stays above the glasses (≤ 1.2 px);
   the drop starts only 10 px up, so even the tilted crown stays inside the circle */
.xc-hat-fit {
  transform-origin: 101px 55px;
  transform: translate(var(--hat-x), var(--hat-y)) rotate(var(--hat-rot));
}
.xc-hat { transform-origin: 101px 55px; }
.xc-wrap.xc-on .xc-hat {
  opacity: 1;
  transition: opacity .14s ease .6s;
  animation: xc-hat-in .7s ease-out .6s both;
}
@keyframes xc-hat-in {
  0%   { transform: translateY(-10px) rotate(-6deg); animation-timing-function: cubic-bezier(.5, 0, .9, .6); }
  52%  { transform: translateY(1.2px) scale(1.04, .95); animation-timing-function: ease-out; }
  76%  { transform: translateY(-1.4px) scale(.99, 1.02); }
  100% { transform: none; }
}

/* ⑥ knife swings into his other fist */
.xc-knife {
  transform-origin: 124px 165px;
  transform: rotate(28deg) scale(.4);
}
.xc-wrap.xc-on .xc-knife {
  opacity: 1;
  transform: none;
  transition: opacity .2s ease .55s, transform .5s cubic-bezier(.2, 1.4, .4, 1) .55s;
}
.xc-wrap.xc-on .xc-knife + .xc-grip { transition-delay: .55s; }

/* ⑧ trophy lands on the shelf */
.xc-trophy {
  transform-origin: 157px 77px;
  transform: scale(0);
}
.xc-wrap.xc-on .xc-trophy {
  opacity: 1;
  transform: none;
  transition: opacity .15s ease 1.05s, transform .5s cubic-bezier(.2, 1.6, .4, 1) 1.05s;
}

/* ③ seal presses onto the station front */
.xc-seal {
  transform-origin: 100px 191.7px;
  transform: scale(2);
}
.xc-wrap.xc-on .xc-seal {
  opacity: 1;
  transform: none;
  transition: opacity .12s ease 1.3s, transform .3s cubic-bezier(.3, 1.5, .5, 1) 1.3s;
}

/* ⑦ one 3.2 s "service" beat: flambé burst (~20 % of the beat) + embers + wrist flick + knife glint;
   then steam; the trophy glints mid-beat. Between bursts only a small still flame stays in the pan. */
.xc-fire {
  transform-origin: 33.6px 151px;
  transform: scale(.4);
}
.xc-wrap.xc-on .xc-fire { animation: xc-flambe 3.2s ease-out .3s infinite both; }
@keyframes xc-flambe {
  0%   { transform: scale(.4); }
  5%   { transform: scale(1.1, 1.16); }
  10%  { transform: scale(.96, 1); }
  15%  { transform: scale(.72); }
  20%  { transform: scale(.42); }
  100% { transform: scale(.4); }
}
.xc-flick { transform-origin: 64px 167px; }
.xc-wrap.xc-on .xc-flick { animation: xc-flick 3.2s ease-out .3s infinite; }
@keyframes xc-flick {
  0%, 16%, 100% { transform: rotate(0deg); }
  4%            { transform: rotate(-5deg); }
  10%           { transform: rotate(1deg); }
}
.xc-ember { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
.xc-wrap.xc-on .xc-ember    { animation: xc-ember 3.2s .3s ease-out infinite; }
.xc-wrap.xc-on .xc-ember.xc-e2 { animation-delay: .36s; }
.xc-wrap.xc-on .xc-ember.xc-e3 { animation-delay: .33s; }
.xc-wrap.xc-on .xc-ember.xc-e4 { animation-delay: .39s; }
@keyframes xc-ember {
  0%, 3% { opacity: 0; transform: translateY(14px) scale(.4); }
  7%     { opacity: 1; transform: translateY(0) scale(1); }
  19%    { opacity: 0; transform: translateY(-16px) scale(.6) rotate(90deg); }
  100%   { opacity: 0; transform: translateY(-16px) scale(.6); }
}

.xc-wisp { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
.xc-wrap.xc-on .xc-wisp    { animation: xc-steam 3.2s .3s ease-in-out infinite; }
.xc-wrap.xc-on .xc-wisp.xc-w2 { animation-delay: .55s; }
@keyframes xc-steam {
  0%, 30% { opacity: 0; transform: translateY(6px) scaleY(.7); }
  46%     { opacity: .8; }
  78%     { opacity: 0; transform: translateY(-8px) scaleY(1.05); }
  100%    { opacity: 0; transform: translateY(-8px) scaleY(1.05); }
}

.xc-glint { opacity: 0; }
.xc-wrap.xc-on .xc-kglint { animation: xc-kglint 3.2s .4s ease-out infinite; }
.xc-wrap.xc-on .xc-tglint { animation: xc-tglint 3.2s .3s ease-out infinite; }
@keyframes xc-kglint {
  0%, 3% { opacity: 0; transform: translate(148.8px, 169.6px) scale(.2) rotate(0deg); }
  8%     { opacity: 1; transform: translate(148.8px, 169.6px) scale(1.15) rotate(45deg); }
  16%    { opacity: 0; transform: translate(148.8px, 169.6px) scale(.3) rotate(90deg); }
  100%   { opacity: 0; transform: translate(148.8px, 169.6px) scale(.3) rotate(90deg); }
}
@keyframes xc-tglint {
  0%, 50% { opacity: 0; transform: translate(150.4px, 51px) scale(.2) rotate(0deg); }
  55%     { opacity: 1; transform: translate(150.4px, 51px) scale(1.2) rotate(45deg); }
  62%     { opacity: 0; transform: translate(150.4px, 51px) scale(.3) rotate(90deg); }
  100%    { opacity: 0; transform: translate(150.4px, 51px) scale(.3) rotate(90deg); }
}

/* ⑨ YES, CHEF! — pops once from his mouth, then leaves */
.xc-yes {
  opacity: 0;
  transform-origin: 93px 70px;    /* the tail tip */
  transform: scale(0);
}
.xc-wrap.xc-on .xc-yes { animation: xc-yes 2.6s .95s both; }
/* small 4 % overshoot only, so the balloon never reaches the rim */
@keyframes xc-yes {
  0%   { opacity: 0; transform: scale(.15) rotate(10deg); animation-timing-function: ease-out; }
  11%  { opacity: 1; transform: scale(1.04) rotate(-1deg); animation-timing-function: ease-in-out; }
  17%  { opacity: 1; transform: scale(1) rotate(0deg); }
  84%  { opacity: 1; transform: scale(1); animation-timing-function: ease-in; }
  100% { opacity: 0; transform: scale(.2); }
}

@media (prefers-reduced-motion: reduce) {
  .xc-stage,
  .xc-wrap .xc-set,
  .xc-wrap .xc-fx g,
  .xc-wrap .xc-lamps { transition: none !important; }
  .xc-wrap.xc-on .xc-set,
  .xc-wrap.xc-on .xc-hat,
  .xc-wrap.xc-on .xc-flick,
  .xc-wrap.xc-on .xc-ember,
  .xc-wrap.xc-on .xc-wisp,
  .xc-wrap.xc-on .xc-glint { animation: none; }
  .xc-wrap.xc-on .xc-yes { animation: none; opacity: 1; transform: none; }
  .xc-wrap.xc-on .xc-fire { animation: none; transform: scale(.72); }
}
</style>


<script>
(function () {
  document.querySelectorAll('.xc-wrap').forEach(function (wrap) {
    if (wrap.dataset.xcReady === '1') return;
    wrap.dataset.xcReady = '1';
    var last = 0;
    function toggle() {
      // a double-click counts once, so a half-played entrance never gets restarted mid-way
      var now = Date.now();
      if (now - last < 400) return;
      last = now;
      var on = wrap.classList.toggle('xc-on');
      wrap.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    wrap.addEventListener('click', toggle);
    wrap.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        toggle();
      }
    });
  });
})();
</script>
