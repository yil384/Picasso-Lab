    </div>`;
    t.viewport = root.querySelector(".gd-viewport");
    t.rot = t.viewport.querySelector(".gd-rot");
    t.stage = t.viewport.querySelector(".gd-stage");
    t.probe = t.viewport.querySelector(".gd-safe-probe");
    t.ui = t.viewport.querySelector(".gd-ui-layer");
    t.toast = t.ui.querySelector(".gd-stage-toast");
    t.fx = t.stage.querySelector(".gd-fx-host");
    t.regions = {};
    t.stage.querySelectorAll("[data-region]").forEach(el => { t.regions[el.dataset.region] = el; });
    t.seats = [0, 1, 2, 3].map(pos => t.stage.querySelector(`.gd-seat.is-p${pos}`));
    t.avatars = t.seats.map(el => el.querySelector(".gd-av"));
    t.keys = {};
    t.cardEls = new Map();
    t.menuOpen = false;
    handSlide = null;
    t.stage.addEventListener("click", onTableClick);
    t.stage.addEventListener("pointerdown", onTablePointerDown);
    t.stage.addEventListener("contextmenu", event => event.preventDefault());
    const hand = t.regions.hand;
    hand.addEventListener("pointerdown", onHandPointerDown);
    hand.addEventListener("pointermove", onHandPointerMove);
    hand.addEventListener("pointerup", onHandPointerUp);
    hand.addEventListener("pointercancel", onHandPointerUp);
    layoutStage();
    return true;
}

// Scale the stage into the viewport, keeping the in-game UI out of the notch/home-indicator insets
// while the felt still bleeds edge to edge. Portrait phones, and portrait touch tablets, get it
// rotated 90deg (turning the device to landscape removes the rotation). A portrait window that
// stays upright (desktop) would get a very tall stage: it is capped at 4:3 and letterboxed on the
// floor colour instead of stretching the felt.
const STAGE_MAX_ASPECT = .75;
const coarsePointer = window.matchMedia?.("(pointer: coarse)");
function layoutStage() {
    const t = tableView;
    if (!t.rot?.isConnected) return false;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const rotated = vw < vh && (Math.max(vw, vh) <= 1024 || !!coarsePointer?.matches);
    const lw = rotated ? vh : vw;
    const lh = rotated ? vw : vh;
    const cs = getComputedStyle(t.probe);
    const left = parseFloat(rotated ? cs.paddingTop : cs.paddingLeft) || 0;
    const right = parseFloat(rotated ? cs.paddingBottom : cs.paddingRight) || 0;
    const aw = Math.max(1, lw - left - right);
    const s = Math.min(lh / STAGE_H, aw / STAGE_MIN_W);
    const w = aw / s;
    const h = Math.min(lh / s, w * STAGE_MAX_ASPECT);
    const rh = h * s;
    const top = rotated ? 0 : Math.round((lh - rh) / 2);
    t.rot.style.width = `${lw}px`;
    t.rot.style.height = `${rh}px`;
    t.rot.style.transform = rotated ? `translate(${vw}px, 0) rotate(90deg)` : top ? `translate(0, ${top}px)` : "";
    t.rot.style.setProperty("--gd-s", s.toFixed(4));
    t.stage.style.width = `${w}px`;
    t.stage.style.height = `${h}px`;
    t.stage.style.transform = `translate(${left}px, 0) scale(${s})`;
    t.viewport.classList.toggle("is-rotated", rotated);
    const changed = Math.abs(w - t.layout.w) > .5 || Math.abs(h - t.layout.h) > .5;
    t.layout = { s, w, h, rotated, left, top, vw };
    return changed;
}

function scheduleStageLayout() {
    if (stageLayoutFrame) return;
    stageLayoutFrame = requestAnimationFrame(() => {
        stageLayoutFrame = 0;
        if (layoutStage() && game && document.body.dataset.screen === "table") renderTable();
    });
}

// Viewport point -> stage design px (inverse of the transforms set in layoutStage).
function stagePoint(x, y) {
    const { s, rotated, left, top, vw } = tableView.layout;
    return rotated ? { x: (y - left) / s, y: (vw - x) / s } : { x: (x - left) / s, y: (y - top) / s };
}

// Rewrites one region only when its key changed; `html` may be a builder so unchanged regions
// cost nothing. Returns true when the region was rewritten.
function setRegion(name, key, html = key) {
    const el = tableView.regions[name];
    if (!el || tableView.keys[name] === key) return false;
    tableView.keys[name] = key;
    el.innerHTML = typeof html === "function" ? html() : html;
    return true;
}

function cardPower(card, levelRank) {
    return card.joker ? jokerPower(card) : rankPower(card.rank, levelRank);
}

// 理牌 groups, keyed to the current deal so they never leak into the next hand.
function liveHandGroups(cards, seat) {
    const key = handOrderKey(seat);
    if (handGroups.key !== key) handGroups = { key, groups: [] };
    const live = new Set(cards.map(c => c.id));
    handGroups.groups = handGroups.groups.map(ids => ids.filter(id => live.has(id))).filter(ids => ids.length);
    return handGroups.groups;
}

// Tencent 竖排: one column per rank, jokers far left, high -> low; same-rank cards stack with
// 方块 on top and 黑桃 in front. Each 理牌 group is its own column at the right end.
function handColumns(cards, levelRank, seat) {
    const groups = liveHandGroups(cards, seat);
    const grouped = new Set(groups.flat());
    const buckets = new Map();
    for (const card of cards) {
        if (grouped.has(card.id)) continue;
        const key = card.joker || card.rank;
        if (!buckets.has(key)) buckets.set(key, []);
        buckets.get(key).push(card);
    }
    const depth = (a, b) => (COLUMN_SUIT_DEPTH[a.suit] ?? 0) - (COLUMN_SUIT_DEPTH[b.suit] ?? 0) || a.id.localeCompare(b.id);
    const columns = [...buckets.values()]
        .sort((a, b) => cardPower(b[0], levelRank) - cardPower(a[0], levelRank))
        .map(list => ({ key: list[0].joker || list[0].rank, cards: list.sort(depth) }));
    const byId = new Map(cards.map(c => [c.id, c]));
    groups.forEach((ids, gi) => {
        const list = ids.map(id => byId.get(id)).filter(Boolean);
        const combo = choosePlayable(list, null, levelRank);
        const stacked = combo
            ? displayCardsForCombo(list, combo).reverse()
            : list.sort((a, b) => cardPower(b, levelRank) - cardPower(a, levelRank));
        columns.push({ key: `g${gi}`, group: true, cards: stacked });
    });
    return columns;
}

function handOrderKey(seat, g = game) {
    return `${roomCode || g?.roomCode || ""}:${g?.roundNo || 0}:${g?.dealStartedAt || 0}:${seat}`;
}

// 横排 row order: the columns read left to right (front card first), then any drag reorders.
function orderedHandForDisplay(cards, levelRank, seat) {
    const sorted = handColumns(cards, levelRank, seat).flatMap(col => [...col.cards].reverse());
    const key = handOrderKey(seat);
    const sortedIds = sorted.map(c => c.id);
    if (handOrderState.key !== key) {
        handOrderState = { key, ids: sortedIds };
        return sorted;
    }
    const liveIds = new Set(sortedIds);
    const nextIds = handOrderState.ids.filter(id => liveIds.has(id));
    const seen = new Set(nextIds);
    for (const card of sorted) {
        if (!seen.has(card.id)) nextIds.push(card.id);
    }
    handOrderState.ids = nextIds;
    const byId = new Map(cards.map(c => [c.id, c]));
    return nextIds.map(id => byId.get(id)).filter(Boolean);
}

function moveHandCard(dragId, targetId, before) {
    if (!dragId || !targetId || dragId === targetId) return false;
    const seat = mySeat();
    if (seat < 0) return false;
    orderedHandForDisplay(game.hands[seat] || [], game.currentLevelRank, seat);
    const ids = handOrderState.ids.filter(id => id !== dragId);
    const targetIndex = ids.indexOf(targetId);
    if (targetIndex < 0) return false;
    ids.splice(targetIndex + (before ? 0 : 1), 0, dragId);
    handOrderState.ids = ids;
    renderTable();
    return true;
}

// Hand bottom edge: 7.6% of the stage like Tencent, raised on small screens so the 重选/理牌/横排
// pills under it keep a 40 CSS px tap target that never reaches into the cards.
function handBottom() {
    return Math.max(HAND_BOTTOM, 40 / tableView.layout.s + 6);
}

// Column mode: every stacked card shows its whole index (the step is fixed at HAND_STEP). The
// pitch shrinks to fit the stage width down to HAND_MIN_PITCH; a column too tall for the room
// under the raised action row shrinks all hand cards (down to HAND_MIN_SCALE). Only a 理牌 group
// taller than that compresses its step. The geometry does not depend on whose turn it is, so the
// cards never resize when the turn comes round. Played cards keep their size.
function handGeometry(columns) {
    const { w, h } = tableView.layout;
    const avail = w - 64;
    if (handMode === "row") {
        const n = columns.reduce((sum, col) => sum + col.cards.length, 0);
        const pitch = n > 1 ? Math.min(HAND_CARD_W * .52, (avail - HAND_CARD_W) / (n - 1)) : HAND_CARD_W;
        return { cardW: HAND_CARD_W, pitch, step: 0, height: HAND_CARD_H * 1.18 };
    }
    const n = columns.length;
    const tallest = Math.max(1, ...columns.map(col => col.cards.length));
    const room = h - handBottom() - ACTION_ROW_GAP - ACTION_ROW_H - ROW_MIN_TOP;
    const fitW = n > 1 ? avail / (HAND_CARD_W * (HAND_MIN_PITCH * (n - 1) + 1)) : 1;
    const fitH = room / (HAND_CARD_H * (1 + HAND_STEP * (tallest - 1)));
    const k = Math.max(HAND_MIN_SCALE, Math.min(1, fitW, fitH));
    const cardW = HAND_CARD_W * k;
    const cardH = HAND_CARD_H * k;
    const pitch = n > 1 ? Math.min(cardW + 1, (avail - cardW) / (n - 1)) : cardW;
    const step = tallest > 1 ? Math.min(cardH * HAND_STEP, Math.max(0, room - cardH) / (tallest - 1)) : cardH * HAND_STEP;
    return { cardW, pitch, step, height: cardH + (tallest - 1) * step };
}

// How far a side seat's played cards (or its 不出) reach in from the stage edge, in design px.
function sidePlayReach(i, v) {
    const entry = game.trickPlays?.[i];
    if (!entry || v.liveTurn === i) return 0;
    if (entry.actionType === "pass") return SIDE_PLAY_INSET + 110;
    const n = valuesFromFirebase(entry.cards).length;
    return n ? SIDE_PLAY_INSET + 80.6 * (1 + .48 * (n - 1)) : 0;
}

// The row sits just above the tallest hand column. When that lifts it into the band of the side
// seats' played cards (大掼蛋 2026 keeps it there, inboard of them), its pills narrow to pass
// between those plays, down to PILL_MIN_W.
function actionPillWidth(v, rowTop) {
    if (!v.canAct || rowTop >= SIDE_PLAY_TOP + PLAYED_H) return PILL_W;
    const { w } = tableView.layout;
    const reach = Math.max(...[1, 3].map(pos => sidePlayReach((v.mine + pos) % 4, v)));
    if (!reach) return PILL_W;
    const pills = v.lead || v.noBeat ? 2 : 3;
    const free = w - 2 * (reach + 16) - ROW_HEX_W - pills * ROW_GAP_X;
    return Math.max(PILL_MIN_W, Math.min(PILL_W, Math.floor(free / pills)));
}

// Selection survives ticks: it is only pruned to the cards still in hand, and dropped when a
// new deal starts (card ids repeat across rounds).
function syncSelection(seat, cards) {
    const key = seat >= 0 ? handOrderKey(seat) : "";
    if (key !== selectionKey) {
        selectionKey = key;
        selected.clear();
        hintAdvisor = null;
        return;
    }
    const live = new Set(cards.map(c => c.id));
    for (const id of [...selected]) if (!live.has(id)) selected.delete(id);
}

// Hand cards are keyed DOM nodes: a re-layout moves the existing elements into new columns
// instead of re-creating them, so portraits never re-decode and nothing flickers. Cards always
// carry [data-card-id]; whether they react is decided by handInteractive().
function renderHand(columns, rowCards, geo, dealPhase) {
    const host = tableView.regions.hand;
    const layoutIds = handMode === "row"
        ? rowCards.map(c => c.id).join(",")
        : columns.map(col => col.cards.map(c => c.id).join(",")).join("|");
    const key = `${handMode}:${geo.cardW.toFixed(2)}:${geo.pitch.toFixed(2)}:${geo.step.toFixed(2)}:${dealPhase}:${uiLang}:${game.currentLevelRank}:${layoutIds}`;
    if (tableView.keys.hand === key) return;
    tableView.keys.hand = key;
    host.style.setProperty("--card-w", `${geo.cardW.toFixed(2)}px`);
    tableView.handCardW = geo.cardW;
    if (dealPhase === "dealing" || !columns.length) {
        host.textContent = "";
        tableView.cardEls = new Map();
        return;
    }
    const sig = `${uiLang}:${game.currentLevelRank}`;
    const cache = tableView.cardEls;
    const next = new Map();
    const tpl = document.createElement("template");
    const cardEl = card => {
        let hit = cache.get(card.id);
        if (!hit || hit.sig !== sig) {
            tpl.innerHTML = cardHTML(card, false, true);
            hit = { el: tpl.content.firstElementChild, sig };
        }
        next.set(card.id, hit);
        return hit.el;
    };
    const sorting = dealPhase === "sorting" ? " is-sorting" : "";
    const wrap = document.createElement("div");
    wrap.style.setProperty("--pitch", `${geo.pitch}px`);
    if (handMode === "row") {
        wrap.className = `gd-row card-ix-v${sorting}`;
        rowCards.forEach((card, i) => {
            const el = cardEl(card);
            el.style.setProperty("--ci", i);
            wrap.append(el);
        });
    } else {
        wrap.className = `gd-cols${sorting}`;
        wrap.style.setProperty("--step", `${geo.step}px`);
        columns.forEach((col, ci) => {
            const colEl = document.createElement("div");
            colEl.className = col.group ? "gd-col is-group" : "gd-col";
            colEl.style.setProperty("--ci", ci);
            col.cards.forEach(card => {
                const el = cardEl(card);
                el.style.removeProperty("--ci");
                colEl.append(el);
            });
            wrap.append(colEl);
        });
    }
    host.replaceChildren(wrap);
    tableView.cardEls = next;
}

function selectionVerdict(mine) {
    const cards = (game.hands[mine] || []).filter(c => selected.has(c.id));
    if (!cards.length) return { ok: false, reason: L("Select cards first", "请先选牌") };
    if (choosePlayable(cards, game.lastPlay?.combo || null, game.currentLevelRank)) return { ok: true, reason: "" };
    const legal = evaluateCombos(cards, game.currentLevelRank).length > 0;
    return { ok: false, reason: legal && game.lastPlay ? L("Can't beat that", "管不上") : L("Not a valid combo", "牌型不符") };
}

// Selection changes never rebuild the hand: classes and the 出牌 state are patched in place.
function refreshSelectionUI() {
    const hand = tableView.regions.hand;
    if (!hand?.isConnected) return;
    hand.querySelectorAll("[data-card-id]").forEach(el => el.classList.toggle("selected", selected.has(el.dataset.cardId)));
    const mine = mySeat();
    const playBtn = document.getElementById("play-btn");
    if (playBtn && mine >= 0) {
        const off = !selectionVerdict(mine).ok;
        playBtn.classList.toggle("is-disabled", off);
        playBtn.setAttribute("aria-disabled", String(off));
    }
    const clearBtn = document.getElementById("clear-btn");
    if (clearBtn) clearBtn.classList.toggle("is-idle", !selected.size);
}

function handInteractive() {
    const mine = mySeat();
    return !!game && game.phase === "playing" && mine >= 0 && !actionBusy && currentDealPhase() === "done";
}

// Press-and-slide selection. Column mode applies the press mode (select/deselect) to every card
// the pointer crosses; row mode selects the contiguous run between the pressed card and the
// pointer. In row mode a still long-press picks the card up to reorder it instead.
function onHandPointerDown(event) {
    const card = event.target.closest?.("[data-card-id]");
    if (!card || handSlide || !handInteractive()) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;
    event.preventDefault();
    const host = tableView.regions.hand;
    const id = card.dataset.cardId;
    handSlide = {
        pointerId: event.pointerId,
        startId: id,
        lastId: "",
        add: !selected.has(id),
        before: new Set(selected),
        order: [...host.querySelectorAll("[data-card-id]")].map(el => el.dataset.cardId),
        x0: event.clientX, y0: event.clientY,
        x: event.clientX, y: event.clientY,
        moved: false,
        reorder: null,
        hold: handMode === "row" ? setTimeout(startHandReorder, 380) : 0
    };
    try { host.setPointerCapture(event.pointerId); } catch (_) {}
    hintAdvisor = null;
    slideOver(id);
    refreshSelectionUI();
}

function slideOver(id) {
    const s = handSlide;
    if (!s || id === s.lastId) return;
    s.lastId = id;
    if (handMode === "row") {
        const a = s.order.indexOf(s.startId);
        const b = s.order.indexOf(id);
        const lo = Math.min(a, b);
        const hi = Math.max(a, b);
        s.order.forEach((cid, idx) => {
            const want = idx >= lo && idx <= hi ? s.add : s.before.has(cid);
            if (want) selected.add(cid);
            else selected.delete(cid);
        });
    } else if (s.add) {
        selected.add(id);
    } else {
        selected.delete(id);
    }
}

function handCardAt(x, y) {
    const el = document.elementFromPoint(x, y)?.closest?.("[data-card-id]");
    return el && tableView.regions.hand.contains(el) ? el : null;
}

function onHandPointerMove(event) {
    const s = handSlide;
    if (!s || event.pointerId !== s.pointerId) return;
    if (s.reorder) {
        updateHandReorder(event.clientX, event.clientY);
        return;
    }
    if (!s.moved && Math.hypot(event.clientX - s.x0, event.clientY - s.y0) > 8) {
        s.moved = true;
        clearTimeout(s.hold);
    }
    // Walk the segment so a fast swipe cannot skip a column.
    const dx = event.clientX - s.x;
    const dy = event.clientY - s.y;
    const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 8));
    const before = s.lastId;
    for (let k = 1; k <= steps; k++) {
        const el = handCardAt(s.x + dx * k / steps, s.y + dy * k / steps);
        if (el) slideOver(el.dataset.cardId);
    }
    s.x = event.clientX;
    s.y = event.clientY;
    if (s.lastId !== before) refreshSelectionUI();
}

function startHandReorder() {
    const s = handSlide;
    if (!s || s.moved) return;
    selected = new Set(s.before);
    s.reorder = { id: s.startId, targetId: "", before: true };
    tableView.regions.hand.querySelector(`[data-card-id="${CSS.escape(s.startId)}"]`)?.classList.add("drag-source");
    refreshSelectionUI();
}

function clearHandDropMarks() {
    tableView.regions.hand?.querySelectorAll(".drag-source,.drop-before,.drop-after")
        .forEach(el => el.classList.remove("drag-source", "drop-before", "drop-after"));
}

function updateHandReorder(x, y) {
    const r = handSlide.reorder;
    tableView.regions.hand.querySelectorAll(".drop-before,.drop-after").forEach(el => el.classList.remove("drop-before", "drop-after"));
    const el = handCardAt(x, y);
    if (!el || el.dataset.cardId === r.id) {
        r.targetId = "";
        return;
    }
    const box = el.getBoundingClientRect();
    const centre = stagePoint(box.left + box.width / 2, box.top + box.height / 2);
    r.before = stagePoint(x, y).x < centre.x;
    r.targetId = el.dataset.cardId;
    el.classList.add(r.before ? "drop-before" : "drop-after");
}

function onHandPointerUp(event) {
    const s = handSlide;
    if (!s || event.pointerId !== s.pointerId) return;
    clearTimeout(s.hold);
    handSlide = null;
    clearHandDropMarks();
    if (s.reorder?.targetId) moveHandCard(s.reorder.id, s.reorder.targetId, s.reorder.before);
}

function clearSelection() {
    if (!selected.size) return;
    selected.clear();
    hintAdvisor = null;
    refreshSelectionUI();
}

// Tapping empty felt clears the selection; while the ☰ menu is open its scrim catches the tap
// (closed on click, so the release cannot land on whatever was under the scrim).
function onTablePointerDown(event) {
    if (event.target.closest("[data-card-id], button, .gd-menu-host, .gd-jipai, .gd-result-host > *, .gd-seat")) return;
    clearSelection();
}

function onTableClick(event) {
    if (event.target.closest(".gd-scrim")) {
        tableView.menuOpen = false;
        return renderTableChrome();
    }
    const btn = event.target.closest("button");
    if (!btn || !tableView.stage.contains(btn) || btn.disabled) return;
    const mine = mySeat();
    switch (btn.id) {
        case "play-btn":
            if (btn.classList.contains("is-disabled")) return showToast(selectionVerdict(mine).reason, 1300);
            return playSelected();
        case "pass-btn": return passTurn();
        case "hint-btn": return hintMove();
        case "clear-btn": return clearSelection();
        case "next-round": return nextRound();
    }
    const act = btn.dataset.act || "";
    const closeMenu = act.startsWith("m-");
    if (closeMenu) tableView.menuOpen = false;
    switch (act.replace(/^m-/, "")) {
        case "menu": tableView.menuOpen = !tableView.menuOpen; break;
        case "tracker":
            jipaiOpen = !jipaiOpen;
            storageSet("picasso.guandan.jipai", jipaiOpen ? "on" : "off");
            return renderTable();
        case "tracker-tab": tableView.jipaiTab = btn.dataset.tab === "log" ? "log" : "count"; break;
        case "rules":
            if (window.GuandanUI?.openRules) window.GuandanUI.openRules(tableView.ui);
            else showToast(L("Rules are loading", "规则加载中"));
            break;
        case "invite": copyLinkBtn.click(); break;
        case "lang": langToggleBtn.click(); return;
        case "music": {
            const music = window.GuandanMusic;
            if (!music) break;
            music.setOn(!music.isOn());
            showToast(music.isOn() ? L("Music on", "音乐已开启") : L("Music off", "音乐已关闭"));
            break;
        }
        case "newroom": newRoomBtn.click(); return;
        case "exit": startReturnToEvents(); return;
        case "lipai": return groupSelection();
        case "hengpai":
            handMode = handMode === "row" ? "col" : "row";
            storageSet("picasso.guandan.handMode", handMode);
            clearSelection();
            return renderTable();
        default: return;
    }
    renderTableChrome();
}

// 理牌: selected cards become their own column; with nothing selected it restores the default.
function groupSelection() {
    const mine = mySeat();
    if (mine < 0) return;
    const cards = game.hands[mine] || [];
    liveHandGroups(cards, mine);
    if (selected.size) {
        const ids = cards.filter(c => selected.has(c.id)).map(c => c.id);
        const picked = new Set(ids);
        handGroups.groups = [...handGroups.groups.map(g => g.filter(id => !picked.has(id))).filter(g => g.length), ids];
        selected.clear();
        hintAdvisor = null;
    } else if (handGroups.groups.length) {
        handGroups.groups = [];
    } else {
        return;
    }
    handOrderState = { key: "", ids: [] };
    renderTable();
}

// Remaining cards per rank that are neither in my hand nor played (the other hands). Red when a
// bomb is still possible (4+, or every joker / 逢人配 still out), orange for a few, gray for none.
function jipaiHTML(mine) {
    if (!jipaiOpen) return "";
    const level = game.currentLevelRank;
    const counts = {};
    [0, 1, 2, 3].forEach(seat => {
        if (seat === mine) return;
        for (const c of game.hands[seat] || []) {
            const key = c.joker || (isWild(c, level) ? "wild" : c.rank);
            counts[key] = (counts[key] || 0) + 1;
        }
    });
    const tab = tableView.jipaiTab;
    const tabs = `<div class="gd-jp-tabs"><button type="button" data-act="tracker-tab" data-tab="count" class="${tab === "count" ? "is-on" : ""}">${L("Tracker", "记牌器")}</button><button type="button" data-act="tracker-tab" data-tab="log" class="${tab === "log" ? "is-on" : ""}">${L("Plays", "出牌记录")}</button></div>`;
    if (tab === "log") {
        const glyph = c => `<i class="${cardColor(c) ? "is-red" : ""}">${c.joker ? jokerIconHTML(c) : `${rankGlyphHTML(c.rank)}${suitSvgHTML(c.suit, "")}`}</i>`;
        const rows = valuesFromFirebase(game.history).slice(-12).reverse().map(h => {
            let play;
            if (h.actionType === "pass") play = `<span class="is-pass">${L("Pass", "不出")}</span>`;
            else if (h.actionType === "finish") play = `<small>${encodeHTML(translateAction(h.action, h))}</small>`;
            else {
                const special = h.combo && !["single", "pair", "triple"].includes(h.combo.type);
                play = displayCardsForCombo(valuesFromFirebase(h.cards), h.combo).map(glyph).join("")
                    + (special ? `<small>${encodeHTML(translateAction(h.action, h))}</small>` : "");
            }
            return `<li><b>${encodeHTML(displaySeatName(game.seats[h.player]))}</b><span class="gd-jp-play">${play}</span></li>`;
        }).join("");
        return `<div class="gd-jipai is-log">${tabs}<ul class="gd-jp-log">${rows || `<li class="is-empty">${L("No plays yet", "还没有人出牌")}</li>`}</ul></div>`;
    }
    const cell = key => {
        const n = counts[key] || 0;
        const max = key === "RJ" || key === "BJ" || key === "wild" ? 2 : 4;
        const tone = !n ? "is-none" : n >= max ? "is-hot" : "is-some";
        const head = key === "wild"
            ? suitSvgHTML("H", "gd-jp-wild")
            : key === "RJ" || key === "BJ"
                ? `<span class="gd-jp-joker">${jokerIconHTML({ joker: key })}</span>`
                : `<b class="gd-jp-rank">${rankGlyphHTML(key)}</b>${key === level ? `<span class="gd-jp-ji">${L("LV", "级")}</span>` : ""}`;
        return `<div class="gd-jp-cell"><div class="gd-jp-head${key === "RJ" || key === "wild" ? " is-red" : ""}">${head}</div><div class="gd-jp-num ${tone}">${n}</div></div>`;
    };
    return `<div class="gd-jipai">${tabs}<div class="gd-jp-grid">${JIPAI_ORDER.map(cell).join("")}</div></div>`;
}

// Lab stat on a seat plate: the labmate's win rate on the 巅峰对决 board (read-only).
function seatMemberStat(name) {
    const clean = String(name || "").trim().toLowerCase();
    const R = window.GuandanRecords;
    if (!clean || !R?.PLAYERS || !Array.isArray(R.MATCHES)) return "";
    const key = Object.keys(R.PLAYERS).find(k => {
        const pname = String(R.PLAYERS[k]?.name || "").trim().toLowerCase();
        return pname && (clean === pname || clean.includes(pname) || pname.includes(clean));
    });
    if (!key) return "";
    let played = 0;
    let won = 0;
    for (const m of R.MATCHES) {
        const side = m.teamA?.includes(key) ? "A" : m.teamB?.includes(key) ? "B" : "";
        if (!side) continue;
        played++;
        if (m.winner === side) won++;
    }
    const pct = played ? Math.round(won * 100 / played) : 0;
    return played ? L(`Win ${pct}%`, `胜率 ${pct}%`) : "";
}

function seatFaceHTML(i, name) {
    const seat = game.seats[i];
    if (!seat) return `<span class="gd-av-glyph is-empty">${L("Open", "空")}</span>`;
    const photo = seat.type === "human" ? seatMemberPhoto(name) : null;
    if (photo) return `<img src="${encodeHTML(photo)}" alt="" draggable="false">`;
    if (seat.type === "ai") return `<span class="gd-av-glyph is-ai">${encodeHTML(Array.from(name)[0] || "AI")}</span>`;
    return `<span class="gd-av-glyph">${encodeHTML(initials(name, String(i + 1)))}</span>`;
}

function clockHTML(kind) {
    return kind === "hex"
        ? `<div class="gd-hex" data-turn-clock><svg viewBox="0 0 100 112" aria-hidden="true"><use href="#gd-sym-hex"/></svg><b id="turn-clock"></b></div>`
        : `<div class="gd-clock" data-turn-clock><svg viewBox="0 0 100 106" aria-hidden="true"><use href="#gd-sym-clock"/></svg><b id="turn-clock"></b></div>`;
}

// Seat: avatar (ring + relation pill, 剩N张 report at <=10, finish place), name plate with a
// lab stat, 首 tag, the active-seat clock and any jokers made public by 抗贡.
function renderSeat(i, v) {
    const pos = visualSeatPos(i, v.mine);
    const seat = game.seats[i];
    const name = displaySeatName(seat, L(`Seat ${i + 1}`, `${i + 1} 号位`));
    const relation = relationForSeat(i, v.mine);
    const count = (game.hands[i] || []).length;
    const place = finishedList(game).indexOf(i) + 1;
    const bottom = pos === 0;
    const turn = v.liveTurn === i && !(bottom && v.mine >= 0);
    const el = tableView.seats[pos];
    el.className = `gd-seat is-p${pos} is-${relation.key}${turn ? " is-turn" : ""}${place ? " is-done" : ""}`;
    tableView.avatars[pos].className = `gd-av${relation.key === "opponent" ? " is-opp" : ""}`;
    setRegion(`face${pos}`, seatFaceHTML(i, name));
    // a finished seat's place is the ribbon at its play slot (renderSlot)
    let tag = "";
    if (!place && !bottom && count > 0 && count <= 10) tag = `<span class="gd-av-tag is-report">${isZH() ? `剩<b>${count}</b>张` : `<b>${count}</b> left`}</span>`;
    else if (!bottom) tag = `<span class="gd-av-tag">${relation.label}</span>`;
    // Tencent shows nothing above 10 cards; the exact count is a 记牌器 extra.
    const chip = jipaiOpen && !bottom && !place && count > 10 ? `<span class="gd-av-count">${count}</span>` : "";
    const first = v.leader === i ? `<span class="gd-first">${L("Lead", "首")}</span>` : "";
    setRegion(`deco${pos}`, tag + chip + first);
    const stat = seat?.type === "human" ? seatMemberStat(name) : "";
    setRegion(`name${pos}`, `<span class="nm">${encodeHTML(name)}</span>${stat ? `<span class="st">${stat}</span>` : ""}`);
    const jokers = valuesFromFirebase(game.publicJokerSeats).includes(i) ? (game.hands[i] || []).filter(c => c.joker === "RJ") : [];
    const jokerHTML = jokers.length ? `<div class="gd-public-jokers" title="${L("Revealed by blocked tribute", "抗贡亮出的大王")}">${jokers.map(c => cardHTML(c, true)).join("")}</div>` : "";
    setRegion(`extra${pos}`, (turn ? clockHTML("clock") : "") + jokerHTML);
}

// Played cards (or the 不出 word) at a seat's slot. The seat whose turn it is has its slot
// cleared, as in Tencent. A fresh play flies in (see playFlightSources) or, without a source, pops
// in; special combos get their label. All of it is keyed by the play stamp, so it never replays.
const COMBO_LABELS = {
    straight: ["Straight", "顺子"],
    pairStraight: ["Pairs", "连对"],
    tripleStraight: ["Plates", "钢板"],
    fullhouse: ["Full House", "三带二"]
};
function renderSlot(i, v, animate, flights, bursts) {
    const pos = visualSeatPos(i, v.mine);
    const place = v.dealPhase === "done" ? seatPlace(i) : 0;
    const entry = v.dealPhase === "done" && v.liveTurn !== i ? game.trickPlays?.[i] : null;
    if (!entry && !place) {
        setRegion(`slot${pos}`, "");
        return;
    }
    const stamp = seatPlayStamp(entry);
    setRegion(`slot${pos}`, `${stamp}:${place}:${uiLang}:${game.currentLevelRank}`, () => {
        let html = "";
        if (entry) {
            const fresh = animate && !tableView.seenPlays.has(stamp);
            tableView.seenPlays.add(stamp);
            const enter = fresh && !flights.has(i) ? " is-enter" : "";
            if (entry.actionType === "pass") {
                html = `<div class="gd-pass-word${enter}">${L("Pass", "不出")}</div>`;
            } else {
                const cards = displayCardsForCombo(valuesFromFirebase(entry.cards), entry.combo);
                const label = fresh && !entry.combo?.isBomb && COMBO_LABELS[entry.combo?.type];
                html = `<div class="gd-played${enter}">${cards.map(c => cardHTML(c, true, false, `data-pid="${encodeHTML(c.id)}"`)).join("")}</div>`
                    + (label ? `<span class="gd-combo-label">${wordHTML(L(...label))}</span>` : "");
                if (fresh && entry.combo?.isBomb) bursts.push({ seat: i, pos, combo: entry.combo });
            }
        }
        if (place) {
            const key = `rb:${game.roomCode}:${game.roundNo}:${i}:${place}`;
            const enter = animate && !tableView.seenPlays.has(key) ? " is-enter" : "";
            tableView.seenPlays.add(key);
            html += `<span class="gd-ribbon ${place <= 2 ? "is-warm" : "is-cool"}${enter}"><b>${PLACE_LABELS[uiLang][place - 1]}</b></span>`;
        }
        return html;
    });
}

// Finishing place (1-4) of a seat this round, 0 while it still plays.
function seatPlace(i) {
    const order = game.phase === "playing" ? finishedList(game) : valuesFromFirebase(game.roundResult?.order);
    return order.indexOf(i) + 1;
}

// Display words (combo labels, bomb names, 抗贡, 胜利): gold gradient over a dark-brown outline.
// The outline is the element's own stroked text; the gradient fill is the ::after copy on top.
function wordHTML(text, cls = "") {
    const t = encodeHTML(text);
    return `<b class="gd-word${cls ? ` ${cls}` : ""}" data-t="${t}">${t}</b>`;
}

// Fresh plays about to appear: mine fly from where the cards sat in my hand (read before the hand
// re-lays out), everyone else's from their avatar. Returns seat -> source.
function playFlightSources(v, animate) {
    const out = new Map();
    if (!animate || v.dealPhase !== "done" || prefersReducedMotion()) return out;
    (game.trickPlays || []).forEach((entry, i) => {
        if (!entry || entry.actionType === "pass" || v.liveTurn === i || tableView.seenPlays.has(seatPlayStamp(entry))) return;
        if (i === v.mine) {
            const rects = new Map();
            valuesFromFirebase(entry.cards).forEach(c => {
                const el = tableView.cardEls.get(c.id)?.el;
                if (el?.isConnected) rects.set(c.id, el.getBoundingClientRect());
            });
            if (rects.size) out.set(i, { rects, scale: tableView.handCardW / (HAND_CARD_W * .79) });
        } else {
            out.set(i, { avatar: tableView.avatars[visualSeatPos(i, v.mine)].getBoundingClientRect(), scale: .45 });
        }
    });
    return out;
}

// FLIP: each played card starts at its source (in stage design px, so the rotated stage works too)
// and settles into the slot in ~200 ms. Transform and opacity only.
function runPlayFlights(flights, v) {
    const centre = r => stagePoint(r.left + r.width / 2, r.top + r.height / 2);
    flights.forEach((src, i) => {
        const slot = tableView.regions[`slot${visualSeatPos(i, v.mine)}`];
        slot.querySelectorAll(".gd-played .card").forEach((el, k) => {
            const from = src.rects ? src.rects.get(el.dataset.pid) : src.avatar;
            if (!from) return;
            const a = centre(from);
            const b = centre(el.getBoundingClientRect());
            el.animate([
                { transform: `translate(${(a.x - b.x).toFixed(1)}px, ${(a.y - b.y).toFixed(1)}px) scale(${src.scale.toFixed(3)})`, opacity: src.rects ? 1 : 0 },
                { transform: "none", opacity: 1 }
            ], { duration: 210, delay: src.rects ? 0 : k * 16, easing: "cubic-bezier(.2, .8, .2, 1)", fill: "backwards" });
        });
    });
}

function seatPlayStamp(entry) {
    if (!entry) return "";
    return `${entry.player ?? ""}:${entry.actionType || ""}:${entry.at || ""}:${valuesFromFirebase(entry.cards).map(c => c.id).join("-")}`;
}

function displayCardsForCombo(cards = [], combo = null) {
    return engineDisplayCardsForCombo(cards, combo, game?.currentLevelRank || "2");
}

// The seat that led the round's first trick (the 首 tag). Remembered from the opening lead; a
// mid-round rejoin falls back to the first history entry while the history is not yet capped.
function roundLeaderSeat() {
    const key = dealKey();
    if (isOpeningLead(game)) {
        tableView.leader = { key, seat: game.currentTurn };
        return game.currentTurn;
    }
    if (tableView.leader.key === key) return tableView.leader.seat;
    const hist = valuesFromFirebase(game.history);
    return hist.length && hist.length < 16 ? hist[0].player : -1;
}

function obviousPassNow(mine) {
    if (!game.lastPlay) return false;
    const key = `${game.roomCode}:${game.revision}:${mine}`;
    if (noBeatMemo.key !== key) {
        noBeatMemo = { key, value: obviouslyCannotBeat(game.hands[mine] || [], game.lastPlay.combo, game.currentLevelRank) };
    }
    return noBeatMemo.value;
}

// [不出] [timer] [提示] [出牌]: only on my turn. No 不出 on a lead; when the engine sees no way to

    const hint = v.noBeat ? "" : `<button class="btn pass${spaced}" id="hint-btn" type="button">${hit}${L("Hint", "提示")}</button>`;

function toolsHTML(v) {

    return `<button class="gd-tool is-idle" id="clear-btn" type="button">${L("Reset", "重选")}</button>
        <button class="gd-tool" type="button" data-act="lipai"><svg class="gd-ico" viewBox="0 0 32 32" aria-hidden="true"><path fill="#fff" d="m16 4 13 6.5-13 6.5L3 10.5Zm-9.2 11 9.2 4.6 9.2-4.6 3.8 1.9-13 6.5-13-6.5Zm0 6 9.2 4.6 9.2-4.6 3.8 1.9L16 29.4 3 22.9Z"/></svg>${L("Group", "理牌")}</button>
        <button class="gd-tool" type="button" data-act="hengpai"><svg class="gd-ico" viewBox="0 0 32 32" aria-hidden="true"><path fill="#fff" d="${handMode === "row" ? "M4 5h24v6H4Zm0 8h24v6H4Zm0 8h24v6H4Z" : "M5 4h6v24H5Zm8 0h6v24h-6Zm8 0h6v24h-6Z"}"/></svg>${handMode === "row" ? L("Columns", "竖排") : L("Row", "横排")}</button>`;
}

// Deal: backs arc from a centre deck toward the four seats over DEALING_MS, synced to dealStartedAt
// (a rejoin mid-deal resumes mid-flight through negative delays), each flight shrinking and fading
// at the seat's inboard edge so no face is covered; the hand then rises column by column during
// SORTING_MS. One flight stands for two cards. Your hand is never face-up before the deal ends.
const DEAL_FLIGHTS = DEAL_CARD_COUNT / 2;
function dealHTML(v) {
    if (v.dealPhase !== "dealing") return "";
    const { w, h } = tableView.layout;
    const ox = w / 2;
    const oy = h * .36;
    const targets = {
        0: [0, h - handBottom() - HAND_CARD_H * .6 - oy],
        1: [196 - ox, 250 - oy],
        2: [0, 172 - oy],
        3: [w - 196 - ox, 250 - oy]
    };
    const elapsed = Math.max(0, Date.now() - Number(game.dealStartedAt || 0));
    const gap = (DEALING_MS - 560) / DEAL_FLIGHTS;
    const back = `<i class="gd-back"><span class="gd-back-emblem">P</span></i>`;
    const flights = prefersReducedMotion() ? "" : Array.from({ length: DEAL_FLIGHTS }, (_, idx) => {
        const pos = visualSeatPos(idx % 4, v.mine);
        const [tx, ty] = targets[pos];
        const spread = pos === 0 ? ((idx >> 2) - 6.5) * 40 : 0;
        const tilt = ((idx * 37) % 13) - 6;
        return `<i class="gd-deal-card" style="--tx:${(tx + spread).toFixed(0)}px;--ty:${ty.toFixed(0)}px;--r:${tilt}deg;animation-delay:${Math.round(idx * gap - elapsed)}ms">${back}</i>`;
    }).join("");
    return `<div class="gd-deal" style="--deal-left:${Math.round(DEALING_MS - elapsed)}ms"><div class="gd-deck"><i class="gd-back"></i><i class="gd-back"></i>${back}</div>${flights}</div>`;
}

// 首出 (qqg_result_zoom): when the deal ends, the round-1 starting card pops up at the centre
// with a warm ribbon, then shrinks into the seat that holds it and leads (which keeps its 首 tag).
// Keyed by the deal, so a re-render never replays it and a rejoin resumes it in step.
const FIRST_LEAD_MS = 1500;
function firstLeadKey(v) {
    const since = Date.now() - Number(game.dealStartedAt || 0) - DEALING_MS;
    if (!game.startingCard || v.dealPhase === "dealing" || v.leader < 0 || since < 0 || since > FIRST_LEAD_MS) return "";
    return `${dealKey()}:${v.leader}:${uiLang}`;
}
function firstLeadHTML(v) {
    const { w, h } = tableView.layout;
    const pos = visualSeatPos(v.leader, v.mine);
    const seat = { 0: [92, h - 50], 1: [90, 240], 2: [w / 2, 58], 3: [w - 90, 240] }[pos];
    const card = { ...game.startingCard, id: "first-lead" };
    const since = Date.now() - Number(game.dealStartedAt || 0) - DEALING_MS;
    return `<div class="gd-first-lead" style="--tx:${(seat[0] - w / 2).toFixed(0)}px;--ty:${(seat[1] - h * .4).toFixed(0)}px;animation-delay:${-since}ms">${cardHTML(card)}<span class="gd-first-ribbon">${L("First lead", "首出")}</span></div>`;
}

// 进贡/还贡/抗贡 (round 2+): as the last deal flights land, each tribute card flies payer -> receiver
// under an orange 进贡 plate, then the returned card flies back under a blue 还贡 plate (a double
// tribute flies both pairs at once); a blocked tribute shows 抗贡 at the centre (the revealed
// jokers sit at the seats). The whole moment ends inside the deal window (DEALING_MS + SORTING_MS),
// before anyone can act, so it never crosses the first lead or the action row. The region is
// rendered with the deal and keyed by it: delays are synced to dealStartedAt and never replay.
const TRIBUTE_AT = DEALING_MS - 200;        // the deal's last flights have landed
const TRIBUTE_FLY_MS = 640;                 // pop, hold, 340 ms flight, fade (see gd-tribute)
const TRIBUTE_RETURN_AT = 480;              // 还贡 leaves as the 进贡 card lands
const TRIBUTE_MS = TRIBUTE_RETURN_AT + TRIBUTE_FLY_MS;
function tributeKey(v) {
    const elapsed = Date.now() - Number(game.dealStartedAt || 0);
    if (!game.selectedTributes?.length || game.startingCard || elapsed > TRIBUTE_AT + TRIBUTE_MS) return "";
    return `${dealKey()}:${v.mine}:${uiLang}`;
}
function tributeHTML(v) {
    const { w, h } = tableView.layout;
    // each seat's played-card slot, so nothing crosses the rising hand
    const at = { 0: [w / 2, h * .32 + PLAYED_H / 2], 1: [215, 244], 2: [w / 2, 166], 3: [w - 215, 244] };
    const since = Date.now() - Number(game.dealStartedAt || 0) - TRIBUTE_AT;
    const rows = game.selectedTributes.filter(r => r?.tributeCard);
    if (!rows.length) return `<div class="gd-kanggong" style="animation-delay:${-since}ms">${wordHTML(L("Tribute blocked", "抗贡"))}</div>`;
    const fly = (card, from, to, cls, label, delay) => `<div class="gd-tribute ${cls}" style="left:${from[0].toFixed(0)}px;top:${from[1].toFixed(0)}px;--tx:${(to[0] - from[0]).toFixed(0)}px;--ty:${(to[1] - from[1]).toFixed(0)}px;animation-delay:${delay - since}ms"><span>${label}</span>${cardHTML(card, true)}</div>`;
    return rows.map(r => {
        const payer = at[visualSeatPos(r.payerSeat, v.mine)];
        const receiver = at[visualSeatPos(r.receiverSeat, v.mine)];
        return fly(r.tributeCard, payer, receiver, "is-in", L("Tribute", "进贡"), 0)
            + (r.returnCard ? fly(r.returnCard, receiver, payer, "is-back", L("Return", "还贡"), TRIBUTE_RETURN_AT) : "");
    }).join("");
}

// Round/system messages become short toasts (plays and passes are already visible at the seats).
function maybeToastTableMessage() {
    const msg = game.message || "";
    const key = `${game.roomCode}:${game.roundNo}:${msg}`;
    const first = tableView.lastMessage === null;
    if (key === tableView.lastMessage) return;
    tableView.lastMessage = key;
    if (first && !dealWindowOpen(game)) return;
    if (game.phase !== "playing" || !msg || /出了 .+。$|不要。$|收牌，继续出。$|入座。$|加入对局。$|^第 \d+ 局(开始| · )/.test(msg)) return;
    showToast(displayMessage(msg), 2600);
}

function renderTable() {
    document.body.dataset.screen = "table";
    const freshMount = ensureTableSkeleton();
    if (freshMount) {
        tableView.seenPlays = new Set();
        tableView.lastMessage = null;
    }
    const t = tableView;
    const mine = mySeat();
    const view = Math.max(0, mine);
    const dealPhase = currentDealPhase();
    const liveTurn = game.phase === "playing" && dealPhase === "done" && !finishedList(game).includes(game.currentTurn) ? game.currentTurn : -1;
    const canAct = mine >= 0 && liveTurn === mine;
    const v = {
        mine, view, dealPhase, liveTurn, canAct,
        lead: !game.lastPlay,
        noBeat: canAct && !!game.lastPlay && obviousPassNow(mine),
        passHint: canAct && !!hintAdvisor?.pass && hintAdvisor.turn === turnStateKey(),
        leader: game.phase === "playing" ? roundLeaderSeat() : -1
    };
    const handCards = mine >= 0 ? (game.hands[mine] || []) : [];
    syncSelection(mine, handCards);
    const columns = mine >= 0 ? handColumns(handCards, game.currentLevelRank, mine) : [];
    const geo = handGeometry(columns);
    const handH = mine >= 0 ? geo.height : 0;
    const bottom = handBottom();
    const actionsBottom = bottom + handH + ACTION_ROW_GAP;
    t.stage.style.setProperty("--hand-bottom", `${bottom.toFixed(1)}px`);
    t.stage.style.setProperty("--hand-h", `${handH.toFixed(1)}px`);
    t.stage.style.setProperty("--actions-bottom", `${actionsBottom.toFixed(1)}px`);
    const rowTop = t.layout.h - actionsBottom - ACTION_ROW_H;
    t.stage.style.setProperty("--pill-w", `${actionPillWidth(v, rowTop)}px`);
    // toasts sit over the felt centre, or just above the action row while it is up
    t.rot.style.setProperty("--toast-y", `${v.canAct ? Math.max(150, Math.min(266, rowTop - 46)) : 266}px`);
    t.stage.classList.toggle("is-acting", v.canAct);

    renderTableChrome();
    setRegion("watermark", `<b>${L("PICASSO Guandan", "PICASSO 掼蛋")}</b><span>${L(`Classic · Level ${game.currentLevelRank}`, `经典 · 打${game.currentLevelRank}`)}</span>`);
    const flights = playFlightSources(v, !freshMount);
    const bursts = [];
    [0, 1, 2, 3].forEach(i => {
        renderSeat(i, v);
        renderSlot(i, v, !freshMount, flights, bursts);
    });
    renderHand(columns, handMode === "row" && mine >= 0 ? orderedHandForDisplay(handCards, game.currentLevelRank, mine) : [], geo, dealPhase);
    setRegion("tools", toolsHTML(v));
    setRegion("spectate", mine < 0 ? `<span>${L("Spectating", "观战中")}</span>` : "");
    setRegion("actions", `${v.canAct}:${v.lead}:${v.noBeat}:${v.passHint}:${uiLang}`, () => actionsHTML(v));
    setRegion("deal", dealPhase === "dealing" ? `deal:${dealKey()}:${Math.round(t.layout.w)}` : "", () => dealHTML(v));
    const firstKey = firstLeadKey(v);
    setRegion("firstLead", firstKey, firstKey ? () => firstLeadHTML(v) : "");
    const tributeMoment = tributeKey(v);
    setRegion("tribute", tributeMoment, tributeMoment ? () => tributeHTML(v) : "");
    const result = game.phase === "roundOver" ? "round" : game.phase === "gameOver" ? "game" : "";
    setRegion("result", result ? `${result}:${game.roundNo}:${uiLang}:${isHost()}` : "", result === "round" ? roundOverHTML : result ? gameOverHTML : "");
    refreshSelectionUI();
    updateTurnClockDOM();
    runPlayFlights(flights, v);
    runBursts(bursts);
    initResultOverlay();
    maybeToastTableMessage();
}

// Bomb tiers (tg_ingame_bomb, tg_ingame_tianwangzha): authored one-shot FX over a fresh bomb.
// renderSlot reports a bomb only the first time its play is shown, so re-renders and reloads never
// replay it. 4-5 炸弹: burst, floor ring, cracks and the word at the seat, 6 px shake; 6+: bigger,
// a second ring and a flash; 同花顺: gold ring sweep; 天王炸: three explosions under the vertical
// word at the table centre. Transform/opacity only; reduced motion keeps the still word.
const FX_MS = { bomb: 1000, big: 1300, flush: 1150, joker: 1900 };
const FX_RAYS = "M" + Array.from({ length: 32 }, (_, k) => {
    const r = k % 2 ? 24 : k % 4 ? 78 : 100;
    const a = k * Math.PI / 16;
    return `${(Math.sin(a) * r).toFixed(1)} ${(-Math.cos(a) * r).toFixed(1)}`;
}).join(" L") + "Z";
const FX_CRACKS = "M0 0 L-30 6 L-52 2 L-80 12 L-106 8 M-52 2 L-66 -12 L-84 -16 M0 0 L26 -8 L48 -4 L72 -14 L100 -10 M48 -4 L62 10 L86 16 M0 0 L-12 16 L-32 28 L-44 46 M0 0 L10 18 L30 26 L40 46 M0 0 L-18 -16 L-40 -24 M0 0 L16 -20 L20 -38";
// A cartoon blast outline: n points round a circle (radius jittered), joined by outward arcs.
function fxCloudPath(r, n, seed) {
    const pts = Array.from({ length: n }, (_, k) => {
        const a = (k + ((k * 7 + seed) % 5) * .08) * 2 * Math.PI / n;
        const rr = r * (.84 + ((k * 37 + seed * 11) % 9) * .02);
        return [Math.cos(a) * rr, Math.sin(a) * rr];
    });
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let k = 1; k <= n; k++) {
        const [x, y] = pts[k % n];
        const arc = (Math.hypot(x - pts[k - 1][0], y - pts[k - 1][1]) * .6).toFixed(1);
        d += `A${arc} ${arc} 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    return `${d}Z`;
}
const FX_BLAST = `<svg viewBox="-100 -100 200 200"><path class="gd-fx-smoke" d="${fxCloudPath(90, 9, 2)}"/><path class="gd-fx-fire" d="${fxCloudPath(74, 11, 5)}"/><path class="gd-fx-hot" d="${fxCloudPath(38, 7, 3)}"/></svg>`;

function burstTier(combo) {
    if (combo.type === "jokerBomb") return "joker";
    if (combo.type === "straightFlush") return "flush";
    return (combo.bombLen || 4) >= 6 ? "big" : "bomb";
}

function burstWord(combo, tier) {
    if (tier === "joker") return L("Joker Bomb", "天王炸");
    if (tier === "flush") return L("Straight Flush", "同花顺");
    const n = combo.bombLen || 4;
    return tier === "big" ? L(`${n}-Bomb`, `${"六七八九十"[n - 6] || n}炸`) : L("Bomb", "炸弹");
}

function burstHTML(tier, word, x, y) {
    const n = tier === "bomb" ? 10 : 16;
    const sparks = Array.from({ length: n }, (_, k) => `<i class="gd-fx-spark" style="--a:${Math.round(k * 360 / n + (k % 3) * 9)}deg;--d:${150 + (k * 53) % 90}px"></i>`).join("");
    const flash = tier === "big" || tier === "joker" ? `<i class="gd-fx-flash"></i>` : "";
    const body = tier === "joker"
        ? [0, 1, 2].map(k => `<span class="gd-fx-boom" style="--n:${k}">${FX_BLAST}</span>`).join("") + sparks + wordHTML(word, "is-vertical")
        : `<i class="gd-fx-ring"></i>${tier === "big" ? `<i class="gd-fx-ring is-2"></i>` : ""}${tier === "flush" ? "" : `<i class="gd-fx-dome"></i>`}`
            + (tier === "flush" ? `<svg class="gd-fx-sweep" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92"/></svg>` : `<svg class="gd-fx-cracks" viewBox="-120 -60 240 120"><path d="${FX_CRACKS}"/></svg>`)
            + `<svg class="gd-fx-rays" viewBox="-100 -100 200 200"><path d="${FX_RAYS}"/></svg><i class="gd-fx-core"></i>${sparks}${wordHTML(word)}`;
    return `<div class="gd-fx-set">${flash}<div class="gd-fx is-${tier}" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px">${body}</div></div>`;
}

// Starts once the played cards have landed (their flight is ~200 ms).
function runBursts(bursts) {
    const t = tableView;
    bursts.forEach(({ pos, combo }) => {
        const tier = burstTier(combo);
        let x = t.layout.w / 2;
        let y = t.layout.h * .35;
        const played = t.regions[`slot${pos}`]?.querySelector(".gd-played");
        if (tier !== "joker" && played) {
            const r = played.getBoundingClientRect();
            const c = stagePoint(r.left + r.width / 2, r.top + r.height / 2);
            x = Math.min(t.layout.w - 170, Math.max(170, c.x));
            y = c.y;
        }
        setTimeout(() => {
            if (!t.fx?.isConnected) return;
            t.fx.insertAdjacentHTML("beforeend", burstHTML(tier, burstWord(combo, tier), x, y));
            const set = t.fx.lastElementChild;
            setTimeout(() => set.remove(), FX_MS[tier] + 100);
            if (prefersReducedMotion()) return;
            const d = tier === "bomb" ? 6 : 11;
            t.stage.animate({ translate: ["0 0", `${d}px 0`, `-${d}px 0`, `${d * .6}px 0`, `-${d * .3}px 0`, "0 0"] },
                { duration: tier === "bomb" ? 250 : 400, easing: "linear" });
        }, 150);
    });
}

function roundOverHTML() {
    const r = game.roundResult;
    const mine = mySeat();
    const isWin = mine >= 0 && mine % 2 === r.firstTeam;
    const isLose = mine >= 0 && mine % 2 !== r.firstTeam;
    const rows = r.order.map((i, idx) => `<div class="tribute-row">${L(`#${idx + 1}`, `第 ${idx + 1} 名`)}: ${encodeHTML(displaySeatName(game.seats[i]))} · ${teamName(i % 2)}</div>`).join("");
    const title = r.aceChallenge
        ? r.aceReset
            ? `${teamName(r.firstTeam)} ${L("A challenge reset", "冲 A 失败退回 2")}`
            : `${teamName(r.firstTeam)} ${L("A challenge failed", "冲 A 失败")}`
        : `${teamName(r.firstTeam)} ${L(`advances ${r.advance}`, `本局升级 ${r.advance}`)}`;
    const detail = r.aceChallenge
        ? r.aceReset
            ? L("This was the third failed A challenge. The team resets to level 2 next round.", "这是第 3 次冲 A 失败，下局该队退回打 2。")
            : L(`A challenge failed. Failure ${r.aceFailureCount}/${ACE_FAIL_LIMIT}; the team keeps playing A next round.`, `冲 A 失败，第 ${r.aceFailureCount}/${ACE_FAIL_LIMIT} 次；下局继续打 A。`)
        : L("The next round will automatically handle Tribute and Return. If the paying side holds two Red Jokers, Tribute is blocked.", "下一局将自动处理进贡/还贡；如果进贡方合计拿到两张大王，则抗贡成功。");
    // Confetti only for a clean round win (not a failed/aborted A challenge, even
    // though the challenging team still technically held first place).
    const showConfetti = isWin && !r.aceChallenge;
    const resultKey = `round:${game.roundNo}:${r.firstTeam}:${r.advance}:${r.aceChallenge ? 1 : 0}:${r.aceReset ? 1 : 0}`;
    return `<div class="phase-backdrop">
        <div class="result-ticket ${isWin ? "win" : "lose"}" data-result-key="${encodeHTML(resultKey)}" data-result-score="${Number(r.advance) || 0}">
            <div class="result-verdict">
                <span class="result-verdict-label">${isWin ? "胜" : "负"}</span>
                <span class="result-verdict-team">${teamName(r.firstTeam)}</span>
            </div>
            <div class="result-standings">
                <h2>${title}</h2>
                <p>${detail}</p>
                <div class="tribute-list">${rows}</div>
            </div>
            <div class="result-action">
                <div class="result-score"><span class="result-score-label">${L("Levels advanced", "本局升级")}</span><span class="result-score-value">0</span></div>
                <button class="btn play" id="next-round" ${isHost() ? "" : "disabled"} type="button">${L("Next Round", "进入下一局")}</button>
            </div>
            ${showConfetti ? `<div class="result-confetti">${confettiPiecesHTML(28)}</div>` : ""}
        </div>
    </div>`;
}

function gameOverHTML() {
    const r = game.roundResult;
    const mine = mySeat();
    const isWin = mine >= 0 && mine % 2 === r.firstTeam;
    const isLose = mine >= 0 && mine % 2 !== r.firstTeam;
    const rows = r.order.map((i, idx) => `<div class="tribute-row">${L(`#${idx + 1}`, `第 ${idx + 1} 名`)}: ${encodeHTML(displaySeatName(game.seats[i]))} · ${teamName(i % 2)}</div>`).join("");
    const resultKey = `game:${game.roundNo}:${r.firstTeam}`;
    return `<div class="phase-backdrop">
        <div class="result-ticket ${isWin ? "win" : "lose"}" data-result-key="${encodeHTML(resultKey)}" data-result-score="${Number(game.roundNo) || 0}">
            <div class="result-verdict">
                <span class="result-verdict-label">${isWin ? "胜" : "负"}</span>
                <span class="result-verdict-team">${teamName(r.firstTeam)}</span>
            </div>
            <div class="result-standings">
                <h2>${teamName(r.firstTeam)} ${L("wins the match", "冲 A 成功")}</h2>
                <p>${L("A-level victory requires first place with the partner in second or third. The match is complete.", "打 A 时必须头游且对家第二或第三才算升级成功；本场比赛结束。")}</p>
                <div class="tribute-list">${rows}</div>
            </div>
            <div class="result-action">
                <div class="result-score"><span class="result-score-label">${L("Rounds played", "共进行回合")}</span><span class="result-score-value">0</span></div>
                <button class="btn play" id="next-round" disabled type="button">${L("Match Complete", "比赛结束")}</button>
            </div>
            ${isWin ? `<div class="result-confetti">${confettiPiecesHTML(28)}</div>` : ""}
        </div>
    </div>`;
}

function confettiPiecesHTML(n) {
    let out = "";
    for (let i = 0; i < n; i++) {
        const cx = Math.round(Math.random() * 100);
        const dx = Math.round((Math.random() * 2 - 1) * 120);
        const rot = Math.round(Math.random() * 720 - 360);
        const dur = Math.round(1800 + Math.random() * 800);
        const delay = Math.round(Math.random() * 600);
        out += `<span class="confetti-piece" style="--cx:${cx}%;--cdx:${dx}px;--crot:${rot}deg;--cdur:${dur}ms;--cdelay:${delay}ms"></span>`;
    }
    return out;
}

// Win/lose overlay entrance is handled by CSS (gdBackdropIn/gdResultIn); the
// score count-up needs real per-frame JS for an eased 0 -> final-tally
// animation. Guarded by lastResultOverlayKey so it only plays once per result
// (renderTable() re-runs on every game-state tick while the panel is open).
let lastResultOverlayKey = "";
function initResultOverlay() {
    const panel = document.querySelector(".result-ticket");
    if (!panel) { lastResultOverlayKey = ""; return; }
    const key = panel.dataset.resultKey || "";
    if (!key || key === lastResultOverlayKey) return;
    lastResultOverlayKey = key;
    const valueEl = panel.querySelector(".result-score-value");
    const target = Number(panel.dataset.resultScore) || 0;
    if (!valueEl) return;
    const duration = 700;
    const start = performance.now();
    function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        valueEl.textContent = String(Math.round(target * eased));
        if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
}

document.getElementById("copy-link-btn").addEventListener("click", async () => {
    if (!roomCode) return showToast(L("No room yet", "还没有房间"));

    try {
        await navigator.clipboard.writeText(url.toString());
        showToast(L("Room link copied", "房间链接已复制"));
    } catch (_) {
        showToast(roomCode);
    }
});

// ↩ on the room screen gives the seat back before going to the lobby, so nobody waits on a ghost
// seat; mid-game it is the table's 新桌 and just opens a fresh lobby.

document.addEventListener("keydown", event => {
    if (event.target?.closest?.("input, textarea, [contenteditable='true']")) return;
    if (event.key.length !== 1 || event.metaKey || event.ctrlKey || event.altKey) return;
    returnKeyboardPrimed = true;

// ==== STAGE HOOKS (owned by stage package) ====

<script src="https://yil384.github.io/Picasso-Lab/events/static/guandan-records.js"></script>
<script>
// 巅峰对决 board: window.GuandanRecordsUI.open(page) / close(). It opens only from a
// [data-open-records] control (value = page key) and never by itself; the 战报 strip is
// rendered only into [data-gdr-banner-slot] elements that a screen provides.
(function () {
    var R = window.GuandanRecords;
    var modal = document.getElementById("gdr-cardmodal");
    var host = document.getElementById("gdr-cardmodal-body");
    if (!R || !R.mount || !modal || !host) return;
    var board = null, opener = null, closeTimer = 0;
    function setBackgroundInert(on) {
        [document.getElementById("root"), document.querySelector(".topbar")].forEach(function (el) { if (el) el.inert = on; });
    }
    function uiLang() {
        try { return localStorage.getItem("picasso.guandan.lang") === "en" ? "en" : "zh"; } catch (_) { return "zh"; }
    }
    function isOpen() { return !modal.hidden && modal.classList.contains("is-open"); }
    function open(page) {
        var lang = uiLang();
        clearTimeout(closeTimer);
        if (!board || board.lang !== lang) {
            if (board) board.destroy();
            board = R.mount(host, { lang: lang, onClose: close });
            modal.setAttribute("aria-label", lang === "en" ? "Peak Showdown" : "巅峰对决");
        }
        board.go(page == null || page === "" ? 0 : page, true);
        if (!isOpen()) opener = document.activeElement;
        modal.hidden = false;
        setBackgroundInert(true);
        document.body.classList.add("gdr-modal-open");
        void modal.offsetWidth; // start the fade from the hidden state
        modal.classList.add("is-open");
        var back = host.querySelector(".gdr-back");
        if (back) back.focus({ preventScroll: true });
    }
    function close() {
        if (modal.hidden) return;
        modal.classList.remove("is-open");
        setBackgroundInert(false);
        document.body.classList.remove("gdr-modal-open");
        clearTimeout(closeTimer);
        closeTimer = setTimeout(function () { modal.hidden = true; }, 160);
        var back = opener && document.contains(opener) ? opener : document.body;
        opener = null;
        try { back.focus({ preventScroll: true }); } catch (_) {}
    }
    document.addEventListener("click", function (e) {
        var t = e.target.closest && e.target.closest("[data-open-records]");
        if (!t) return;
        e.preventDefault();
        open(t.getAttribute("data-open-records"));
    });
    document.addEventListener("keydown", function (e) {
        if (isOpen()) {
            if (e.key === "Escape") { e.preventDefault(); close(); }
            else if (e.key === "ArrowRight") { e.preventDefault(); board.next(); }
            else if (e.key === "ArrowLeft") { e.preventDefault(); board.prev(); }
            return;
        }
        var t = (e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest("[data-open-records]");
        if (t && t.tagName !== "BUTTON" && t.tagName !== "A") { e.preventDefault(); open(t.getAttribute("data-open-records")); }
    });
    function fillBannerSlots() {
        if (!R.buildBanner) return;
        var lang = uiLang();
        [].forEach.call(document.querySelectorAll("[data-gdr-banner-slot]"), function (slot) {
            var bn = slot.firstElementChild;
            if (bn && bn.classList.contains("gdr-banner") && bn.getAttribute("data-lang") === lang) return;
            slot.innerHTML = R.buildBanner({ lang: lang });
        });
    }
    new MutationObserver(fillBannerSlots).observe(document.getElementById("root") || document.body, { childList: true, subtree: true });
    fillBannerSlots();
    window.GuandanRecordsUI = { open: open, close: close };
})();

// BGM + window.GuandanMusic { isOn(), setOn(bool) }: the on/off preference is stored in
// localStorage "picasso.guandan.music" ('on'|'off'). While on, it autoplays on load and falls back
// to the first user gesture if the browser blocks autoplay. setOn() fires a "guandan:music" event.
(function () {
    var KEY = "picasso.guandan.music";
    var bgm = document.getElementById("guandan-bgm");
    var on = true;
    try { on = localStorage.getItem(KEY) !== "off"; } catch (_) {}
    function tryPlay() { if (on && bgm) bgm.play().catch(function () {}); }
    function setOn(value) {
        on = !!value;
        try { localStorage.setItem(KEY, on ? "on" : "off"); } catch (_) {}
        if (on) tryPlay();
        else if (bgm) bgm.pause();
        document.dispatchEvent(new CustomEvent("guandan:music", { detail: { on: on } }));
    }
    window.GuandanMusic = { isOn: function () { return on; }, setOn: setOn };
    if (!bgm) return;
    bgm.volume = 0.45;
    tryPlay();
    function onGesture() {
        tryPlay();
        document.removeEventListener("click", onGesture, true);
        document.removeEventListener("keydown", onGesture, true);
    }
    document.addEventListener("click", onGesture, true);
    document.addEventListener("keydown", onGesture, true);
})();
</script>
