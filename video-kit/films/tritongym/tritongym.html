<!-- TritonGym project-card film (3D comic series). See STORYBOARD.md. One real three.js set rendered through the npr

<script src="/pv/vendor/p5/p5.min.js"></script>

<script type="module">
import { defineScene } from '/pv/runtime/pv.js';
import { NF, LOOK, PAPER, buildWorld, updateWorld, drawNPR, drawMarks, drawInk } from './tg_film.js';

defineScene({
  meta: {
    title: 'TritonGym - The Loop', durationFrames: NF, fps: 24, width: 1920, height: 1080, seed: 29,
    design: [1920, 1080], background: PAPER.tone, fonts: [],
    boil: { every: 2, variants: 3 },            // ink boils at 12 drawings/s
    poster: 628,     // the settled payoff: TRITONGYM, PERF@1 > 1, Kern ahead with its check, Tok star-eyed
  },
  update(ctx) { updateWorld(ctx); },
  layers: [
    { name: 'paper', type: '2d', cache: () => 'static', draw(ctx, g) { g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(ctx.paper(PAPER), 0, 0); } },
    { name: 'npr', type: 'three', underlay: true, antialias: false,
      async init(ctx, three) { return buildWorld(ctx, three); },
      draw(ctx) { drawNPR(ctx); return false; } },
    { name: 'ink', type: 'brush', blend: 'multiply', draw(ctx, p, brush) { drawInk(ctx, brush); } },
    { name: 'marks', type: '2d', draw(ctx, g) { drawMarks(ctx, g); } },
  ],
});
</script></body></html>
