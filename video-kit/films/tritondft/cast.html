<!doctype html>
<html><head><meta charset="utf-8"><title>TritonDFT cast</title>
<script src="/pv/vendor/p5/p5.min.js"></script>
<script src="/pv/vendor/p5.brush/p5.brush.pv.js"></script>
<script type="importmap">{"imports":{"three":"/pv/vendor/three/build/three.module.js","three/addons/":"/pv/vendor/three/addons/"}}</script>
</head><body>
<script type="module">
// authoring aid: model sheet of the cast on the workbench; frames 0/12/24/36 = four camera angles, expressions cycle
import { defineScene } from '/pv/runtime/pv.js';
import { createNPR } from './npr/npr.js';
import { orbit, applyRig } from './npr/camera.js';
import { PAL, COL, Q, bake } from './td_core.js';
import { addLetterBrushes } from './td_letters.js';
import { L, buildRoom, buildBench, buildSilicon, buildEngine } from './td_world.js';
import { makeAdder } from './td_world.js';
import { buildTri, buildClack, buildLoupe, buildTilt, buildConsole, buildHoot } from './td_cast.js';

const LOOK = {
  extends: 'comic',
  hatchCut: 0.22, crossT: 0.62, crossW: 1.0, hatchPx: 7.5, hatchW: 1.5, hatchWobble: 0.08, hatchSwell: 0.35,
  htAmt: 0.55, htPx: 14, htT: 0.3, htRange: 0.5, misreg: [2.6, -2.0], htCol: [0.06, 0.18, 0.34],
  lineW: 2.0, lineWShadow: 3.2, hullW: 3.1, hullShadowW: 1.5,
  bleed: 1.6, edgeDark: 0.45, gran: 0.3, flocc: 0.06, dryEdge: 0.2, sat: 1.1,
  shadeGlaze: [0.6, 0.72, 0.9], coreGlaze: [0.6, 0.72, 0.9], keyTint: [1.0, 0.97, 0.9],
  rule: 0.0, bgDots: [0.2, 0.52, 0.75, 0.25], dofMax: 2.0, dofRange: 4.0, grain: 0.018, vignette: 0.16,
};
let T;
const paperC = (ctx) => ctx.paper({ tone: PAL.paper, grain: 0.04, fibres: 0.05, blotch: 0.06, seed: 4 });
const X0 = L.bench.x, Z0 = L.bench.z + 0.9;
defineScene({
  meta: { title: 'cast', durationFrames: 48, fps: 24, width: 1920, height: 1080, design: [1920, 1080], background: PAL.paper, boil: { every: 2, variants: 3 }, seed: 5 },
  layers: [
    { name: 'paper', type: '2d', cache: () => 'static', draw(ctx, g) { g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(paperC(ctx), 0, 0); } },
    { name: 'npr', type: 'three', underlay: true, antialias: false,
      async init(ctx, { THREE, renderer }) {
        addLetterBrushes(brush);
        const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, ctx.W / ctx.H, 0.3, 80);
        const npr = createNPR(renderer, ctx, { look: LOOK, paper: paperC(ctx), samples: 4 });
        npr.setUnder(window.__pv.canvas);
        npr.setLight({ dir: [-0.45, 0.8, 0.5], target: [X0, 0, Z0], size: 4, dist: 22 });
        const add = makeAdder(THREE, npr, scene);
        const W = { THREE, scene, npr, add, ctx, bake };
        await buildRoom(W); buildBench(W); buildEngine(W);
        const C = {};
        C.tri = await buildTri(W); C.clack = await buildClack(W); C.loupe = buildLoupe(W); C.tilt = await buildTilt(W);
        C.con = await buildConsole(W); C.hoot = await buildHoot(W);
        C.tri.root.position.set(X0 - 1.25, 0, Z0); C.clack.root.position.set(X0 - 0.55, 0, Z0);
        C.loupe.root.position.set(X0 + 0.15, 0, Z0); C.tilt.root.position.set(X0 + 0.8, 0, Z0);
        C.con.root.position.set(X0 + 1.35, 0, Z0 - 0.35); C.hoot.root.position.set(X0 - 2.4, 0, Z0 - 0.2);
        T = { THREE, npr, scene, camera, C };
        return { scene, camera };
      },
      draw(ctx) {
        const { npr, scene, camera, THREE } = T;
        npr.frame(ctx);
        npr.focusOn(camera, new THREE.Vector3(X0 - 0.4, 0.35, Z0), 4);
        npr.render(scene, camera);
        return false;
      } },
    { name: 'ink', type: 'brush', blend: 'multiply', draw() {} },
  ],
  update(ctx) {
    const k = Math.floor(ctx.iw / 12) % 4, C = T.C;
    const E = [['determined', 'determined', 'determined', 'tired'], ['surprised', 'surprised', 'surprised', 'surprised'], ['happy', 'grin', 'dizzy', 'happy'], ['squint', 'strain', 'worried', 'sleep']][k];
    C.tri.face.material.uniforms.uMap.value = C.tri.faceTex[E[0] === 'dizzy' ? 'look' : E[0]][0];
    C.clack.face.material.uniforms.uMap.value = C.clack.faceTex[E[1] in C.clack.faceTex ? E[1] : 'look'][0];
    C.tilt.headM.material.uniforms.uMap.value = C.tilt.faceTex[E[2] in C.tilt.faceTex ? E[2] : 'look'][0];
    C.hoot.disc.material.uniforms.uMap.value = C.hoot.faceTex[E[3] in C.hoot.faceTex ? E[3] : 'look'][0];
    // pans hang under the hands
    T.scene.updateMatrixWorld(true);
    C.tilt.pans.forEach((p, i) => { const w = C.tilt.hands[i].getWorldPosition(new T.THREE.Vector3()); p.g.position.copy(w); });
    const cams = [{ az: 0.0, el: 0.16, r: 5.2 }, { az: 0.45, el: 0.1, r: 4.6 }, { az: -0.5, el: 0.3, r: 5.0 }, { az: 0.15, el: 0.05, r: 3.2 }];
    const c = cams[k];
    applyRig(T.camera, orbit({ target: [X0 - (k === 3 ? 1.6 : 0.6), 0.45, Z0], radius: c.r, az: c.az, el: c.el, fov: 30 }));
    ctx.camera = T.camera;
  },
});
</script></body></html>
