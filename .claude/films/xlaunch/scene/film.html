<html><head><meta charset="utf-8"><title>Picasso Lab - launch film v8</title>
<!-- Picasso Lab's first X post, v8: the v7 studio (curved papers, area lights, glossy floor), the v6 story of the
     lab's 136 real papers, and a character line: Prof. Yufei Ding writes the first paper in 2013, students arrive as
     the papers multiply, they live through every beat (by year, by venue, three directions, the honours, milk tea),
     a camera flash turns the cartoon crew into the real team photo, and the first desk waits empty for the viewer.
     Painted characters stand in the 3D world as billboards (sprite.js). 4:5, 30 fps, every cut on a 2 s bar
     (120 bpm), every reveal on a 15-frame beat. Shot list: .claude/films/xlaunch/STORYBOARD.md -->
<link rel="stylesheet" href="/pv/fonts/fonts.css">
<script src="/pv/vendor/p5/p5.min.js"></script>
<script src="/pv/vendor/p5.brush/p5.brush.pv.js"></script>
<script type="importmap">{"imports":{"three":"/pv/vendor/three/build/three.module.js","three/addons/":"/pv/vendor/three/addons/"}}</script>
</head><body>
<script type="module">
import { defineScene } from '/pv/runtime/pv.js';
import { buildStudio, setPaper, look, blankPage, sheetGeometry } from '/scene/studio.js';
import * as L from '/scene/layouts.js';
import { spriteKit } from '/scene/sprite.js';
import { clamp, lerp, mix3, sm, eio, eio5, eout, eout5, ein, hsh, win, camRig, TAU } from '/scene/lib.js';
import * as TY from '/scene/type.js';

const FPS = 30, NF = 1830, FLOOR = L.FLOOR, ASP = L.ASP;
// shots (frames). A bar is 60 frames (2 s at 120 bpm); every shot starts on a bar.
const S = {
  open: [0, 180], grow: [180, 420], gallery: [420, 540], years: [540, 720], venues: [720, 900],
  dirs: [900, 1200], award: [1200, 1380], photo: [1380, 1500], seat: [1500, 1680], end: [1680, NF],
};
const CHAPTER = (f) => f < S.grow[0] ? ['01', 'ORIGIN'] : f < S.dirs[0] ? ['02', 'GROWTH'] : f < S.award[0] ? ['03', 'DIRECTIONS']
  : f < S.photo[0] ? ['04', 'RECOGNITION'] : f < S.seat[0] ? ['05', 'PEOPLE'] : f < S.end[0] ? ['06', 'NEXT'] : null;
const RING_COL = [0x3f8cff, 0x63d36f, 0xff4d4d], GOLD = 0xffc547;

let D, T, SK; const st = {}, C = {};
// the real lab: every member as a painted character (from their Team-page photo); three of them carry the
// research directions (Xiang quantum, Zaifeng systems / compilers, Zhongkai hardware). Only members whose art is
// in cut/ (m_<name>.png) are in the film: build() drops the rest and re-balances the line-up.
// Line-up order: front row (Yufei in the middle, the featured three next to her), back row.
let MEMBERS = ['chang', 'haotian', 'jixuan', 'keyi', 'ohm', 'parikshit', 'rishabh', 'xiang', 'xinwei', 'yanju', 'yichen', 'yilin', 'yue', 'zaifeng', 'zhengding', 'zhongkai', 'zhuo', 'zihan'];
let FRONT = ['yue', 'keyi', 'xiang', 'zhongkai', 'Y', 'zaifeng', 'chang', 'zhuo', 'yichen'];
let BACK = ['haotian', 'parikshit', 'jixuan', 'ohm', 'xinwei', 'zhengding', 'yilin', 'yanju', 'zihan', 'rishabh'];
const FEATURED = ['xiang', 'zaifeng', 'zhongkai'];
const EXTRA = { xiang: ['xiang_land', 'xiang_chip'], zaifeng: ['zaifeng_flop', 'zaifeng_gpu'], zhongkai: ['zhongkai_tray', 'zhongkai_wafer', 'zhongkai_offer'] };
// keep the cast to the members that have art; move plain members between the rows until they differ by <= 1
function castFrom(avail) {
  MEMBERS = MEMBERS.filter((m) => avail.has(m));
  FRONT = FRONT.filter((m) => m === 'Y' || avail.has(m)); BACK = BACK.filter((m) => avail.has(m));
  const plain = (row) => row.filter((m) => m !== 'Y' && !FEATURED.includes(m));
  while (BACK.length > FRONT.length + 1) { const m = plain(BACK).pop(); BACK.splice(BACK.indexOf(m), 1); FRONT.push(m); }
  while (FRONT.length > BACK.length + 1 && plain(FRONT).length) { const m = plain(FRONT).pop(); FRONT.splice(FRONT.indexOf(m), 1); BACK.push(m); }
}
// slot of a person in the line-up: the front row centred on Yufei at (cx, cz + dz), column spacing sp; the back
// row centred on cx, on the half steps between the front row's columns
function slot(name, cx, cz, sp, dz = 0.3) {
  let i = FRONT.indexOf(name);
  if (i >= 0) return [cx + (i - FRONT.indexOf('Y')) * sp, cz + dz];
  i = BACK.indexOf(name);
  return [cx + (i - (BACK.length - 1) / 2 + (BACK.length % 2 ? 0.5 : 0)) * sp, cz];
}
const MH = (m) => 0.95 + 0.1 * hsh(MEMBERS.indexOf(m) + 3, 11);            // a little height variety

defineScene({
  meta: { title: 'Picasso Lab - launch film v8', durationFrames: NF, fps: FPS, width: 1080, height: 1350, seed: 8,
    design: [1080, 1350], background: '#0b0b0e', fonts: ['Inter', 'Instrument Serif', 'JetBrains Mono'], boil: { every: 1, variants: NF }, poster: 500 },
  update(ctx) { frame(ctx, ctx.iw); },
  layers: [
    { name: '3d', type: 'three', async init(ctx, three) { return build(ctx, three); }, draw() { T.composer.render(); return false; } },
    { name: 'type', type: '2d', draw(ctx, g) { typeLayer(ctx, g, ctx.iw); } },
  ],
});

// ---------------------------------------------------------------------------------------------------------
// build
// ---------------------------------------------------------------------------------------------------------
// height of each pose in world units (a standing Yufei is 1.0); seated/kneeling/flying poses are shorter
const POSE_H = {
  y_write: 1.02, desk_empty: 1.02, y_hold_up: 1.16, y_think: 1.0, y_surprise: 1.0, y_proud: 1.12, y_swing: 1.08, y_paint_air: 1.05,
  y_award: 1.0, y_toast: 1.12, y_invite: 1.0, y_wave: 1.04,
  leo_catch: 1.3, leo_gpu: 1.12, leo_toast: 1.18,
  mia_land: 0.52, mia_qubit: 0.8, mia_toast: 0.86,
  kai_flop: 0.7, kai_chip: 0.96, kai_toast: 1.0,
  zoe_sip: 0.9, zoe_tray: 0.92, zoe_toast: 0.92,
  cat_sleep: 0.2, cat_sit: 0.34, cat_jump: 0.38, cat_cheer: 0.36,
  xiang_land: 0.55, xiang_chip: 1.0, zaifeng_flop: 0.72, zaifeng_gpu: 1.0, zhongkai_tray: 1.0, zhongkai_wafer: 1.0, zhongkai_offer: 1.0, y_hold_cat: 1.05,
};
async function build(ctx, three) {
  D = L.index(await (await fetch('/scene/data.json')).json());
  T = await buildStudio(ctx, three, D);
  const { THREE, scene } = T;
  SK = spriteKit(THREE, scene);
  const mk = async (names) => SK.make(Object.fromEntries(names.map((n) => [n, `/scene/cut/${n}.png`])), { height: 1 });
  C.y = await mk(['y_write', 'y_hold_up', 'y_think', 'y_surprise', 'y_proud', 'y_swing', 'y_paint_air', 'y_award', 'y_toast', 'y_invite', 'y_wave', 'y_hold_cat']);
  C.desk = await mk(['desk_empty']);
  C.cat = await mk(['cat_sleep', 'cat_sit', 'cat_jump', 'cat_cheer']);
  const has = async (n) => (await fetch(`/scene/cut/${n}.png`, { method: 'HEAD' })).ok;
  const ok = await Promise.all(MEMBERS.map((m) => has(`m_${m}`)));
  castFrom(new Set(MEMBERS.filter((m, i) => ok[i])));
  C.m = {};
  for (const m of MEMBERS) C.m[m] = await mk([`m_${m}`, ...(EXTRA[m] || [])]);

  // Paper #137: the layout of the page it rhymes with, a template body, a blinking cursor
  const tex = blankPage(THREE, 'Your Title Here', 'You et al.', { affil: 'Picasso Lab · UC San Diego', tag: '#137' });
  const geo = sheetGeometry(THREE, 1.0, 0.1, 0.3, 137), backMat = T.backMat;
  st.p137 = new THREE.Group();
  st.p137mat = new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.74, bumpMap: T.bump, bumpScale: 0.5, sheen: 0.35, sheenRoughness: 0.85 });
  const f137 = new THREE.Mesh(geo, st.p137mat), b137 = new THREE.Mesh(geo, backMat); f137.castShadow = b137.castShadow = true;
  st.cursor = new THREE.Mesh(new THREE.PlaneGeometry(0.006, 0.03), new THREE.MeshBasicMaterial({ color: 0x111114 }));
  const [cu, cv] = tex.userData.cursor; st.cursor.position.set((cu - 0.5) * ASP, 0.5 - cv - 0.012, 0.03);
  st.p137.add(f137, b137, st.cursor); scene.add(st.p137); st.p137.visible = false;

  // the real team photo on photo paper with a white border
  const img = await T.loadImg('/scene/team.jpg');
  const c = document.createElement('canvas'), B = 36; c.width = img.width + 2 * B; c.height = img.height + 2 * B;
  const g = c.getContext('2d'); g.fillStyle = '#f4f2ee'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, B, B);
  const pt = new THREE.CanvasTexture(c); pt.colorSpace = THREE.SRGBColorSpace; pt.anisotropy = 16;
  const pg = sheetGeometry(THREE, 0.5, 0.2, 0.0, 9, c.width / c.height);
  st.print = new THREE.Group();
  st.printMat = new THREE.MeshStandardMaterial({ map: pt, roughness: 0.4, toneMapped: false });   // the photo keeps its own blacks
  st.printAsp = c.width / c.height;
  const pf = new THREE.Mesh(pg, st.printMat), pb = new THREE.Mesh(pg, backMat); pf.castShadow = pb.castShadow = true;
  st.print.add(pf, pb); scene.add(st.print); st.print.visible = false;

  // three gold brush strokes, one per ring, painted on the ring's centre line; then the paint cools into glass
  const bristle = (() => {
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 64; const gg = cv.getContext('2d');
    gg.fillStyle = '#ffffff'; gg.fillRect(0, 0, 512, 64);
    for (let i = 0; i < 90; i++) { const y = hsh(i, 1) * 64, a = 0.15 + hsh(i, 2) * 0.35; gg.fillStyle = `rgba(120,80,10,${a})`; gg.fillRect(0, y, 512, 0.6 + hsh(i, 3) * 1.6); }
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
  })();
  st.strokes = L.RING_C.map((cc, j) => {
    const N = 220, pos = [], uv = [], idx = [], a0 = [Math.PI * 0.75, -Math.PI * 0.35, Math.PI * 0.15][j], lead = 0.7;
    for (let i = 0; i <= N; i++) {
      const t = i / N, a = a0 - lead + t * (TAU + lead), R = L.RING_R + 0.14 * (1 - sm(t * 4));
      const w = lerp(0.085, 0.014, Math.pow(t, 0.7)) * Math.min(1, t / 0.03 + 0.15);
      const cx = cc[0] + R * Math.cos(a), cy = cc[1] + R * Math.sin(a), nx = Math.cos(a), ny = Math.sin(a);
      pos.push(cx - nx * w / 2, cy - ny * w / 2, cc[2] + 0.035, cx + nx * w / 2, cy + ny * w / 2, cc[2] + 0.035);
      uv.push(t, 0, t, 1);
      if (i < N) { const b = i * 2; idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2); }
    }
    const geo2 = new THREE.BufferGeometry(); geo2.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo2.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); geo2.setIndex(idx); geo2.computeVertexNormals();
    const m = new THREE.Mesh(geo2, new THREE.MeshPhysicalMaterial({ color: GOLD, map: bristle, metalness: 0.9, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.12,
      emissive: 0x8a5600, emissiveIntensity: 0.45, side: THREE.DoubleSide, transparent: true }));
    m.visible = false; scene.add(m);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.02, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffe2a0 }));
    tip.visible = false; scene.add(tip);
    return { m, tip, n: idx.length, a0, lead, N };
  });

  // the venue stacks: each paper a thin bound copy (its first page on top, paper edges on the sides), countable
  const edge = document.createElement('canvas'); edge.width = 64; edge.height = 16; const eg = edge.getContext('2d');
  eg.fillStyle = '#ece8df'; eg.fillRect(0, 0, 64, 16);
  for (let y = 2; y < 16; y += 3) { eg.fillStyle = 'rgba(150,140,125,0.45)'; eg.fillRect(0, y, 64, 1); }
  eg.fillStyle = 'rgba(40,36,30,0.75)'; eg.fillRect(0, 15, 64, 1);
  const edgeTex = new THREE.CanvasTexture(edge); edgeTex.colorSpace = THREE.SRGBColorSpace;
  const edgeMat = new THREE.MeshStandardMaterial({ map: edgeTex, roughness: 0.9 }), botMat = new THREE.MeshStandardMaterial({ color: 0xe6e2d8, roughness: 0.9 });
  const boxGeo = new THREE.BoxGeometry(L.VS * ASP, L.VSTEP * 0.8, L.VS);
  st.boxes = {};
  for (const v of D.topv) for (const k of D.byVenue[v]) {
    const top = new THREE.MeshStandardMaterial({ map: T.papers[k].mat.map, roughness: 0.75 });
    const m = new THREE.Mesh(boxGeo, [edgeMat, edgeMat, top, botMat, edgeMat, edgeMat]);
    m.castShadow = m.receiveShadow = true; m.visible = false; scene.add(m); st.boxes[k] = m;
  }

  // confetti: small paper chips (instanced), for the toast
  const cg = new THREE.PlaneGeometry(0.028, 0.018);
  st.confetti = new THREE.InstancedMesh(cg, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide }), 220);
  const cols = [0xf5f5f7, 0xffd27a, 0x5aa2ff, 0x7fe08a, 0xff7474];
  for (let i = 0; i < 220; i++) st.confetti.setColorAt(i, new THREE.Color(cols[i % 5]));
  scene.add(st.confetti); st.confetti.visible = false;
  st.dummy = new THREE.Object3D();
  st.v3 = new THREE.Vector3();
  // the warm light that sets the Best Paper apart
  st.gold = new THREE.RectAreaLight(0xffc98a, 0, 1.2, 1.4); scene.add(st.gold);
  return { scene, camera: T.camera };
}

// ---------------------------------------------------------------------------------------------------------
// papers: one state per paper per frame, through every beat
// ---------------------------------------------------------------------------------------------------------
const YEAR_T0 = S.grow[0] + 26, YEAR_DT = 13.5;            // growth: 2013 at 206 ... 2026 at 382
function appearAt(k) {
  if (k === D.first) return S.grow[0];
  const p = D.pubs[k], und = p.yr == null;
  const same = und ? D.order.filter((q) => D.pubs[q].yr == null) : D.byYear[p.yr];
  const j = same.indexOf(k), n = same.length;
  const yr = und ? 2025.2 : p.yr;
  return YEAR_T0 + (yr - 2013) * YEAR_DT + (j / Math.max(1, n)) * YEAR_DT * (und ? 1.6 : 0.95);
}
const LAND = 18;                                            // frames from appearing to landing in the vortex
const SWARM_C = [0, 1.25, -0.4];
const swarmC = (f) => mix3([0, 0.95, -1.15], SWARM_C, sm((f - FIRST_GO) / 70));
const FIRST_GO = YEAR_T0 + 7 * YEAR_DT - 10;               // with the 2020 surge the first paper joins the vortex
function farPoint(k) { const a = hsh(k, 51) * TAU, R = 6 + hsh(k, 52) * 4; return { p: [Math.cos(a) * R, 0.5 + hsh(k, 53) * 4, -2 - Math.abs(Math.sin(a)) * R], r: [hsh(k, 54) * 3, hsh(k, 55) * 3, hsh(k, 56) * 3], s: 0.3, dim: 1 }; }

// the first paper's path in the opening: out of her hands, up into the light, to the hero pose
const HAND = [0.38, -0.02, 0.72];
const RELEASE = 96;
function firstOpen(f) {
  if (f < RELEASE) return null;
  const t = eio((f - RELEASE) / 64);
  const a = { p: HAND, r: [-0.5, -0.2, 0.1], s: 0.2, dim: 0 };
  const s = L.mixL(a, L.HERO, t, { lift: Math.sin(Math.PI * t) * 0.25, ry: Math.sin(Math.PI * t) * 0.9 });
  s.p[1] += 0.015 * Math.sin((f - RELEASE) * 0.05) * sm((f - RELEASE - 50) / 30);
  return s;
}

const GROW = (k) => Math.floor((D.order.length - 1 - D.RANK[k]) / 4);
function galleryArrive(k) { return S.gallery[0] - 34 + (D.order.length - 1 - D.RANK[k]) * 0.42; }
const DOMINO0 = S.years[0] + 26;
function toppleAt(k) { return DOMINO0 + GROW(k) * 1.9; }
function toppled(g, th, k) {
  const sy = Math.sin(g.r[1]), cy = Math.cos(g.r[1]), d = g.s / 2;
  // each sheet leans on the one in front of it: shingled, not a grid of tiles
  const th2 = th * (1 - 0.18 * sm((th - 1.0) / 0.5));
  return { p: [g.p[0] - Math.sin(th2) * d * sy, FLOOR + 0.012 + d * Math.cos(th2) + 0.0016 * GROW(k), g.p[2] - Math.sin(th2) * d * cy], r: [-th2, g.r[1], g.r[2]], s: g.s, dim: g.dim };
}
function yearFly(k) { const p = D.pubs[k]; const y = p.yr ?? 2027; const j = p.yr != null ? D.byYear[p.yr].indexOf(k) : 0; return Math.max(toppleAt(k) + 16, S.years[0] + 66 + (y - 2013) * 3.4 + j * 0.9); }
function yearLand(k) { return yearFly(k) + 30; }
function venueBurst(k) { const c = D.topv.indexOf(D.pubs[k].venue); return S.venues[0] + 4 + (c < 0 ? 10 : c * 2) + hsh(k, 61) * 12; }
function venueLand(k) { return venueBurst(k) + 42; }
const STROKE = [[S.dirs[0] + 14, S.dirs[0] + 36], [S.dirs[0] + 36, S.dirs[0] + 58], [S.dirs[0] + 58, S.dirs[0] + 80]];
function ringFly(k) { const r = D.pubs[k].ring, j = D.byRing[r].indexOf(k); return STROKE[r][1] - 6 + (j / D.byRing[r].length) * 26; }
function awardFly(k) { const i = D.awards.indexOf(k); return i >= 0 ? S.award[0] + 18 + i * 5 : S.award[0] + 4 + hsh(k, 71) * 14; }
const VISIT = [[S.dirs[0] + 90, S.dirs[0] + 150], [S.dirs[0] + 150, S.dirs[0] + 210], [S.dirs[0] + 210, S.dirs[0] + 268]];

function paperAt(k, f) {
  // 1 opening: only the first paper
  if (f < S.grow[0] + 40 || (k === D.first && f < FIRST_GO)) {
    if (k !== D.first) { if (f < S.grow[0]) return null; }
    else { if (f < S.grow[0]) return firstOpen(f); return L.HERO; }
  }
  // 2 growth: 2014-2019 peel off the first paper; from 2020 the papers pour in from the dark into a widening vortex
  const tg = galleryArrive(k);
  if (f < tg) {
    const ap = appearAt(k); if (f < ap) return null;
    const b = L.swarm(D, k, f, swarmC(f));
    if (k === D.first) return f < FIRST_GO ? L.HERO : L.mixL(L.HERO, b, eio5((f - FIRST_GO) / 44), { ry: TAU * eio5((f - FIRST_GO) / 44) * 0.5 });
    const yr = D.pubs[k].yr;
    if (yr != null && yr < 2020) {
      // a page slides out of the first paper, swings out to one side clear of it, and joins the circle behind
      const t = eio((f - ap) / 40), src = L.HERO, order = D.RANK[k], side = order % 2 ? 1 : -1;
      const from = { p: [src.p[0], src.p[1], src.p[2] + 0.06], r: src.r, s: 0.6, dim: 0 };
      const s2 = L.mixL(from, b, t, { lift: Math.sin(Math.PI * t) * 0.12, rz: Math.sin(Math.PI * t) * 0.25 * side });
      s2.p[0] += Math.sin(Math.PI * Math.min(1, t * 1.3)) * 0.85 * side; s2.p[2] += Math.sin(Math.PI * t) * 0.15;
      return s2;
    }
    const t = eout((f - ap) / 26);
    return L.mixL(farPoint(k), b, t, { ry: (1 - t) * 2.2 });
  }
  // 3 gallery: from the vortex into the S-curve, front first, with a half flip
  const g = L.gallery(D, k), t0 = toppleAt(k);
  if (f < t0) {
    const t = eio((f - tg) / 34);
    if (t >= 1) return g;
    return L.mixL(L.swarm(D, k, tg, swarmC(tg)), g, t, { lift: Math.sin(Math.PI * t) * 0.5, ry: (hsh(k, 7) > 0.5 ? 1 : -1) * TAU * eio(t) * 0.5 });
  }
  // 4 by year: the domino topples the gallery front to back, then each paper flies into its year column (isotype)
  const ty = yearFly(k);
  if (f < ty) { const th = ein(clamp((f - t0) / 13)) * (Math.PI / 2 - 0.02); return toppled(g, th, k); }
  const yv = L.years(D, k), flat = toppled(g, Math.PI / 2 - 0.02, k), tb = venueBurst(k);
  if (f < tb) { const t = eio((f - ty) / 30); return L.mixL(flat, yv, t, { lift: Math.sin(Math.PI * t) * (0.6 + 0.4 * hsh(k, 8)) }); }
  // 5 by venue: the columns burst up like a shuffled deck and rain down onto eight stacks
  const vv = L.venues(D, k), tr = ringFly(k);
  if (f < tr) {
    const up = clamp((f - tb) / 16), dn = clamp((f - tb - 16) / 26);
    const peak = { p: [yv.p[0] * 0.6 + (hsh(k, 62) - 0.5) * 1.6, 1.6 + hsh(k, 63) * 1.6, -0.5 + (hsh(k, 64) - 0.5) * 1.2], r: [hsh(k, 65) * TAU, hsh(k, 66) * TAU, 0], s: 0.42, dim: 0 };
    if (dn <= 0) return L.mixL(yv, peak, eout(up));
    return L.mixL(peak, vv, ein(dn) * 0.85 + eout5(dn) * 0.15);
  }
  // 6 three directions: out of the stacks in a spiral into the wreath around its ring
  const ov = L.orbit(D, k, f), ta = awardFly(k);
  if (f < ta) {
    const t = eio((f - tr) / 40);
    if (t >= 1) return repState(k, f, ov);
    const s = L.mixL(vv, ov, t);
    const [cx, cy] = L.RING_C[D.pubs[k].ring], sw = (1 - t) * Math.PI * 1.2;
    const dx = s.p[0] - cx, dy = s.p[1] - cy;
    s.p[0] = cx + dx * Math.cos(sw) - dy * Math.sin(sw); s.p[1] = cy + dx * Math.sin(sw) + dy * Math.cos(sw);
    s.p[2] += Math.sin(Math.PI * t) * 0.4; s.r[2] += sw;
    return s;
  }
  // 7 the honours: six papers to the row; the rest recede fast into a dim cloud
  const aw = L.awardsRow(D, k), cloud = L.farCloud(D, k, f);
  const te = S.end[0] + 6 + hsh(k, 81) * 30;
  if (f < S.photo[0] - 10 || (!aw && f < te)) {
    const from = repState(k, ta, L.orbit(D, k, ta));
    if (aw) { const t = eio((f - ta) / 40); return L.mixL(from, aw, t, { lift: Math.sin(Math.PI * t) * 0.3, ry: TAU * eio(t) }); }
    return L.mixL(from, cloud, eio((f - ta) / 22));

      const R = D.rings[r];
      halo(g, 0, 140, 820, 320, 0.8 * kv);
      txt(g, R.name, M, HEAD_Y, 56, 700, COLS[r], { k: kv });
      txt(g, `${R.n} publications`, M, HEAD_Y + 52, 34, 500, SOFT, { k: kv });
      D.reps[r].forEach((kk, j) => {
        const p = D.pubs[kk], kj = win(f, a + 18 + j * 5, b + (r === 2 ? -6 : 2), 10, 8); if (kj < 0.01) return;
        const rs = repState(kk, f, L.orbit(D, kk, f));
        const q = PR(ctx, rs.p[0], rs.p[1] - rs.s * 0.5, rs.p[2]);
        const name = p.short.length > 22 ? p.short.split(':')[0].slice(0, 22) : p.short;
        leader(g, { x: q.x, y: q.y + 4 }, { x: q.x, y: q.y + 44 }, kj, null, { noDot: true });
        txt(g, name, q.x, q.y + 80, 30, 700, INK, { align: 'center', k: kj });
        txt(g, p.tag.replace("'", ' 20'), q.x, q.y + 114, 28, 500, SOFT, { align: 'center', k: kj });
      });
    });
  }
  // 04 recognition
  if (f >= S.award[0] && f < S.photo[0] + 10) {
    const u = f - S.award[0];
    const ka = win(u, 30, CLOSE[1] - S.award[0] + 10, 15, 10);
    halo(g, 0, 140, 900, 320, 0.8 * ka);
    headline(g, 'Best Paper Award', ka, ['#ffe6a8', '#c9962e']);
    txt(g, 'ISCA 2026  ·  Patterns behind Chaos', M, HEAD_Y + 52, 34, 500, SOFT, { k: ka * sm((u - 45) / 12) });
    // the lead author, underlined on the real page
    const kz = win(f, CLOSE[0] - 4, CLOSE[1] + 8, 12, 10);
    if (kz > 0.01) pageNote(ctx, g, T.papers[D.awards[0]].g, ASP, 0.116, 0.21, 0.1705, 0.0, ['Zhongkai Yu', 'lead author, PhD student'], kz,
      { fromLeft: true, align: 'left', plate: true, to: (e) => ({ x: Math.max(M + 4, e.x - 10), y: e.y + 300 }) });
    // the row: five slots, one honest label each
    const kr = win(u, 105, 150, 12, 10);
    halo(g, 0, 140, 760, 300, 0.75 * kr);
    headline(g, 'Six honours.', kr);
    const LBL = { 4: ['Best Paper', 'ISCA 2026'], 63: ['Best Paper', 'Nominee', 'ISCA 2022'], 66: ['Best Paper', 'Nominee', 'DAC 2022'],
      89: ['Distinguished', 'Paper', 'OOPSLA 2020'], 42: ['Distinguished', 'Artifact ×2', 'ASPLOS 2024'] };
    Object.entries(LBL).forEach(([k, l], i) => {
      const s = L.awardsRow(D, +k), q = PR(ctx, s.p[0], FLOOR, s.p[2] + 0.2), kk = kr * sm((u - 105 - i * 3) / 10); if (kk < 0.01) return;
      l.forEach((line, j) => txt(g, line, q.x, q.y + 34 + j * 30, j === l.length - 1 ? 24 : 26, j === l.length - 1 ? 500 : 700, j === l.length - 1 ? SOFT : (+k === 4 ? '#ffd27a' : INK), { align: 'center', k: kk, mask: false }));
    });
    const kt = win(u, 150, 186, 12, 8);
    halo(g, 0, 140, 820, 340, 0.75 * kt);
    headline(g, 'Every acceptance:', kt);
    txt(g, 'milk tea.', M, HEAD_Y + 80, 72, 700, null, { grad: ['#f3d9b6', '#c49a6c'], k: kt * sm((u - 156) / 10) });
  }
  // 05 people
  if (f >= S.photo[0] && f < S.seat[0] + 10) {
    const u = f - S.photo[0];
    caption(g, 'Say “hot pot”!', win(u, 15, 64, 12, 4), CAP_Y, 56, INK, 700);
    const kt = win(u, 90, 130, 12, 8);
    if (kt > 0.01) pageNote(ctx, g, st.print, st.printAsp, 0.555, 0.665, 0.052, 0.665, ['The Fire Spot', 'hot pot, of course'], kt,
      { to: (e) => ({ x: Math.min(1080 - M - 260, e.x + 40), y: e.y - 70 }) });
    caption(g, 'The people behind the papers.', kt, 1180, 52, INK, 700);
    caption(g, 'Lab life: lots of hot pot.', kt * sm((u - 96) / 10));
  }
  // 06 the next one: #137 in the slot of 2013, the line in the slot of the first line
  if (f >= S.seat[0] + 30 && f < S.end[0] + 30) {
    const u = f - S.seat[0], k = win(u, 45, S.end[0] - S.seat[0] + 25, 15, 14);
    halo(g, 0, 1010, 820, 1300, 0.75 * k);
    txt(g, '#137', M - 6, 1168, 168, 200, null, { grad: ['#ffffff', '#9c9ca6'], track: -0.035, k });
    const kc = win(u, 90, 135, 10, 8);
    const cq = PR(ctx, 0.68, FLOOR + 0.62, 0.36);
    leader(g, cq, { x: Math.min(cq.x + 50, 1080 - M - 160), y: cq.y - 80 }, kc, ['(not you)'], { size: 34, tail: 24 });
    txt(g, 'The next one is yours.', M, CAP_Y, 40, 500, SOFT, { k: win(u, 135, S.end[0] - S.seat[0] + 25, 15, 14) });
  }
  // end card (v7 frame 3)
  if (f >= S.end[0] + 30) {
    const u = f - S.end[0];
    const ks = sm((u - 30) / 30);
    scrim(g, 700, 1000, 0.95 * ks); if (ks > 0.01) { g.fillStyle = `rgba(11,11,14,${0.95 * ks})`; g.fillRect(0, 1000, 1080, 350); }
    txt(g, 'Picasso Lab', 540, 900, 104, 700, null, { align: 'center', grad: GRAD, track: -0.035, k: sm((u - 45) / 15) });
    txt(g, 'UC San Diego  ·  Prof. Yufei Ding', 540, 962, 32, 500, '#a1a1a6', { align: 'center', k: sm((u - 60) / 15) });
    txt(g, 'We are recruiting PhD students.', 540, 1082, 40, 600, INK, { align: 'center', k: sm((u - 75) / 15) });
    txt(g, '@PicassoLabUCSD', 540, 1176, 46, 700, null, { align: 'center', grad: ['#a8d0ff', '#5aa2ff'], k: sm((u - 90) / 15) });
    txt(g, 'yufeiding.ucsd.edu', 540, 1228, 30, 500, SOFT, { align: 'center', k: sm((u - 90) / 15) });
  }
  // the running header, last, over its own band
  const ch = CHAPTER(f);
  header(g, ch, sm((f - 20) / 20), ch ? 1 : 0);
}
