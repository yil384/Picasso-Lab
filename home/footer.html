<!-- =====================================================================
     Picasso Lab footer: ONE embed for the Google Sites footer (every page).
     It replaces the three footer embeds home/ucsd.html + home/address.html +
     home/visitor-map.html:
       - the UC San Diego seal (link: ucsd.edu)
       - PICASSO LAB + the address (link: the 3D lab walk-through, home/address.html), and the lab's X
         account under it (link: x.com/PicassoLabUCSD; on phone strips only the X mark, after the address)
       - the visitor map card: it records the visit into Supabase exactly like
         home/visitor-map.html does, and a click opens the analytics dashboard
         (home/visitor-map.html) in a new tab.
     A Sites embed box keeps its aspect ratio and only shrinks on phones, and
     Sites already frames the box, so this page fills whatever box it gets
     edge to edge (sizes read from the box):
       ratio >= 2.2 : one row  seal | title + address | map  (desktop proportions,
                      turning smoothly into a compact phone row as the box shrinks)
       ratio <  2.2 : seal + text on top, map below; or, for tall boxes, stacked
                      (seal, text, map), whichever of the two comes out larger.
     GENERATED FILE: edit home/footer-src/footer.tpl.html and run
     python3 home/footer-src/build.py. The visit-recording code is copied from
     home/visitor-map.html by that script (keep the two in sync through it).
     ===================================================================== -->

    function overlay(s) {

            { id: 'cyb', x: WB[0], y: WB[1], hr: BODY.cyb.r * 1.2, period: 9, color: '150,200,255', name: 'CYBERTRON', dist: 'VIA WORMHOLE', ly: BODY.cyb.y + BODY.cyb.r * 1.5 + CH * 0.05, from: 0.95 },
            { id: 'moon', x: MT.vis ? MT.x : M.x, y: MT.vis ? MT.y : M.y, hr: M.r * 1.3, color: '255,214,120', hidden: !moonVis, noBlip: !MT.vis } ];

            if (o.noBlip) continue; var bp = ((s + k * 0.7) % 3) / 3; g.strokeStyle = 'rgba(255,205,110,' + (0.5 * (1 - bp)).toFixed(3) + ')'; g.lineWidth = 1; g.beginPath(); g.arc(o.x, o.y, 1.4 * K + bp * 5 * K, 0, 6.2832); g.stroke();
            g.fillStyle = '#ffd877'; g.beginPath(); g.arc(o.x, o.y, 1.1 * K, 0, 6.2832); g.fill();
            if (o.id === 'moon') continue;

            if (showLab) { g.textAlign = 'center'; g.textBaseline = 'top'; try { g.letterSpacing = (fs * 0.12).toFixed(1) + 'px'; } catch (e) {} g.font = '600 ' + fs.toFixed(1) + 'px ui-monospace, Menlo, Consolas, monospace';
                g.shadowColor = 'rgba(0,0,0,0.85)'; g.shadowBlur = 4 * K; g.fillStyle = 'rgba(225,235,248,0.72)'; var lx = clamp(o.x, g.measureText(o.name).width / 2 + 6, CW - g.measureText(o.name).width / 2 - 6); g.fillText(o.name, lx, o.ly);
                g.font = '500 ' + (fs * 0.92).toFixed(1) + 'px ui-monospace, Menlo, Consolas, monospace'; g.fillStyle = 'rgba(' + o.color + ',0.75)'; g.fillText(o.dist, lx, o.ly + fs * 1.25); g.shadowBlur = 0; g.shadowColor = 'transparent'; }

            var u = ((s + k * 3.1) % o.period) / o.period;

                    g.fillStyle = 'rgba(' + o.color + ',' + al.toFixed(3) + ')'; g.beginPath(); g.arc(R2[0], R2[1], (0.4 + 1.2 * tm) * K * (1 - m * 0.1), 0, 6.2832); g.fill(); }
                var grow = Math.min(1, tt / 0.75), sink = tt > 0.75 ? 1 - 0.7 * (tt - 0.75) / 0.25 : 1;   // closer, then down into the atmosphere

    }
    /* ~30 fps, only while the card is on screen and the tab is visible; textures load the first time it shows */
    var onScreen = false, lastF = 0, ticking = false;
