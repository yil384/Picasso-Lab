<!doctype html>
<html><head><meta charset="utf-8"><title>TritonGym lookdev</title>
<!-- look development only (palette, ink, halftone, faces, bake cache): not part of the film -->
<script src="/pv/vendor/p5/p5.min.js"></script>
<script src="/pv/vendor/p5.brush/p5.brush.pv.js"></script>
<script type="importmap">{"imports":{"three":"/pv/vendor/three/build/three.module.js","three/addons/":"/pv/vendor/three/addons/"}}</script>
</head><body>
<script type="module">
import { defineScene } from '/pv/runtime/pv.js';
import { createNPR } from '/scene/npr/npr.js';
import { bakeBrushTexture } from '/scene/npr/brush.js';
import { orbit, applyRig } from '/scene/npr/camera.js';
import { faceSet, cachedBake } from '/scene/tg_paint.js';
import { comicWord, bang } from '/scene/tg_letter.js';

const LOOK = {
  extends: 'comic',
  hatchCut: 0.22, crossT: 0.62, crossW: 1.0, hatchPx: 7.5, hatchW: 1.5, hatchWobble: 0.08, hatchSwell: 0.35,
  htAmt: 0.55, htPx: 14, htT: 0.3, htRange: 0.5, misreg: [2.6, -2.0],
  lineW: 2.0, lineWShadow: 3.2, hullW: 3.1, hullShadowW: 1.5,
  bleed: 1.6, edgeDark: 0.45, gran: 0.3, flocc: 0.06, dryEdge: 0.2, sat: 1.12,
  rule: 0.17, rulePx: 10, ruleTop: 0.3, ruleBot: 0.04, bgDots: [0.95, 0.6, 0.42, 0.28],
  dofMax: 3.5, dofRange: 3.0, grain: 0.018, vignette: 0.16,
};
let T;
defineScene({
  meta: { title: 'lookdev', durationFrames: 48, fps: 24, width: 1920, height: 1080, seed: 3, design: [1920, 1080], background: '#f4ebd6', fonts: [], boil: { every: 2, variants: 3 } },
  update(ctx) {
    applyRig(T.camera, orbit({ target: [0, 0.7, 0], radius: 7, az: 0.5 * Math.sin(ctx.t * Math.PI * 2), el: 0.22, fov: 30 }));
    ctx.camera = T.camera;
  },
  layers: [
    { name: 'paper', type: '2d', cache: () => 'static', draw(ctx, g) { g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(ctx.paper({ tone: '#f4ebd6', grain: 0.04, fibres: 0.05, blotch: 0.06, seed: 4 }), 0, 0); } },
    { name: 'npr', type: 'three', underlay: true, antialias: false,
      async init(ctx, { THREE, renderer }) {
        const t0 = performance.now();
        const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, ctx.W / ctx.H, 0.5, 80);
        const npr = createNPR(renderer, ctx, { look: LOOK, paper: ctx.paper({ tone: '#f4ebd6', grain: 0.04, fibres: 0.05, blotch: 0.06, seed: 4 }) });
        npr.setUnder(window.__pv.canvas);
        npr.setLight({ dir: [-0.55, 0.8, 0.6], target: [0, 0, 0], size: 7, dist: 20 });
        const bd = await cachedBake(THREE, bakeBrushTexture, { width: 2048, height: 512, seed: 2, key: 'lkbd', background: '#ffffff' }, (p, brush, w, h) => {
          brush.noStroke();
          for (let k = 0; k < 30; k++) { const a0 = k / 30 * Math.PI * 2; brush.fill('#bdbdbd', 200); brush.fillBleed(0.03); brush.fillTexture(0.35, 0.3); brush.polygon([[w / 2, h * 0.7], [w / 2 + Math.cos(a0) * 2000, h * 0.7 + Math.sin(a0) * 900], [w / 2 + Math.cos(a0 + 0.1) * 2000, h * 0.7 + Math.sin(a0 + 0.1) * 900]]); }
        });
        const tb = performance.now();
        const back = npr.backdrop(bd, { radius: 16, height: 20, y: -5, arc: [Math.PI - 2.2, 4.4], color: 0x0b8a67 });
        scene.add(back);
        const add = (geo, o, ao = {}, pos = [0, 0, 0]) => { const m = npr.add(new THREE.Mesh(geo, npr.surface(o)), ao); m.position.set(...pos); scene.add(m); return m; };
        add(new THREE.BoxGeometry(14, 0.4, 9), { color: 0x059669, hatchDir: [1, 0, 0.3] }, { outline: 1, cast: false }, [0, -0.2, 0]);
        add(new THREE.BoxGeometry(3, 0.3, 3), { color: 0x2b2447, hatchDir: [1, 0, 0.3] }, { outline: 1.1 }, [0, 0.15, -1.5]);
        const faces = faceSet(THREE, { happy: { eyes: 'happy', mouth: 'open', blush: true }, det: { eyes: 'determined', mouth: 'flat' } }, { base: '#fff4dc', s: 1.6 });
        T = { THREE, scene, camera, npr, faces };
        const head = add(new THREE.SphereGeometry(0.6, 48, 32), { color: 0xffffff, map: faces.happy[0], rim: 0.8, spec: 0.6 }, { outline: 1.1 }, [-1.2, 0.8, 0.8]);
        add(new THREE.SphereGeometry(0.5, 48, 32), { color: 0xef4b5f, rim: 0.8 }, { outline: 1.1 }, [1.2, 0.5, 0.9]);
        add(new THREE.CylinderGeometry(0.4, 0.4, 1.4, 40), { color: 0xf2b134, hatchMode: 'u', rim: 0.8 }, { outline: 1.1 }, [0.2, 0.7, 0.2]);
        console.log(`lookdev init ${(performance.now() - t0).toFixed(0)}ms (bake ${(tb - t0).toFixed(0)}ms cached=${!!bd.userData.cached})`);
        return { scene, camera };
      },
      draw(ctx) { T.npr.frame(ctx); T.npr.focusOn(T.camera, new T.THREE.Vector3(0, 0.6, 0.5), 3); T.npr.render(T.scene, T.camera); return false; } },
    { name: 'ink', type: 'brush', blend: 'multiply', draw() {} },
    { name: 'letters', type: '2d', draw(ctx, g) {
      const r = ctx.boilRng('lt');
      comicWord(g, 'CLANG!', 520, 250, 150, { fill: '#ef4b5f', shade: '#b8283f', r, rot: -0.1 });
      comicWord(g, 'TRITONGYM', 1250, 180, 90, { fill: '#fff6e0', shade: '#e0c9a0', r, rot: 0.04 });
      comicWord(g, '164', 1350, 520, 260, { fill: '#f2b134', shade: '#c7812a', r, rot: -0.06 });
      comicWord(g, 'PERF@1 > 1', 900, 880, 120, { fill: '#10b981', shade: '#047857', r, rot: -0.05, keyline: '#fff6e0' });
      bang(g, 300, 700, 90, 0.1, '#ef4b5f', r);
    } },
  ],
});
</script></body></html>
